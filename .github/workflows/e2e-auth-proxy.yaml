name: E2E auth-proxy

# The authenticated corporate-proxy end-to-end test (the Tenant-a / hospital
# archetype): stand up a squid that REQUIRES basic auth, bring a k3d cluster up
# with the installer's proxy config pointed at it as user:pass@host, and prove
# both egress paths behave — the nodes pull a workload image THROUGH the authed
# proxy (the squid access log shows an authenticated auth.docker.io CONNECT,
# which only a real pull makes), and an app pod tunnels via the in-cluster squid
# only when the ingestion proxy env is set. Guards the #119/#172/#174 proxy
# hardening end-to-end.
#
# WHY ITS OWN FILE — split out of installer-tests.yaml on 2026-08-27
# (backend#2350). This check shipped RED to `staging` on client#789 and blocked
# nothing, because it was a job inside installer-tests.yaml: an expensive,
# path-filtered workflow whose jobs can never be required status checks. A
# required check behind a paths filter never reports on a PR that touches nothing
# under the filter, and GitHub then holds the PR at "Expected — waiting for
# status to be reported" indefinitely. A guard that cannot block is advice, not a
# gate (backend#1729). To BE a gate a check has to report on the branches it
# gates, on every PR to them. This workflow is the shape that can — the same move
# `Source-of-truth drift` made out of installer-tests.yaml's old `static` job
# (see drift-checks.yaml).
#
# `paths:` ON pull_request TOO, since 2026-09-09 — the same filter `push` has.
# The paragraph above is still why this is its own file: a check that is to
# BECOME required must be able to report on every PR, and a paths filter on a
# REQUIRED context holds any PR that touches nothing under it at "Expected —
# waiting for status to be reported" forever (a promotion batch that happens not
# to touch scripts/, a backmerge, the hotfix lane; drift-checks.yaml's header
# names the PRs it once stuck). That hazard exists only once the context IS
# required, and `E2E auth-proxy (squid)` is required on no branch — read
#   gh api repos/tracebloc/client/branches/<b>/protection/required_status_checks
# for develop, staging and main before touching this block. Unarmed, running
# it on every docs-only or workflow-only PR bought nothing, so it is scoped.
#
# ARMING PRE-CONDITION — two halves that move together. Whoever makes this
# check required MUST, in the same PR, delete the `paths:` under pull_request
# and add `edited` to its `types:` (a retarget fires only `edited`), or the
# first PR outside the filter is unmergeable. Arm it on `staging` + `main` (the
# hop this protects), not on `develop` where the same blip would tax every PR,
# and only after a green-watch window per the "arm while green" rule
# (CLAUDE.md). This workflow does NOT make the check required — that is a
# branch-protection setting. See backend#2350 for the extraction.
#
# COST — a single ubuntu-latest job (52-100 s measured, median 65 s). The filter
# drops it from PRs that touch neither scripts/ nor this file; the weekly cron
# and the push signal on the gated branches are unchanged.
on:
  push:
    branches: [main, staging, develop]
    paths:
      - 'scripts/**'
      - '.github/workflows/e2e-auth-proxy.yaml'
  pull_request:
    branches: [main, staging, develop]
    # Same filter as `push` — see the header for why, and for what MUST change
    # here before this context is ever made a required check.
    paths:
      - 'scripts/**'
      - '.github/workflows/e2e-auth-proxy.yaml'
  schedule:
    # Mondays 03:00 UTC — the same cadence e2e-proxy already ran on via
    # installer-tests.yaml's cron; kept here so extracting the job does not drop
    # its weekly canary. It pulls external images (squid/nginx/curl) and opens a
    # real CONNECT to auth.docker.io, so the canary catches drift in those before
    # it reddens a promotion.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded PR runs; never cancel push/schedule.
  group: e2e-auth-proxy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-proxy:
    # Single runner (arch-agnostic), no secrets. What it proves is in the header.
    name: E2E auth-proxy (squid)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cluster up through an authenticated proxy
        run: bash scripts/tests/e2e-proxy.sh
