name: Version bump gate

# Caller for tracebloc/.github version-bump-gate.yml. Fails a develop PR that
# touches this repo's published files while the version those files would ship
# under is ALREADY released -- caught on the author's diff, not days later at the
# prod hop (backend#1563; the cli + py-package surprise on 2026-08-10).
# Override a false positive with the 'skip-version-gate' label (visible in audit).
on:
  pull_request:
    branches: [develop]
    # labeled/unlabeled so the skip-version-gate override actually re-runs the gate (Bugbot).
    # `edited` is the ONLY event GitHub fires on a BASE-branch change (a retarget).
    # This gate hard-fails develop PRs (soft-fail: false) and has no `paths:`, so
    # without `edited` a PR opened against a non-develop base and retargeted onto
    # develop never re-runs it -- `synchronize` needs a push and a retarget has
    # nothing to push. Same base-change rationale fr-gate-caller.yml documents
    # (backend#1945/.github#237); the required, non-path-filtered gates fixed in
    # backend#2701 close the identical gap.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]

permissions:
  contents: read

jobs:
  version-bump-gate:
    uses: tracebloc/.github/.github/workflows/version-bump-gate.yml@main
    with:
      version-file: "client/Chart.yaml"
      publish-paths: "client/* ingestor/*"
      soft-fail: false
