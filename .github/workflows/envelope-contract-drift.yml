name: Cross-repo contract drift

# The training-envelope arithmetic has ONE definition —
# client-runtime/node_sizing.py::envelope_from_allocatable, with its constants
# and golden vectors in client-runtime/envelope_contract.json (backend#2220,
# RFC-BACKEND-664 §P0).
#
# Neither installer can call it: bash has no guaranteed JSON parser (jq is not a
# prerequisite) and this bootstrap is signed, so it must not fetch anything
# unsigned at install time. So the constants are EMBEDDED in
# scripts/lib/install-client-helm.sh and scripts/install-k8s.ps1, and the
# contract is vendored as a test fixture. Three ways that can rot, one gate
# each:
#
#   1. the embed stops matching the vendored fixture
#        -> scripts/gen-envelope-embed.sh --check (also mirrored in bats/Pester)
#   2. the vendored fixture stops matching upstream
#        -> the diff below, against the ref pinned in scripts/.client-runtime-ref
#   3. the installers stop reproducing the contract's vectors
#        -> the bats + Pester replays, which run in the normal test jobs
#
# Pin, don't float (the rule cli/.github/workflows/chart-drift.yml states): an
# unrelated client-runtime commit must not redden every open client PR. The
# weekly run is what catches a pin gone stale enough to matter.
#
# tracebloc/client-runtime is PRIVATE, so unlike cli's chart-drift (which reads
# the public tracebloc/client with no token) this needs an App installation
# token, scoped to that one repo with contents:read.
#
# ── the SECOND contract, added by backend#2378 ──────────────────────────────
# The log-redaction rule — which strings must be scrubbed before a log leaves a
# customer's cluster — is declared once, in client-runtime/log_redactions.json.
# This chart vendors it at client/log_redactions.json and GENERATES the
# Collector's OTTL statements from it, so the hand port that used to sit in
# telemetry-collector-configmap.yaml is gone.
#
# The in-repo half of that guarantee is checked by the REQUIRED drift job
# (scripts/tests/collector-redaction-derived.sh: vendored bytes match their
# pinned sha256, and what renders IS the declaration) — locally, with no
# network, because a lint gate that needs the network fails on the day the
# network is what broke. What this job adds is the one question that cannot be
# answered from inside this repository: has upstream MOVED ON without the
# vendored copy following? Same lane, same token, same pin — one more contract.

on:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday, offset from the other cross-repo gates
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
    paths:
      - "scripts/lib/install-client-helm.sh"
      - "scripts/install-k8s.ps1"
      - "scripts/gen-envelope-embed.sh"
      - "scripts/.client-runtime-ref"
      - "scripts/tests/fixtures/envelope_contract.json"
      - "scripts/tests/fixtures/envelope_vectors.bash"
      - "client/log_redactions.json"
      - "scripts/.log-redactions.sha256"
      - "scripts/tests/collector-redaction-derived.sh"
      - "client/templates/telemetry-collector-configmap.yaml"
      - ".github/workflows/envelope-contract-drift.yml"

permissions:
  contents: read

jobs:
  # ── IS THE PIN ITSELF STALE? (backend#2460) ────────────────────────────────
  # The job below compares the vendored copies against the PINNED ref, which is
  # the whole point of pinning: an unrelated client-runtime commit must not
  # redden every open client PR. The cost is that it cannot see the pin going
  # stale -- it compares v2 against v2 and agrees.
  #
  # MEASURED, not hypothetical. client-runtime#376 merged 2026-08-24 and the pin
  # comment carried a note to re-point once it did. That went unactioned for 2.5
  # weeks, during which client-runtime#544 landed envelope contract v3 -- and
  # this repo went on verifying its installers against v2, with the drift job
  # GREEN the whole time. The pin comment claimed "the weekly run is what catches
  # a pin gone stale enough to matter"; nothing compared the pin against the
  # producer's default branch, so nothing caught it (CLAUDE.md rule 7: a comment
  # asserting a property the code does not have).
  #
  # WARNS ON A PR, FAILS ON THE SCHEDULE. Failing a PR would punish whoever
  # happens to touch an installer line for a pin someone else left behind, which
  # is how a whole tier gets skipped (rule 4). The weekly and dispatch runs are
  # where the alarm is actionable and blocks nobody.
  pin-staleness:
    name: pinned contract vs client-runtime's default branch
    runs-on: ubuntu-latest
    # A stalled api.github.com must not hold a runner to the six-hour cap; a
    # read that cannot finish is a cannot-tell, and cannot-tell has to FAIL, not
    # hang (Bugbot Medium). The curl calls carry their own bounds too, so a hang
    # inside one read fails that read rather than the whole job.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Mint a read-only installation token for client-runtime
        id: token
        # GITHUB_TOKEN is scoped to THIS repo and cannot read another private
        # one -- the job below read tracebloc/client-runtime with it and so
        # failed closed on EVERY run, turning a pin comparison into a
        # cannot-read error (Bugbot High, and it was right: this PR's own run
        # went red that way). The envelope-contract job twenty lines down
        # already solved this and says so in its comment; I added a second
        # cross-repo reader without reading the first. Same App, same least
        # privilege: named `repositories`, contents:read only.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: client-runtime
          permission-contents: read

      - name: Compare the pinned contract against the producer's default branch
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          ref="$(grep -vE '^[[:space:]]*(#|$)' scripts/.client-runtime-ref | head -1 | tr -d '[:space:]')"
          [ -n "$ref" ] || { echo "::error::scripts/.client-runtime-ref names no ref"; exit 1; }

          # BOTH CONTRACTS, because the pin governs both. scripts/.client-runtime-ref
          # says so in capitals -- "ONE REF, TWO CONTRACTS since backend#2378" --
          # and the first version of this job compared only the envelope contract
          # and then printed "the pin is current". An upstream-only change to
          # log_redactions.json would have left the pin stale with this guard
          # reporting green: the exact silent-green gap the job exists to close,
          # reproduced one file over (Bugbot Medium). Checking one of two and
          # reporting on both is worse than not checking, because it looks like
          # cover.
          #
          # Left half is the path in client-runtime, right half is where this repo
          # vendors it -- named together so adding a third contract is one line.
          CONTRACTS="envelope_contract.json log_redactions.json"

          # FAIL CLOSED on every read: a fetch I could not do is not evidence the
          # pin is fresh, and two unknowns must never compare equal (rule 3).
          fetch() {
            curl -fsSL --connect-timeout 10 --max-time 60 --retry 2 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/tracebloc/client-runtime/contents/$1?ref=$2"
          }

          stale=""
          for path in $CONTRACTS; do
            fetch "$path" "$ref" > "/tmp/pinned-$path" \
              || { echo "::error::cannot read $path at the pinned ref $ref"; exit 1; }
            fetch "$path" develop > "/tmp/head-$path" \
              || { echo "::error::cannot read $path on client-runtime develop -- cannot tell whether the pin is stale"; exit 1; }
            if cmp -s "/tmp/pinned-$path" "/tmp/head-$path"; then
              echo "$path: pinned copy matches develop"
            else
              echo "$path: DIFFERS between the pinned ref and develop"
              stale="$stale $path"
            fi
          done

          # The envelope contract carries a version worth naming in the message;
          # log_redactions.json does not, so it is reported by name alone.
          if [ -s /tmp/pinned-envelope_contract.json ]; then
            pinned="$(python3 scripts/contract-summary.py /tmp/pinned-envelope_contract.json)"
            head="$(python3 scripts/contract-summary.py /tmp/head-envelope_contract.json)"
            echo "envelope contract: pinned v${pinned%%|*} (${pinned#*|})  vs  develop v${head%%|*} (${head#*|})"
          fi

          if [ -z "$stale" ]; then
            echo "the pin is current for every contract it governs."
            exit 0
          fi

          msg="the pin is behind client-runtime develop for:$stale. To adopt: bump scripts/.client-runtime-ref, re-vendor BOTH contracts (scripts/tests/fixtures/envelope_contract.json and client/log_redactions.json), re-run scripts/gen-envelope-embed.sh (it rewrites the bash vectors AND the embedded literals in scripts/lib/install-client-helm.sh and scripts/install-k8s.ps1), then update the hand-written expectations the new numbers move."
          if [ "$EVENT" = "pull_request" ]; then
            echo "::warning::PIN STALE (not this PR's doing) -- $msg"
            exit 0
          fi
          echo "::error::PIN STALE -- $msg"
          exit 1

  envelope-contract:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the pinned client-runtime ref
        id: pin
        run: |
          ref="$(grep -vE '^[[:space:]]*(#|$)' scripts/.client-runtime-ref | head -1 | tr -d '[:space:]')"
          if [ -z "$ref" ]; then
            echo "::error file=scripts/.client-runtime-ref::no ref found — the first non-comment line must be a commit SHA"
            exit 1
          fi
          # Same shape guard cli's chart-drift applies: no path traversal, no
          # option-looking refs reaching the checkout action.
          if ! printf '%s' "$ref" | grep -qE '^[A-Za-z0-9][A-Za-z0-9._/-]*$' || printf '%s' "$ref" | grep -q '\.\.'; then
            echo "::error file=scripts/.client-runtime-ref::invalid ref shape: $ref"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: The embed matches the vendored contract
        # Runs FIRST and without the network: an in-repo inconsistency should
        # not be reported as a cross-repo drift.
        run: scripts/gen-envelope-embed.sh --check

      - name: Set up Helm
        # REQUIRED BY THE STEP BELOW, not decoration. Without helm that script
        # can only check the vendored bytes and skips the render comparison —
        # so the step would go green having proved less than its name claims,
        # which is the exact defect class backend#1729 is about. (Caught by
        # Bugbot on #803; the script now also treats a missing helm under `CI`
        # as an ERROR, so removing this step reddens rather than halves it.)
        # Same action, same pin as drift-checks.yaml and helm-ci.yaml — and the
        # `version` below is the half that makes that sentence true. Without it
        # `azure/setup-helm` defaults to `latest`, so this job would render under
        # Helm 4.x while the REQUIRED `Source-of-truth drift` path runs the same
        # script under v3.15.4. A render comparison passing under a Helm the
        # required path never uses is the "green having proved less than its name
        # claims" failure this step exists to close. (@saqlainsyed007 + Bugbot on
        # client#803, verified against all four sibling steps.)
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.15.4

      - name: The rendered redaction floor matches the vendored declaration
        # Same reason, for the second contract: prove the in-repo half before
        # blaming the other repository. This is the same script the required
        # `Source-of-truth drift` job runs.
        env:
          REQUIRE_HELM: "1"
        run: bash scripts/tests/collector-redaction-derived.sh

      - name: Mint a read-only installation token for client-runtime
        id: token
        # GITHUB_TOKEN is scoped to THIS repo and cannot read another private
        # one, so mint an App installation token. Least privilege per the
        # backend#2157 sweep: named `repositories`, not owner-wide, and
        # contents:read only -- this job reads one JSON file and one .py.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: client-runtime
          permission-contents: read

      - name: Checkout tracebloc/client-runtime @ pinned ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tracebloc/client-runtime
          ref: ${{ steps.pin.outputs.ref }}
          token: ${{ steps.token.outputs.token }}
          path: client-runtime
          persist-credentials: false

      - name: The vendored contract matches upstream
        env:
          PINNED_REF: ${{ steps.pin.outputs.ref }}
        run: |
          upstream="client-runtime/envelope_contract.json"
          vendored="scripts/tests/fixtures/envelope_contract.json"
          if [ ! -f "$upstream" ]; then
            echo "::error::$upstream is missing at $PINNED_REF — has the contract moved or been renamed?"
            exit 1
          fi
          if ! diff -u "$vendored" "$upstream"; then
            echo "::error file=scripts/tests/fixtures/envelope_contract.json::the vendored envelope contract has drifted from tracebloc/client-runtime@$PINNED_REF"
            echo ""
            echo "To adopt the upstream change:"
            echo "  1. cp <client-runtime>/envelope_contract.json scripts/tests/fixtures/"
            echo "  2. update the SHA in scripts/.client-runtime-ref"
            echo "  3. scripts/gen-envelope-embed.sh"
            echo "  4. scripts/gen-manifest.sh          # the installers' digests changed"
            echo "  5. run the bats + Pester replays — the goldens WILL have moved"
            exit 1
          fi
          echo "vendored contract is identical to client-runtime@$PINNED_REF"

      - name: The vendored redaction declaration matches upstream
        env:
          PINNED_REF: ${{ steps.pin.outputs.ref }}
        run: |
          upstream="client-runtime/log_redactions.json"
          vendored="client/log_redactions.json"
          if [ ! -f "$upstream" ]; then
            echo "::error::$upstream is missing at $PINNED_REF. Either the pin"
            echo "predates backend#2378 (bump scripts/.client-runtime-ref to a"
            echo "client-runtime commit that carries the declaration), or the"
            echo "declaration was renamed upstream. Absent is a FINDING here:"
            echo "this job cannot tell 'no drift' from 'nothing to compare'."
            exit 1
          fi
          if ! diff -u "$vendored" "$upstream"; then
            echo "::error file=client/log_redactions.json::the vendored log-redaction declaration has drifted from tracebloc/client-runtime@$PINNED_REF"
            echo ""
            echo "This is the two-PR bump ritual's second PR, not yet landed."
            echo "To adopt the upstream change:"
            echo "  1. cp <client-runtime>/log_redactions.json client/"
            echo "  2. cp the digest line from <client-runtime>/.log-redactions.sha256"
            echo "     into scripts/.log-redactions.sha256"
            echo "  3. update the SHA in scripts/.client-runtime-ref"
            echo "  4. bump Chart.yaml version AND appVersion (chart content changed)"
            echo "  5. make drift  # the redaction guards re-derive from the new file"
            exit 1
          fi
          echo "vendored redaction declaration is identical to client-runtime@$PINNED_REF"

      - name: The two repos pin the same digest
        env:
          PINNED_REF: ${{ steps.pin.outputs.ref }}
        # Belt and braces, and it catches a real shape: the JSON could be copied
        # across while the digest line was not, leaving this repo's local guard
        # comparing new bytes to an old pin. Both sides parse the same way --
        # first non-comment, non-blank line.
        run: |
          _digest() {
            grep -vE '^[[:space:]]*(#|$)' "$1" | head -1 | tr -d '[:space:]'
          }
          for f in client-runtime/.log-redactions.sha256 scripts/.log-redactions.sha256; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing -- a digest pin that cannot be read is a finding"
              exit 1
            fi
          done
          ours="$(_digest scripts/.log-redactions.sha256)"
          theirs="$(_digest client-runtime/.log-redactions.sha256)"
          if [ -z "$ours" ] || [ -z "$theirs" ]; then
            echo "::error::a digest pin carries no digest line"
            exit 1
          fi
          if [ "$ours" != "$theirs" ]; then
            echo "::error file=scripts/.log-redactions.sha256::digest pins disagree -- ours $ours, client-runtime@$PINNED_REF $theirs"
            exit 1
          fi
          echo "both repos pin $ours"

      - name: The upstream arithmetic still produces these vectors
        # Belt and braces: the vendored file could match upstream byte-for-byte
        # while upstream's own vectors have gone stale against its own code. That
        # is client-runtime's test suite's job, but a stale contract reaching us
        # is OUR problem, so re-derive here rather than trust the file.
        run: |
          cd client-runtime
          python3 scripts/gen_envelope_vectors.py
          if ! git diff --quiet -- envelope_contract.json; then
            echo "::error::client-runtime@$(git rev-parse --short HEAD) ships golden vectors that its own arithmetic no longer produces"
            git --no-pager diff -- envelope_contract.json | head -40
            exit 1
          fi
          echo "upstream vectors reproduce from upstream code"
