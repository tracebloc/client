name: E2E mysql

# Native-arm64 MySQL 8.4 install + real-driver auth end-to-end (backend#723,
# Option A). Brings up a real k3d cluster via the installer's create_cluster(),
# helm-installs THIS chart with the 8.4 engine on a public-image / hostPath
# profile (no secrets, no registry, no backend registration), and proves on a
# real host what nothing asserted before: the multi-arch 8.4 image runs NATIVELY
# on arm64 (not under qemu), and edgeuser's cold-cache plaintext connect
# succeeds without ERROR 2061 — on first boot AND after the strategy:Recreate
# cache-wipe (decision D2). The real driver (mysql-connector-python) is used
# because the Deployment's `mysqladmin ping` probe passes regardless of auth
# plugin. Full rationale in scripts/tests/e2e-mysql.sh.
#
# WHY ITS OWN FILE (not a job in installer-tests.yaml) — the same reason
# e2e-auth-proxy.yaml is standalone (backend#2350): installer-tests.yaml is
# path-filtered on pull_request, and a required check behind a paths filter never
# reports on a PR that touches nothing under the filter, so GitHub holds the PR
# at "waiting for status to be reported" forever. This test is the intended
# GATING evidence for the native-arm64 close condition of backend#723, so it has
# to be able to become a required check — which means its own workflow, whose
# pull_request trigger can be made unfiltered (so it always reports) the day it
# is armed, without dragging the whole installer matrix along.
#
# `paths:` ON pull_request TOO, since 2026-09-09 — the same filter `push` has.
# The paragraph above is still why this is its own file: a path-filtered
# REQUIRED check is unmergeable-forever the moment a PR touches nothing under
# the filter (a promotion batch, a backmerge). That hazard exists only once the
# context IS required, and `E2E mysql 8.4 (...)` is required on no branch —
# read
#   gh api repos/tracebloc/client/branches/<b>/protection/required_status_checks
# for develop, staging and main before touching this block. Unarmed, a 2-leg
# matrix on every docs-only or workflow-only PR bought nothing, so it is scoped.
#
# ARMING PRE-CONDITION — two halves that move together. Whoever makes this
# check required MUST, in the same PR, delete the `paths:` under pull_request
# and add `edited` to its `types:` so a base-branch retarget re-reports instead
# of hanging pending (backend#2701) — or the first PR outside the filter is
# unmergeable. Arm on staging + main only after a green-watch window per the
# "arm while green" rule (CLAUDE.md). This workflow does NOT make the check
# required — that is a branch-protection setting.
#
# COST — a 2-leg matrix (amd64 + arm64), each ~2.5-3 min measured (cluster +
# helm install + two connector probes). The arm64 leg is the point; arm64
# runners are free on this public repo. The filter drops both legs from PRs
# that touch neither client/ nor scripts/ nor this file; the weekly cron and the
# push signal on the gated branches are unchanged.
on:
  push:
    branches: [main, staging, develop]
    paths:
      - 'client/**'
      - 'scripts/**'
      - '.github/workflows/e2e-mysql.yaml'
  pull_request:
    branches: [main, staging, develop]
    # Same filter as `push` — see the header for why, and for what MUST change
    # here before this context is ever made a required check.
    paths:
      - 'client/**'
      - 'scripts/**'
      - '.github/workflows/e2e-mysql.yaml'
  schedule:
    # Mondays 03:15 UTC — a weekly canary. This pulls external images
    # (tracebloc/mysql-client:8.4, python:3.12-slim) and pip-installs the
    # connector from PyPI, so the canary catches drift in those before it reddens
    # a promotion.
    - cron: '15 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded PR runs; never cancel push/schedule.
  group: e2e-mysql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-mysql:
    name: E2E mysql 8.4 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Native 8.4 install + real-driver auth (cold-cache + post-Recreate)
        run: bash scripts/tests/e2e-mysql.sh
