name: Drift checks

# Source-of-truth drift: values duplicated across files (the backend API hosts,
# the CLIENT_ENV alias vocabulary) or coupled across artifacts (the chart's
# workload names <-> the names the readiness-wait and --diagnose bundle grep
# for). Mocked unit tests can't see these — a rename ships green and breaks in
# the field. This guards both sides.
# Triggers on scripts/ OR client/ because either side moving is the drift.
#
# This job is the home for every duplicated-declaration guard in this repo,
# because it is the one that GATES: `Source-of-truth drift` is required on
# develop and on main, so a disagreement blocks the merge rather than merely
# printing red on a workflow nobody has to wait for. A guard that cannot block
# is advice (backend#1729).
#
# NO `paths:` ON pull_request, deliberately. `Source-of-truth drift` is a
# REQUIRED status check on develop and on main, and a required check that is
# path-filtered can never report on a PR outside those paths -- GitHub leaves it
# at "Expected - waiting for status to be reported" and the PR is unmergeable
# forever. Not hypothetical: on 2026-08-11 it was blocking client#651, #657 and
# #660, none of which touch scripts/ or client/. standard-checks.yml's own
# header spells out the same hazard. The job is ~10s, so running it on every PR
# costs nothing next to a permanently stuck PR.
#
# `push` keeps its paths filter: pushes are not gated by required checks, so
# path-scoping there is free and correct.
on:
  push:
    branches: [main, develop, openshift]
    paths:
      - 'scripts/**'
      - 'client/**'
      - '.github/workflows/drift-checks.yaml'
  pull_request:
    branches: [main, develop, openshift]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Source-of-truth drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.15.4
      - name: check-drift
        run: bash scripts/tests/check-drift.sh
      # One CLIENT_ENV vocabulary, four declarations (Go template, JSON Schema,
      # bash, PowerShell), backend#1729 sweep 5. Lives here rather than in
      # helm-ci because helm-ci's `Helm lint` is NOT a required check, so the
      # guard could only advise: a PR that made the four disagree was mergeable
      # with it red. It needs bash + python3 only (~2s), and drift-checks runs
      # unfiltered on every PR, so it reports on the installer-only PRs that
      # helm-ci's `paths:` filter would have skipped entirely.
      - name: CLIENT_ENV vocabulary agreement (backend#1729)
        run: bash scripts/tests/env-vocabulary-agreement.sh
      # The installer's telemetry vocabularies (backend#1907): four closed sets
      # whose values are produced elsewhere -- the phases by install-k8s.sh's
      # step_header calls, the client states by summary.sh, the script names by
      # gen-manifest.sh's FILES array, the error classes by telemetry.sh's own
      # classifier. A closed set that has drifted from its producer does not fail
      # loudly; it reports `unknown` forever, on exactly the runs somebody added
      # the new value for. It lives HERE for the same reason the CLIENT_ENV guard
      # does: `Source-of-truth drift` is required, so this can block rather than
      # advise. bash only, ~1s.
      - name: Telemetry vocabulary agreement (backend#1907)
        run: bash scripts/tests/telemetry-vocabulary-agreement.sh
      # The k3s components both installers switch off at cluster-create time: one
      # list, written twice (cluster.sh's --k3s-arg block, install-k8s.ps1's
      # $k3dArgs). `traefik` and `servicelb` were in NEITHER test suite, and the
      # inverse property -- metrics-server must never be disabled, because the
      # chart's resource-monitor template `fail`s the release without it -- was
      # unguarded on both installers. Here rather than in `Pester
      # (windows-latest)`, which is not a required context, so the PowerShell half
      # would only ever advise. bash only, ~1s.
      - name: k3s component agreement (both installers + the chart coupling)
        run: bash scripts/tests/k3s-components-agreement.sh
