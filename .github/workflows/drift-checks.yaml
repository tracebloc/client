name: Drift checks

# Source-of-truth drift: values duplicated across files (the backend API hosts,
# the CLIENT_ENV alias vocabulary) or coupled across artifacts (the chart's
# workload names <-> the names the readiness-wait and --diagnose bundle grep
# for). Mocked unit tests can't see these — a rename ships green and breaks in
# the field. This guards both sides.
# Triggers on scripts/ OR client/ because either side moving is the drift.
#
# This job is the home for every duplicated-declaration guard in this repo,
# because it is the one that GATES: `Source-of-truth drift` is required on
# develop and on main, so a disagreement blocks the merge rather than merely
# printing red on a workflow nobody has to wait for. A guard that cannot block
# is advice (backend#1729).
#
# It is therefore also the home for the R8 installer-manifest check and the
# cross-OS facts check, which moved here from installer-tests.yaml's `static`
# job (`Static analysis`, required on NO branch) on 2026-08-19. If you add a
# guard, add it to the Makefile's `drift` target -- this job runs that target
# and holds no list of its own.
#
# NO `paths:` ON pull_request, deliberately. `Source-of-truth drift` is a
# REQUIRED status check on develop and on main, and a required check that is
# path-filtered can never report on a PR outside those paths -- GitHub leaves it
# at "Expected - waiting for status to be reported" and the PR is unmergeable
# forever. Not hypothetical: on 2026-08-11 it was blocking client#651, #657 and
# #660, none of which touch scripts/ or client/. standard-checks.yml's own
# header spells out the same hazard. The job is ~10s, so running it on every PR
# costs nothing next to a permanently stuck PR.
#
# `push` keeps its paths filter: pushes are not gated by required checks, so
# path-scoping there is free and correct.
on:
  push:
    branches: [main, develop, openshift]
    paths:
      - 'scripts/**'
      - 'client/**'
      - '.github/workflows/drift-checks.yaml'
      # #616: check-facts pins the GPU node image's k3s tag against
      # scripts/spec/facts.env, so a K3S_TAG edit under docker/k3s-cuda must run
      # this job too. These moved here with the guard itself, out of
      # installer-tests.yaml's `paths`.
      - 'docker/k3s-cuda/**'
      - '.github/workflows/build-k3s-cuda.yaml'
      - 'Makefile'
  pull_request:
    branches: [main, develop, openshift]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Source-of-truth drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.15.4
      # ONE step, and it does not spell the guard list out: `make drift` is the
      # single declaration of "the duplicated-declaration guards", and the
      # pre-push hook (`make check` -> `drift`) runs the identical set. Listing
      # them here again would be a second copy to drift from -- which is exactly
      # what this job exists to catch, and exactly what had happened: the
      # Makefile's `drift` target carried gen-manifest/check-facts/check-style
      # while this job carried check-drift, so each side gated what the other
      # did not. Add a guard in the Makefile and it gates here automatically.
      #
      # The guards this covers, and why each is a merge gate rather than advice:
      #   gen-manifest.sh --check   R8 supply chain. The bootstrap verifies every
      #                             sub-script against scripts/manifest.sha256
      #                             before the privileged steps; a script changed
      #                             without regenerating the manifest publishes a
      #                             manifest that rejects the scripts it ships.
      #   check-facts.sh --check    Cross-OS tool pins single-sourced from
      #                             scripts/spec/facts.env (#435, #616).
      #   check-style.sh            Terminal style + terminology (STYLE.md).
      #   check-drift.sh            Chart <-> script name/host coupling.
      #   env-vocabulary-agreement  One CLIENT_ENV vocabulary, four declarations
      #                             (backend#1729 sweep 5).
      #
      # The first three moved here from installer-tests.yaml's `static` job on
      # 2026-08-19. `Static analysis` is required on no branch, so all three were
      # advice: a PR could change an installer script, leave manifest.sha256
      # stale, and merge on its required checks. Worse, they shared that job's
      # `timeout-minutes: 10` with an apt-get, and on 2026-08-19 that apt-get ate
      # the whole budget five times on client#752 -- all four guards reported
      # `skipped` while the required checks went green. A guard that shares a
      # budget with an unrelated download can be silenced by it.
      #
      # No `timeout-minutes` here, deliberately. A required job with no timeout
      # that hangs blocks the merge; a required job that is killed mid-way can
      # report guards as `skipped`. Fail closed: prefer the slow red.
      - name: Duplicated-declaration guards (make drift)
        run: make drift
