name: Standard checks

# Emits the org-standard required status checks **Lint** and **Unit tests** for
# this (shell / Helm) repo, so branch-protection rules that require those exact
# contexts are satisfied and PRs can merge.
#
# IMPORTANT — deliberately NOT path-filtered. A *required* status check must
# report on EVERY PR to the protected branch; if it were gated on `paths:`, a PR
# that didn't touch those paths would never produce the check and would sit
# forever at "Expected — waiting for status to be reported", blocking the merge.
#
# These jobs reuse the same proven steps as `installer-tests.yaml`'s deeper
# suite (which keeps the broader coverage: Pester on Windows, distro-prereqs,
# e2e). Keep SOMETHING reporting `Lint` + `Unit tests` unconditionally.
#
# That "if the two ever feel redundant, fold the deep suite's names into these
# and drop the duplicates" invitation was taken on 2026-08-19: installer-tests'
# `static` job restated this job's parse loop and its exact 19-file shellcheck
# sweep, and carried four guards that gated nothing because `Static analysis` is
# a required check on no branch. The job is gone. Its shellcheck and bash -n are
# `make lint` here, its PSScriptAnalyzer is a step below, and its three
# duplicated-declaration guards are in drift-checks.yaml's required job.
#
# STILL NOT GATED, and deliberately out of scope of that change: Pester. The
# PowerShell installer's unit suite reports as `Pester (windows-latest)` /
# `Pester (ubuntu-latest)`, neither of which is a required context, so `Unit
# tests` below gates bats only. Adding it means a required check on a
# windows-latest runner -- a cost and flake question, not a cleanup.

on:
  push:
    branches: [main, develop, openshift]
  pull_request:
    branches: [main, develop, openshift]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # shellcheck IS on the ubuntu-latest runner image -- the comment that used
      # to sit here said it wasn't, and the unconditional `apt-get update &&
      # apt-get install` it justified is not harmless bootstrapping. On
      # 2026-08-19 that same apt-get pair, in installer-tests.yaml's `static`
      # job, hung for the job's full `timeout-minutes: 10` on five consecutive
      # runs of client#752 and took four guards down with it (they reported
      # `skipped`). Measured: the org's `quality / shellcheck` job runs
      # shellcheck 3 s after checkout having installed nothing.
      #
      # So: use what the image ships, and install only if a future image drops
      # it. Fail closed -- if neither path yields shellcheck, `make lint` below
      # fails and this REQUIRED check goes red rather than skipping the sweep.
      - name: Ensure shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "shellcheck not on the runner image — installing"
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version | grep version

      - name: make lint
        # `make lint` (backend#1606). This job used to restate the parse loop AND
        # spell out the shellcheck file list inline, while the Makefile kept the
        # same list in SHELLCHECK_FILES. The two had ALREADY drifted, and in the
        # direction nobody notices: the Makefile carried 19 entries and this file
        # 9, so ten scripts were shellchecked on a contributor's machine and NOT
        # at the merge gate --
        #
        #   scripts/gen-manifest.sh          scripts/check-facts.sh
        #   scripts/check-style.sh           scripts/lib/*.sh
        #   scripts/tests/check-drift.sh     scripts/tests/e2e-full-seal.sh
        #   scripts/tests/e2e-journey.sh     scripts/tests/path-persist.sh
        #   scripts/tests/chart-env-vocabulary.sh
        #   scripts/tests/env-vocabulary-agreement.sh
        #
        # gen-manifest.sh is the installer's integrity manifest generator, so a
        # shell defect there was invisible to this gate. Measured green across
        # all 19 before this landed, so it arms a green check rather than
        # importing a backlog.
        run: make lint

      # Advisory only, and it carries no file list of its own -- `make
      # lint-warnings` reuses SHELLCHECK_FILES. Inherited from the deleted
      # `static` job so the SC2034 visibility survives the move. `|| true` lives
      # in the target; this step cannot fail the check.
      - name: shellcheck warnings (advisory, non-blocking)
        if: always()
        run: make lint-warnings

      # PSScriptAnalyzer moved here from installer-tests.yaml's `static` job on
      # 2026-08-19, for the same reason R8 moved to the drift job: `Static
      # analysis` is a required check on no branch, so the PowerShell lint could
      # only advise. `Lint` IS required on develop and on main, and a lint of
      # scripts/install.ps1 -- the R8 trust root on Windows -- belongs behind a
      # gate rather than beside one.
      #
      # NOT in `make lint`: it needs pwsh and a PSGallery fetch, which most dev
      # machines have neither of, and a `make check` that fails on a missing pwsh
      # is a `make check` people stop running. Skipping it locally is fine
      # precisely because this job cannot skip it -- `shell: pwsh` fails the
      # REQUIRED check outright if pwsh is ever absent.
      #
      # `if: always()` so a red `make lint` above still reports the PowerShell
      # verdict in the same run. Both are mechanical and independent; making the
      # author fix one to discover the other is two round trips for no reason.
      - name: PSScriptAnalyzer (PowerShell installer)
        if: always()
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -SkipPublisherCheck -Scope CurrentUser
          # Both PowerShell entrypoints (the bootstrap install.ps1, R8 trust root, and the
          # main installer install-k8s.ps1) plus the Windows e2e driver (#436) — the driver
          # only RUNS on the self-hosted nested-virt runner, but lint it here on every push
          # so a syntax/verb regression fails fast instead of at the nightly run.
          $issues = @()
          foreach ($p in 'scripts/install.ps1', 'scripts/install-k8s.ps1', 'scripts/tests/e2e-windows.ps1') {
            $issues += Invoke-ScriptAnalyzer -Path $p -Severity Error,Warning
          }
          if ($issues) { $issues | Format-Table -AutoSize }
          $errs = @($issues | Where-Object { $_.Severity -eq 'Error' })
          if ($errs.Count -gt 0) { Write-Error "PSScriptAnalyzer: $($errs.Count) error(s)"; exit 1 }
          Write-Host "no PSScriptAnalyzer errors"

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats

      - name: Run bats (bash unit suite, mocked)
        run: bats scripts/tests/*.bats
