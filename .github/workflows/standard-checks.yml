name: Standard checks

# Emits the org-standard required status checks **Lint** and **Unit tests** for
# this (shell / Helm) repo, so branch-protection rules that require those exact
# contexts are satisfied and PRs can merge.
#
# IMPORTANT — deliberately NOT path-filtered. A *required* status check must
# report on EVERY PR to the protected branch; if it were gated on `paths:`, a PR
# that didn't touch those paths would never produce the check and would sit
# forever at "Expected — waiting for status to be reported", blocking the merge.
#
# These jobs reuse the same proven steps as `installer-tests.yaml`'s deeper
# suite (which keeps the broader coverage: PSScriptAnalyzer, Pester on Windows,
# distro-prereqs, e2e). If the two ever feel redundant, fold the deep suite's
# names into these and drop the duplicates — but keep SOMETHING reporting
# `Lint` + `Unit tests` unconditionally.

on:
  push:
    branches: [main, develop, openshift]
  pull_request:
    branches: [main, develop, openshift]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # #753: this job had no timeout at all, so when `Install shellcheck` stalled
    # on 2026-08-19 it drifted toward GitHub's 360-minute default instead of
    # failing fast. Every job in this file now has a bound.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The `Install shellcheck` step that used to sit here is gone, and the
      # premise it was written on ("shellcheck itself is not on the runner
      # image") is simply false — it IS preinstalled on ubuntu-latest, which is
      # how `quality / shellcheck` runs without installing anything. The apt
      # call bought nothing and cost this job 35+ minutes on 2026-08-19 (#753).
      #
      # shellcheck now runs in exactly one place: `quality / shellcheck`, also
      # a required check on develop, which derives its file set from the tree
      # rather than enumerating it. See installer-tests.yaml's `static` job for
      # the measurement. This job keeps the parse half, which needs no install.

      - name: make parse
        # Calls the Makefile rather than restating the loop (backend#1606). That
        # ticket's concern was a hand-written FILE LIST drifting between the
        # Makefile and this workflow; it fixed the drift by re-copying the list,
        # which only reset the clock — measured 2026-08-19, the list had drifted
        # again, past eight scripts. `make parse` enumerates nothing (it is a
        # `find`), and shellcheck's file set is now derived by the org gate, so
        # there is no longer a list here for anything to drift from.
        run: make parse

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    # See the lint job: no job in this file had a timeout before #753.
    # bats itself runs in ~2 min; the headroom is for the apt install.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # NOT hardened here. bats has no preinstalled-or-reusable equivalent, so
      # unlike shellcheck it genuinely has to be installed, and bounding and
      # retrying package installs is #753's own scope rather than this change's.
      # The timeout above at least turns a stall into a bounded failure.
      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats

      - name: Run bats (bash unit suite, mocked)
        run: bats scripts/tests/*.bats
