name: Installer tests

# Validates the curl/PowerShell installer (scripts/) across the breadth of
# environments a customer might actually have:
#   (bats, the mocked bash unit suite, is NOT here: it runs once, as the
#    required `Unit tests` check in standard-checks.yml. A second, non-required
#    copy lived here as `unit-bash` until 2026-09-09 — 5-6 CI-minutes per
#    scripts/** push that could never block anything.)
#   • unit-pester— Pester for the PowerShell installer, on Linux AND real Windows
#   • distro-prereqs — runs the REAL Linux prerequisite-install path (package
#                  manager, system deps, Docker branch, kernel modules, kubectl/
#                  k3d/helm) inside a fresh container for each major distro family.
#                  This is what catches "works on Ubuntu, breaks on minimal RHEL"
#                  bugs that mocked unit tests can't see.
on:
  push:
    branches: [main, develop]
    paths:
      - 'scripts/**'
      - '.github/workflows/installer-tests.yaml'
  pull_request:
    # `labeled` is required so adding the `e2e` label to an open PR starts the
    # e2e-journey job immediately — with the default types it would only fire on
    # the next push, making the label gate feel broken.
    types: [opened, synchronize, reopened, labeled]
    branches: [main, develop]
    paths:
      - 'scripts/**'
      - '.github/workflows/installer-tests.yaml'
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC — catch drift as distro base images move
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded PR runs — this suite is expensive (9-distro
  # docker-in-docker matrix + real k3d e2e + Windows Pester). Never cancel
  # push/schedule runs.
  group: installer-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The `static` job lived here until 2026-08-19. It is gone, and every part of it
  # now sits behind a check that can actually block.
  #
  # #753/#754 had already deleted its shellcheck step (three copies of shellcheck,
  # only this one non-gating and enumerated) and said the R8-step-as-a-gate
  # question was backend#2182/#2183's to answer. This is that answer: `Static
  # analysis` is a required status check on NO branch — verified against develop,
  # staging, main and both rulesets — so R8, the cross-OS facts check, the style
  # guard and PSScriptAnalyzer could annotate a PR and never stop one. Worse, they
  # shared this job's `timeout-minutes: 10` with an apt-get that ate the whole
  # budget five times on client#752; all four reported `skipped` while every
  # required check went green.
  #
  # Where each part went:
  #   bash -n               -> standard-checks.yml `Lint` (required), via `make parse`
  #   PSScriptAnalyzer      -> standard-checks.yml `Lint` (required)
  #   gen-manifest --check  -> drift-checks.yaml `Source-of-truth drift` (required)
  #   check-facts --check   -> drift-checks.yaml `Source-of-truth drift` (required)
  #   check-style.sh        -> drift-checks.yaml `Source-of-truth drift` (required)
  #
  # The three guard moves go through the Makefile's `drift` target, so the gate and
  # the pre-push hook read one list instead of two that had already diverged. This
  # job keeps only what nothing else can do: Pester on real Windows, the
  # 9-distro prereq matrix, PATH persistence and the e2e runs. (The bats suite
  # also ran here as `unit-bash` until 2026-09-09 — a byte-for-byte twin of the
  # required `Unit tests` job in standard-checks.yml, and not itself required,
  # so it was advice at ~5 min a run; the required copy is the only one now.)

  unit-pester:
    timeout-minutes: 20
    # Pester on Linux pwsh (fast) AND real Windows — the .ps1 installer's actual
    # target. fail-fast:false so a Windows-only surprise doesn't mask Linux signal.
    name: Pester (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Pester
        shell: pwsh
        env:
          TB_PESTER: "1"
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          # PINNED TO THE 5 MAJOR (@saadqbal on client#931). `-MinimumVersion`
          # alone takes whatever the gallery has newest, so this job silently
          # drifted onto 6.x while the mutation tier certifies guards under 5.x --
          # and .cursor/BUGBOT.md rule 6, which the same PR adds, exists because
          # guards bind DIFFERENTLY across those two majors. An unpinned suite
          # cannot say which one it proved.
          #
          # 6.x is not dropped; it moved to the `Pester next-major` job below, a
          # NEW context. The name of this one is deliberately unchanged: adding a
          # matrix dimension here would rename `Pester (<os>)`, and a renamed
          # required context never reports and blocks every PR in the repo. I
          # cannot read branch protection to rule that out (404 on my token, as on
          # Asad's and Arturo's), so this change adds contexts and renames none.
          Install-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 -Force
          $cfg = New-PesterConfiguration
          # The whole tests dir — picks up install-k8s.Tests.ps1 AND install.Tests.ps1
          # (the R8 bootstrap) without needing a per-file edit as suites are added.
          $cfg.Run.Path = "scripts/tests"
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = "Detailed"
          Invoke-Pester -Configuration $cfg

  unit-pester-next:
    timeout-minutes: 20
    # THE OTHER MAJOR, ON PURPOSE. The suites are asserted to pass on Pester 5.5
    # (the version the mutation tier certifies against) and on 6.x, because
    # .cursor/BUGBOT.md rule 6 records that assertions bind differently across
    # them -- three capture strategies were burned on backend#2849 discovering
    # exactly that, each green on one major and red on the other.
    #
    # A NEW context rather than a matrix dimension on `Pester (<os>)`: renaming an
    # existing context would break it if it is required, and branch protection is
    # unreadable from any of our tokens.
    #
    # Not fail-fast, and allowed to be the noisier of the two: if 6.x breaks
    # first, that is the signal this job exists to give.
    name: Pester next-major (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Pester on the next major
        shell: pwsh
        env:
          TB_PESTER: "1"
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 6.0.0 -MaximumVersion 6.99.99 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -MinimumVersion 6.0.0 -MaximumVersion 6.99.99 -Force
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = "scripts/tests"
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = "Detailed"
          Invoke-Pester -Configuration $cfg

  mutation-check:
    # EVERY GUARD MUST STILL CATCH ITS OWN BUG. 1000+ green assertions prove
    # nothing on their own: most installer guards read a property off the SOURCE
    # TEXT, and such a guard passes forever once the string drifts. This
    # reintroduces each fixed defect into a COPY of the tree and requires the
    # suite to go red. backend#2675 / #2849 are why -- both were "already fixed",
    # and both were found by a human running the installer instead.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prove every installer guard still bites
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          # THE SAME CEILING THE HARNESS IMPORTS WITH (Bugbot on #931).
          # `-MinimumVersion` alone takes the newest the gallery has -- 6.x today --
          # while every suite child imports with a 5.x ceiling, so the child cannot
          # load Pester, prints no RESULT, and this job dies at the baseline having
          # proven nothing. @saadqbal hit exactly that. The two pins move together.
          Install-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 -Force -SkipPublisherCheck -Scope CurrentUser
          pwsh -NoProfile -File scripts/tests/mutation-check.ps1

  distro-prereqs:
    timeout-minutes: 20
    # Runs the installer's REAL Linux prerequisite path in a fresh container for
    # each distro family. Proves the package-manager / Docker / tar+gzip / helm
    # branches all resolve and install — the layer where every installer bug we
    # have shipped lived (#718 PATH, #719 RHEL docker-ce, #720 the per-distro
    # package name of a since-retired prerequisite, the AlmaLinux kernel-modules
    # gap, the Amazon Linux openssl/tar gap).
    # It does NOT start dockerd or create a cluster — that needs a real kernel +
    # systemd, covered by local VMs and (optionally) a future e2e job. Arch is
    # omitted: its official image is x86-only and bare containers need keyring
    # bootstrapping; the pacman branch is covered by the bats unit test.
    name: Prereqs — ${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - 'ubuntu:22.04'        # apt / get.docker.com — most common server
          - 'ubuntu:24.04'        # newest LTS
          - 'debian:12'           # apt
          - 'almalinux:9'         # dnf + docker-ce repo (RHEL rebuild, #719)
          - 'almalinux:8'         # older RHEL rebuild
          - 'rockylinux:9'        # the other RHEL rebuild
          - 'amazonlinux:2023'    # dnf + 'docker' pkg — common AWS default
          - 'fedora:latest'       # dnf, falls through to get.docker.com
          - 'opensuse/leap:15.6'  # zypper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pull the distro image FIRST, bounded and retried. `docker run` pulls
      # implicitly with no timeout, so Docker Hub connectivity trouble either
      # fails the job in seconds (registry-1.docker.io timeout, exit 125) or
      # stalls it until timeout-minutes kills it at 20 -- both hit three times
      # on 2026-08-04 (#525/#592), always infra, never the diff. Three bounded
      # attempts turn that into a cheap retry with an honest error. Bounds are
      # sized so the WORST case (~5.5 min) still leaves the 20-minute job most
      # of its budget for the real work (Bugbot): a healthy pull takes seconds.
      - name: Pull ${{ matrix.distro }} (bounded, retried)
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          for i in 1 2 3; do
            timeout 90 docker pull -q "$DISTRO" && exit 0
            echo "::warning::pull of $DISTRO stalled or failed (attempt $i/3)"
            sleep $((i*10))
          done
          echo "::error::could not pull $DISTRO from Docker Hub in 3 bounded attempts - runner-to-registry connectivity, not this PR. Re-run this job."
          exit 1
      # Bound the container run ITSELF. distro-prereqs.sh bounds its own
      # package-manager calls, yet on 2026-09-04 a Prereqs leg still ran to the
      # job cap and reported `cancelled` with nothing readable in its log (#986):
      # a job-level timeout-minutes kills the step before it can say what it was
      # doing. The wrapper FAILS the step instead, so the script's own last
      # output stays in the log and names the command that stalled -- and it
      # owns the exit-code contract (124 AND 137: a PID-1 shell ignores SIGTERM,
      # so the likely stall path ends in SIGKILL), in one place for both jobs.
      # Sized so the worst-case pull above (~5.5 min) plus this bound still ends
      # inside the 20-minute job with room to spare; a healthy leg finishes in
      # under 3.
      - name: Install prerequisites in ${{ matrix.distro }}
        env:
          DISTRO: ${{ matrix.distro }}
          BOUND: 12m
        run: |
          bash scripts/tests/bounded-docker-run.sh "$BOUND" "prerequisite install in $DISTRO" \
            docker run --rm -v "$PWD:/src:ro" -w /src "$DISTRO" \
              bash scripts/tests/distro-prereqs.sh

  e2e-cluster:
    timeout-minutes: 30
    # Highest-fidelity check CI can run: brings up an ACTUAL k3d cluster via the
    # installer's own create_cluster() on a real kernel (Docker is preinstalled
    # on the runner), proves it can schedule + run a public workload, then tears
    # down. Stops BEFORE the tracebloc helm install / backend registration (those
    # need private images + real credentials), so it needs no secrets. Runs on
    # both amd64 and arm64 Ubuntu runners (arm64 is free on this public repo).
    name: E2E cluster (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bring up a real k3d cluster + run a workload
        run: bash scripts/tests/e2e-cluster.sh

  node-reservation-measure:
    timeout-minutes: 30
    # The Linux half of backend#2460's measurement. Brings up the installer's real
    # cluster on each Ubuntu runner and samples the kubelet's own accounting idle
    # and under a training-shaped load (the real 2 GB CPU task image, pulled and
    # run), then publishes the record scripts/gen-node-reservation-embed.sh
    # derives the `linux` reservation from. Three legs, because amd64 and arm64
    # are different machines and the generator takes the MAX across a platform's
    # records. Label-gated like e2e-journey: a 10-minute measurement is not a PR
    # check, it is evidence, re-taken when someone asks for it (`e2e` label) and on
    # the weekly schedule so a k3s bump that moves the footprint is seen.
    # NON-GATING BY DESIGN: it writes a record, it asserts nothing; the assertion
    # that the declared reservation is what the node took lives in e2e-cluster.
    name: Node reservation measurement (${{ matrix.os }})
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Measure the kubelet + runtime footprint on a real k3d node
        env:
          TB_MEASURE_IDLE_S: "180"
          TB_MEASURE_LOAD_S: "240"
          TB_MEASURE_INTERVAL_S: "10"
          TB_MEASURE_OUT: ${{ runner.temp }}/node-reservation-linux-${{ runner.arch }}-${{ matrix.os }}.json
        run: bash scripts/tests/measure-node-reservation.sh
      - name: Publish the measurement record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-reservation-${{ matrix.os }}
          path: ${{ runner.temp }}/node-reservation-*.json
          if-no-files-found: warn

  # The `e2e-proxy` job (`E2E auth-proxy (squid)`) moved to its own workflow,
  # e2e-auth-proxy.yaml, on 2026-08-27 (backend#2350). It shipped RED to `staging`
  # on client#789 and blocked nothing: a job in THIS workflow can never be a
  # required status check, because installer-tests is path-filtered on both push
  # AND pull_request, and a required check behind a paths filter never reports on
  # a PR outside its paths — GitHub then holds the PR at "waiting for status to be
  # reported" forever. A guard that cannot block is advice, not a gate
  # (backend#1729). Its new home has `pull_request` with no `paths:` so it always
  # reports and can be armed as a gate on `staging`/`main` — the same move
  # drift-checks.yaml's `Source-of-truth drift` made out of the old `static` job.
  # It ran on a single ubuntu-latest runner, so extracting it costs the matrix
  # nothing.

  path-persist:
    timeout-minutes: 20
    # Fresh-shell PATH-persistence guard for the tracebloc CLI — the cheap, wide
    # leg. Installs cli/install.sh into an OFF-PATH prefix (~/.local/bin) in a
    # plain container per distro, once per shell (SHELL=bash/zsh/fish so the
    # installer persists to that shell's rc), then opens a BRAND-NEW INTERACTIVE
    # shell of that kind and asserts `tracebloc` resolves + `tracebloc version`
    # runs. Forcing an off-PATH prefix is what gives the test a real signal: it
    # goes RED on an installer that doesn't persist PATH to the rc and GREEN on
    # the fixed one — the regression guard for the whole PATH class that
    # distro-prereqs / e2e-cluster can't see (they assert in the same shell that
    # ran the installer). No cluster, no Docker-in-Docker, no creds. The script
    # iterates shells INSIDE the container; distro is the matrix axis (it installs
    # zsh/fish in-container where a package exists). See client#310.
    name: PATH persist — ${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - 'ubuntu:22.04'        # most common server
          - 'ubuntu:24.04'        # newest LTS
          - 'debian:12'           # apt
          - 'fedora:latest'       # dnf
          - 'almalinux:9'         # RHEL rebuild
          - 'opensuse/leap:15.6'  # zypper
          - 'alpine:3'            # busybox sh + apk (optional, minimal)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pull the distro image FIRST, bounded and retried. `docker run` pulls
      # implicitly with no timeout, so Docker Hub connectivity trouble either
      # fails the job in seconds (registry-1.docker.io timeout, exit 125) or
      # stalls it until timeout-minutes kills it at 20 -- both hit three times
      # on 2026-08-04 (#525/#592), always infra, never the diff. Three bounded
      # attempts turn that into a cheap retry with an honest error. Bounds are
      # sized so the WORST case (~5.5 min) still leaves the 20-minute job most
      # of its budget for the real work (Bugbot): a healthy pull takes seconds.
      - name: Pull ${{ matrix.distro }} (bounded, retried)
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          for i in 1 2 3; do
            timeout 90 docker pull -q "$DISTRO" && exit 0
            echo "::warning::pull of $DISTRO stalled or failed (attempt $i/3)"
            sleep $((i*10))
          done
          echo "::error::could not pull $DISTRO from Docker Hub in 3 bounded attempts - runner-to-registry connectivity, not this PR. Re-run this job."
          exit 1
      - name: Fresh-shell PATH check in ${{ matrix.distro }}
        env:
          DISTRO: ${{ matrix.distro }}
          # Override TRACEBLOC_CLI_REF here to point at a specific cli install.sh
          # (URL or, for the cross-repo cli-side caller, a local path). Default
          # in the script is the public release installer (cli#61's PATH fix
          # shipped in v0.3.1+).
          TRACEBLOC_CLI_REF: ${{ vars.TRACEBLOC_CLI_REF }}
          BOUND: 12m
        run: |
          # Minimal base images (Alpine) ship only busybox `sh` — no bash — so we
          # can't exec the bash script directly as the entrypoint (the container
          # dies at init before line 1). Bootstrap bash via a POSIX `sh -c` wrapper:
          # `command -v bash` short-circuits on every glibc distro (they already
          # have it), and the apk branch only fires on Alpine. Then exec the script.
          # Bounded through the same wrapper as the Prereqs job (#986): a stalled
          # mirror inside the container must end as a FAILED step with the
          # script's last output in the log, not a `cancelled` job at the cap.
          bash scripts/tests/bounded-docker-run.sh "$BOUND" "PATH-persist check in $DISTRO" \
            docker run --rm \
              -e TRACEBLOC_CLI_REF \
              -v "$PWD:/src:ro" -w /src "$DISTRO" \
              sh -c 'command -v bash >/dev/null 2>&1 || apk add --no-cache bash >/dev/null 2>&1; exec bash scripts/tests/path-persist.sh'

  e2e-journey:
    timeout-minutes: 30
    # Leg 2 — the full last-mile journey on a real cluster: create_cluster() →
    # install the CLI via cli/install.sh → apply a CREDENTIAL-FREE stub the CLI
    # discovers (a *-jobs-manager Deployment with the chart's labels + an
    # `ingestor` SA) → assert `tracebloc cluster info` succeeds AND resolves from
    # a fresh shell → `dataset push --dry-run` smoke. No private images, no
    # secrets (the stub stands in for the parent release). Heavier than Leg 1
    # (boots a real k3d cluster), so — mirroring cli's e2e.yml — it runs on the
    # nightly schedule + workflow_dispatch, and on a PR ONLY when it carries the
    # `e2e` label. amd64, like e2e-cluster.
    name: E2E last-mile journey (amd64)
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install → CLI → cluster info (fresh shell) → dataset push --dry-run
        env:
          TRACEBLOC_CLI_REF: ${{ vars.TRACEBLOC_CLI_REF }}
        run: bash scripts/tests/e2e-journey.sh
