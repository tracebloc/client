name: Installer tests

# Validates the curl/PowerShell installer (scripts/) across the breadth of
# environments a customer might actually have:
#   • unit-bash  — bats (mocked) for the bash installer
#   • unit-pester— Pester for the PowerShell installer, on Linux AND real Windows
#   • distro-prereqs — runs the REAL Linux prerequisite-install path (package
#                  manager, system deps, Docker branch, kernel modules, kubectl/
#                  k3d/helm) inside a fresh container for each major distro family.
#                  This is what catches "works on Ubuntu, breaks on minimal RHEL"
#                  bugs that mocked unit tests can't see.
on:
  push:
    branches: [main, develop, openshift]
    paths:
      - 'scripts/**'
      - '.github/workflows/installer-tests.yaml'
  pull_request:
    # `labeled` is required so adding the `e2e` label to an open PR starts the
    # e2e-journey job immediately — with the default types it would only fire on
    # the next push, making the label gate feel broken.
    types: [opened, synchronize, reopened, labeled]
    branches: [main, develop, openshift]
    paths:
      - 'scripts/**'
      - '.github/workflows/installer-tests.yaml'
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC — catch drift as distro base images move
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded PR runs — this suite is expensive (9-distro
  # docker-in-docker matrix + real k3d e2e + Windows Pester). Never cancel
  # push/schedule runs.
  group: installer-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The `static` job lived here until 2026-08-19. It is gone, and every part of it
  # now sits behind a check that can actually block.
  #
  # #753/#754 had already deleted its shellcheck step (three copies of shellcheck,
  # only this one non-gating and enumerated) and said the R8-step-as-a-gate
  # question was backend#2182/#2183's to answer. This is that answer: `Static
  # analysis` is a required status check on NO branch — verified against develop,
  # staging, main and both rulesets — so R8, the cross-OS facts check, the style
  # guard and PSScriptAnalyzer could annotate a PR and never stop one. Worse, they
  # shared this job's `timeout-minutes: 10` with an apt-get that ate the whole
  # budget five times on client#752; all four reported `skipped` while every
  # required check went green.
  #
  # Where each part went:
  #   bash -n               -> standard-checks.yml `Lint` (required), via `make parse`
  #   PSScriptAnalyzer      -> standard-checks.yml `Lint` (required)
  #   gen-manifest --check  -> drift-checks.yaml `Source-of-truth drift` (required)
  #   check-facts --check   -> drift-checks.yaml `Source-of-truth drift` (required)
  #   check-style.sh        -> drift-checks.yaml `Source-of-truth drift` (required)
  #
  # The three guard moves go through the Makefile's `drift` target, so the gate and
  # the pre-push hook read one list instead of two that had already diverged. This
  # job keeps only what nothing else can do: the real bats suite, Pester on real
  # Windows, the 9-distro prereq matrix, PATH persistence and the e2e runs.

  unit-bash:
    # 10 -> 15. At 10 the bounded install (390 s worst case) plus ~155 s of bats
    # could still reach the cap and report `cancelled`, which is the #753 bug the
    # bound exists to remove. Matches standard-checks.yml's `Unit tests`.
    timeout-minutes: 15
    name: bats (bash unit, mocked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bounded and retried, same shape as "Pull <distro> (bounded, retried)"
      # below. This is not speculative hardening: this exact step stalled on
      # 2026-08-19 at 11:58 and burned the whole `timeout-minutes: 10` budget,
      # reporting `cancelled` with an empty log and `Run bats` skipped -- the
      # #753 signature, on bats rather than shellcheck. shellcheck could be
      # fixed by deleting the install (it is preinstalled); bats genuinely has
      # to be installed, so it gets a bound instead.
      #
      # `sudo timeout`, not `timeout sudo`: timeout must run as root so it
      # signals apt-get directly rather than signalling sudo and hoping the TERM
      # is forwarded. `-qq` is dropped on the install so a slow mirror leaves
      # something in the log, and `bats --version` is the proof-of-install
      # marker whose absence identified the stall in the first place.
      - name: Install bats (bounded, retried)
        # Bounds sized against the job budget (see the twin step in
        # standard-checks.yml for the arithmetic): worst case 3 x (60 + 60) +
        # 30 s backoff = 390 s, plus ~155 s of bats, inside the 15 minutes this
        # job now allows. `if`/`fi` not `[ ... ] &&` because the default shell is
        # `bash -e` and a false test on the last iteration would abort before the
        # ::error:: line printed.
        run: |
          for i in 1 2 3; do
            if sudo timeout 60 apt-get update -qq \
               && sudo timeout 60 apt-get install -y bats; then
              bats --version && exit 0
            fi
            echo "::warning::bats install stalled or failed (attempt $i/3)"
            if [ "$i" -lt 3 ]; then sleep $((i*10)); fi
          done
          echo "::error::could not install bats in 3 bounded attempts - runner-to-mirror connectivity, not this PR. Re-run this job."
          exit 1

      - name: Run bats
        run: bats scripts/tests/*.bats

  unit-pester:
    timeout-minutes: 20
    # Pester on Linux pwsh (fast) AND real Windows — the .ps1 installer's actual
    # target. fail-fast:false so a Windows-only surprise doesn't mask Linux signal.
    name: Pester (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Pester
        shell: pwsh
        env:
          TB_PESTER: "1"
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -MinimumVersion 5.5.0 -Force
          $cfg = New-PesterConfiguration
          # The whole tests dir — picks up install-k8s.Tests.ps1 AND install.Tests.ps1
          # (the R8 bootstrap) without needing a per-file edit as suites are added.
          $cfg.Run.Path = "scripts/tests"
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = "Detailed"
          Invoke-Pester -Configuration $cfg

  distro-prereqs:
    timeout-minutes: 20
    # Runs the installer's REAL Linux prerequisite path in a fresh container for
    # each distro family. Proves the package-manager / Docker / conntrack / helm
    # branches all resolve and install — the layer where every installer bug we
    # have shipped lived (#718 PATH, #719 RHEL docker-ce, #720 conntrack-tools,
    # the AlmaLinux kernel-modules gap, the Amazon Linux openssl/tar gap).
    # It does NOT start dockerd or create a cluster — that needs a real kernel +
    # systemd, covered by local VMs and (optionally) a future e2e job. Arch is
    # omitted: its official image is x86-only and bare containers need keyring
    # bootstrapping; the pacman branch is covered by the bats unit test.
    name: Prereqs — ${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - 'ubuntu:22.04'        # apt / get.docker.com — most common server
          - 'ubuntu:24.04'        # newest LTS
          - 'debian:12'           # apt
          - 'almalinux:9'         # dnf + docker-ce repo (RHEL rebuild, #719)
          - 'almalinux:8'         # older RHEL rebuild
          - 'rockylinux:9'        # the other RHEL rebuild
          - 'amazonlinux:2023'    # dnf + 'docker' pkg — common AWS default
          - 'fedora:latest'       # dnf, falls through to get.docker.com
          - 'opensuse/leap:15.6'  # zypper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pull the distro image FIRST, bounded and retried. `docker run` pulls
      # implicitly with no timeout, so Docker Hub connectivity trouble either
      # fails the job in seconds (registry-1.docker.io timeout, exit 125) or
      # stalls it until timeout-minutes kills it at 20 -- both hit three times
      # on 2026-08-04 (#525/#592), always infra, never the diff. Three bounded
      # attempts turn that into a cheap retry with an honest error. Bounds are
      # sized so the WORST case (~5.5 min) still leaves the 20-minute job most
      # of its budget for the real work (Bugbot): a healthy pull takes seconds.
      - name: Pull ${{ matrix.distro }} (bounded, retried)
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          for i in 1 2 3; do
            timeout 90 docker pull -q "$DISTRO" && exit 0
            echo "::warning::pull of $DISTRO stalled or failed (attempt $i/3)"
            sleep $((i*10))
          done
          echo "::error::could not pull $DISTRO from Docker Hub in 3 bounded attempts - runner-to-registry connectivity, not this PR. Re-run this job."
          exit 1
      - name: Install prerequisites in ${{ matrix.distro }}
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src "$DISTRO" \
            bash scripts/tests/distro-prereqs.sh

  e2e-cluster:
    timeout-minutes: 30
    # Highest-fidelity check CI can run: brings up an ACTUAL k3d cluster via the
    # installer's own create_cluster() on a real kernel (Docker is preinstalled
    # on the runner), proves it can schedule + run a public workload, then tears
    # down. Stops BEFORE the tracebloc helm install / backend registration (those
    # need private images + real credentials), so it needs no secrets. Runs on
    # both amd64 and arm64 Ubuntu runners (arm64 is free on this public repo).
    name: E2E cluster (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bring up a real k3d cluster + run a workload
        run: bash scripts/tests/e2e-cluster.sh

  e2e-proxy:
    timeout-minutes: 30
    # Authenticated corporate-proxy E2E (the Tenant-a/hospital archetype): stands
    # up a squid that REQUIRES basic auth, brings the cluster up with the
    # installer's proxy config pointed at it as user:pass@host, and proves the
    # nodes pull a workload image THROUGH the authed proxy (the squid log shows an
    # authenticated auth.docker.io CONNECT, which only a real pull makes). Guards
    # the #172/#174 proxy hardening end-to-end. Single runner (arch-agnostic). No secrets.
    name: E2E auth-proxy (squid)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cluster up through an authenticated proxy
        run: bash scripts/tests/e2e-proxy.sh

  path-persist:
    timeout-minutes: 20
    # Fresh-shell PATH-persistence guard for the tracebloc CLI — the cheap, wide
    # leg. Installs cli/install.sh into an OFF-PATH prefix (~/.local/bin) in a
    # plain container per distro, once per shell (SHELL=bash/zsh/fish so the
    # installer persists to that shell's rc), then opens a BRAND-NEW INTERACTIVE
    # shell of that kind and asserts `tracebloc` resolves + `tracebloc version`
    # runs. Forcing an off-PATH prefix is what gives the test a real signal: it
    # goes RED on an installer that doesn't persist PATH to the rc and GREEN on
    # the fixed one — the regression guard for the whole PATH class that
    # distro-prereqs / e2e-cluster can't see (they assert in the same shell that
    # ran the installer). No cluster, no Docker-in-Docker, no creds. The script
    # iterates shells INSIDE the container; distro is the matrix axis (it installs
    # zsh/fish in-container where a package exists). See client#310.
    name: PATH persist — ${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - 'ubuntu:22.04'        # most common server
          - 'ubuntu:24.04'        # newest LTS
          - 'debian:12'           # apt
          - 'fedora:latest'       # dnf
          - 'almalinux:9'         # RHEL rebuild
          - 'opensuse/leap:15.6'  # zypper
          - 'alpine:3'            # busybox sh + apk (optional, minimal)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pull the distro image FIRST, bounded and retried. `docker run` pulls
      # implicitly with no timeout, so Docker Hub connectivity trouble either
      # fails the job in seconds (registry-1.docker.io timeout, exit 125) or
      # stalls it until timeout-minutes kills it at 20 -- both hit three times
      # on 2026-08-04 (#525/#592), always infra, never the diff. Three bounded
      # attempts turn that into a cheap retry with an honest error. Bounds are
      # sized so the WORST case (~5.5 min) still leaves the 20-minute job most
      # of its budget for the real work (Bugbot): a healthy pull takes seconds.
      - name: Pull ${{ matrix.distro }} (bounded, retried)
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          for i in 1 2 3; do
            timeout 90 docker pull -q "$DISTRO" && exit 0
            echo "::warning::pull of $DISTRO stalled or failed (attempt $i/3)"
            sleep $((i*10))
          done
          echo "::error::could not pull $DISTRO from Docker Hub in 3 bounded attempts - runner-to-registry connectivity, not this PR. Re-run this job."
          exit 1
      - name: Fresh-shell PATH check in ${{ matrix.distro }}
        env:
          DISTRO: ${{ matrix.distro }}
          # Override TRACEBLOC_CLI_REF here to point at a specific cli install.sh
          # (URL or, for the cross-repo cli-side caller, a local path). Default
          # in the script is the public release installer (cli#61's PATH fix
          # shipped in v0.3.1+).
          TRACEBLOC_CLI_REF: ${{ vars.TRACEBLOC_CLI_REF }}
        run: |
          # Minimal base images (Alpine) ship only busybox `sh` — no bash — so we
          # can't exec the bash script directly as the entrypoint (the container
          # dies at init before line 1). Bootstrap bash via a POSIX `sh -c` wrapper:
          # `command -v bash` short-circuits on every glibc distro (they already
          # have it), and the apk branch only fires on Alpine. Then exec the script.
          docker run --rm \
            -e TRACEBLOC_CLI_REF \
            -v "$PWD:/src:ro" -w /src "$DISTRO" \
            sh -c 'command -v bash >/dev/null 2>&1 || apk add --no-cache bash >/dev/null 2>&1; exec bash scripts/tests/path-persist.sh'

  e2e-journey:
    timeout-minutes: 30
    # Leg 2 — the full last-mile journey on a real cluster: create_cluster() →
    # install the CLI via cli/install.sh → apply a CREDENTIAL-FREE stub the CLI
    # discovers (a *-jobs-manager Deployment with the chart's labels + an
    # `ingestor` SA) → assert `tracebloc cluster info` succeeds AND resolves from
    # a fresh shell → `dataset push --dry-run` smoke. No private images, no
    # secrets (the stub stands in for the parent release). Heavier than Leg 1
    # (boots a real k3d cluster), so — mirroring cli's e2e.yml — it runs on the
    # nightly schedule + workflow_dispatch, and on a PR ONLY when it carries the
    # `e2e` label. amd64, like e2e-cluster.
    name: E2E last-mile journey (amd64)
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install → CLI → cluster info (fresh shell) → dataset push --dry-run
        env:
          TRACEBLOC_CLI_REF: ${{ vars.TRACEBLOC_CLI_REF }}
        run: bash scripts/tests/e2e-journey.sh
