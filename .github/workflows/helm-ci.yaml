name: Helm Chart CI

on:
  push:
    branches: [main, develop, openshift]
    paths:
      - 'client/**'
      - 'ingestor/**'
      - 'scripts/tests/e2e-auto-upgrade.sh'
      - 'scripts/tests/e2e-seal-check.sh'
      - 'scripts/tests/e2e-full-seal.sh'
      - 'scripts/tests/lib/e2e-common.sh'
      - 'scripts/tests/chart-env-vocabulary.sh'
      - 'scripts/lib/**'
      # This workflow's `lint` job runs `make helm-lint helm-vocab`, so the
      # Makefile is part of what the gate executes: an edit to those targets
      # has to be able to start it.
      - 'Makefile'
      - '.github/workflows/helm-ci.yaml'
  pull_request:
    branches: [main, develop, openshift]
    paths:
      - 'client/**'
      - 'ingestor/**'
      - 'scripts/tests/e2e-auto-upgrade.sh'
      - 'scripts/tests/e2e-seal-check.sh'
      - 'scripts/tests/e2e-full-seal.sh'
      - 'scripts/tests/lib/e2e-common.sh'
      - 'scripts/tests/chart-env-vocabulary.sh'
      - 'scripts/lib/**'
      # This workflow's `lint` job runs `make helm-lint helm-vocab`, so the
      # Makefile is part of what the gate executes: an edit to those targets
      # has to be able to start it.
      - 'Makefile'
      - '.github/workflows/helm-ci.yaml'
  # Manual runs — mainly to fire full-seal-e2e on demand (e.g. right after the
  # e2e-test-agent secrets are provisioned, or to re-record a seal run).
  workflow_dispatch:

concurrency:
  # Cancel superseded runs on PRs — this is the repo's heaviest workflow
  # (a real k3d cluster in upgrade-e2e plus two 4-platform matrices). Never
  # cancel push/schedule runs.
  group: helm-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    timeout-minutes: 10
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # helm is not on the runner image at a version we choose, so it is
      # installed here at the pin this repo standardises on. That is
      # environment bootstrapping, not a duplicated command.
      #
      # This comment used to cite the shellcheck apt install in
      # standard-checks.yml as the parallel case. That install is gone (#753):
      # its premise was wrong -- shellcheck IS on the runner image -- so it was
      # never the same distinction, and it hung CI for 35 minutes. helm is the
      # genuine case: pinned, absent from the image, and installed by a
      # sha-pinned action rather than a package manager, which is what a
      # bootstrap step should look like.
      #
      # Both `helm-lint` and `helm-vocab` shell out to
      # `helm`, and chart-env-vocabulary.sh's helper-backstop cases branch on
      # the helm VERSION (they self-skip below 3.16), so an unpinned runner
      # helm would silently change which assertions run. drift-checks.yaml
      # pins the identical action + version for the same reason.
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.15.4

      - name: make helm-lint helm-vocab
        # Both targets, from the Makefile that already declares them
        # (backend#1606). This job restated the `client/ci/*-values.yaml` loop,
        # the `helm lint --strict ./ingestor` call, and the chart-vocabulary
        # script verbatim.
        #
        # `helm-vocab` is the chart vocabulary only. The CLIENT_ENV
        # vocabulary-agreement guard (backend#1729 sweep 5) used to run in this
        # job too; #715 moved it to drift-checks.yaml's `Source-of-truth drift`
        # job, which is a REQUIRED check on develop and main -- `Helm lint` is
        # not, so here the guard could only advise. Calling the Makefile must
        # not quietly undo that, so the guard sits in `make drift` (the target
        # that mirrors the drift gate) and not in `helm-vocab`; `make check`
        # runs both, so the local tier is unchanged.
        #
        # The helper-backstop cases inside chart-env-vocabulary.sh self-skip
        # when helm predates --skip-schema-validation (3.16); the pin above is
        # v3.15.4, so they are skipped here today and run for anyone local on
        # 3.16+. Bumping the pin turns them on with no change to this file.
        run: make helm-lint helm-vocab

  template:
    timeout-minutes: 10
    name: Template render
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [aks, bm, eks, oc]
    env:
      # Pinned by version AND digest. To bump, change both together, taking the
      # digest from the upstream `CHECKSUMS` release asset:
      #   https://github.com/yannh/kubeconform/releases/download/v<version>/CHECKSUMS
      KUBECONFORM_VERSION: "0.8.0"
      KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.15.4

      - name: Helm template — ${{ matrix.platform }}
        run: |
          helm template test-${{ matrix.platform }} ./client \
            -f client/ci/${{ matrix.platform }}-values.yaml \
            > /tmp/rendered-${{ matrix.platform }}.yaml
          echo "Rendered $(wc -l < /tmp/rendered-${{ matrix.platform }}.yaml) lines"

      - name: Install kubeconform (version + digest pinned)
        # Was `curl .../releases/latest/... | tar xz -C /usr/local/bin`, which
        # had two problems. `releases/latest` is a mutable pointer, so a new
        # upstream release silently changed the binary this job executed; and
        # piping straight into tar means the bytes are extracted before anything
        # can inspect them, so there was no point at which a digest could be
        # checked. Download to a file, verify against the pinned digest, and only
        # then install.
        run: |
          set -euo pipefail
          # Assert the digest is a full SHA-256 before trusting it. `sha256sum -c`
          # reports a malformed line as "no properly formatted checksum lines
          # found", and whether that is a non-zero exit depends on the coreutils
          # build (GNU exits 1; the macOS sha256sum exits 0). An empty or
          # truncated env var must be a hard failure here, not a verification
          # that quietly checks nothing and lets the install proceed.
          if [[ ! "${KUBECONFORM_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::KUBECONFORM_SHA256 is not a 64-character hex SHA-256 digest."
            exit 1
          fi
          TARBALL="kubeconform-linux-amd64.tar.gz"
          URL="https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/${TARBALL}"
          # -f so an HTTP error is a curl failure rather than an error page
          # written to disk and handed to sha256sum. --connect-timeout/--max-time
          # bound the download so a stalled endpoint fails the step fast instead of
          # hanging the template matrix to the GitHub Actions cap (backend#1497).
          curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 120 -o "$RUNNER_TEMP/$TARBALL" "$URL"
          # Any mismatch exits non-zero here, and `set -e` fails the step before
          # the binary is extracted or placed on PATH.
          echo "${KUBECONFORM_SHA256}  $RUNNER_TEMP/$TARBALL" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$TARBALL" -C "$RUNNER_TEMP" kubeconform
          install -m 0755 "$RUNNER_TEMP/kubeconform" /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate Kubernetes manifests
        run: |
          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -summary \
            /tmp/rendered-${{ matrix.platform }}.yaml

  unittest:
    timeout-minutes: 10
    name: Helm unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.15.4

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version 0.5.2

      - name: Run unit tests
        run: helm unittest ./client

  ingestor-multiarch:
    timeout-minutes: 10
    # Guard: the ingestor image the cluster spawns must be a multi-arch index
    # (linux/amd64 + linux/arm64), or arm64 hosts (Apple Silicon, Graviton)
    # fail data ingestion with "no match for platform" / ImagePullBackOff.
    # dev/staging edges spawn ingestion Jobs by the floating tag
    # `images.ingestor.tag` (imagePullPolicy=Always), so that tag must be
    # multi-arch. Prod edges spawn `images.ingestor.prodDigest` — a chart default
    # that ships to the whole fleet (backend#1245) — so that MUST be checked too;
    # the pin previously lived in an install-time overlay this job never read.
    # `images.ingestor.digest` (empty by default) is the per-edge opt-in pin and
    # is checked when set. This would have caught #160 (the amd64-only v0.3.1
    # pin). See client#186.
    name: Spawned ingestor image is multi-arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert the ingestor tag and pinned digests are multi-arch
        run: |
          repo=$(yq '.images.ingestor.repository' client/values.yaml)
          if [ -z "$repo" ] || [ "$repo" = "null" ]; then repo="ghcr.io/tracebloc/ingestor"; fi
          tag=$(yq '.images.ingestor.tag' client/values.yaml)
          digest=$(yq '.images.ingestor.digest' client/values.yaml)
          prod_digest=$(yq '.images.ingestor.prodDigest' client/values.yaml)

          assert_multiarch() {
            ref="$1"; label="$2"
            echo "Inspecting $label: $ref"
            plats=$(docker buildx imagetools inspect "$ref" 2>&1 \
              | awk '/Platform:/{print $2}' | grep -v '^unknown' | sort -u)
            echo "Platforms: $(echo "$plats" | paste -sd' ' -)"
            echo "$plats" | grep -qx 'linux/arm64' || { echo "::error::$label ($ref) is NOT multi-arch (no linux/arm64). arm64 installs (Apple Silicon, Graviton) would fail ingestion with 'no match for platform' / ImagePullBackOff. See client#186 / #160."; exit 1; }
            echo "$plats" | grep -qx 'linux/amd64' || { echo "::error::$label ($ref) is missing linux/amd64."; exit 1; }
            echo "OK — $label is multi-arch (amd64 + arm64)."
          }

          # Every tag this chart can spawn by must be multi-arch. Since
          # backend#1360 that is `tag` (an explicit override, empty by default)
          # PLUS each per-environment entry in `channelTags` — an edge resolves
          # exactly one of them, so a single-arch value in any of them breaks
          # ingestion on arm64 for whichever environment lands on it.
          checked=0
          if [ -n "$tag" ] && [ "$tag" != "null" ]; then
            assert_multiarch "${repo}:${tag}" "explicit tag override (images.ingestor.tag)"
            checked=$((checked + 1))
          fi
          for env_key in dev stg prod; do
            channel=$(yq ".images.ingestor.channelTags.${env_key}" client/values.yaml)
            if [ -z "$channel" ] || [ "$channel" = "null" ]; then
              continue
            fi
            assert_multiarch "${repo}:${channel}" "channelTags.${env_key}"
            checked=$((checked + 1))
          done
          if [ "$checked" -eq 0 ]; then
            echo "::error::no spawnable ingestor tag is defined — images.ingestor.tag is empty and channelTags has no entries, so an edge with no digest has nothing to spawn."; exit 1
          fi

          # The prod pin is a chart DEFAULT that reaches every prod edge through
          # the fleet auto-upgrade, so a single-arch value here would break
          # ingestion fleet-wide on arm64. Hard-fail when it is missing: an empty
          # prodDigest silently un-pins prod (backend#1028 reproducibility) and
          # is never intentional.
          if [ -z "$prod_digest" ] || [ "$prod_digest" = "null" ]; then
            echo "::error::images.ingestor.prodDigest is empty — prod edges would silently fall back to the floating tag, losing the reproducibility pin (backend#1028/#1245). Resolve it with scripts/resolve-ingestor-digest.sh --write."; exit 1
          fi
          assert_multiarch "${repo}@${prod_digest}" "prod pin (images.ingestor.prodDigest)"

          # The per-edge pin is opt-in (empty by default). When set, it must be multi-arch too.
          if [ -n "$digest" ] && [ "$digest" != "null" ]; then
            assert_multiarch "${repo}@${digest}" "per-edge pinned digest"
          else
            echo "images.ingestor.digest empty (default) — no per-edge pin to check."
          fi

  upgrade-e2e:
    timeout-minutes: 30
    # Fleet auto-upgrade non-regression gate (client-runtime#102 / #245-class
    # regressions): installs the LAST PUBLISHED chart from gh-pages on a real
    # k3d cluster, then upgrades to THIS working tree via both
    # `--reuse-values` (manual-operator habit; nil-guards must hold, lockdown
    # must not engage) and `--reset-then-reuse-values` (the auto-upgrade
    # cronjob's path; new defaults must flow in inert), then flips the #102
    # egress-lockdown flags and proves the next auto-upgrade preserves them.
    # Pods are never waited on — published images need real credentials; the
    # regression class this guards lives in Helm templating/values semantics.
    name: Fleet auto-upgrade E2E (k3d)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Upgrade from last published release through both flag paths
        run: bash scripts/tests/e2e-auto-upgrade.sh

  seal-check-e2e:
    # 30m to match the sibling k3d job (upgrade-e2e): the script's own bounds
    # (create_cluster up to 15m + helm test 360s + tool install + install)
    # can exceed a 20m GHA cap on a slow cluster bring-up and false-fail even
    # while every component is still inside its own timeout (Bugbot).
    timeout-minutes: 30
    # RFC-0003 D12 (backend#1184): run the egress-enforcement seal-check LIVE on
    # a real k3d cluster with the lockdown engaged, closing the SEAL-CHECK §8.4
    # "full-chart probe run pending" gap (the k3s netpol substrate was verified
    # in #504). Zero secrets — a public curl image vs 1.1.1.1; no private images,
    # no backend. Proves the probe fires and the CNI actually blocks a
    # training-labelled pod's egress once allowExternalHttps=false.
    name: Seal-check egress-enforcement (k3d)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the live egress-enforcement seal-check
        run: bash scripts/tests/e2e-seal-check.sh

  full-seal-e2e:
    # backend#1184 deferred fast-follow: the FULL seal suite — egress-
    # enforcement + backend-reachability + bound-PVC storage-assertions — on a
    # real k3d cluster installed against the DEV backend as the dedicated
    # e2e-test-agent client. Real credentials, so it runs on push/dispatch
    # only, never on PRs: fork PRs can't read the secrets anyway, and a real
    # dev-backend login per PR push would be platform churn + runner cost for
    # no extra signal (the secret-free enforcement probe above covers PRs).
    # Until the secrets are provisioned the job SKIPS green with a notice —
    # see docs/SEAL-CHECK.md § Full-suite dev harness.
    if: github.event_name != 'pull_request'
    # 45m, deliberately above the sibling's 30m: this script stacks a 300s PVC
    # wait, two 300s rollouts and a 600s unfiltered helm test on top of
    # create_cluster's 15m bound — a slow-but-healthy run must not be killed
    # by GHA while inside every one of its own timeouts (Bugbot).
    timeout-minutes: 45
    # One dev-agent session at a time: two clusters authenticating as the same
    # client id would read as a duplicate/capacity anomaly on the platform.
    concurrency:
      group: full-seal-e2e-dev-agent
      cancel-in-progress: false
    name: Full seal suite vs dev (e2e-test-agent)
    runs-on: ubuntu-latest
    env:
      TB_E2E_CLIENT_ID: ${{ secrets.TB_E2E_CLIENT_ID }}
      TB_E2E_CLIENT_PASSWORD: ${{ secrets.TB_E2E_CLIENT_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the full seal suite (skips until the e2e-test-agent is provisioned)
        run: |
          if [ -z "$TB_E2E_CLIENT_ID" ] || [ -z "$TB_E2E_CLIENT_PASSWORD" ]; then
            echo "::notice::TB_E2E_CLIENT_ID / TB_E2E_CLIENT_PASSWORD are not set — skipping the full seal suite. Provision the dedicated dev e2e-test-agent client and add both repo Actions secrets to activate this job (backend#1184 residual; docs/SEAL-CHECK.md)."
            exit 0
          fi
          bash scripts/tests/e2e-full-seal.sh

  # Installer script tests (bats + Pester) + the cross-distro prerequisite matrix
  # live in their own workflow: .github/workflows/installer-tests.yaml
  # (triggered on scripts/** changes).
