    capabilities: "ddp,loss-coupled:embeddings,loss-coupled:time_to_event_prediction,min-micro-batch:2,no-backend-token,per_rank_split"
    parents:
      gpu:
        repository: "tracebloc/torch"
        digest: "sha256:882a0b26f3b9157cf35da476d2c3df47ac29369309543d7fb1f1007195381a9f"
        platforms:
          - "linux/amd64"
    macosBundle:
      digest: "sha256:c7160a9dae191b4e437abb677b673656ffcf7f46f15d468ab29d5d48f4b73576"
      location: "ghcr.io/tracebloc/engine-macos-arm64@sha256:c265244c8c82b231cde625deb7bc9f367f2ea031edee04c6c452c9c6ae2e50ae"
  # The ingestor image is spawned by
  # jobs-manager at ingestion-submission time, not as a long-lived pod.
  # jobs-manager resolves ONE effective digest from the keys below and spawns
  # each ingestion Job from it — see client-runtime
  # submit_ingestion_run._build_image_reference and the `tracebloc.ingestorDigest`
  # helper. The consuming contract is fixed:
  #   * effective digest set   → `repository@digest`, imagePullPolicy=IfNotPresent
  #   * effective digest empty → `repository:tag`,    imagePullPolicy=Always
  #
  # Non-prod (dev / staging) — floating, always-current:
  #   * No effective digest → each ingestion Job is spawned by the floating
  #     `tag` with imagePullPolicy=Always. The kubelet resolves the tag's
  #     current digest on every spawn (a cheap manifest check; already-present
  #     layers are reused), so the edge always runs the current published
  #     ingestor release. This mirrors how training pods are spawned.
  #   * New ingestor releases under the same `tag` are picked up on the
  #     next ingestion submit — no chart release, no CronJob, no
  #     `kubectl set env`. The image-refresh CronJob's ingestor (class-2)
  #     pass was retired; image-refresh now only rolls the long-lived
  #     jobs-manager pod.
  #
  # Prod — pinned, reproducible:
  #   * `prodDigestServiceDb` below is a CHART DEFAULT and applies whenever the
  #     resolved CLIENT_ENV is "prod", so a standard prod install is reproducible
  #     with no per-edge action and a republished pin reaches installed edges
  #     through the auto-upgrade the fleet already runs. See
  #     `prodDigestServiceDb`/`prodPin`.
  #   * An earlier attempt distributed this pin through an install-time
  #     `-f values-prod.yaml` overlay. That reached no edge: the installer never
  #     passed the overlay, and `helm upgrade --reset-then-reuse-values` (the
  #     auto-upgrade path) re-applies stored USER-SUPPLIED values while reading
  #     defaults only from `values.yaml`, so an overlay value could never be
  #     updated either. Chart defaults propagate; user-supplied values freeze.
  #     Hence the pin lives here.
  #
  # Any pinned digest — `prodDigestServiceDb` or `digest` — MUST be a multi-arch index
  # (linux/amd64 + linux/arm64): an amd64-only pin breaks ingestion on arm64
  # hosts (Apple Silicon, Graviton) with "no match for platform" /
  # ImagePullBackOff (the amd64-only v0.3.1 pin was the original
  # regression). The same applies to the floating `tag` — the team publishes the
  # tag as a multi-arch index. Enforced for both chart-default values by the
  # `ingestor-multiarch` job in .github/workflows/helm-ci.yaml.
  ingestor:
    # Image repository. Override for a private mirror / air-gapped registry
    # (which must host the same `tag` / `digest`). Surfaces into jobs-manager
    # as INGESTOR_IMAGE_REPOSITORY.
    repository: "ghcr.io/tracebloc/ingestor"
    # Floating tag spawned by default (imagePullPolicy=Always). The team's
    # ghcr.io publishing convention uses semver-style float tags — `0` tracks
    # the latest 0.x, `0.8` tracks the latest 0.8.x patch. Moving a line float
    # (`0.8` -> `0.9`) is deliberate: a future 0.9 release is NOT picked up
    # until someone changes it (or sets `0` for minor auto-track too).
    # `latest` is rejected by the schema.
    #
    # THIS FIELD IS EMPTY BY DEFAULT — see `tag: ""` below. The per-environment
    # floats in `channelTags` are what actually select a tag.
    #
    # The line the fleet tracks carries the ingestion correctness fixes and task
    # catalogue accumulated to date — case/whitespace
    # label-column resolution and UTF-8 BOM header
    # handling from the 0.6 line, plus 0.7's tabular schema-inference
    # rules, the semantic-segmentation mask_id contract, and the
    # minimum-image-size floor. Keep this tracking the current line:
    # leaving it on an older line while client-runtime's ingest schema tracks
    # newer categories re-opens the submit-vs-run drift bug (categories
    # accepted at submit that the spawned image can't process). See the
    # client-runtime ingest schema discussion.
    # Empty by DEFAULT: the effective tag now comes from `channelTags` below,
    # keyed on the resolved CLIENT_ENV. Set this to force one tag on an edge
    # regardless of environment (to pin an exact immutable image, prefer
    # `digest` — it wins over any tag).
    tag: ""

    # -- PER-ENVIRONMENT CHANNELS
    #
    # dev and staging edges track the internal channels published from the
    # matching data-ingestors branch (`publish-images.yml`: develop -> :dev,
    # staging -> :stg), so an ingestor change can be validated on a real edge
    # WITHOUT a production release. Before this, the ingestor image existed
    # only as a byproduct of a prod release, so testing one change cost a prod
    # PyPI publish plus an FR-gate override (2026-07-30).
    #
    # `prod` deliberately stays a semver float, NOT a `:prod` channel — no
    # such tag is published; prod normally runs `prodDigestServiceDb` and this is
    # only the fallback when pinning is disabled. Keep the prod entry tracking
    # the current release line for the same submit-vs-run reasons noted above.
    #
    # These are unsigned internal images. Do not point a prod edge at them.
    #
    # THESE THREE VALUES ARE MIRRORED as last-resort literals in the
    # `tracebloc.ingestorTag` helper, for the `--reuse-values` replay where
    # this key is absent and no chart default is adopted. Bump `prod` here and
    # you must bump it there; ingestor_channel_tag_test.yaml pins both so a
    # half-done bump fails CI. Read that helper's comment before touching prod.
    channelTags:
      dev: "dev"
      stg: "stg"
      # 0.12 line: the first line that runs every task the CLI submits --
      # FASTA folders (first in v0.11.1), multichannel images (v0.10.5),
      # mixed image sizes (v0.10.0) and text-value stripping (v0.9.3). THIS
      # FLOAT MOVES WITHOUT US: every 0.12.x patch lands on it.
      #
      # Do not restate the float's current version here. Any version written
      # into this comment is stale the moment the next release ships, and a
      # stale one reads as reassurance ("only two patches behind") for a gap
      # that may be much larger. scripts/check-digest-drift.sh is what tracks
      # it; it compares the float against `prodDigestServiceDb` on a schedule,
      # and the digest-drift watch opens the pin PR when they part company.
      # Moving to a new line is a person's change: this value, the literal in
      # `tracebloc.ingestorTag` and ingestor_channel_tag_test.yaml together.
      prod: "0.12"

    # -- PROD REPRODUCIBILITY PIN — the digest every prod edge runs.
    #
    # This is a CHART DEFAULT on purpose. The fleet auto-upgrade
    # CronJob runs `helm upgrade --reset-then-reuse-values` with no `-f` and no
    # `--set`: it resets to the NEW chart's values.yaml defaults, then re-applies
    # only the release's stored user-supplied values. A default therefore reaches
    # every installed edge on the next auto-upgrade; an install-time overlay value
    # freezes on its install-day value forever.
    #
    # Applies only where `prodPin` resolves true (prod) — see `prodPin` below.
    # It is the one prod pin: service DB accounts are always on, so every
    # ingestion Job gets DB_USER=tb_ingest and no edge needs an ingestor that
    # still carries the old edgeuser fallback (docs/SECURITY.md §4.1.1). The
    # retired `prodDigest` key is accepted and ignored, so an edge that stored
    # it cannot fail the render or run the build it named.
    #
    # A canonical multi-arch index, resolved, never hand-typed:
    # `scripts/resolve-ingestor-digest.sh` prints the `channelTags.prod` float's
    # index and `--write` patches this line. No Chart.yaml bump: the release
    # train numbers the client chart, so the next release publishes it. CI's
    # `ingestor-multiarch` job checks it on every PR.
    #
    # The digest-drift watch moves this pin by pull request, within its line:
    # when the `channelTags.prod` float names a newer release on its line,
    # scripts/verify-ingestor-release.sh re-verifies it and
    # scripts/ingestor-auto-pin.sh rewrites the pin, the paragraph below and its
    # `pinnedImageLabels` entry. A check that fails keeps the watch red and
    # opens nothing (docs/SECURITY.md §4.1.1).
    #
    # ghcr.io/tracebloc/ingestor multi-arch index, **v0.12.3** — VERIFIED
    # against ghcr.io 2026-11-07 by scripts/verify-ingestor-release.sh in the
    # digest-drift watch: a linux/amd64 + linux/arm64 OCI image index, the
    # digest the `0.12` float, the `0.12.3` tag and the v0.12.3 GitHub Release
    # name, with one version and revision label on both platforms; revision
    # b01a249, on main and named by refs/tags/v0.12.3; SLSA provenance and a
    # cosign keyless signature from data-ingestors' release-image.yml at
    # refs/tags/v0.12.3. What the release changes is in its GitHub Release
    # notes and in the pin PR, which the watch opened.
    prodDigestServiceDb: "sha256:cca109b21903863f666e06e71015cb5b95d0dfc74af49686e9ac28cd1cd3983d"

    # -- What each chart-pinned ingestor image says about itself, keyed by its
    # digest. When the digest `tracebloc.ingestorDigest`
    # picks for this edge has an entry here, jobs-manager carries it as
    # TRACEBLOC_INGESTOR_IMAGE_VERSION / TRACEBLOC_INGESTOR_CAPABILITIES, and the
    # CLI reads those BEFORE it copies any data: an edge whose ingestor can't
    # run what the CLI is about to submit (a FASTA folder on a release before
    # v0.11.1, say) is refused up front in plain words, instead of failing a
    # schema check after the whole upload.
    #
    # Keyed by digest, not by pin name, so an entry can only ever describe the
    # image it was read from: an operator-set `digest` / `prodDigestServiceDb` that is
    # not listed here renders neither var (the CLI then treats the ingestor as
    # unknown and does not block), and a floating tag never renders them.
    #
    #   version       the image's `org.opencontainers.image.version` label.
    #   capabilities  its `io.tracebloc.ingestor.capabilities` label
    #                 (data-ingestors tracebloc_ingestor/capabilities.py). OMIT
    #                 the key when the image has no such label -- every release
    #                 before the one that ships it -- so "no label" never reads
    #                 as "can do nothing".
    #
    # READ OFF THE IMAGE, NEVER TYPED: `scripts/ingestor-pin-labels.sh <digest>`
    # prints the entry, and CI's `ingestor-multiarch` job fails when a chart pin
    # (prodDigestServiceDb, digest) has no entry, when an entry
    # disagrees with its image's labels, or when an entry names a digest no
    # chart pin uses. Moving a pin therefore means re-running the script.
    pinnedImageLabels:
      "sha256:cca109b21903863f666e06e71015cb5b95d0dfc74af49686e9ac28cd1cd3983d":
        version: "0.12.3"
        capabilities: "ingest:v1,layout:4,multi_label_text_classification:fasta,object_detection:manifestless,option:example,tabular_classification:wide-table,tabular_regression:wide-table,task:causal_language_modeling,task:embeddings,task:image_classification,task:keypoint_detection,task:masked_language_modeling,task:multi_label_text_classification,task:object_detection,task:semantic_segmentation,task:sentence_pair_classification,task:seq2seq,task:tabular_classification,task:tabular_regression,task:text_classification,task:text_regression,task:time_series_classification,task:time_series_forecasting,task:time_to_event_prediction,task:token_classification,text_classification:fasta,text_regression:fasta,time_series_forecasting:named-time-column,token_classification:fasta"

    # -- Whether `prodDigestServiceDb` applies on this edge. Default true, which means
    # "pin on prod only": it takes effect when the resolved CLIENT_ENV is "prod"
    # (that is, `env.CLIENT_ENV` unset or empty — the template defaults it to
    # prod). Dev and staging installs carry `env.CLIENT_ENV: dev|stg` in their
    # user-supplied values, so they keep floating on `tag` with
    # imagePullPolicy=Always and are never frozen on a stale build.
    #
    # Set FALSE on a canary prod edge to float it on `tag` while the rest of the
    # fleet stays pinned — e.g. to validate a new ingestor release in place
    # before it becomes the fleet-wide pin. Being user-supplied, that opt-out
    # survives auto-upgrades until an operator changes it back.
    prodPin: true

    # -- Explicit per-edge pin. Empty (default) = let `prodPin`/CLIENT_ENV
    # decide. Set to a canonical multi-arch digest to lock every ingestion Job on
    # THIS edge to that exact image in ANY environment; it takes precedence over
    # `prodDigestServiceDb` and over `prodPin: false` (so for a hard float, clear this to
    # "" as well). Use for debugging a release before rollout, certification, or
    # air-gapped repro. A single request can also be pinned via the submit
    # endpoint's `image_digest` body field, independent of this value.
    #
    # Set at install time this becomes a user-supplied value, so it freezes
    # across auto-upgrades — intended for a deliberate per-edge pin, and exactly
    # why the fleet-wide prod pin lives in `prodDigestServiceDb` instead.
    #
    # Last known-good baseline, for easy manual pinning: v0.3.6 (cumulative
    # NULL / empty-value ingestion fixes):
    #   sha256:dfdaa7e633a8df0f46b403e9422eba5c16bdb7d9c39047e6d3738f9e38fbdba8
    digest: ""
  # Same `digest` + `digestRegistry` contract as images.jobsManager above.
  podsMonitor:
    digest: ""
    digestRegistry: ""
  # Same contract. `resourceMonitor: false` (no DaemonSet) also counts as
  # "nothing to refresh" for the CronJob -- see tracebloc.resourceMonitorRefreshPinned.
  resourceMonitor:
    digest: ""
    digestRegistry: ""
  # Same contract, for the egress gate (egressGate below), which took over the
  # requests-proxy's workload and keeps this key. Leave `digest` EMPTY (default)
  # and the gate follows the honoured images.jobsManager pin, so the two pods
  # cannot run different builds of the same image; an own pin here that is
  # IGNORED (registry mismatch) is not an override and follows jobs-manager the
  # same way. Set both keys only to pin the gate apart from jobs-manager.
  requestsProxy:
    digest: ""
    digestRegistry: ""
  # -- CONTROL-PLANE PROD DEFAULTS: the published chart is the lockfile.
  # The digests a PROD edge runs for
  #    jobs-manager, pods-monitor and resource-monitor, keyed by the published
  #    image name (tracebloc/<name>), resolved on `prodDigestsRegistry`.
  #
  #    EMPTY IN GIT, FILLED IN THE PUBLISHED CHART. The release train records
  #    the digests the SAME hop promoted (client-runtime's `:stg` / `:prod`,
  #    each equal to the develop build it was promoted from) as the
  #    `control-plane-digests.json` asset on the release it cuts. The packaging
  #    job (release-helm-chart.yaml) stamps them into a copy of this file before
  #    `helm package`, and refuses to package without them. So the chart version
  #    names the bytes, staging reviewed the bytes prod runs, and a chart built
  #    from git floats. scripts/tests/control-plane-prod-digests.sh holds the
  #    values here empty: a hand-filled map would pin a git build to bytes no
  #    release recorded.
  #
  #   honoured  <=>  the resolved CLIENT_ENV is prod
  #                  AND the image's own `images.<image>.digest` is EMPTY
  #                  AND prodDigestsRegistry == the registry this release pulls
  #                      from (tracebloc.tbRegistry, the same rule as every pin)
  #                  AND the map's value for the image is not empty
  #   otherwise the map is not read: dev and staging edges float on :dev / :stg
  #   with the image-refresh CronJob, a mirror or docker.io edge floats as it
  #   does today, and no NOTES warning is printed (nobody set these values).
  #
  # PRECEDENCE. A set `images.<image>.digest` wins, honoured or not: an operator
  # pin on another registry is ignored with the NOTES warning above, and the
  # image floats rather than falling back to this map. requests-proxy has no
  # entry: it runs the jobs-manager image and follows the jobs-manager pin, this
  # map's included.
  #
  # image-refresh is off on prod (imageRefresh.enabled), so nothing re-images
  # these between chart releases. The per-edge unpin valve is
  # `--set images.prodDigests=null`: every control-plane image then floats on
  # its tag with imagePullPolicy=Always, and moves when its pod restarts; add
  # `--set imageRefresh.enabled=true` to have the CronJob re-pin it from the live
  # float instead. A mirror that holds these exact bytes adopts the map by
  # declaring its host: --set images.prodDigestsRegistry=<host>.
  prodDigests:
    jobs-manager: ""
    pods-monitor: ""
    resource-monitor: ""
  prodDigestsRegistry: "ghcr.io"
  mysqlClient:
    # Repository and tag are stated rather than left to template defaults so the
    # digest below is WATCHABLE: check-digest-drift.sh pairs a pin with the
    # repo/float in its own block, and this block had neither — so the daily
    # watch classified it UNWATCHABLE and exited non-zero, staying red forever
    # while the pin it was meant to compare was never checked at all
    # Both values are what the templates already default
    # to, so the rendered image is byte-identical.
    repository: "tracebloc/mysql-client"
    # THE REGISTRY THE PIN BELOW WAS RESOLVED ON.
    # Same `digest` + `digestRegistry` contract as images.jobsManager: the pin
    # renders only while this equals the registry the release pulls from
    # (tracebloc.tbRegistry), and is IGNORED otherwise -- the workload falls
    # back to `repository:tag`, which both ghcr.io and the frozen Hub namespace
    # serve. Set explicitly rather than left empty because the LEGACY rule reads
    # an empty value as docker.io, which would ignore this pin at the ghcr.io
    # default and silently put every edge back on the floating tag.
    #
    # The digest is unchanged by the move: `crane copy` writes the same bytes
    # under the same digest, so this is a one-word change, not a re-pin.
    # Docker Hub's retained namespace holds the same frozen image, but the chart
    # refuses `images.traceblocRegistry: docker.io` from 1.9.218 (see that key).
    digestRegistry: "ghcr.io"
    # THE 8.4 ENGINE IS THE DEFAULT. Until this
    # release the default was the frozen 5.7-lineage `:prod` pin below, and 8.4
    # was an opt-in for fresh datadirs. Every edge we operate has migrated to
    # 8.4 (the migration Job), and fresh installs have no 5.7 data, so
    # the default moved; the decision not to wait for the remaining 5.7 customer
    # edges was deliberate.
    #
    # `tag` is the 8.4 channel client-runtime's build-mysql-client.yml publishes
    # (multi-arch, amd64 + arm64). It is what renders when the pin below is
    # ignored (a registry or mirror the pin was not resolved on); the pin is what
    # renders otherwise.
    tag: "8.4"
    # Pinned to the MANIFEST-INDEX digest of the cosign-signed :8.4 build
    # (linux/amd64 + linux/arm64) that client-runtime build-mysql-client.yml
    # publishes; digest-drift.yml holds it to what :8.4 resolves to.
    # tracebloc.mysqlEngineMajor in _helpers.tpl maps this literal to "8.4", and
    # the installer's TB_MYSQL_84_DEFAULT_DIGEST is this literal: re-pin all
    # three IN THE SAME COMMIT (mysql_test.yaml's default-render
    # case enforces the pair -- an unmapped digest reads "unknown" and disarms
    # mysql-format-guard). Earlier defaults stay mapped to "8.4": the installer
    # wrote them into clients' values files, so clients still carry them.
    #
    # WHAT THIS MEANS FOR AN EDGE STILL ON A 5.7 DATADIR:
    # its next upgrade onto this chart renders 8.4 over 5.7 data;
    # mysql-format-guard refuses before mysqld starts, and the --atomic upgrade
    # rolls back to the 5.7 release. No data is touched. Such an edge keeps 5.7
    # only with an EXPLICIT pin to the frozen 5.7-lineage image -- which is what
    # the installer now writes whenever it resolves 5.7 (existing release or
    # datadir, or TB_MYSQL_ENGINE=5.7):
    #   tag: "prod"
    #   digest: "sha256:f546e47fb339e0982c902cef063b081ccf2cbbaf35b475287d583b9bf3163354"
    # `prod` stays frozen on the 5.7 lineage (client-runtime build-images.sh), and
    # the helper still maps that digest to "5.7", so the guard stays armed for it.
    # An edge MIGRATED by the migration Job carries `tag: "8.4"` + `digest: ""` in its
    # own values; that keeps rendering the 8.4 float and reads 8.4.
    digest: "sha256:31fe86bd6777894b98059c3dd3f678e8ef6f164eaa44cdcfd9b1790d7a24a470"
  busybox:
    # A THIRD-PARTY DOCKER HUB IMAGE, which this block does not look like.
    # `images.busybox` sits beside tracebloc's own images, so it reads as ours;
    # the template pulls `library/busybox` from docker.io at THREE sites (the
    # mysql and jobs-manager init containers). It was invisible to a sweep of
    # this file for third-party registries for exactly that reason.
    # REPOSITORY AND TAG BOTH DECLARED, so the pin below is WATCHABLE.
    # `check-digest-drift.sh` resolves a pin by reading the repository and float
    # from the same block; with `repository` hardcoded in the templates and
    # absent here, it reported `UNWATCHABLE: images.busybox is pinned ... but
    # the block declares no repository:` -- a pin nothing can tell you has gone
    # stale, "the same blind spot as having no watcher at all, just quieter".
    # The three templates read this value now, so the watch cannot be reading
    # something the render ignores.
    repository: library/busybox
    tag: "1.35"
    # PINNED, same provenance and same watch as the collector.
    digest: "sha256:98ad9d1a2be345201bb0709b0d38655eb1b370145c7d94ca1fe9c421f76e245a"
    # `<repository>:<tag>` the digest above was resolved for. Empty = the chart
    # default identity for the chart's own pin, your image for your own digest.
    digestFor: ""

# -- Container resource requests and limits.
# Tuned in v1.1.0 after the prod investigation showed mysql being killed
# every ~12 minutes when jobs-manager, under-resourced, ate node memory and
# triggered the kernel OOM killer.
#
# NOT "BestEffort QoS in older releases", as this comment used to claim.
# Before this block existed the template hardcoded
# requests cpu 100m / memory 256Mi and limits cpu 500m / memory 512Mi
# (`git show 2d9d013^:client/templates/jobs-manager-deployment.yaml`) —
# requests AND limits set, so Burstable from day one. BestEffort requires
# neither, and jobs-manager has never had neither. The pod was under-resourced,
# which is the real cause; the QoS class was never the difference.
#
# mysql: requests.memory == limits.memory pins the cgroup memory budget so
# mysqld is never the largest victim during node-level OOM. CPU limit is
# intentionally OMITTED (no `limits.cpu` field below) — CPU throttling
# causes InnoDB lock-wait timeouts and is a far more common cause of
# mysql crashes than a noisy CPU neighbour. PriorityClass + PDB cover
# eviction.
#
# jobs-manager: 256Mi was too tight under load; bumped to 512Mi/1Gi so
# the Service Bus client + pod watcher have headroom before OOM. In v1.x
# requests.memory was raised to EQUAL limits.memory (1Gi api /
# 512Mi pods-monitor) to lower each container's oom_score_adj — on a
# single-node cluster-recovery mass restart they were otherwise the kernel
# OOM-killer's preferred victims and were exit-137 killed, taking ~9m to
# recover. The pods stay Burstable; pinning memory just makes them
# less-preferred OOM victims.
#
# Burstable for TWO reasons, not one — cpu request != limit is the obvious one,
# and the one every earlier version of this comment stopped at. The other:
# ComputePodQOS requires requests == limits in EVERY container including INIT
# containers, and `jobs-manager` renders an unresourced `init-writable-data`
# whenever hostPath.enabled=true (every installer edge), while `mysql` renders
# an unresourced `mysql-format-guard` UNCONDITIONALLY plus `init-mysql-data` on
# hostPath edges.
#
# AND SINCE THEN, EQUALISING CPU BELOW BUYS GUARANTEED NOWHERE.
# The claim here used to read "only for jobs-manager on a CSI
# cluster"; the chart then added `wait-for-mysql`, which is UNCONDITIONAL and unequal on
# BOTH dimensions (cpu 10m/100m, memory 16Mi/64Mi) and has no values key. So
# Guaranteed is now unreachable through values for t-jobs-manager on EVERY
# cluster, not just off-CSI. Measured on the merged tree -- hostPath off plus
# every resources.* knob this chart exposes equalised:
#
#   t-jobs-manager  Burstable  wait-for-mysql:cpu(req=10m,lim=100m);
#                              wait-for-mysql:memory(req=16Mi,lim=64Mi)
#
# `wait-for-mysql` is the only blocker left, and nothing in values can move it.
#
# THE GUARD STAYED GREEN THROUGH THAT, which is this PR's own subject one turn
# deeper. The goldens pin the CLASS (still Burstable) and the unresourced-init
# SET (`wait-for-mysql` is resourced, merely unequal), so a claim about
# REACHABILITY had nothing asserting it and went stale in silence.
# `scripts/tests/qos-reachability.sh` now asserts it: see that file for what it
# derives and what it cannot.
#
# TWO routes still clear it, and the earlier "only route" was false
# Pod-level resources (KEP-2837, beta 1.34) clear it without
# touching the init containers. Giving every init container requests == limits
# also reaches Guaranteed -- but note that is now a CHART edit rather than a
# values change, because `wait-for-mysql` has no key -- at the cost of reserving
# that capacity for the pod's whole life, which is why it is not the route taken
# here.
#
# requests.cpu was also raised so
# a mass restart does not throttle their startup. Same requests.memory==limits
# philosophy mysql already uses (mysql likewise omits its cpu limit).
resources:
  # MYSQL BACK TO 1Gi (2026-09-26). MySQL 8.4 at production data scale (~1.3 GB,
  # 194 tables, 2.7M rows) was measured peaking at 740 MiB (cgroup memory.peak),
  # and an 8.4 server was OOM-killed at 704Mi (exit 137) on a 20 MB LONGBLOB
  # write -- the 704Mi below was sized from 5.7 (468 p95). requests==limits
  # kept; the render now sums to 2112 MiB / 650 m, and envelope contract v5
  # carries it. An existing install keeps its training envelope across the
  # upgrade: jobs-manager shrinks a run that no longer fits beside the larger
  # platform instead of refusing it (see MIGRATION.md).
  #
  # MEASURED TRIM (2026-09-13) -- every request below is sized from the
  # load run, not from the idle snapshot the interim trim used. Four legs on the same
  # edge (11.23 h ambient, one training cycle, a five-deep queue, two full-node
  # restarts incl. one under an 8 GiB cap) found that LOAD DOES NOT MOVE THE CONTROL
  # PLANE -- no container's p95 rose more than ~4 MiB from ambient -- and that the
  # RESTART PEAK is the sizing driver. Requests = worst observed (p95 or restart peak)
  # with ~1.5x headroom; the render sums to 1792 MiB / 650 m (was 2272 / 650):
  #
  #   container              request   worst observed (MiB)      why
  #   egress-proxy   160Mi -> 256Mi    176 on restart (1.10x OVER 160)   UP; limit 256 -> 384 so request < limit
  #   collector      128Mi -> 256Mi    158 on restart (1.23x OVER 128)   UP; first measurement of it (was "unmeasured")
  #   resource-mon   128Mi -> 160Mi    101 on restart (0.79x)            UP; hardcoded in its DaemonSet template
  #   mysql          704Mi (kept)      468 p95 under load                requests==limits kept  [1Gi since 2026-09-26, see above]
  #   requests-proxy 128Mi ->  96Mi     64 on restart                    limits unchanged
  #   pods-monitor   384Mi -> 128Mi     77 on restart                    LIMIT STAYS 512Mi
  #   jobs-manager   640Mi -> 192Mi    105 p95 / 103 restart (0.16x)     LIMIT STAYS 1Gi; QoS unchanged (see below)
  #
  # CPU requests are untouched: the highest control-plane cpu p95 in any leg was 13m
  # (jobs-manager during the burst). Full tables, windows and caveats are on the ticket.
  #
  # INTERIM TRIM (2026-09-10) -- the history the block above supersedes.
  #
  # Requests are what the scheduler and the jobs-manager's admission SUBTRACT from
  # the node; they are not what the process uses. Measured on an installer edge:
  # the control plane requested 1050m / 3276Mi while using
  # 36m / ~1022Mi. Since chart 1.9.109 the kubelet reservation is honest
  # and the admission subtracts the chart's
  # real requests, so on the smallest supported node -- 2 cores / 8 GiB -- the
  # arithmetic became visible: allocatable 1900m / 5538Mi, minus these requests,
  # minus k3s's own coredns + metrics-server (200m / 140Mi), left 900m / 2390Mi,
  # and the smallest training envelope needs 1000m / 3072Mi. Every task on
  # staging was refused NEVER_STEADY_STATE (e2e-test-agent fleet 34473120598).
  #
  # THE FOOTPRINT COUNTS THE COLLECTOR. The render -- and therefore
  # control-plane-footprint.sh, the installer embed and this derivation --
  # carries the telemetry collector's 100m / 128Mi, because a real edge renders
  # it too. With it counted the
  # render was 650m / 2272Mi (now 1792Mi, see above), and the node above left 1050m / 3126Mi (was
  # 900m / 2390Mi): 50m and 54Mi over the envelope. Thin, and honest.
  #
  #   mysql           250m/1Gi   -> 150m/704Mi   peak measured 0.40-0.55x of 1Gi (max ~563Mi); 704 = +25% headroom; requests==limits kept
  #   jobs-manager    250m/1Gi   -> 150m/640Mi   168Mi idle (0.16x); LIMIT STAYS 1Gi (see below); cpu: the whole plane idles at 36m
  #   pods-monitor    100m/512Mi -> 100m/384Mi   no measurement yet; LIMIT STAYS 512Mi (see below)
  #   requests-proxy  100m/256Mi ->  50m/128Mi   a few requests a minute; limits unchanged (1000m/512Mi)
  #   egress-proxy     50m/64Mi  ->  50m/160Mi   UP: measured 2.45x OVER its request
  #   collector       100m/128Mi unchanged       unmeasured (distroless, no readable cgroup) -- not trimmed on a guess
  #
  # WHY jobs-manager AND pods-monitor NOW HAVE requests < limits. The chart used to pin
  # requests.memory == limits.memory on both so a cluster-recovery mass restart
  # would not pick them as OOM victims; the PODS were Burstable then and still
  # are (the unresourced init containers, see above). The trim lowers only the
  # REQUEST -- what the scheduler and admission subtract -- and leaves the LIMIT
  # where it was, because the limit is the hard cgroup ceiling and the restart
  # peak that justifies it is exactly the leg the planned load run has not
  # produced yet. The cost is a higher oom_score_adj
  # under node pressure; the alternative was a hard ceiling nothing has measured.
  # When the restart leg lands, set BOTH from its p95 and restore the equality.
  #
  # What this is NOT: the final trim. Re-derive from the load run; do not
  # hand-tune here. Guards that read these values: control-plane-footprint.sh
  # (ceiling), the generated embed in scripts/lib/install-client-helm.sh
  # (scripts/gen-footprint-embed.sh --check), envelope-schedulability.sh.
  mysql:
    requests:
      cpu: "150m"
      memory: "1Gi"
    limits:
      memory: "1Gi"
      # No cpu limit — see comment above.
  jobsManager:
    requests:
      cpu: "150m"
      memory: "192Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  podsMonitor:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  # The egress gate's `gate` container (egressGate below; the key is the
  # requests-proxy's, whose workload the gate took over). It serves the Service
  # Bus / backend communication path and is mostly idle (a few req/min).
  # 50m/96Mi requests with the limits at 1000m/512Mi for the occasional burst;
  # revisit if heap profiling shows growth. Schema at
  # values.schema.json#resources.requestsProxy validates overrides.
  requestsProxy:
    requests:
      cpu: "50m"
      memory: "96Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"

# -- PriorityClass for the data-plane (mysql).
# DROPPED BY DEFAULT (create: false, name: ""). mysql doesn't need it: its
# memory requests==limits (so it's among the last evicted under memory
# pressure), its data lives on a PVC (eviction = a transient restart, never
# data loss), and a PodDisruptionBudget guards voluntary disruptions. Dropping
# this cluster-scoped, fixed-name object also lets multiple tracebloc
# namespaces coexist in one cluster (BYO) and removes the one-client-per-
# cluster install collision.
#
# Opt back in ONLY on a heavily-contended cluster where you want the scheduler
# to preempt noisy training jobs to keep mysql scheduled:
#   create: true, name: <some-name>, value: ~1000000  (above default 0, below
#   system-cluster-critical 2,000,000,000).
# For a PriorityClass your platform manages out-of-band, use create: false +
# name: <existing-name> (mysql references it without the chart templating it).
priorityClass:
  create: false
  name: ""
  value: 1000000

# -- PodDisruptionBudgets for the single-replica mysql and jobs-manager
# Deployments. `create` is tri-state and defaults to AUTO (null), tracking the
# storage/topology mode:
#   null (default) -> multi-node CSI clusters (hostPath.enabled=false:
#                     AKS/EKS/OpenShift) RENDER a minAvailable:1 PDB, so a
#                     surprise autoscaler scale-down / node upgrade can't evict
#                     the only pod without a deliberate operator drain.
#                     Single-node / bare-metal installs (hostPath.enabled=true)
#                     SKIP it: with one replica on one node, minAvailable:1
#                     allows zero voluntary disruptions, so `kubectl drain`
#                     (node maintenance, manual k3s upgrade) would block forever
#                     while the pod has nowhere to reschedule.
#   true  -> force render regardless of topology (e.g. a fixed multi-node
#            bare-metal cluster that still wants drain protection).
#   false -> never render (e.g. a multi-replica workload managed externally).
podDisruptionBudget:
  mysql:
    create: null
  jobsManager:
    create: null

# -- Platform client credentials. Issued by the backend; the chart never
# generates them. Resolved in three tiers, like every other credential in
# templates/secrets.yaml:
#   1. these values, else
#   2. the TRACEBLOC_CLIENT_ID / TRACEBLOC_CLIENT_PASSWORD keys already in the
#      release Secret, else
#   3. a hard failure naming both options.
#
# THE SECRET CARRIES EACH CREDENTIAL UNDER ITS TRACEBLOC_ KEY. The chart writes
# TRACEBLOC_CLIENT_ID and TRACEBLOC_CLIENT_PASSWORD, and the pods read them; the
# chart reads no other key. A release Secret that exists without both keys (one
# written by a chart older than 1.9.180, or pre-created without them) is refused,
# even with these values set: the environment is reinstalled, or a hand-made
# Secret gets both TRACEBLOC_ keys. When you create or rotate the Secret by hand,
# set the TRACEBLOC_ keys, as the commands below do.
#
# WHY YOU WOULD BOTHER: anything passed as a value is stored by Helm in the
# release's user-supplied values IN CLEARTEXT, in every retained revision (10 by
# default), so it outlives any rotation and is readable by anyone with
# `get secret` in the namespace. Tier 2 exists so the credential need never
# enter release values at all.
#
# SIMPLEST — install once with these set, then drop them from your values on the
# next upgrade. Tier 2 reads them from the Secret from then on, and the Secret is
# already Helm-managed, so there is nothing else to do.
#
# BEFORE THE FIRST INSTALL, the Secret has to be adopted, not just created. This
# chart emits `<release>-secrets` -- or `<fullnameOverride>-secrets` if you set
# that (see `fullnameOverride` above; `tracebloc.secretName` follows it). USE THE
# NAME THIS RENDER RESOLVES TO in the three commands below, substituting your
# override for `<release>` if you have one. Get it from the chart rather than
# guessing:
#
#   helm template <release> ./client -n <ns> --show-only templates/secrets.yaml \
#     [-f your-values.yaml] | grep -m1 "  name:"
#
# Naming the wrong one is not a cosmetic error: a plain `kubectl create secret`
# leaves an object Helm does not own and `helm install` aborts with
# `invalid ownership metadata` rather than reading it. Helm adopts
# a pre-existing object that already carries its three ownership fields, so add
# them in the same breath:
#
#   kubectl -n <ns> create secret generic <release>-secrets \
#     --from-literal=TRACEBLOC_CLIENT_ID=... --from-literal=TRACEBLOC_CLIENT_PASSWORD=...
#   kubectl -n <ns> label secret <release>-secrets \
#     app.kubernetes.io/managed-by=Helm
#   kubectl -n <ns> annotate secret <release>-secrets \
#     meta.helm.sh/release-name=<release> \
#     meta.helm.sh/release-namespace=<ns>
#
# `<release>` and `<ns>` must match the install exactly — Helm compares all
# three fields and refuses the adoption if any of them disagrees. Both keys must
# be NON-EMPTY: an empty key reads as absent and falls through to the hard
# failure, because the chart is the only layer left that can see it (the schema
# cannot, it runs before render).
#
# NOT AVAILABLE UNDER A CLIENT-SIDE RENDERER, and worth knowing before you plan
# around it. Tier 2 is a `lookup`, which needs a live cluster — so it is inert
# under `helm template`, `--dry-run`, ArgoCD's default renderer and Flux
# post-render alike. The chart's other five credentials degrade gracefully there
# (their tier 3 generates a value); these two cannot, because the backend issues
# them, so tier 3 is a hard failure and the render simply stops. A GitOps install
# rendering without cluster access must therefore KEEP these two in its values,
# and for it the cleartext-in-revisions problem above is not solved. Rendering
# against a live cluster (server-side apply, or `helm upgrade` from CI) is what
# makes the value-free path reachable.
#
# AVOID `--set clientPassword=...`: that puts the credential in your shell
# history AND in the `helm` process's argv, where anyone who can run `ps` sees
# it. A values file, or the Secret above, are both better. And do not commit
# real credentials to version control.
clientId: ""
clientPassword: ""

# -- Pod-proxy token signing
# Shared HMAC secret used by the jobs-manager to MINT and the requests-proxy to
# VERIFY the per-pod REQUESTS_PROXY_TOKEN. When set (non-empty), the proxy
# validates tokens statelessly (signature + expiry) and the legacy pod_tokens
# table is not used — eliminating the token-revoke-while-live race class.
#
# Leave empty to AUTO-GENERATE a stable secret: the chart generates one on
# first install and reuses it on every subsequent upgrade (via `lookup`), so
# tokens minted before an upgrade still verify after. Set explicitly only to
# pin a known value or to rotate (rotating invalidates all live tokens at once,
# forcing pods to be respawned). Never injected into training pods.
podTokenSigningSecret: ""

# -- Backstop lifetime (seconds) for a signed pod-proxy token. The real bound
# on a token's usefulness is the pod lifecycle (the pod is deleted on stop);
# this just caps a leaked token. Set to comfortably exceed the longest expected
# training-job duration, or a long-running job will 401 mid-run when its token
# expires. Default 7 days.
podTokenTtlSeconds: 604800

# -- Docker registry credentials (optional). Two supported shapes, and they are
# mutually exclusive -- setting both fails the render rather than picking one.
#
# 1. LET THE CHART BUILD IT: `create: true` plus the credentials below. The
#    Secret is named `{{ .Release.Name }}-regcred` (release-scoped, so two
#    releases in one namespace cannot share it) and is mirrored automatically
#    into the node-agents and GPU device-plugin namespaces when those are
#    enabled and differ from the release namespace.
#
# 2. BRING YOUR OWN: `existingSecret: <name>` naming a `kubernetes.io/
#    dockerconfigjson` Secret you created yourself. Use this when registry
#    credentials must not live in values. The chart references it and never
#    writes it -- it has no credentials to write it with.
#
#    YOU must create that Secret in every namespace that pulls: the release
#    namespace, plus `nodeAgents.namespace.name` (default
#    "tracebloc-node-agents") while `resourceMonitor` is true, plus
#    `gpu.devicePlugin.namespace` (default "kube-system") while the device
#    plugin is enabled. The chart cannot mirror a Secret whose contents it does
#    not have. If one is missing, those pods report ImagePullBackOff -- loud and
#    diagnosable, unlike the failure this option exists to prevent.
#
# Omit `dockerRegistry` entirely, or set `create: false` with no
# `existingSecret`, for public images: no imagePullSecrets are rendered
# anywhere, and jobs-manager stamps none onto training pods either. That is the
# honest declaration of an anonymous pull.
#
# `existingSecret` was added for a config that used to half-work by accident:
# `create: false` plus a hand-made Secret literally named
# `regcred`. Chart-rendered pods pulled anonymously while TRAINING pods
# authenticated, because client-runtime's job.yaml carried `regcred` as a
# hardcoded literal. The chart now replaces that literal with the name below, so
# those installs need to say what they are using. Set `existingSecret: regcred`
# to keep working, and note that it now covers your control-plane pods too.
#
# dockerRegistry:
#   create: true
#   server: https://index.docker.io/v1/
#   username: "<DOCKER_USERNAME>"
#   password: "<DOCKER_REGISTRY_TOKEN>"
#   email: "<DOCKER_EMAIL>"
#
# dockerRegistry:
#   existingSecret: regcred

# -- Self-upgrade CronJob.
# Runs `helm upgrade --reuse-values` against this release on a schedule, so
# customers do not stay frozen on the version they first installed and miss
# security fixes / stability work shipped after their install.
#
# How it works:
#   - A CronJob in this namespace runs `helm repo update` against repoUrl,
#     compares the latest published chart version to the deployed revision,
#     and upgrades when the published version is newer (semver compare via
#     `sort -V`, so 1.10 > 1.9 — not a string compare).
#   - --reuse-values is passed, so secrets (clientId, clientPassword,
#     dockerRegistry creds) and any operator overrides are preserved.
#   - NOTE: a chart upgrade no longer picks up new IMAGE content as a
#     side effect. That used to work because the control-plane pods ran
#     `imagePullPolicy: Always`, so any restart re-resolved the floating tag;
#     they now run IfNotPresent so an offline restart cannot fail. New image
#     content arrives via the image-refresh CronJob's `kubectl set image`
#     instead. This CronJob still delivers everything else a chart release
#     carries — template, RBAC, values-default and schema changes.
#
# Trust boundary: the CronJob's ServiceAccount is NO
# LONGER cluster-admin. It gets a namespaced Role granting full control inside
# THIS release's namespace, plus a narrow ClusterRole enumerating only the
# cluster-scoped kinds the chart templates (Namespace / PersistentVolume /
# StorageClass / PriorityClass / ClusterRole / ClusterRoleBinding / OpenShift
# SecurityContextConstraints). So a compromise of this Pod or the chart repo at
# repoUrl no longer yields a standing cluster-admin: cross-namespace secret
# reads, pod exec, and node access are gone; widening the grant requires an
# active, auditable use of the `escalate`/`bind` verbs the ClusterRole needs to
# manage the chart's own RBAC. See the comment in
# templates/auto-upgrade-rbac.yaml for the full rationale and the one residual
# (adding a NEW cluster-scoped kind means extending that ClusterRole in the same
# release). Mitigations that still apply:
#   - repoUrl defaults to GitHub Pages over HTTPS (publish controlled by
#     the tracebloc team via the gh-pages branch).
#   - Every tick checks the chart it would install against the Sigstore bundle
#     its release attaches beside it (`<chart url>.bundle`), signed by
#     tracebloc's release workflow, and installs that checked file. A missing,
#     wrong or unreadable signature stops the tick and keeps the running
#     release. A chart repository you mirror must serve each chart's bundle
#     beside it. See autoUpgrade.cosign.
#   - Set autoUpgrade.enabled: false to opt out and run upgrades manually
#     under your own approval gate.
#
# Disabled-on-this-cluster check after install:
#   kubectl get cronjob -n <namespace> -l app.kubernetes.io/component=auto-upgrade
autoUpgrade:
  # Default ON: the entire point is that customers freeze on the
  # version they installed. Defaulting off would recreate that exact bug.
  enabled: true
  # Hourly at :23. The off-hour minute spreads load across the
  # tracebloc.github.io/client GitHub Pages origin.
  schedule: "23 * * * *"
  # Helm chart repo to poll. Override only when mirroring internally.
  repoUrl: "https://tracebloc.github.io/client"
  repoName: "tracebloc"
  chartName: "client"
  # `helm upgrade --wait --timeout`. Bare-metal first-pull of mysql/jobs-manager
  # images can take several minutes; 10m gives PVC bind + image pull headroom
  # without holding the slot all night if something is genuinely wedged.
  timeout: "10m"
  # A release in `pending-upgrade` is NOT necessarily a wedge left by a
  # killed upgrade — it is ALSO the state of an upgrade that is CURRENTLY RUNNING
  # (an operator's manual `helm upgrade`, or a slow one of ours). The hourly
  # wedge-recovery must not roll back an in-flight upgrade: doing so
  # silently reverts it and discards the operator's new values (measured turning
  # a retirement into a fleet-breaking sequence). The discriminator
  # is AGE — a real wedge is at least ~an hour old by the next hourly tick, an
  # in-flight upgrade is seconds/minutes old. Only a release that has sat in
  # pending-upgrade/pending-rollback for AT LEAST this long is treated as an
  # abandoned wedge and rolled back; anything younger is left untouched and the
  # tick is skipped. Keep it comfortably ABOVE the longest upgrade an operator
  # would run by hand (well above `timeout`) and BELOW the ~1h schedule gap, so a
  # genuine wedge still recovers on the very next tick. That tick only rolls back;
  # the upgrade runs on the tick after it. Duration string (Ns/Nm/Nh).
  pendingWedgeMinAge: "45m"
  # An upgrade replaces the jobs-manager pod, and a replaced jobs-manager starts
  # the next training cycle late: on a run across several edges that cycle can be
  # averaged without this edge. So while the edge trains, a tick that would
  # upgrade (or re-render) DEFERS: it logs `DEFERRED: ...`, exits 0, and the next
  # scheduled tick asks again. Training means a pod labelled
  # tracebloc.io/workload=training (every training, inference and scoring pod
  # jobs-manager runs) that is not finished, or that finished less than
  # `finishedWithin` ago: between two cycles of a run no pod runs. Finished pods
  # are visible only until their Job's TTL removes them (5 minutes by default).
  # The deferral count is the CronJob's tracebloc.io/upgrade-training-deferrals
  # annotation. After `maxDeferrals` deferrals in a row the tick upgrades anyway
  # (`BACKSTOP: ...`), so an edge that is always busy is at most that many ticks
  # behind (24 = a day at the hourly schedule). A tick that cannot tell whether
  # the edge trains, or cannot record a deferral, upgrades as it would without
  # this gate, and says so.
  deferWhileTraining:
    enabled: true
    maxDeferrals: 24
    finishedWithin: "10m"
  # CronJob spec knobs. Override per-cluster if needed.
  suspend: false
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 600
  # Hard wall-clock cap on the whole Job. `timeout` above only bounds
  # `helm upgrade --wait`; the earlier `helm repo add`/`helm repo update`
  # HTTPS fetches have no timeout of their own, so on a TCP black-hole (a
  # corporate proxy that drops packets with no RST) the Job can hang
  # indefinitely — and with concurrencyPolicy: Forbid that hung Job makes
  # every future tick "still active" and skipped, wedging auto-upgrade until a
  # human kills the pod. activeDeadlineSeconds is the backstop that fails the
  # Job instead. This is a FLOOR, not the final value: the template renders
  # activeDeadlineSeconds as max(this, 2 x parsed `timeout` + 600s headroom for
  # the repo fetch, the chart's signature check and the status reads, itemised
  # in the template) -- 2 x because `--atomic` waits up to `timeout` on the
  # upgrade and again on its rollback; a wedge recovery's rollback runs in
  # a tick of its own, never beside an upgrade -- so raising `timeout` lifts the
  # deadline too and neither a slow-but-healthy upgrade nor its rollback is
  # killed mid-flight. At the 10m default that is 1800s. A `timeout` of 26m or
  # more makes the Job outlast the hourly schedule, and Forbid skips the tick
  # that falls inside it. Raise this only to give even more slack than the
  # timeout-derived value.
  activeDeadlineSeconds: 900
  # Pod image: helm CLI only. alpine/helm is small and the tag pins the
  # helm version, so behaviour cannot drift if upstream re-tags.
  #
  # THE SAME HELM THE INSTALLERS RUN. The tag is `scripts/spec/facts.env`
  # HELM_VERSION without its `v` (the installers' default; an operator
  # overrides it with TRACEBLOC_HELM_VERSION -- old name HELM_VERSION still
  # works): the installers put that helm on the host, and
  # this image runs it for the hourly upgrade and the MySQL migration Job
  # (`TRACEBLOC_MYSQL_MIGRATION_HELM_IMAGE`, rendered beside the old
  # MYSQL_MIGRATION_HELM_IMAGE, copies `/usr/bin/helm` out of it). Helm 3's
  # security fixes end on 2026-11-11, and this CronJob is how an edge receives
  # security fixes, so it must run a supported helm. helm-version-agreement.sh (a
  # drift guard) holds this tag, and the defaults-table row, to facts.env: bump
  # all three together, with the digest resolved for the new tag.
  image:
    repository: alpine/helm
    tag: "4.2.3"
    pullPolicy: IfNotPresent
    # THE REGISTRY AND THE PIN, BOTH EXPRESSIBLE. This block was
    # `repository` + `tag` only, rendered as `mirrorPrefix + repo:tag` -- which,
    # with no mirror set, emits a BARE reference, and a bare reference is a
    # Docker Hub reference. There was no `docker.io` in the chart to grep for, so this
    # site was invisible to a sweep of these values. It renders through
    # `tracebloc.image` now, which always names the registry.
    #
    # `registry` is the per-image override; `global.imageRegistry` still wins over
    # it, so an air-gapped mirror re-homes this image exactly as before.
    #
    # THE PIN IS WORK ITEM 2, AND THIS IS IT. The comment here used
    # to say `digest` was empty on purpose because pinning was the next change.
    # It is this change. The tag already pinned the BEHAVIOUR; the digest pins the
    # BYTES, so a silent upstream re-tag of the same version cannot move what this
    # cluster runs, and check-digest-drift.sh now watches this float nightly and
    # reds when it stops resolving here.
    #
    # RE-HOMING THIS IMAGE: THE PIN FOLLOWS ITS IMAGE, NOT ITS KEY. Helm merges
    # values, so an override of `repository` or `tag` alone leaves this `digest`
    # in place. It is honoured only for the `repository:tag` it was resolved for
    # (`digestFor` below; left empty, the chart's own pin is deemed resolved for
    # the chart's own repository:tag), so such an override renders YOUR repo:tag
    # and NOTES names the dropped pin. To pin your image, set your own `digest`
    # (always honoured). A mirror that serves the SAME bytes under another path
    # keeps this digest by declaring it: `digestFor: "<your repository>:<tag>"`.
    # `registry` / global.imageRegistry never affect the match -- a registry-only
    # re-home keeps the pin.
    registry: "docker.io"
    digest: "sha256:b97ba4f9b27fe7af16ee3d37e6815783c9d4a51289b6240a9024ec471611ae9b"
    # `<repository>:<tag>` the digest above was resolved for. Empty = the chart
    # default identity for the chart's own pin, your image for your own digest.
    digestFor: ""
  # The chart's signature check before every upgrade runs this cosign build: an
  # init container copies `/ko-app/cosign` out of the image into the tick's pod
  # (the `-dev` build, because the plain one has no `cp`). The tag is the
  # installer's cosign (install.sh COSIGN_VERSION) plus `-dev`;
  # auto-upgrade-chart-verify.sh holds the two together. The pin and its
  # re-homing work as autoUpgrade.image's above; a mirror must carry this image.
  #
  # Sigstore's trust keys ship with the chart (client/files/sigstore: the
  # Fulcio root and intermediate, Rekor's and the CT log's public keys, copied
  # from Sigstore's TUF repository), so the check needs no network beyond the
  # chart and its bundle. The release proves these keys verify each chart it
  # signs before it publishes it.
  cosign:
    image:
      registry: "ghcr.io"
      repository: sigstore/cosign/cosign
      tag: "v2.4.1-dev"
      pullPolicy: IfNotPresent
      digest: "sha256:a1bb112f1758703aa1d222bf30b9655d04cf196c0b7feaf3479d1222c2283590"
      # `<repository>:<tag>` the digest above was resolved for, as for
      # autoUpgrade.image.
      digestFor: ""
  # GUARANTEED QoS: requests == limits for BOTH cpu and memory.
  # this CronJob AND image-refresh were both exit-137 (SIGKILL) killed hourly on
  # a live edge, TOGETHER — the signature of a NODE-level OOM kill, not either
  # container overrunning its own cgroup limit. The helm CLI's peak working set
  # on this chart is ~50Mi measured (repo update + search + `helm template`
  # render), a fraction of the 256Mi limit, so no ceiling was ever the binding
  # constraint. Two independent levers fix the two halves of that:
  #
  #  1. The memory REQUEST rising to meet the limit is an honest scheduler
  #     RESERVATION. It attacks the CAUSE: the node is no longer overcommitted by
  #     the gap between what these pods reserved and what they use, so it is less
  #     likely to enter the pressure that triggered the kill. (This is the real
  #     structural half — NOT an oom_score_adj change: a Burstable pod's
  #     oom_score_adj is 1000 - 1000*memRequest/nodeCapacity, fixed at start and
  #     independent of usage, so 128Mi->256Mi barely moves it, ~992->984 on a
  #     16Gi node, and does nothing on a large node. An earlier revision of this
  #     comment wrongly credited the memory pin with the victim-preference change
  # below.)
  #  2. Pinning CPU too makes the pod GUARANTEED, whose oom_score_adj is -997.
  #     THAT is what genuinely moves it off the kernel OOM-killer's shortlist
  #     under pressure, regardless of node size. These two CronJobs (and
  #     image-refresh) are the only chart pods one line from Guaranteed: memory
  #     already equal, cpu the sole blocker. jobs-manager could NOT reach
  #     Guaranteed (it renders an unresourced init container); here the cosign
  #     init container takes these same resources, so the pod is Guaranteed and
  #     reserves no more than the helm container alone. auto-upgrade is the
  #     security-fix delivery path — worth the strongest protection.
  #
  # TRADEOFF (reservation vs throttle): Guaranteed reserves the full 500m/256Mi
  # for the pod's brief hourly run and caps it there (helm is I/O/network-bound,
  # not CPU-bound, so the 500m cap does not slow a real upgrade). Limits never
  # moved — only the requests rose to meet them. If a small edge cannot spare the
  # reservation the pod goes Pending/skipped rather than OOM-looping; `Forbid` +
  # startingDeadlineSeconds bound that. auto_upgrade_test.yaml pins cpu AND memory
  # request==limit on every container, init included, which is the in-manifest
  # proxy for Guaranteed until a pod-qos-class checker asserts the class directly.
  resources:
    requests:
      cpu: "500m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# -- Image-refresh CronJob.
# Re-images the always-running control-plane workloads when a new image
# digest is published under the floating CLIENT_ENV tag on the registry the
# chart pulls the tracebloc images from (`tracebloc.tbRegistry`: global.imageRegistry,
# else images.traceblocRegistry -- ghcr.io by default since the GHCR migration
# (1.9.113; see MIGRATION.md)). It is NOT tied to Docker Hub; on a private
# mirror it is inert (see the script).
# Without this, running pods stay on the old image until someone manually
# restarts them, which is exactly the customer-runs-no-commands UX we want
# to avoid.
#
# The ACTION changed from `kubectl rollout restart` to `kubectl set
# image repo@digest`, and widened the set of workloads it covers. A restart
# only picks up a new build when the pods run `imagePullPolicy: Always` —
# and `Always` is precisely what made a restart while offline fail
# with ImagePullBackOff on a cached image. The two properties are mutually
# exclusive unless the image REFERENCE changes on update, so the reference
# is now what changes; the pods run IfNotPresent (see the images block).
#
# How it works:
#   - A CronJob in this namespace polls the tracebloc registry for the current
#     manifest digest of tracebloc/jobs-manager:<CLIENT_ENV>,
#     tracebloc/pods-monitor:<CLIENT_ENV> and
#     tracebloc/resource-monitor:<CLIENT_ENV> (anonymous token + manifest HEAD;
#     docker.io and ghcr.io are the hosts it knows how to resolve on).
#   - The script compares each fetched digest to an annotation on the
#     jobs-manager deployment (`tracebloc.io/last-refreshed-<image>-digest`)
#     that records the digest the LAST successful refresh moved to. Not
#     to the running pod's imageID — that value's format varies across
#     container runtimes (kubernetes/kubernetes#108689 + #115199) and
#     diverges from the registry's index digest on multi-arch tags.
#     The annotation makes the comparison entirely server-vs-our-record
#     with no client-side runtime variation in the loop.
#   - On a real change: `kubectl set image` + `kubectl rollout status` to
#     wait for completion, then patch the annotation to the new digest.
#     (Order matters — annotating first would let a failed rollout
#     silently freeze the workload.)
#   - Workloads covered. jobs-manager was always covered; the other
#     two were NOT, and both were quietly broken as a result:
#       * deployment/<release>-jobs-manager — containers `api` and
#         `pods-monitor-container`, re-imaged in ONE patch, one rollout.
#       * deployment/<release>-requests-proxy — runs the SAME
#         tracebloc/jobs-manager image, so it follows the jobs-manager
# digest with no extra registry call. Previously it was never
#         refreshed: it stayed on its old build until some unrelated
#         restart, then jumped to whatever the tag pointed at, so the two
#         pods routinely ran different builds of one image.
#       * daemonset/<release>-resource-monitor — in the node-agents
# namespace, reached via a second, narrower Role. Previously it
#         had no deliberate update path at all (a chart release does not
#         change its image ref either); it moved only when a pod happened
#         to restart.
#   - First observation (annotation absent on a fresh install): record
#     the current digest without re-imaging. Rewriting repo:tag to
#     repo@digest for byte-identical content would roll every workload —
#     including the DaemonSet on every node — for nothing. A FRESH install
#     therefore stays on repo:tag until the first genuine upstream digest
# change, and is pinned by digest from then on (the
#     first-observed / digest-applied markers, which tell the two cases apart
#     only once the pin case below is excluded); an established edge whose
#     live ref is off the recorded digest -- a helm re-render, a legacy
#     install -- is re-pinned at the next tick. Restart-safe offline
#     throughout.
#     One case OUTRANKS the markers: an image carrying an images.<image>.digest
#     pin the render IGNORED (a digest resolved on a registry this release does
#     not pull from) is never the fresh-install case, whatever the markers say
#     -- the operator asked for a digest, so the script re-pins it on the first
#     tick (`pin_ignored`, image-refresh-cronjob.yaml).
#   - Idle-cheap: when the recorded digest matches today's digest AND the
#     workload already runs that digest, the script exits without touching
#     anything. If a helm re-render reverted the pin back to repo:tag it
#     re-pins that one tick (compared on the @sha256 digest, so a mirror
#     prefix rewrite is not mistaken for a revert). Steady state is one HEAD
#     per image per tick, well under the 100/6h anonymous pull-rate limit --
#     which is DOCKER HUB's, and so binds only where `tracebloc.tbRegistry`
#     resolves to docker.io. On the ghcr.io default that cap is not the one
#     in play (see the schedule block, which keeps the docker.io arithmetic
#     as the worst case).
#   - The script resolves digests on the SAME registry the pods pull the
#     tracebloc images from (images.traceblocRegistry, or the
#     global.imageRegistry mirror when set), and it can only do so
#     anonymously on docker.io and ghcr.io. Anywhere else -- a private
#     mirror -- pinning a digest resolved elsewhere could pin an image the
#     registry does not hold, so it logs and goes INERT instead. Under the
#     old `rollout restart` the mismatch was merely useless; with
#     `set image` it has to fail closed.
#
# Pinned-digest interaction: if images.jobsManager.digest,
# images.podsMonitor.digest AND images.resourceMonitor.digest are all set,
# the chart skips rendering this CronJob entirely — digest pinning is an
# explicit opt-out from drift, and auto-refresh would defeat the purpose.
# If only some are pinned the CronJob still runs and the script skips the
# pinned images at runtime. requests-proxy needs no entry in that test: it
# follows the jobs-manager pin. Setting images.requestsProxy.digest opts
# requests-proxy alone out of following jobs-manager.
#
# Trust boundary: this CronJob's ServiceAccount is bound to a
# namespace-scoped Role with get/list/patch/watch on the deployment
# resource ONLY (no pods, no other resources, no cluster scope) — a
# compromise can only re-image and annotate the jobs-manager and
# requests-proxy Deployments in this one namespace. The chart adds a SECOND
# Role in the node-agents namespace for the resource-monitor DaemonSet:
# get/patch are resourceNames-scoped to that one DaemonSet, while
# list/watch (which RBAC cannot scope by name, and `rollout status`
# requires) are namespace-wide and read-only. Still far narrower than
# autoUpgrade, which holds cluster-admin.
#
# The script reaches out only to the public token + manifest endpoints of
# the registry the tracebloc images are pulled from (docker.io or ghcr.io);
# if your cluster requires egress through a proxy, set HTTPS_PROXY via env
# or disable this CronJob.
#
# Disabled-on-this-cluster check after install:
#   kubectl get cronjob -n <namespace> -l app.kubernetes.io/component=image-refresh
#
# Inspect what the controller has recorded so far:
#   kubectl get deployment <release>-jobs-manager -n <namespace> \
#     -o jsonpath='{.metadata.annotations}' | tr ',' '\n' \
#     | grep tracebloc.io/last-refreshed
imageRefresh:
  # "" (default) = AUTO: OFF where the stage (tracebloc.clientEnv) resolves to
  # prod, ON for dev and stg. A prod edge runs the control plane its chart
  # version names (images.prodDigests) and never re-images it from a floating
  # tag between chart releases; a new build reaches it as the next chart release.
  # dev and stg edges float on :dev / :stg and this CronJob keeps them current.
  # true / false = explicit override on any stage. With it off, an image no pin
  # covers runs its tag with imagePullPolicy=Always (tracebloc.controlPlanePullPolicy).
  enabled: ""
  # Every 15 minutes at minute :07. The off-hour minute spreads load across
  # the origin the script HEADs; 15m balances drift latency against the cap
  # below.
  #
  # WHICH CAP: the 100/6h anonymous pull-rate limit named throughout this block
  # is DOCKER HUB's, and the script HEADs whatever `tracebloc.tbRegistry`
  # resolves to — ghcr.io by default since the GHCR migration (1.9.113), and
  # docker.io only where global.imageRegistry / images.traceblocRegistry say
  # so. The budget below is therefore the docker.io WORST CASE, kept because it
  # is the tightest published cap this schedule can hit; on the ghcr.io default
  # it is not the binding constraint. The numbers are unchanged —
  # nothing here re-derives them for ghcr.io.
  #
  # The per-tick cost is 3 manifest HEADs, up from 2 (resource-monitor
  # joined jobs-manager and pods-monitor; requests-proxy adds none, it reuses
  # the jobs-manager digest). At this schedule that is 3 x 4/hr = 12/hr, so
  # 72 per 6h against Docker Hub's cap of 100 — up from 48. Still under, but
  # on a docker.io edge the headroom for OTHER workloads sharing the egress IP
  # dropped from ~52 to ~28.
  #
  # That matters more than the raw number: exhausting Docker Hub's cap behind a
  # shared corporate NAT is one of the failure modes this CronJob exists
  # to fix (a rate-limited edge cannot pull for up to ~6h). If an edge pulls
  # from docker.io and shares its egress IP with other Docker Hub consumers,
  # widen this — "7,27,47 * * * *" (3/hr) puts the cost back to 9/hr, at the
  # price of slower drift pickup.
  # A digest pin on any image removes its HEAD from every tick entirely.
  schedule: "7,22,37,52 * * * *"
  # `kubectl rollout status --timeout`, applied PER WORKLOAD. Generous;
  # jobs-manager image pulls on bare-metal first-boot can take minutes, and
  # the CronJob slot shouldn't hold all night if a rollout genuinely wedges.
  #
  # RAISING THIS MEANS RAISING activeDeadlineSeconds BELOW — a tick
  # can wait on up to THREE workloads in sequence, so the Job's total budget
  # must stay above 3 x this value.
  rolloutTimeout: "10m"
  # Job-level wall-clock backstop (CronJob jobTemplate.spec.activeDeadlineSeconds).
  # MUST exceed 3 x rolloutTimeout: a tick re-images jobs-manager, requests-proxy
  # and the resource-monitor DaemonSet in sequence, waiting on each.
  #
  # This was a hardcoded 1800 (30m). With the default 10m rolloutTimeout that is
  # EXACTLY 3 x 10m, i.e. no headroom at all. Blowing the deadline is not a benign
  # timeout: the Job is killed mid-wait, so the post-success annotate never runs,
  # the recorded digest never advances, and the shared `refresh-attempt` counter
  # stays incremented. Three such ticks trip the flap lockout for EVERY
  # control-plane image at once, while the CronJob still looks healthy.
  #
  # 3600 (60m) = 3 x the default rolloutTimeout plus 100% slack.
  activeDeadlineSeconds: 3600
  # Consecutive failed rollout attempts after which the refresh STOPS
  # re-restarting and flags the deployment for a human. A deployment whose
  # readiness FLAPS (becomes Ready, then crashes after warmup near the
  # rollout-status timeout) fails the rollout, so `recorded` never advances and
  # every later settled tick re-issues the same re-image. After this many in-a-row
  # failures the job stops re-imaging and annotates a "flap detected" marker
  # (tracebloc.io/refresh-flap-detected) so monitoring can surface it. There is
  # no auto-resume: a human investigates and clears the
  # tracebloc.io/refresh-attempt annotation to re-arm (or a rollout that finally
  # settles resets the counter on its own).
  maxRefreshAttempts: 3
  # The OTHER way refresh stops: the job skips a tick whenever the
  # jobs-manager Deployment is not settled, which is right for a rollout in
  # flight and wrong forever if the pod never becomes Ready. Because the skip
  # happens BEFORE anything is reconciled, requests-proxy and resource-monitor
  # stop updating too — and every tick exits 0, so the CronJob stays green.
  #
  # After this many consecutive skips the job FAILS instead, annotating
  # tracebloc.io/refresh-skip-streak so monitoring can surface it. It auto-resumes
  # the moment the deployment settles (unlike maxRefreshAttempts, which needs a
  # human): a skip streak means "it was busy", and settling really does resolve it.
  #
  # 8 ticks is ~2h at the default 15m schedule — longer than any legitimate
  # rollout, including a resource-monitor DaemonSet roll across every node.
  maxSkipTicks: 8
  # Re-imaging jobs-manager or requests-proxy replaces its pod, so it waits while
  # the edge trains, exactly as autoUpgrade.deferWhileTraining describes: the tick
  # logs `DEFERRED: ...` and exits 0 without re-imaging anything, and goes ahead
  # anyway after `maxDeferrals` deferrals in a row (96 = a day at the 15-minute
  # schedule). The count is the jobs-manager Deployment's
  # tracebloc.io/refresh-training-deferrals annotation. On, it adds `list` on pods
  # in the release namespace to this CronJob's Role.
  deferWhileTraining:
    enabled: true
    maxDeferrals: 96
    finishedWithin: "10m"
  # CronJob spec knobs. Override per-cluster if needed.
  suspend: false
  # Lower history limits than autoUpgrade — this Job runs ~96x/day, the
  # successful runs aren't interesting and 1 is enough for an at-a-glance
  # "last run succeeded" check.
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  # Pod image: needs `sh`, `kubectl`, and `curl`. alpine/k8s ships all
  # three in a small image and we pin the tag so behaviour cannot drift
  # if upstream re-tags.
  image:
    repository: alpine/k8s
    tag: "1.30.5"
    pullPolicy: IfNotPresent
    # THE REGISTRY AND THE PIN, BOTH EXPRESSIBLE. This block was
    # `repository` + `tag` only, rendered as `mirrorPrefix + repo:tag` -- which,
    # with no mirror set, emits a BARE reference, and a bare reference is a
    # Docker Hub reference. There was no `docker.io` in the chart to grep for, so this
    # site was invisible to a sweep of these values. It renders through
    # `tracebloc.image` now, which always names the registry.
    #
    # `registry` is the per-image override; `global.imageRegistry` still wins over
    # it, so an air-gapped mirror re-homes this image exactly as before.
    #
    # THE PIN IS WORK ITEM 2, AND THIS IS IT. The comment here used
    # to say `digest` was empty on purpose because pinning was the next change.
    # It is this change. The tag already pinned the BEHAVIOUR; the digest pins the
    # BYTES, so a silent upstream re-tag of the same version cannot move what this
    # cluster runs, and check-digest-drift.sh now watches this float nightly and
    # reds when it stops resolving here.
    #
    # RE-HOMING THIS IMAGE: THE PIN FOLLOWS ITS IMAGE, NOT ITS KEY. Helm merges
    # values, so an override of `repository` or `tag` alone leaves this `digest`
    # in place. It is honoured only for the `repository:tag` it was resolved for
    # (`digestFor` below; left empty, the chart's own pin is deemed resolved for
    # the chart's own repository:tag), so such an override renders YOUR repo:tag
    # and NOTES names the dropped pin. To pin your image, set your own `digest`
    # (always honoured). A mirror that serves the SAME bytes under another path
    # keeps this digest by declaring it: `digestFor: "<your repository>:<tag>"`.
    # `registry` / global.imageRegistry never affect the match -- a registry-only
    # re-home keeps the pin.
    registry: "docker.io"
    digest: "sha256:0d03af14f8539df28e51e8afc12ee6d78891c630b88226243307f08a6fab3538"
    # `<repository>:<tag>` the digest above was resolved for. Empty = the chart
    # default identity for the chart's own pin, your image for your own digest.
    digestFor: ""
  # GUARANTEED QoS: requests == limits for BOTH cpu and memory. See the fuller
  # note on autoUpgrade.resources for the mechanism. Image-refresh
  # was OOM-killed in lock-step with auto-upgrade (six paired failures — this Job
  # runs every 15m, so failing only when it coincides with the hourly upgrade
  # tick is itself the tell), which is what makes the cause SHARED: a node-level
  # OOM event, not two independent overruns. kubectl's peak here is ~40-80Mi
  # measured (one `get deployment -o json` + `rollout status` at a time; the curl
  # HEADs return headers only, jq ~2Mi) — well under 128Mi, so no ceiling was the
  # constraint. The memory pin is the honest reservation that reduces node
  # overcommit; pinning cpu makes the pod Guaranteed (oom_score_adj -997), which
  # is what actually keeps it off the OOM-killer's shortlist — a memory pin alone
  # barely moves a Burstable pod's oom_score_adj (on a large node, 64Mi->128Mi
  # moves 999->998, i.e. nothing). Limits never moved; only requests rose to meet
  # them. image_refresh_test.yaml pins cpu AND memory request==limit.
  resources:
    requests:
      cpu: "200m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

# ============================================================
# Per-ingestion dataset tables
# ============================================================
# When true, jobs-manager stamps PER_INGESTION_TABLES=1 into every ingestion
# Job it spawns: each ingest run then writes its own IMMUTABLE physical table
# ds_<uuid4 hex> (append disabled) and reports the handle to the backend,
# which resolves it into the experiment payload (data_info.tables) for the
# training read path and for per-experiment grant scoping.
#
# An edge flipped before its backend, engine images and jobs-manager carry the
# D-series ingests datasets its training path cannot locate. File-bearing
# categories (images/text) are refused under the flag until the per-dataset
# mount work — row-only categories (tabular /
# time-series) are the v1 target. Off: legacy shared label-named tables,
# byte-for-byte.
#
# UNSET by default: the effective value comes from perIngestionTablesByEnv
# below, keyed on the resolved CLIENT_ENV. Set true/false to force one answer
# on this edge regardless of environment. Left null on purpose, as
# ingestRunToken is: a literal `false` here is an OPERATOR OVERRIDE that wins
# over the map and makes it dead.
perIngestionTables:

# -- PER-ENVIRONMENT ROLLOUT for the gate above.
#
# On for dev. A run on a dev secure environment showed the whole D16 path: the backend
# row carries physical_table, training reads the ds_<hex> table, and `tb data
# delete` drops the table, the salt and the journal.
#
# Off for stg and prod: `tb data list` still names a dataset by its table, so
# under the flag a user's dataset shows only as its ds_<hex> handle. stg is off
# too because its journey checks what users see (data-list-parity was red on
# every staging hop while stg was on), and that journey gates every promotion.
# Prove the CLI fix on dev first.
# TODO: turn stg, then prod, on once `tb data list` names ds_ tables.
#
# An ingestor older than data-ingestors v0.8.16 reports the dataset's --name
# instead of its ds_ handle and its delete misses the table. Every chart pin is
# newer; an operator-set `images.ingestor.digest` must be too before this is on.
#
# An edge upgraded with plain `--reuse-values` from a chart without these keys
# has neither: the gate resolves off there and the render does not fail. The
# auto-upgrade CronJob uses --reset-then-reuse-values, which picks the map up.
perIngestionTablesByEnv:
  dev: true
  stg: false
  prod: false

# ============================================================
# Per-dataset PVC mounts
# ============================================================
# When true, jobs-manager stamps PER_DATASET_PVCS=1 into its own environment:
# each spawned training pod then gets one dedicated READ-ONLY hostPath PV/PVC
# per dataset handle, mounted at /data/shared/<handle>, and the shared data
# volume is removed from the pod entirely — the mount table references only
# the pod's own dataset(s), so no other dataset on the edge is even nameable.
# Off (default), training pods keep the subPath-scoped view of the shared PVC
# (Track A) — that is also the rollback: flip off and pods revert on the next
# spawn; the static PV/PVCs left behind are garbage-collected by jobs-manager.
#
# Effective only on single-node/hostPath clusters (node-local Option C):
# on elastic clusters the runtime logs a warning and falls back
# to subPath scoping. Requires clusterScope (the default): PersistentVolumes
# are cluster-scoped, so the namespaced Role cannot grant them — rendering
# fails on the invalid combination rather than letting Job spawns 403.
# Grants jobs-manager PV/PVC provisioning + GC verbs only while on (see
# templates/rbac.yaml). Default false: byte-for-byte identical rendering.
perDatasetPvcs: false

# ============================================================
# Durable pause/resume volume
# ============================================================
# Keeping a paused cycle's resume payload (model weights + optimizer state) on a
# volume that outlives the training pod is an exception to the 
# model-IP bound. It was allowed on 2026-10-13 with a 7-day
# retention: jobs-manager deletes a pause neither resumed nor stopped within 7
# days, and a resume after that restarts the cycle. Whether an install gets it
# is per environment, from trainingResumeEnabledByEnv below; off, the render is byte
# for byte what it was before this block existed.
#
# On, the chart:
# - creates the PVC `training-resume-pvc` (or uses `existingClaim`), with the
#   same access mode as the logs PVC (ReadWriteMany, or ReadWriteOnce on a
#   hostPath single-node install): jobs-manager and the training pods share it;
# - sets TRACEBLOC_TRAINING_RESUME_PVC on jobs-manager to that claim, so
#   training pods mount `<claim>/<experiment_pk>` at /data/resume/<pk> and the
#   engine is told which kind of stop a SIGTERM is;
# - mounts the same claim into jobs-manager at /data/resume, where it
#   pre-creates each experiment's directory and removes it on a stop;
# - grants jobs-manager `patch` on pods, to write the tracebloc.io/stop-kind
#   annotation the training pod reads (templates/rbac.yaml);
# - sets TRACEBLOC_TRAINING_RESUME_ENABLED / TRAINING_RESUME_ENABLED to "1" on
#   jobs-manager, which forwards it to every training pod: the engine only
#   resumes with it on. An operator's own env.TRAINING_RESUME_ENABLED
#   (either name) wins over this.
# Set it here, not as env.TRACEBLOC_TRAINING_RESUME_PVC: rendering refuses the
# env key, because on its own it arms the runtime without the mount or the RBAC.
#
# `enabled` is LEFT NULL ON PURPOSE: null means "this environment's default"
# (trainingResumeEnabledByEnv). A literal true or false is a per-edge override that
# always wins, so a customer opts an edge out with `trainingResume.enabled: false`.
trainingResume:
  enabled:
  # -- Use a claim you created yourself instead of the chart's. It must be
  #    mountable by jobs-manager and every training pod at once.
  existingClaim: ""
  # -- Size of the chart-created claim.
  storage: 10Gi

# What an install of each environment gets when trainingResume.enabled is unset:
# on for dev, stg and prod. The evidence for prod is staging e2e
# run 39488505748: a PyTorch cycle paused at epoch 3 resumed at epoch 4, so a
# resume keeps the finished epochs. The engine checkpoints only PyTorch models;
# sklearn, lifelines and scikit-survival models still restart the cycle on
# resume (TODO). Like the other *ByEnv maps,
# this records what a NEW install or upgrade of that environment renders, not
# where every edge already is.
trainingResumeEnabledByEnv:
  dev: true
  stg: true
  prod: true

# ============================================================
# Stop-kind signal for pause
# ============================================================
# A pause deletes the training Job, and the pod used to end as `Error` because
# it could not tell a pause from a stop or a node drain. On, jobs-manager
# writes tracebloc.io/stop-kind (pause | stop) on the Job's pods before the
# delete, and the pod reads it through a downward-API file, so the engine exits
# 0 on a pause and the pod reads `Completed`. Any other
# stop still exits 143.
#
# It holds no model weights, so it is ON by default and does not depend on
# trainingResume, which is set per environment. On, the chart sets
# TRACEBLOC_STOP_KIND_SIGNAL=1 on jobs-manager and grants it `patch` on pods
# (templates/rbac.yaml). trainingResume.enabled always implies it. Set it here,
# not as env.TRACEBLOC_STOP_KIND_SIGNAL: rendering refuses the env key, because
# on its own it would leave out the grant.
stopKindSignal:
  enabled: true

# ============================================================
# Per-experiment DB credentials
# ============================================================
# When true, jobs-manager mints a short-lived MySQL user for each experiment
# scoped to ONLY that experiment's physical table(s), and injects it into the
# training pod via a per-job Secret — instead of every pod sharing the
# root-equivalent edgeuser (which today can read every dataset + the metadata
# DB's Service Bus strings). jobs-manager provisions the dedicated tb_credmgr
# minting identity on startup and revokes each user when its Job ends.
#
# Flipped per environment, dev first; now ON for dev, stg and prod (see
# perExperimentDbCredsByEnv below) since staging and prod have DROPped edgeuser —
# a fresh install comes up on per-experiment credentials rather than the shared
# path. Where an operator overrides it off, behaviour is the old shared-credential
# path, byte-for-byte. Needs no per-edge action — the tb_credmgr password is a
# generated, upgrade-stable Secret value.
# LEFT NULL ON PURPOSE, matching narrowEdgeuser. The helper distinguishes
# "unset" from "explicitly false" with `kindIs "invalid"`, so a literal
# `false` here is an OPERATOR OVERRIDE that wins over every fleet default and
# makes the map below dead. Measured: with `perExperimentDbCreds: false` left in
# place, `dev` still rendered the gate off.
perExperimentDbCreds:

# -- PER-ENVIRONMENT ROLLOUT for the gate above.
#
# An operator `--set perExperimentDbCreds` still wins; with it unset, the fleet
# default below applies, resolved through the same CLIENT_ENV normalization as
# narrowEdgeuserByEnv (so `staging` maps to `stg` and cannot miss its entry).
#
# WHY THIS EXISTS. Every other gate in this rollout had a `…ByEnv` map; this one
# did not, so the flag the LAST step is gated on was the one whose
# fleet posture the chart could not record. A fleet taken to the per-experiment
# shape held that fact only in its stored release values — and a values-resetting
# upgrade or a fresh-datadir reinstall drops it, which puts the account mint back
# on edgeuser: the account the ticket exists to retire, silently restored.
#
# `dev: true` records a posture already achieved: dev was fully retired on
# 2026-08-26 (edgeuser DROPped and verified under a driven experiment). Safe to
# default on, because `credmgrPassword` generates-and-persists when unset —
# measured, not assumed: `helm template --set perExperimentDbCreds=true` with no
# companion secret renders clean.
#
# `stg: true` and `prod: true`. Staging DROPped edgeuser on 2026-08-31
# and prod's edge 713 on 2026-09-01, so both fleets
# are retired and their posture is a thing to bake — a fresh install comes up on
# per-experiment credentials rather than the shared edgeuser identity.
#
# SAFE TO BAKE, unlike rotate/reparent below. This gate is ADDITIVE: turning it on
# mints tb_credmgr (as edgeuser while re-parent stays off) and injects per-Job
# credentials, adding the per-experiment path without a render guard or a root-
# password migration. So baking it fires no guard and no 1045 on an existing
# fleet whose manual DDL has not run — which is exactly why rotateMysqlRootByEnv and
# bootstrapDbReparentByEnv below CANNOT be baked the same way.
#
# THE DEFAULT IS STILL NOT A POSTURE RECORD: it records what a NEW
# install of that environment should get, not where existing fleets are. Per-fleet
# migration state lives in each edge's stored release values and its migration
# ticket; do not read this as a claim that every existing edge is already there.
perExperimentDbCredsByEnv:
  dev: true
  stg: true
  prod: true

# Narrow edgeuser to USAGE only at every jobs-manager boot (S3
# close-out). mysql-client-initdb/10-edgeuser-bridge-grants.sql re-grants edgeuser
# its broad privileges at every FRESH datadir init and cannot branch on a runtime
# flag -- it is baked into a digest-frozen image and the mysql entrypoint runs it
# before jobs-manager exists. So without this, a fleet that completed the entire
# retirement can be handed a root-equivalent edgeuser again by a reinstall or a
# datadir loss, silently. With it on, the retired posture is self-sustaining
# instead of being a property of whoever last ran a REVOKE by hand.
#
# It REVOKES; it never DROPs. The account keeps existing with USAGE only -- able
# to connect, able to do nothing -- which is reversible from the S0
# `SHOW GRANTS FOR 'edgeuser'@'%'` snapshot. `DROP USER` stays an operator step.
#
# ONLY LEGAL WITH BOTH PREDECESSORS ON: bootstrapDbReparent (else the REVOKE
# strips the privileges of the connection issuing it) and perExperimentDbCreds
# (else a training pod is still authenticating as edgeuser). The third, the
# tb_meta/tb_ingest service accounts, is always on.
# Enforced, not documented: the render FAILS on a mis-paired combination, and
# jobs-manager refuses it again at startup. Verify a fleet is ready with
# docs/migration-tools/edgeuser-drop-readiness.sh before flipping this.
#
# UNSET by default: the effective value comes from narrowEdgeuserByEnv below,
# keyed on the resolved CLIENT_ENV. Set this to force one answer on an edge
# regardless of environment. Mirrors perExperimentDbCreds.
narrowEdgeuser:

narrowEdgeuserByEnv:
  dev: true
  stg: true
  prod: true

# DROP edgeuser entirely at jobs-manager boot — the step
# that was left as a deliberate operator action, made automatic for edges we
# cannot reach. jobs-manager runs `DROP USER IF EXISTS` on boot, idempotent and
# fail-safe (a fresh datadir has no edgeuser; an already-dropped
# edge is a no-op).
#
# ONLY RESOLVES ON WHERE narrowEdgeuser IS ALREADY ON: the baked default below is
# gated on it, so an edge is dropped only once it is narrowed (edgeuser USAGE-only
# and unused). DROP is the step PAST the risky one, not the risky one — and unlike
# the REVOKE it is NOT reversible from the S0 snapshot, so it is staged behind
# narrowing, one fleet at a time. The render FAILS a mis-paired explicit override
# (tracebloc.assertDropEdgeuserIsSafe) and jobs-manager refuses it again at startup.
#
# Flipped per environment (dev first) only after narrowing has soaked on that
# fleet. TRUE for every environment — dev, stg, prod:
# narrowEdgeuser has been baked-on across all three for weeks, so edgeuser is
# already USAGE-only and unused there — DROP is the clean finish. dev and stg were
# verified retired live (telemetry edgeuser_present false, Part C) before prod, the
# final flip. On prod DROP is a no-op on the 8.4 template edge (no edgeuser) and the
# retirement step on any remaining 5.7 prod edge. UNSET override => the effective
# value comes from dropEdgeuserByEnv, keyed on the resolved CLIENT_ENV. Mirrors
# narrowEdgeuser (and selfRotateMysqlRoot, whose prod flip landed).
dropEdgeuser:

dropEdgeuserByEnv:
  dev: true
  stg: true
  prod: true

# Optional operator pin for the tb_credmgr account password (mirrors
# podTokenSigningSecret's 3-tier resolution). Leave "" to generate-and-persist
# on first install. Set it for DR, to match a pre-created MySQL account, or to
# force a rotation — and to keep the password stable across a
# perExperimentDbCreds off→on toggle. Must be alphanumeric ([A-Za-z0-9]+);
# jobs-manager rejects other characters.
credmgrPassword: ""

# S1: the dedicated MySQL service identities tb_meta (owns the metadata DB)
# and tb_ingest (writes the dataset DB) that replace the root-equivalent edgeuser
# for jobs-manager, the egress gate and the ingestor. jobs-manager mints both at
# startup from the generated Secret below, and every ingestion Job it spawns gets
# DB_USER=tb_ingest. ALWAYS ON, in every environment: the shared-edgeuser path is
# gone, and with it the ingestor pin that path needed (docs/SECURITY.md §4.1.1).
#
# `serviceDbAccounts` and `serviceDbAccountsByEnv` are retired. The schema still
# accepts them, so a release that stored them renders, but an explicit `false`
# is ignored: the edge is migrated on its next upgrade, when jobs-manager mints
# the two accounts at boot, and NOTES.txt names the value it ignored.

# Optional operator pins for the tb_meta / tb_ingest account passwords (each
# mirrors credmgrPassword's 3-tier resolution). Leave "" to generate-and-persist
# on first install. Set for DR, to match a pre-created MySQL account, or to
# force a rotation. Must be alphanumeric ([A-Za-z0-9]+); jobs-manager rejects
# other characters.
tbMetaPassword: ""
tbIngestPassword: ""

# ============================================================
# Per-run ingest token
# ============================================================
# When on, jobs-manager gives each ingestion Job its own backend token: minted
# per run through the backend's POST /ingest-token/, scoped to ingestion, valid
# 24h -- instead of handing every ingestion Job the edge's
# shared, long-lived backend token. A leaked ingestion pod then leaks a token
# that can only ingest, for one run, for a day. Rendered into jobs-manager as
# TRACEBLOC_INGEST_RUN_TOKEN, always, "true" or "false".
#
# If the backend answers 404 (no endpoint yet) jobs-manager falls back to the
# shared token; any other mint failure fails the ingestion submit with a 502.
#
# UNSET by default: the effective value comes from ingestRunTokenByEnv below,
# keyed on the resolved CLIENT_ENV. Set true/false to force one answer on this
# edge regardless of environment. Mirrors narrowEdgeuser -- and LEFT NULL ON
# PURPOSE for the same reason: a literal `false` here is an OPERATOR OVERRIDE
# that wins over the map and makes it dead.
ingestRunToken:

# -- PER-ENVIRONMENT ROLLOUT for the gate above.
#
# The token is BOUND to one ingestor, so the ingestor has to know who it is: it
# must read TRACEBLOC_INGESTOR_ID and BACKEND_TOKEN_SCHEME.
# An ingestor built before the ingest-token change ignores them, and under a bound token every one
# of its backend calls fails. So each fleet turns on when ITS ingestor carries it
# and ITS backend serves the endpoint -- not before.
#
# dev: TRUE. dev floats on the :dev ingestor channel, which publishes from
# data-ingestors `develop` and carries it, and the dev API serves
# /ingest-token/.
#
# stg: TRUE. stg floats on the :stg channel, which publishes from
# data-ingestors `staging` and carries it, and backend staging serves
# /ingest-token/.
#
# prod: TRUE. Every prod edge spawns images.ingestor.prodDigestServiceDb, which
# carries it, and backend main serves /ingest-token/.
#
# An edge upgraded with plain `--reuse-values` from a chart without these keys
# has neither: the gate resolves off there, the shared-token behaviour it already
# had, and the render does not fail. Use --reset-then-reuse-values (Helm >= 3.14)
# to pick up this map.
ingestRunTokenByEnv:
  dev: true
  stg: true
  prod: true

# ============================================================
# S3 bootstrap re-parent (final stage)
# ============================================================
# The account-minting DDL (CREATE USER / GRANT for tb_credmgr, tb_meta and
# tb_ingest) still authenticates AS the root-equivalent edgeuser. While it does,
# edgeuser cannot be REVOKEd / DROPped. This gate re-parents that mint onto MySQL
# root — client-runtime's _bootstrap_db_config reads DB_BOOTSTRAP_USER /
# DB_BOOTSTRAP_PASSWORD (both-or-neither) — which is the prerequisite for
# retiring edgeuser. Additive to the data plane: it changes only which identity
# runs the mint, never which the scoped accounts hold.
#
# This is the LAST, prod-irreversible-adjacent step of the rollout. Baked ON for
# dev, stg and prod (all three fleets retired) — but the baked default re-parents
# ONLY a fresh or already-rotated edge (tracebloc.bakedRootRotationOn),
# in lockstep with rotateMysqlRoot, so an existing un-rotated / blind edge falls
# back to its current mint identity rather than wedging its render. An accessible
# existing edge is re-parented by the explicit override once its root is rotated
# (ALTER USER) and its S0 `SHOW GRANTS FOR 'edgeuser'@'%'` snapshot is captured
# (the rollback reference).
#
# UNSET by default: the effective value comes from bootstrapDbReparentByEnv
# below, keyed on the resolved CLIENT_ENV. Set this to force one answer on an
# edge regardless of environment (an operator override — DR, a fleet held back
# deliberately, or a customer opt-out). Mirrors narrowEdgeuser.
#
# BAKING THIS ON REQUIRES THE ROTATION ON TOO. The re-parent needs
# root's password pinned as DB_BOOTSTRAP_PASSWORD, and of the three tiers that can
# supply it only one works for a DEFAULT: an explicit .Values.bootstrapDbPassword
# is an operator action, the live Secret is empty on a fresh install and in every
# `helm template`/dry-run, and the third — derived from rotateMysqlRoot, which is
# what makes the chart the authority on root's password — renders everywhere. So
# reparent=true with rotate=false has nothing to fall back on and hard-fails the
# render for every install of that environment that does not pin the password by
# hand. Bake the two ByEnv gates as a PAIR; scripts/tests/reparent-requires-
# rotation.sh refuses the half-baked combination at review time.
bootstrapDbReparent:

bootstrapDbReparentByEnv:
  dev: true
  stg: true
  prod: true

# REQUIRED when the gate above is on: the password jobs-manager authenticates
# with, as MySQL root, to run the mint DDL. There is NO generated default —
# jobs-manager AUTHENTICATES as root (it never runs `ALTER USER root`), so a
# random value the server was never told to expect would lock the minter out of
# MySQL and CrashLoop it. Set this to the MySQL root password for the cluster —
# the `mysql-client` image's baked default (Dockerfile.mysql_client bakes
# MYSQL_ROOT_PASSWORD).
# Helm fails the render if the gate is on and this is unset (with an existing
# Secret value preserved across upgrades in between). NOT constrained to
# alphanumeric — unlike the credmgr / tb_* passwords it is never interpolated
# into DDL, only passed as a mysql-connector connection parameter.
bootstrapDbPassword: ""

# ============================================================
# Rotate the mysql-client root password (Phase 0)
# ============================================================
# The mysql-client image bakes root's password as a literal (Dockerfile
# MYSQL_ROOT_PASSWORD). Rotation moves it off that literal. When this gate
# is on, the chart generates a random root password into the Secret and injects
# it as MYSQL_ROOT_PASSWORD on the mysql-client deployment.
#
# WHICH SECRET: every MySQL password -- this one,
# bootstrapDbPassword's DB_BOOTSTRAP_PASSWORD, and the credmgr / tb_meta /
# tb_ingest passwords above -- lives in `mysql-credentials`, a constant-named
# Secret carrying helm.sh/resource-policy: keep, so it survives `helm uninstall`
# beside the `mysql-pvc` datadir it opens and a reinstall over that datadir just
# works. "The Secret" below means that one. The release Secret
# (`<release>-secrets`) keeps clientId / clientPassword / the pod token signing
# key, and for one release a copy of the MySQL passwords for a rollback; the
# chart reads that copy only when `mysql-credentials` does not exist yet (the
# first upgrade onto the split), and then as a whole, never key by key. Rotate or
# remove a MySQL password by hand in `mysql-credentials`.
#
# IMPORTANT — this alone only rotates a FRESH datadir. The mysql entrypoint reads
# MYSQL_ROOT_PASSWORD at first init and ignores it thereafter, so an EXISTING
# edge keeps its current root password until the one-time rollout DDL runs:
#   ALTER USER 'root'@'%'        IDENTIFIED BY '<the generated Secret value>';
#   ALTER USER 'root'@'localhost' IDENTIFIED BY '<the generated Secret value>';
# (read the value from the Secret, run via `kubectl exec` as root@localhost).
# Turning the gate on rolls the mysql pod (a brief restart) — flip it in a window.
# Any tooling/runbook that dials root with the old literal must move to the
# Secret first, or it breaks at rotation. selfRotateMysqlRoot (below) has mysqld
# run that DDL itself at every start, so an existing edge needs no manual step.
#
# GUARDED — fail-CLOSED. Because that DDL is manual
# and mandatory, the chart REFUSES to render a rotation that would silently break
# auth rather than fail at runtime with a 1045. On the MINT path (gate on, no
# mysqlRootPassword pin, no MYSQL_ROOT_PASSWORD already in the Secret) the render
# FAILS at template time, naming docs/migration-tools/rotate-mysql-root.md, in
# THREE cases:
#   1. the MySQL datadir PVC already exists in the live cluster (`lookup`);
#   2. mysqlDatadirExists=true is declared (below) — arm 1, asserted for a render
#      that cannot see the PVC; or
#   3. the render CANNOT SEE A CLUSTER AT ALL: `helm template`, `--dry-run`,
#      ArgoCD's default (non-server-side) render, Flux post-render.
#      Offline the chart can neither check for an existing datadir NOR preserve the
#      value it mints (tier-2 preservation is a live `lookup` too), so an offline
#      mint re-randomises every render and never converges — refuse it.
# The ONLY render that mints is a FRESH install on a LIVE cluster (datadir absent,
# cluster visible, nothing declared → born rotated, and the next live render's
# tier 2 preserves it). Acknowledge the manual migration with
# mysqlRootRotationAcknowledged below to clear all three arms and proceed on an
# existing fleet; a cluster-less fleet that wants the rotation pins mysqlRootPassword
# (below) or renders server-side.
#
# UNSET by default: the effective value comes from rotateMysqlRootByEnv below,
# keyed on the resolved CLIENT_ENV. Set this to force one answer on an edge
# regardless of environment. Mirrors bootstrapDbReparent.
rotateMysqlRoot:

rotateMysqlRootByEnv:
  dev: true
  stg: true
  prod: true
#
# CLUSTER-LESS DEV NOTE. Because `dev` defaults rotation ON, a dev
# fleet rendered WITHOUT a live cluster — ArgoCD's default render, Flux
# post-render, or a bare `helm template` for validation — hits the fail-closed
# mint guard above (arm 3) and REFUSES. That is correct: such a render cannot
# preserve the minted value, so it would re-randomise every sync. To render a dev
# fleet cluster-less, either PIN mysqlRootPassword below (tier 1 — stable, and it
# bypasses the mint guard) or render SERVER-SIDE (argocd-repo-server against the
# live cluster). A live install/upgrade — the in-cluster auto-upgrade CronJob
# included — sees the cluster and is unaffected.

# Optional operator pin for the root password (3-tier resolution, mirrors
# credmgrPassword). Leave "" to generate-and-persist on first install. Set for
# DR, or to match a root account you rotated out-of-band. Must be alphanumeric
# ([A-Za-z0-9]+): the rotation runbook embeds this value in an
# `ALTER USER ... IDENTIFIED BY '...'` statement, so a quote or metacharacter
# would break the one-time rotation (generated randAlphaNum values already
# satisfy this). This is why it is constrained where bootstrapDbPassword is not
# — that one is only ever a mysql-connector connection parameter, this one also
# lands in DDL.
mysqlRootPassword: ""

# Acknowledge the manual root-rotation migration on an EXISTING fleet.
# Normally unset. When rotateMysqlRoot is on and the chart would
# MINT (see the guard above), the render FAILS at template time (naming
# docs/migration-tools/rotate-mysql-root.md) unless this is true. Set it ONLY as
# part of that runbook: it asserts you have read it and will run the one-time
# `ALTER USER 'root'` DDL to align root's live password to the Secret value in the
# same maintenance window. It clears ALL of the guard's refuse arms (existing
# datadir, declared, and the offline fail-closed one), and it runs no DDL itself.
# It ALSO clears tracebloc.bakedRootRotationOn's own refuse arms and, over a
# SURVIVING mysql-root-rotated marker whose rotation the Secret no longer backs, its
# marker-forces-ON arm. The marker (resource-policy:
# keep) can OUTLIVE the rotation it recorded — an old, pre-rotation Secret restored
# over a datadir whose marker survived leaves marker present + Secret present but no
# MYSQL_ROOT_PASSWORD — and the marker forced rotation ON there, minting a
# root password the live database never accepted (1045). SET, the marker yields and
# bakedRootRotationOn resolves OFF onto the image-baked password; UNSET, the marker
# still wins (the safe born-rotated default). A born-rotated edge on a NORMAL upgrade
# (its Secret still carries the root) needs no ack — bakedRoot keeps it ON either way.
#   This does NOT bypass the SEPARATE credential-collision guard in secrets.yaml:
# a render that finds the resource-policy: keep datadir PVC but
#   NEITHER `mysql-credentials` NOR the release Secret (an uninstall by a chart
#   older than the split, or both deleted by hand) is refused THERE, regardless of
#   this ack — copy the release Secret back to the name this render wants, or delete
#   the datadir (that guard names both). A reinstall whose uninstall kept
#   `mysql-credentials` is not refused at all. The ack governs root's rotation state, not that
#   guard. Once past it on the image-baked path, ALSO delete the leftover marker
#   (`kubectl -n <ns> delete configmap mysql-root-rotated`) AND then UNSET this ack
#   (clear it from your values — it does NOT self-expire and replays through the
#   CronJob's `--reset-then-reuse-values`). Both matter: the ack makes the SURVIVING
#   marker yield but does not remove it, so with the marker still there a later
#   render that omits the ack would re-arm off the stale marker; and while the ack
#   stays SET the marker is yielded rather than enforced, so it no longer backstops a
#   later loss of the root key. Marker deleted + ack cleared leaves a clean un-rotated
#   edge where the normal marker / bakedRoot guards apply again.
#
# SELF-EXPIRING ONLY ON A LIVE OR SERVER-SIDE RENDER: once rotated,
# tier 2 (a live `lookup` of the Secret) preserves MYSQL_ROOT_PASSWORD and the mint
# branch is never reached again, so the flag becomes a no-op. On a CLUSTER-LESS
# render tier 2 is empty EVERY render, so it does NOT self-expire there — an
# operator who rotates a cluster-less fleet on the ack alone would have to leave it
# set permanently, which permanently DISARMS the guard (and the ack replays through
# `--reuse-values` and `--reset-then-reuse-values`, which the auto-upgrade CronJob
# and runbook use). Do not rotate a cluster-less fleet with the ack alone: pin
# mysqlRootPassword or render server-side (see the cluster-less note above). A
# FRESH install on a live cluster never needs this.
mysqlRootRotationAcknowledged:

# Declare that this fleet's MySQL datadir ALREADY EXISTS (chart
# `>= 1.9.90`). Normally unset — the fail-closed guard above already covers most
# fleets: a cluster-less render REFUSES the mint by default (arm 3) and a live
# render DETECTS the datadir by its PVC (arm 1). This is the explicit arm-2
# assertion, for the two gaps those leave:
#   - a LIVE render whose datadir PVC the `lookup` cannot see (a renamed PVC, or
#     one not yet bound) though you know the datadir exists; and
#   - message clarity: with it set, the refusal names the existing-datadir
#     migration specifically, instead of the generic cannot-see-a-cluster message.
# Pin it in the fleet's checked-in overlay: a DURABLE per-fleet fact (an existing
# install stays existing). A FRESH install leaves it unset. No drift check against
# live cluster state is warranted: a stale `true` only ever makes a render REFUSE
# (fail-closed-safe — clear it, or acknowledge), it can never cause a wrong mint.
#
# PROTECTION, not a rotation path — like the acknowledgement, it does NOT make a
# cluster-less rotation converge (the minted value is not preserved offline: tier-2
# preservation is a live `lookup` too, the same limit documented for
# clientId/clientPassword). To actually rotate a cluster-less fleet, pin
# mysqlRootPassword (tier 1 — deterministic, and it bypasses the mint) or render
# server-side. Charts `< 1.9.90` ignore this key (open schema). See
# docs/migration-tools/rotate-mysql-root.md.
mysqlDatadirExists:

# ============================================================
# Let mysqld rotate root itself
# ============================================================
# The rotation above only reaches an EXISTING datadir through the manual
# `ALTER USER 'root'` runbook, which needs access to the cluster. With this gate
# on, mysqld does it itself: at every start on an existing datadir it sets root's
# password to MYSQL_ROOT_PASSWORD in `mysql-credentials` (the same Secret and key
# every other root reader uses) through `init_file`, which runs
# before the server accepts connections and needs no authentication, so the old
# password is never needed. An init container decides at each pod start:
#   - existing datadir  -> hand mysqld the SQL (root is set from mysql-credentials);
#   - fresh datadir     -> do nothing (the entrypoint initialises root itself);
#   - key absent, empty or not alphanumeric -> do nothing and log a warning
#     (root is left as it is).
#
# What it changes:
#   - An existing un-rotated edge on a live cluster now resolves rotation ON (it
#     used to stay on its install-time password), so the next upgrade mints root,
#     re-parents jobs-manager onto it and lays down the born-rotated marker.
#   - The rotation guard's existing-datadir refusal no longer applies; its
#     cluster-less refusal still does (an offline mint is never preserved).
#   - Root always equals the Secret after a restart, so a Secret and a database
#     that disagree heal at the next mysql restart instead of failing with 1045.
#   - The mysql pod rolls once when the gate first reaches it.
# The render REFUSES if the root password it would apply is not alphanumeric, or
# if bootstrapDbPassword pins a different value (jobs-manager would be locked out).
#
# UNSET by default: the effective value comes from selfRotateMysqlRootByEnv below,
# keyed on the resolved CLIENT_ENV. Set this to force one answer on an edge.
selfRotateMysqlRoot:

# True for dev, stg and prod. The rollout flipped one environment at a time
# (dev, then stg, then prod); set selfRotateMysqlRoot=false to hold one edge back.
selfRotateMysqlRootByEnv:
  dev: true
  stg: true
  prod: true

# The claim the MySQL Deployment mounts as its datadir. Leave empty (the default)
# and it mounts the chart's own `mysql-pvc`, exactly as before. Set it only to the
# name of a PersistentVolumeClaim that already exists in the release namespace and
# holds a datadir provisioned OUTSIDE this chart — for example one an in-cluster
# engine migration restored into a fresh volume. Set it as a user-supplied value
# (`--set`), so the auto-upgrade's `--reset-then-reuse-values` carries it forward.
# Put the claim on the release's own StorageClass: the storage seal check
# (`helm test`) requires every expected claim, this one included, to be Bound on
# that class, and fails on a claim anywhere else.
#
# `mysql-pvc` is still rendered and kept while this is set, and must NOT be
# deleted: a `helm rollback` of a failed upgrade needs it in the manifest, the
# root-password guards look it up by name, and a re-created claim can stay Pending
# on a WaitForFirstConsumer class and fail every later upgrade. To reclaim its
# space, empty it in place. Not supported with hostPath.enabled (the render fails).
mysqlClaimName: ""

# jobs-manager's replica count: 1 (the default) or 0. Setting it to 0 as a
# user-supplied value holds jobs-manager down across upgrades, where a
# `kubectl scale` would be reverted by the next `helm upgrade`. Anything else is
# refused by the schema — jobs-manager is a single-writer controller on
# ReadWriteOnce volumes.
jobsManagerReplicas: 1

# jobs-manager's livenessProbe on GET /livez. Off by default: an older image
# answers 404 there and would restart-loop. Enable only where the image that runs
# (a digest pin included) serves /livez. Never rendered when either INGESTION_HTTP_DISABLED spelling is set.
jobsManager:
  livenessProbe:
    enabled: false

# ============================================================
# Ingestion endpoint authorization
# ============================================================
# jobs-manager's POST /internal/submit-ingestion-run authenticates callers
# via Kubernetes TokenReview, then authorizes against this policy. Mapping
# is (namespace, service_account) → list of allowed table-name prefixes;
# "*" means any table.
#
# Default: allow the ingestor subchart's SA (created below by this chart,
# named `ingestionAuthz.serviceAccountName`) to ingest into any table.
# Customers tighten via overrides — e.g.:
#
#   ingestionAuthz:
#     allowed:
#       - service_account: my-dataset-ingestor
#         namespace: tracebloc
#         table_prefixes: ["chest_xrays_", "tumors_"]
ingestionAuthz:
  # -- Name of the shared ServiceAccount this chart creates for ingestor
  # subchart releases. Single source of truth: the SA
  # template and the default `allowed` entry below both read this value.
  # Override only if the name "ingestor" collides with something in your
  # namespace; the matching ingestor subchart's `serviceAccount.name`
  # must be updated to the same value.
  serviceAccountName: ingestor
  allowed:
    # Default: the SA named `ingestionAuthz.serviceAccountName` above, in
    # the same namespace as this release, can ingest into any table. When
    # `service_account` is omitted the ConfigMap template substitutes
    # `ingestionAuthz.serviceAccountName`; when `namespace` is omitted it
    # substitutes `.Release.Namespace`. Customers tighten by adding more
    # specific entries with explicit fields.
    - table_prefixes: ["*"]

# -- The egress gate: the one service the client's senders hand
# their messages to. It checks each message against the declaration of what may
# leave, sends or refuses it, and keeps a record on this machine of every one
# (2Gi claim `<release>-egress-record`; 90 days or 1 GiB, oldest first). It runs
# the jobs-manager image: images.requestsProxy and resources.requestsProxy still
# pin and size its `gate` container, so an override stored by --reuse-values
# keeps applying. requests-proxy-service is an alias of it.
egressGate:
  # `report`: a message the declaration does not allow is sent and recorded as
  # would-refuse. The only value the chart takes: enforce waits until the client
  # stores the owner's data mark, because until then every run is checked as
  # patient data and enforce would refuse every open-data run's losses and scores.
  mode: report
  record:
    # The `record` container serves the record read-only, to the owner, through
    # the Kubernetes API's service proxy. Idle unless the owner reads it, so it
    # requests nothing and adds nothing to the control plane's footprint.
    resources:
      requests:
        cpu: "0"
        memory: "0Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"
