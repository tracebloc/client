        gpu: "sha256:dc39107e981dc7d354330037389dda01347ae4b8e1d0909060c70a57a1d54a64"
      embeddings:
        cpu: "sha256:ff782e4a586f28340f5a3a37362d6246355f6411030d96009ad13f0ad3df1ea7"
