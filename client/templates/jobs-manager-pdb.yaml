{{- /*
  PodDisruptionBudget for the single-replica jobs-manager Deployment.

  `podDisruptionBudget.jobsManager.create` is tri-state:
    null (default) -> AUTO, tracking the storage/topology mode:
                        * multi-node CSI clusters (hostPath.enabled=false,
                          i.e. AKS/EKS/OpenShift): RENDER. A surprise
                          autoscaler scale-down or node upgrade could evict
                          the only pod; minAvailable:1 forces the operator to
                          drain deliberately.
                        * single-node / bare-metal installs
                          (hostPath.enabled=true): SKIP. With one replica on
                          one node, minAvailable:1 leaves zero allowed voluntary
                          disruptions, so `kubectl drain`/cordon (node
                          maintenance, manual k3s upgrade) blocks forever and
                          the pod has nowhere to reschedule anyway
                          (tracebloc/client#560).
    true  -> force render regardless of topology.
    false -> never render.
*/}}
{{- $pdb := default dict .Values.podDisruptionBudget.jobsManager -}}
{{- /* Single-node detection mirrors jobs-manager-deployment's SINGLE_NODE
     resolution: an explicit env.SINGLE_NODE wins, else default to
     hostPath.enabled. A node-local single-node install (SINGLE_NODE=true with
     hostPath.enabled=false — local-path CSI k3d, AGENTS=0) must count as
     single-node here too, otherwise it renders an undrainable minAvailable:1
     PDB and blocks drain / k3s upgrade (client#560 / Bugbot). */ -}}
{{- $env := default dict .Values.env -}}
{{- $hostPathMode := (default dict .Values.hostPath).enabled | default false -}}
{{- $isSingleNode := ternary (eq (toString (index $env "SINGLE_NODE")) "true") $hostPathMode (hasKey $env "SINGLE_NODE") -}}
{{- $create := ternary $pdb.create (not $isSingleNode) (kindIs "bool" $pdb.create) -}}
{{- if $create }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-jobs-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tracebloc.labels" . | nindent 4 }}
spec:
  # Single-replica deployment: maxUnavailable: 1 would be a no-op (the only pod
  # can always go away), so minAvailable: 1 is used to actually block voluntary
  # disruptions while replicas == 1. This only renders where a drain has
  # somewhere to move the pod (multi-node CSI) or is force-enabled — on
  # single-node installs the whole object is skipped (see header above).
  minAvailable: 1
  selector:
    matchLabels:
      app: manager
{{- end }}
