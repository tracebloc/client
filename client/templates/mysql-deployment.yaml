apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-client
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tracebloc.labels" . | nindent 4 }}
    app: mysql-client
spec:
  selector:
    matchLabels:
      app: mysql-client
  strategy:
    type: Recreate
  replicas: 1
  template:
    metadata:
      labels:
        app: mysql-client
    spec:
      # NOT NEEDED, and no ServiceAccount is named — so without this the pod would
      # mount the namespace's `default` SA token. A database and two busybox init
      # containers make no Kubernetes API calls.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      {{- /*
        Reference the PriorityClass whenever a name is set, regardless of
        priorityClass.create. Operators on GitOps / shared-platform setups
        manage the PriorityClass out-of-band (create: false) but still want
        the pod to reference it — gating on `create` would silently strip
        the OOM protection this chart's mysql tuning relies on.
      */}}
      {{- with .Values.priorityClass.name }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: "OnRootMismatch"
      initContainers:
      {{- if (default dict .Values.hostPath).enabled }}
      # kubelet does not apply fsGroup to hostPath volumes
      # (kubernetes/kubernetes#138411), so bare-metal installs need a
      # privileged bootstrap to chown /var/lib/mysql to 999:999. CSI-backed
      # deployments (EKS/AKS/OC) skip this and rely on fsGroup.
      - name: init-mysql-data
        image: {{ include "tracebloc.thirdPartyImage" (dict "site" "images.busybox" "root" $) | quote }}
        # Must run as root to chown the hostPath mount; kubelet does not apply
        # fsGroup to hostPath volumes (kubernetes/kubernetes#138411).
        # Scope privilege tightly: only CHOWN is needed — no FOWNER, so do not
        # chmod here. On re-install the dir is already owned by 999, and
        # chmod-by-non-owner without CAP_FOWNER returns EPERM (kubelet creates
        # the dir 0755 via DirectoryOrCreate, so chmod was a no-op anyway).
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN"]
          seccompProfile:
            type: RuntimeDefault
        command: ['sh', '-c', 'chown 999:999 /var/lib/mysql']
        volumeMounts:
        - name: mysql-persistent-storage
          mountPath: /var/lib/mysql/
      {{- end }}
      # Engine/datadir format guard (backend#723). MySQL datadirs are
      # version-specific: 8.4 refuses a 5.7-format datadir (staged 5.7→8.0→8.4
      # upgrades only), and 5.7 cannot open an 8.x one. A mismatched engine
      # would CrashLoop with a cryptic mysqld error — this fails FIRST with an
      # actionable message instead. `mysql.ibd` (the 8.0+ data dictionary) is
      # the format marker: present = 8.x datadir, absent (with ibdata1) = 5.7.
      # The 8.0 transit hop and unknown/custom pins are deliberately allowed —
      # this is a backstop against accidental engine flips, not a gate.
      - name: mysql-format-guard
        image: {{ include "tracebloc.thirdPartyImage" (dict "site" "images.busybox" "root" $) | quote }}
        env:
        - name: TB_EXPECTED_ENGINE
          value: {{ include "tracebloc.mysqlEngineMajor" . | quote }}
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        command:
          - 'sh'
          - '-c'
          - |
            d=/var/lib/mysql
            if [ ! -e "$d/ibdata1" ] && [ ! -e "$d/mysql.ibd" ]; then
              exit 0  # fresh/empty datadir: the entrypoint initializes it
            fi
            case "$TB_EXPECTED_ENGINE" in
              8.4)
                if [ ! -e "$d/mysql.ibd" ]; then
                  echo "REFUSING TO START: MySQL 8.4 image over a 5.7-format datadir (no mysql.ibd)."
                  echo "8.4 cannot open 5.7 data — MySQL supports staged upgrades only (5.7 -> 8.0 -> 8.4)."
                  echo "Either keep this edge on the 5.7 engine (remove the 8.4 image override) or"
                  echo "migrate the datadir per the staged runbook in tracebloc/backend#723."
                  exit 1
                fi ;;
              5.7)
                if [ -e "$d/mysql.ibd" ]; then
                  echo "REFUSING TO START: MySQL 5.7 image over an 8.x-format datadir (mysql.ibd present)."
                  echo "This datadir was already upgraded and cannot go back to 5.7. Point this edge"
                  echo "back at its 8.4 engine values (tracebloc/backend#723), or restore the"
                  echo "pre-migration backup if a rollback is intended."
                  exit 1
                fi ;;
              *) : ;;
            esac
        volumeMounts:
        - name: mysql-persistent-storage
          mountPath: /var/lib/mysql/
          readOnly: true
      containers:
      # THE REGISTRY IS tracebloc.tbRegistry SINCE D1 STEP 6 (backend#3397).
      # mysql-client is a tracebloc-published image and now lives beside the
      # others on ghcr.io; it used to be routed around this helper with a
      # hardcoded `docker.io` fallback because it was published nowhere else.
      # THE DIGEST GOES THROUGH tracebloc.honouredPin -- the same one decision
      # the control-plane sites use -- so a pin resolved on one registry is
      # never rendered onto another. Passing `.Values.images.mysqlClient.digest`
      # straight in, the shape this line used to have, is exactly how a Hub
      # digest was rendered onto ghcr.io and every pull timed out (see
      # tracebloc.pinFor). An IGNORED pin falls back to `:<images.mysqlClient.tag, default prod>`,
      # which the frozen Hub namespace and ghcr.io both serve.
      # NIL-GUARDED (backend#4372): `images.mysqlClient: null` or `images: null`
      # renders the defaults below rather than a nil-pointer failure.
      {{- $mysqlImg := default dict (index (default dict .Values.images) "mysqlClient") }}
      - image: {{ include "tracebloc.image" (dict "repository" ($mysqlImg.repository | default "tracebloc/mysql-client") "tag" ($mysqlImg.tag | default "prod") "digest" (include "tracebloc.honouredPin" (dict "image" "mysqlClient" "root" $)) "registry" (include "tracebloc.tbRegistry" .)) | quote }}
        imagePullPolicy: IfNotPresent
        name: mysql-client
        {{- if (include "tracebloc.rotateMysqlRoot" .) }}
        # backend#947 / backend#1528 Phase 0: chart-managed root password so a
        # FRESH datadir is born with a generated password instead of the image's
        # baked literal. On an EXISTING datadir the mysql entrypoint ignores this
        # (root's password lives in mysql.user) — the one-time `ALTER USER 'root'`
        # rollout step aligns those to this same Secret value. Rendered only when
        # the rotation gate is on; a default install is byte-identical (it keeps
        # relying on the image's baked default). Probes use `mysqladmin ping`,
        # which needs no auth, so this env change never disturbs them.
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "tracebloc.secretName" . }}
              key: MYSQL_ROOT_PASSWORD
        {{- end }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        # requests.memory == limits.memory pins the cgroup memory budget so
        # mysqld is never the largest victim during node-level OOM. CPU limit
        # is intentionally omitted: throttled CPU causes InnoDB lock-wait
        # timeouts (mysqld can't service heartbeats) and is a far more common
        # cause of mysql crashes than a noisy neighbour. PriorityClass +
        # PodDisruptionBudget cover the eviction angle instead.
        resources:
          requests:
            memory: {{ .Values.resources.mysql.requests.memory | default "704Mi" | quote }}
            cpu: {{ .Values.resources.mysql.requests.cpu | default "150m" | quote }}
          limits:
            memory: {{ .Values.resources.mysql.limits.memory | default "704Mi" | quote }}
            {{- /*
              CPU limit is intentionally unset by default (see comment block
              above). Schema permits it, so honour an explicit override here
              instead of silently dropping it.

              An operator flipping this on to buy Guaranteed QoS gets NEITHER
              half of that trade (backend#2872). They get the CPU throttling the
              block above warns about — the cause of InnoDB lock-wait timeouts —
              and no QoS change at all, because ComputePodQOS requires
              requests == limits in EVERY container including init containers,
              and `mysql-format-guard` above carries no resources
              UNCONDITIONALLY. mysql therefore cannot be Guaranteed on any
              cluster, whatever is set here. Measured, not inferred.
            */}}
            {{- with .Values.resources.mysql.limits.cpu }}
            cpu: {{ . | quote }}
            {{- end }}
        ports:
        - containerPort: 3306
          name: mysql-client
        # timeoutSeconds defaults to 1; under CPU contention `mysqladmin ping`
        # routinely needs >1s to even spawn, which kubelet reports as a probe
        # failure and kills the container. 5s is generous enough to survive
        # transient CPU pressure but still catch a real hang within ~25s.
        #
        # Probe over TCP (-h 127.0.0.1), NOT the unix socket (-h localhost):
        # the mysql-client image writes its socket to /var/lib/mysql/mysql.sock,
        # not the client default /var/run/mysqld/mysqld.sock, so a socket-based
        # `mysqladmin ping` can't reach a perfectly healthy mysqld — the startup
        # probe then exhausts and the kubelet kill-loops the DB. TCP is immune to
        # where the image places the socket. Do not change back to `localhost`.
        startupProbe:
          exec:
            command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 24
        livenessProbe:
          exec:
            command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          exec:
            command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: mysql-persistent-storage
          mountPath: /var/lib/mysql/
        - name: mysql-config
          mountPath: /etc/mysql/conf.d/
        {{- /*
          ...AND as /etc/mysql/my.cnf, which mysqld reads directly (backend#3032).

          The conf.d mount alone is reached ONLY through `!includedir
          /etc/mysql/conf.d/` on the image's /etc/my.cnf. That line is a detail of
          a foreign image, and it is one unreadable file away from taking this
          whole ConfigMap out of effect SILENTLY: mysqld skips an option file it
          cannot open, with no warning and no error -- `mysqld --print-defaults`
          just comes back empty and the server runs on compiled defaults
          (max_allowed_packet 64M instead of the 256M declared here).

          That is not hypothetical. MEASURED on the CI k3d runner: the host has
          mysql-server installed, so AppArmor carries a `/usr/sbin/mysqld`
          profile; the k3d node is privileged, so pods inherit no container
          profile and AppArmor attaches the HOST profile to this container's
          mysqld by executable path (`/proc/1/attr/current` =
          `/usr/sbin/mysqld (enforce)` while a shell beside it is `unconfined`).
          That profile permits `/etc/mysql/**` -- the Debian layout -- and NOT
          `/etc/my.cnf`, which is where the Oracle-Linux-based 8.4 image keeps
          the include. The 5.7 fleets never hit this because their Debian image
          already kept its config under /etc/mysql/. Any node with mysql-server
          installed on the host is the same shape, so this is not CI-only.

          subPath, deliberately: a projected ConfigMap file is a symlink into
          `..data/`, AppArmor matches on the RESOLVED path, and the profile's
          `/etc/mysql/conf.d/*` does not match `/etc/mysql/conf.d/..2026_.../x`.
          subPath bind-mounts the file itself, so the path mysqld opens is
          exactly `/etc/mysql/my.cnf`. The cost is that subPath mounts do not
          track later ConfigMap edits -- which changes nothing here, since mysqld
          reads its options only at startup and the Deployment must be restarted
          for a config change either way.

          On an 8.4 node with no such profile this file is simply read a second
          time, after /etc/my.cnf, with identical content: same values, no
          behaviour change. (The image's OWN settings -- socket,
          skip-name-resolve -- still live in /etc/my.cnf and are still lost under
          confinement; recovering those is an image change, tracked on
          backend#3032.)

          GATED ON 8.4, and that "second read" is exactly why. It holds only for
          the Oracle-Linux 8.4 layout, where /etc/mysql/my.cnf is a file mysqld
          reads IN ADDITION to the primary /etc/my.cnf. On the chart's default
          5.7-lineage Debian image the same path is the PRIMARY option file --
          it carries that image's own `[mysqld]` settings and the `!includedir`
          that reaches conf.d -- so a subPath mount there REPLACES it rather
          than adding a read, dropping the image's settings and the include with
          them. The diagnosis, the AppArmor measurement and every e2e run behind
          this mount are 8.4-only; 5.7 keeps the conf.d mount alone, which is
          what it has always had.
        */}}
        {{- if eq (include "tracebloc.mysqlEngineMajor" .) "8.4" }}
        # Also as /etc/mysql/my.cnf: on 8.4 the conf.d mount is reachable only
        # via the image's `!includedir` in /etc/my.cnf, which a host AppArmor
        # mysqld profile silently takes out of reach (backend#3032 -- rationale
        # above). Never on 5.7, where this path IS the primary option file.
        - name: mysql-config
          mountPath: /etc/mysql/my.cnf
          subPath: mysql.cnf
          readOnly: true
        {{- end }}
        - name: mysql-logs
          mountPath: /var/log/mysql/
        # Writable scratch dirs required by mysqld under readOnlyRootFilesystem:
        # /var/run/mysqld -> pid file + unix socket
        # /tmp            -> temp tables, sort buffers, LOAD DATA staging
        # /var/lib/mysql-files -> default secure_file_priv; mysqld touches it at start
        - name: mysql-run
          mountPath: /var/run/mysqld
        - name: mysql-tmp
          mountPath: /tmp
        - name: mysql-files
          mountPath: /var/lib/mysql-files
      {{- if include "tracebloc.useImagePullSecrets" . }}
      imagePullSecrets:
      - name: {{ include "tracebloc.registrySecretName" . }}
      {{- end }}
      volumes:
      - name: mysql-persistent-storage
        persistentVolumeClaim:
          {{- /* mysql-pvc unless mysqlClaimName names a datadir provisioned outside
          the chart; mysql-pvc is still rendered either way (see the helper). */}}
          claimName: {{ include "tracebloc.mysqlDataClaim" . }}
      - name: mysql-config
        configMap:
          name: mysql-client-config
      - name: mysql-logs
        emptyDir: {}
      - name: mysql-run
        emptyDir: {}
      - name: mysql-tmp
        emptyDir: {}
      - name: mysql-files
        emptyDir: {}
