{{/*
  Dedicated namespace for node-level agents (tracebloc-resource-monitor).

  The resource-monitor DaemonSet mounts hostPath /proc and /sys to collect
  node metrics; Pod Security Admission's `restricted` profile bans hostPath
  volumes outright, so the DaemonSet cannot be made compliant in a
  restricted namespace. Isolating it in its own `privileged` namespace
  lets the release namespace (jobs-manager, mysql, training pods) run
  under `enforce: restricted` once the other blockers are resolved.

  Gated on:
    nodeAgents.namespace.create                   - skip when managing the namespace out-of-band
    nodeAgents.namespace.name != Release.Namespace - skip when the operator
        has pointed node-agents back at the release namespace. Otherwise this
        template would stamp `privileged` PSA labels onto the release
        namespace (defeating the whole point of the split) and, combined
        with namespace.create=true, would render two Namespace resources
        with the same name — a render-time collision.

  helm.sh/resource-policy: keep ensures `helm uninstall` does NOT delete
  the namespace. The namespace itself carries no persistent data, but
  keeping it avoids recreating the PSA labels on every reinstall and
  prevents race conditions where a DaemonSet from a concurrent install
  lands in the not-yet-relabelled namespace.
*/}}
{{- /*
  NO TENANT CONDITION AT ALL, and that is the change backend#2400 made here.

  The history is worth keeping because it explains why the condition kept moving.
  It was `resourceMonitor != false`; the Collector became a second tenant
  (backend#1906) and with `resourceMonitor: false` + `telemetryCollector.enabled:
  true` its DaemonSet targeted a namespace this chart never created, so the
  condition widened to `tracebloc.nodeAgentsInUse` (Bugbot on #779). backend#2400
  added a THIRD occupant that has no flag to widen to: telemetry-token-rbac.yaml
  renders a Role and RoleBinding here unconditionally, because the Collector's
  token Secret has to exist BEFORE anyone can enable the Collector.

  So the chart now always puts something in this namespace, and a predicate over
  the tenants would be a constant `true` dressed up as a question. It is dropped
  rather than extended. `tracebloc.nodeAgentsInUse` is deliberately NOT widened to
  cover this: it still gates DaemonSet-managing RBAC and the mirrored pull Secret,
  none of which an occupant with no pods needs, and making it constant would have
  granted auto-upgrade and image-refresh DaemonSet rights in a namespace with no
  DaemonSets (measured: 4 extra RBAC objects, backend#2400).

  The remaining two conditions are unchanged and both still bite — see above.
*/}}
{{- if and .Values.nodeAgents.namespace.create (ne .Values.nodeAgents.namespace.name .Release.Namespace) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.nodeAgents.namespace.name }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "tracebloc.labels" . | nindent 4 }}
    app: tracebloc-node-agents
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
{{- end }}
