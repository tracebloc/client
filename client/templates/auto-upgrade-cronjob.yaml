{{- if .Values.autoUpgrade.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tracebloc.autoUpgradeName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tracebloc.labels" . | nindent 4 }}
    app.kubernetes.io/component: auto-upgrade
data:
  auto-upgrade.sh: |
    #!/bin/sh
    # Self-upgrade loop. See client/values.yaml `autoUpgrade` for the
    # design + trust boundary discussion. JSON is parsed with awk (plus a `tr`
    # newline-strip) on purpose: the upstream alpine/helm image
    # ships without jq and we don't want to apk-add at runtime under a
    # runAsNonRoot pod — both `awk` and `tr` are busybox built-ins.
    set -eu

    # Settings naming: the chart sets each identity var under its canonical
    # TRACEBLOC_ name only. Read the canonical first; the legacy name is the
    # fallback for an env that still carries it, so a blank or absent canonical
    # leaves the legacy value -- and `set -u`'s refusal of an unset one -- alone.
    if [ -n "${TRACEBLOC_RELEASE_NAME:-}" ]; then RELEASE_NAME="$TRACEBLOC_RELEASE_NAME"; fi
    if [ -n "${TRACEBLOC_RELEASE_NAMESPACE:-}" ]; then RELEASE_NAMESPACE="$TRACEBLOC_RELEASE_NAMESPACE"; fi

    # Helm needs writable cache/config/data dirs. The Pod runs with
    # readOnlyRootFilesystem: true, so point Helm at the emptyDir mounted
    # at /tmp. TMPDIR is set only by a test that runs this script outside a pod.
    export HOME="${TMPDIR:-/tmp}"
    export HELM_CACHE_HOME="$HOME/.helm/cache"
    export HELM_CONFIG_HOME="$HOME/.helm/config"
    export HELM_DATA_HOME="$HOME/.helm/data"
    mkdir -p "$HELM_CACHE_HOME" "$HELM_CONFIG_HOME" "$HELM_DATA_HOME"

    log() { printf '[auto-upgrade] %s\n' "$*"; }

    # --- the failure event: install.upgrade.failed ---------------------------------
    # The one line of a failed tick that leaves: the event the egress declaration's
    # x-tracebloc-collector-events declares, in the Collector's grammar, with the
    # reason code and the chart versions in their declared shape and nothing else.
    # The EXIT trap sends UPGRADE_FAIL_REASON once for any non-zero exit, a `set -e`
    # abort included; a tick the deadline kills is the next tick's rolled_back.
    UPGRADE_FAIL_REASON=helm_error
    UPGRADE_FROM=""
    UPGRADE_TO=""
    upgrade_version() {  # VERSION: printed if it has the declared shape, else nothing
      UV="$1" awk 'BEGIN { v = ENVIRON["UV"]
        if (length(v) <= 64 && v ~ /^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/) print v }'
    }
    upgrade_failed() {  # REASON
      _uf_ts="$(date -u '+%Y-%m-%d %H:%M:%S' 2>/dev/null || true)"
      _uf_from="$(upgrade_version "$UPGRADE_FROM" 2>/dev/null || true)"
      _uf_to="$(upgrade_version "$UPGRADE_TO" 2>/dev/null || true)"
      printf '%s ERROR install.upgrade.failed service.name=installer tracebloc.component=upgrade severity=ERROR error.type=%s%s%s\n' \
        "$_uf_ts" "$1" "${_uf_from:+ tracebloc.upgrade.from_version=$_uf_from}" \
        "${_uf_to:+ tracebloc.upgrade.to_version=$_uf_to}" || true
    }
    upgrade_exit() {
      _ue_rc=$?
      trap - EXIT
      [ "$_ue_rc" -eq 0 ] || upgrade_failed "$UPGRADE_FAIL_REASON"
      exit "$_ue_rc"
    }
    trap upgrade_exit EXIT

    # Settings naming: the CronJob sets each of these under its canonical
    # TRACEBLOC_ name only. Read the canonical first; the legacy name is the
    # fallback for an env that still carries it, so a blank or absent canonical
    # leaves the legacy value -- and any default or `set -u` refusal below -- alone.
    # The chart source (REPO_URL / REPO_NAME / CHART_NAME) takes the spelling the
    # installer and the cli already give the same three facts
    # (install-client-helm.sh TRACEBLOC_HELM_REPO_URL / _NAME, TRACEBLOC_CHART_NAME),
    # not TRACEBLOC_<legacy>: one concept, one name.
    if [ -n "${TRACEBLOC_HELM_REPO_URL:-}" ]; then REPO_URL="$TRACEBLOC_HELM_REPO_URL"; fi
    if [ -n "${TRACEBLOC_HELM_REPO_NAME:-}" ]; then REPO_NAME="$TRACEBLOC_HELM_REPO_NAME"; fi
    if [ -n "${TRACEBLOC_CHART_NAME:-}" ]; then CHART_NAME="$TRACEBLOC_CHART_NAME"; fi
    if [ -n "${TRACEBLOC_UPGRADE_TIMEOUT:-}" ]; then UPGRADE_TIMEOUT="$TRACEBLOC_UPGRADE_TIMEOUT"; fi
    if [ -n "${TRACEBLOC_WEDGE_MIN_AGE_SECONDS:-}" ]; then WEDGE_MIN_AGE_SECONDS="$TRACEBLOC_WEDGE_MIN_AGE_SECONDS"; fi
    if [ -n "${TRACEBLOC_AUTO_UPGRADE_NAME:-}" ]; then AUTO_UPGRADE_NAME="$TRACEBLOC_AUTO_UPGRADE_NAME"; fi
    if [ -n "${TRACEBLOC_TRAINING_DEFER_ENABLED:-}" ]; then TRAINING_DEFER_ENABLED="$TRACEBLOC_TRAINING_DEFER_ENABLED"; fi
    if [ -n "${TRACEBLOC_TRAINING_DEFER_MAX:-}" ]; then TRAINING_DEFER_MAX="$TRACEBLOC_TRAINING_DEFER_MAX"; fi
    if [ -n "${TRACEBLOC_TRAINING_FINISHED_WINDOW_SECONDS:-}" ]; then TRAINING_FINISHED_WINDOW_SECONDS="$TRACEBLOC_TRAINING_FINISHED_WINDOW_SECONDS"; fi

    # The wait mode, read once for both `helm upgrade --atomic` calls below.
    # Helm 4 `--rollback-on-failure` (alias `--atomic`) switches the default wait
    # to the kstatus watcher; `--wait=legacy` keeps Helm 3's per-object readiness
    # checks. The watcher lists and watches every kind the release renders, and
    # on a GPU edge this ServiceAccount holds the kube-system Secret, Role and
    # RoleBinding by NAME only (auto-upgrade-rbac.yaml: no list or watch on them,
    # on purpose), so every such upgrade would fail its wait and roll back.
    # Helm 3's `--wait` is a boolean that refuses `=legacy`, and an operator may
    # pin a Helm 3 `autoUpgrade.image`, so only major 4 gets the flag. An
    # unreadable version passes nothing, which is what every tick passed before,
    # and says so.
    HELM_VERSION_SHORT="$(helm version --short 2>/dev/null || true)"
    HELM_WAIT_FLAG=""
    case "$HELM_VERSION_SHORT" in
      v4.*)
        HELM_WAIT_FLAG="--wait=legacy"
        log "helm $HELM_VERSION_SHORT: upgrading with --wait=legacy" ;;
      v[0-9]*)
        log "helm $HELM_VERSION_SHORT: upgrading without --wait=legacy" ;;
      *)
        log "WARNING: helm version unreadable ('$HELM_VERSION_SHORT'); upgrading without --wait=legacy" ;;
    esac

    # --- failed --atomic upgrade classification: begin ----------
    # EXIT CODES of this script, the whole interface a Job's status carries:
    #   0  nothing to do, upgraded, or a skip the log names (pending-* in flight,
    #      mid-uninstall, ahead of the index, an upgrade DEFERRED while the
    #      edge trains), or
    #      an abandoned wedge rolled back, with the upgrade deferred to the next
    #      tick (recovery and upgrade never share a tick)
    #   1  any other failure: the repo fetch, version resolution, a `helm upgrade`
    #      that failed and was rolled back (timeout or not), a wedge recovery that
    #      was refused (no deployed revision) or whose rollback failed, and set -e
    #      aborts
    #   3  a `helm upgrade` failed AND the release is not `deployed` afterwards:
    #      helm's own --atomic rollback failed, or the release reads failed /
    #      pending-* after it. Distinct from 1 because the edge is now left
    #      broken rather than on its old version, and telemetry counts it apart.
    #
    # Why the classification exists. An upgrade whose wait cannot finish inside
    # --timeout ("context deadline exceeded") is rolled back by --atomic and
    # retried by the next hourly tick, for ever, with nothing but helm's own
    # error to tell it from any other failure. Measured on a live edge: every
    # attempt for three days timed out because a Deployment never went Ready
    # (its pod could not log in to MySQL), and from 2026-10-02 the rollback
    # timed out on the same Deployment too, leaving the release `failed`. So on
    # a failure this names, in one line each: a TIMEOUT with the versions, the
    # timeout and what was not ready; a ROLLBACK FAILED with the status the
    # release was left in. It changes no flag and no timeout: the same argv
    # runs, only its output is read.
    #
    # Read from helm, not inferred: the last `Error:` line helm printed, and
    # `helm status` after the attempt. "an error occurred while rolling back the
    # release. original upgrade error: X" is helm's wording (3 and 4) for a
    # failed rollback; the timeout is judged on X alone, so a non-timeout upgrade
    # failure whose ROLLBACK timed out is not miscounted as an upgrade timeout.

    # What the release's resources table says is not ready, one comma-separated
    # line, at most 10 entries. Reads `helm status --show-resources` (Helm 3) or
    # plain `helm status` (Helm 4 lists resources by default and may refuse the
    # flag) on stdin: a `==> v1/<Kind>` heading, a NAME header, one row per
    # object. READY `a/b` with a != b, COMPLETIONS `a/b` likewise, or a DaemonSet
    # READY below DESIRED, is not ready; a STATUS column (pods) is appended. No
    # kubectl: the alpine/helm image has none, and helm reads only what the
    # release owns, through the Role it already upgrades with -- no new RBAC.
    not_ready_workloads() {
      awk '
        /^==> / { kind = $2; sub(/.*\//, "", kind); sub(/\(.*$/, "", kind); hdr = 0; next }
        kind == "" { next }
        /^NAME[ \t]/ {
          r = 0; d = 0; s = 0
          for (i = 1; i <= NF; i++) {
            if ($i == "READY" || $i == "COMPLETIONS") r = i
            if ($i == "DESIRED") d = i
            if ($i == "STATUS") s = i
          }
          hdr = 1; next
        }
        NF == 0 { kind = ""; hdr = 0; next }
        hdr && r {
          v = $r; item = ""
          if (d) { if (v + 0 < $d + 0) item = tolower(kind) "/" $1 " " v "/" $d " ready" }
          else if (split(v, a, "/") == 2 && a[1] != a[2]) item = tolower(kind) "/" $1 " " v " ready"
          if (item == "") next
          if (s) item = item " (" $s ")"
          n++
          if (n <= 10) { out = out sep item; sep = ", " }
        }
        END {
          if (n > 10) out = out ", +" (n - 10) " more"
          print out
        }'
    }

    # One `helm upgrade --atomic`, run as given ($3...), with its outcome read.
    # $1/$2 are the from/to chart versions the log names. Output still streams
    # (tee), so a Job killed mid-op keeps what helm printed. Returns 0 on
    # success; on failure prints the classification and EXITS (1 or 3).
    # Its files are unique per call: a tick run beside another on one host must
    # never read the other's output or exit code.
    atomic_upgrade() {
      _au_from="$1"; _au_to="$2"; shift 2
      _au_out="$(mktemp "${TMPDIR:-/tmp}/auto-upgrade-helm-out.XXXXXX")"
      _au_rcf="$(mktemp "${TMPDIR:-/tmp}/auto-upgrade-helm-rc.XXXXXX")"
      { "$@" 2>&1 && echo 0 >"$_au_rcf" || echo "$?" >"$_au_rcf"; } | tee "$_au_out"
      _au_rc="$(cat "$_au_rcf" 2>/dev/null || true)"
      rm -f "$_au_rcf"
      case "$_au_rc" in ''|*[!0-9]*) _au_rc=1 ;; esac
      [ "$_au_rc" -eq 0 ] && { rm -f "$_au_out"; return 0; }

      _au_err="$(grep '^Error: ' "$_au_out" 2>/dev/null | tail -n 1 || true)"
      [ -n "$_au_err" ] || _au_err="$(tail -n 1 "$_au_out" 2>/dev/null || true)"
      # The ORIGINAL upgrade error, which is what the timeout is judged on.
      # Helm 4 logs it on its own line before rolling back
      # (`level=WARN msg="upgrade failed" ... error="..."`); otherwise it is the
      # middle of helm's rollback-failure wording, "... original upgrade error:
      # <upgrade error>: release <name> failed: <rollback error>", so cut at the
      # last ": release <name> failed: ". A rollback error in any other shape
      # stays attached, and is read as part of the upgrade error.
      _au_rollback_err=no
      _au_orig="$_au_err"
      case "$_au_err" in
        *"an error occurred while rolling back the release"*)
          _au_rollback_err=yes
          _au_orig="${_au_err#*original upgrade error: }"
          _au_orig="${_au_orig%": release $RELEASE_NAME failed: "*}" ;;
      esac
      _au_warn="$(grep 'msg="upgrade failed"' "$_au_out" 2>/dev/null | tail -n 1 || true)"
      rm -f "$_au_out"
      case "$_au_warn" in
        *' error="'*) _au_orig="${_au_warn#* error=\"}"; _au_orig="${_au_orig%%\"*}" ;;
      esac
      _au_kind=other
      case "$_au_orig" in
        *"context deadline exceeded"*|*"timed out waiting for the condition"*) _au_kind=timeout ;;
      esac
      _au_status="$(helm status "$RELEASE_NAME" -n "$RELEASE_NAMESPACE" 2>/dev/null \
        | awk '/^STATUS:/ {print $2; exit}' || true)"
      if [ "$_au_rollback_err" = yes ]; then
        _au_rb=failed
      else
        case "$_au_status" in
          deployed) _au_rb=ok ;;
          failed|pending-*) _au_rb=failed ;;
          *) _au_rb=unknown ;;
        esac
      fi

      UPGRADE_FAIL_REASON=helm_error
      if [ "$_au_rb" = ok ]; then
        if [ "$_au_kind" = timeout ]; then UPGRADE_FAIL_REASON=timeout; else UPGRADE_FAIL_REASON=rolled_back; fi
      fi
      if [ "$_au_kind" = timeout ]; then
        _au_res="$( { helm status "$RELEASE_NAME" -n "$RELEASE_NAMESPACE" --show-resources 2>/dev/null \
          || helm status "$RELEASE_NAME" -n "$RELEASE_NAMESPACE" 2>/dev/null; } | not_ready_workloads || true)"
        log "ERROR: UPGRADE TIMEOUT $_au_from -> $_au_to: helm's wait did not see the release ready within --timeout $UPGRADE_TIMEOUT; rollback: $_au_rb (release status: ${_au_status:-unreadable}); not ready: ${_au_res:-none named by helm status, check: kubectl -n $RELEASE_NAMESPACE get pods}"
      fi
      case "$_au_rb" in
        failed)
          log "ERROR: ROLLBACK FAILED after the $_au_kind failure of $_au_from -> $_au_to: release '$RELEASE_NAME' is '${_au_status:-unreadable}', not 'deployed'; it is left broken, not on $_au_from. Inspect: helm history $RELEASE_NAME -n $RELEASE_NAMESPACE"
          exit 3 ;;
        unknown)
          log "ERROR: upgrade $_au_from -> $_au_to failed and the release status cannot be read afterwards ('${_au_status}'): cannot tell whether helm's rollback left it deployed" ;;
      esac
      exit 1
    }
    # --- failed --atomic upgrade classification: end -----------------------------

    # minimum age (seconds) a release must have sat in a pending-* state
    # before we treat it as an ABANDONED wedge (safe to roll back) rather than an
    # upgrade that is currently IN FLIGHT (must be left alone). Injected from
    # autoUpgrade.pendingWedgeMinAge; the `:-` fallback keeps a standalone run
    # (e.g. the discrimination test) working when the env var is absent.
    WEDGE_MIN_AGE_SECONDS="${WEDGE_MIN_AGE_SECONDS:-2700}"

    # seconds the release has been in its current (pending) revision, i.e.
    # now - info.last_deployed. Echoes the age, or nothing if it can't be read.
    # Takes the `helm status -o json` body as $1 so the caller reads status once.
    # awk-based, per this script's header (the image has no jq): it lifts the
    # RFC3339 last_deployed out of the JSON and computes the epoch itself, since
    # busybox `date` cannot parse an RFC3339 zone offset. The days-since-epoch
    # math is Howard Hinnant's civil→days algorithm; the zone offset is applied by
    # hand. now comes from `date -u +%s`, which every date agrees on.
    #
    # `tr -d '\n'` FIRST: make the parse independent of helm's JSON
    # FORMATTING. The awk body below runs once per input line and `exit`s on the
    # first line that lacks `last_deployed`, so it only works on a body where the
    # key sits on the same line the scan starts — fine for the single-line output
    # helm actually emits today (`EncodeJSON` is `json.NewEncoder(out);
    # enc.Encode(obj)` with no `SetIndent`, i.e. compact JSON, one line — in
    # 3.16.4 and in 4.2.3 alike; the wedge driver runs a captured 4.2.x body), but it
    # would return EMPTY on any multi-line body: a bare `{` first line, a future
    # helm that indents, or a differently-built image. Collapsing to one line
    # first removes that dependence entirely. NOTE: a review claim
    # that this image pretty-prints did NOT reproduce — the gate was never inert
    # on real fleets; this is defensive hardening, not a live fix. Fail-closed is
    # unchanged: an unreadable/empty body still yields no age (→ skip).
    #
    # the shape regex below proves only that the fields are DIGITS
    # in the right slots — NOT that they form a real instant. So the field ranges
    # are validated too, before the civil math is trusted; see the range gate
    # inside the awk body.
    pending_age_seconds() {
      _now="$(date -u +%s 2>/dev/null || true)"
      [ -n "$_now" ] || return 0
      printf '%s' "$1" | tr -d '\n' | awk -v now="$_now" '{
        if (match($0, /"last_deployed":[ ]*"[^"]*"/) == 0) exit
        ts = substr($0, RSTART, RLENGTH)
        sub(/^"last_deployed":[ ]*"/, "", ts); sub(/"$/, "", ts)
        if (match(ts, /^[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]T[0-9][0-9]:[0-9][0-9]:[0-9][0-9]/) == 0) exit
        y = substr(ts, 1, 4) + 0; mo = substr(ts, 6, 2) + 0; d = substr(ts, 9, 2) + 0
        hh = substr(ts, 12, 2) + 0; mi = substr(ts, 15, 2) + 0; ss = substr(ts, 18, 2) + 0
        # the regex above matched the SHAPE, not the field RANGES —
        # `2026-00-01`, `2026-08-00`, or `...T40:99:99` all pass it, then feed the
        # civil→days math a nonsensical date. A month/day that rolls the instant
        # into the deep past yields a LARGE POSITIVE age; the downstream sanitiser
        # only rejects empty/non-numeric/NEGATIVE, so that bogus-but-positive age
        # clears WEDGE_MIN_AGE_SECONDS and rolls back a release that was never
        # wedged. Reject any out-of-range field so a non-instant yields NO age
        # (→ "cannot tell" → skip), never a fabricated one. Bounds are the RFC3339
        # ranges (ss<=60 admits a leap second); day is the coarse 1–31 the issue
        # specifies — enough to kill the deep-past garbage, no per-month calendar.
        if (mo < 1 || mo > 12 || d < 1 || d > 31 || hh > 23 || mi > 59 || ss > 60) exit
        # Domain floor (fail-safe): the year is only shape-checked
        # (4 digits), so a valid-RANGE-but-impossible year — `0000`, `1970`,
        # `1999` — still computes a huge POSITIVE age and would force a rollback,
        # the same failure via the one field the RFC3339 ranges above cannot
        # bound. No real deployment predates the project, so treat a pre-2000
        # stamp as "cannot tell" (skip). Deliberately the SAFE side: were a
        # release somehow genuinely this old we would skip its rollback (never
        # clobber), never the reverse. In-RANGE corruption to another plausible
        # date cannot be told from the stamp alone and is out of scope.
        if (y < 2000) exit
        off = 0; rest = substr(ts, 20)
        if (rest !~ /[Zz]$/ && match(rest, /[+-][0-9][0-9]:[0-9][0-9]$/)) {
          o = substr(rest, RSTART, RLENGTH)
          # Same class as the date fields: the offset regex is
          # SHAPE-only too, so `+40:00` / `+99:99` pass and shift the epoch by up
          # to ~4 days — enough to age a genuinely RECENT (in-flight) upgrade past
          # WEDGE_MIN_AGE_SECONDS and roll it back. Bound it to a real RFC3339
          # numoffset (hour 0–23, minute 0–59); anything else is not an instant.
          oh = substr(o, 2, 2) + 0; om = substr(o, 5, 2) + 0
          if (oh > 23 || om > 59) exit
          sign = (substr(o, 1, 1) == "-") ? -1 : 1
          off = sign * (oh * 3600 + om * 60)
        }
        if (mo <= 2) y = y - 1
        era = int((y >= 0 ? y : y - 399) / 400)
        yoe = y - era * 400
        doy = int((153 * (mo + (mo > 2 ? -3 : 9)) + 2) / 5) + d - 1
        doe = yoe * 365 + int(yoe / 4) - int(yoe / 100) + doy
        days = era * 146097 + doe - 719468
        print now - (days * 86400 + hh * 3600 + mi * 60 + ss - off)
      }'
    }

    # Parses the `version:` field out of `helm search repo ... -o yaml` output on
    # stdin. Search results are newest-first, so the first hit is the latest.
    parse_repo_version() {
      awk '/^[[:space:]]*version:/ {print $2; exit}'
    }

    # --- the chart's signature check: begin ---------------------------------------
    # Who may sign the chart: install-client-helm.sh's TB_CHART_SIGNER_RE and
    # TB_CHART_SIGNER_ISSUER, which auto-upgrade-chart-verify.sh holds these to.
    CHART_SIGNER_RE='^https://github\.com/tracebloc/(client|client-dev)/\.github/workflows/release-helm-chart\.yaml@refs/tags/v.*'
    CHART_SIGNER_ISSUER='https://token.actions.githubusercontent.com'
    # The init container's copy of cosign. TRACEBLOC_COSIGN is set only by a test
    # that runs this script outside a pod.
    COSIGN="${TRACEBLOC_COSIGN:-/verifier/cosign}"
    CHECKED_CHART=""

    # The first URL for CHART_NAME at version $1 in the index `helm repo update`
    # cached, the one `helm search repo` read, so the version and its URL agree.
    chart_url() {
      awk -v chart="$CHART_NAME" -v want="$1" '
        function keep() {
          if (name == chart && ver == want && url != "" && found == "") found = url
          ver = ""; url = ""; key = ""
        }
        /^entries:/ { inent = 1; next }
        inent && /^[^ ]/ { keep(); inent = 0 }
        !inent { next }
        /^  [^ -][^:]*:/ { keep(); name = $1; sub(/:$/, "", name); next }
        /^  - / { keep(); sub(/^  - /, "    ") }
        /^    [A-Za-z]+:/ {
          key = $1; sub(/:$/, "", key)
          if (key == "version") { ver = $2; gsub(/[\042\047]/, "", ver) }
          next
        }
        /^    - / && key == "urls" && url == "" { url = $2; gsub(/[\042\047]/, "", url) }
        END { keep(); if (found != "") print found }
      ' "$HELM_CACHE_HOME/repository/${REPO_NAME}-index.yaml"
    }

    # fetch URL DEST: 0 on a 200 curl delivered whole; the HTTP status in
    # FETCH_STATUS (000: no answer). https only, redirects included.
    fetch() {
      _f_rc=0
      FETCH_STATUS="$(curl -sS -L --proto '=https' --proto-redir '=https' --max-time 120 \
        -o "$2" -w '%{http_code}' "$1")" || _f_rc=$?
      [ "$_f_rc" -eq 0 ] || FETCH_STATUS=000
      [ "$FETCH_STATUS" = 200 ]
    }

    # VERSION WHY: the tick ends here, before anything changes.
    chart_refused() {
      log "ERROR: This release isn't signed by tracebloc, so nothing was changed: $2. Staying on $CURRENT; $1 is not installed."
      UPGRADE_FAIL_REASON=signature_refused
      exit 1
    }

    # chart_check VERSION -- CHART_NAME at VERSION, downloaded and checked against
    # the Sigstore bundle its release attaches beside it (<chart url>.bundle),
    # signed as CHART_SIGNER_RE. The trust keys are the ones this chart ships,
    # beside this script, so cosign needs no network. Leaves the checked file in
    # CHECKED_CHART, which the upgrade installs.
    chart_check() {
      _cc_url="$(chart_url "$1")" || _cc_url=""
      [ -n "$_cc_url" ] || chart_refused "$1" "the index at $REPO_URL lists no URL for ${CHART_NAME} $1"
      case "$_cc_url" in *://*) ;; *) _cc_url="${REPO_URL%/}/${_cc_url#/}" ;; esac
      case "$_cc_url" in
        https://*) ;;
        *) chart_refused "$1" "${CHART_NAME} $1 is listed at $_cc_url, not an https URL" ;;
      esac
      [ -x "$COSIGN" ] || { log "ERROR: no cosign at $COSIGN to check the chart with; not upgrading this tick"; exit 1; }
      _cc_dir="$(mktemp -d "${TMPDIR:-/tmp}/auto-upgrade-chart.XXXXXX")"
      _cc_tgz="$_cc_dir/${CHART_NAME}-$1.tgz"
      if ! fetch "$_cc_url" "$_cc_tgz"; then
        log "ERROR: could not download $_cc_url (status $FETCH_STATUS); not upgrading this tick"
        UPGRADE_FAIL_REASON=download_failed
        exit 1
      fi
      if ! fetch "${_cc_url}.bundle" "${_cc_tgz}.bundle"; then
        [ "$FETCH_STATUS" != 404 ] || chart_refused "$1" "its release attaches no ${_cc_url##*/}.bundle (404)"
        log "ERROR: could not download ${_cc_url}.bundle (status $FETCH_STATUS); not upgrading this tick"
        UPGRADE_FAIL_REASON=download_failed
        exit 1
      fi
      _cc_keys="$(cd "$(dirname "$0")" && pwd)"
      if ! env TUF_ROOT="$_cc_dir/no-tuf" \
          SIGSTORE_ROOT_FILE="$_cc_keys/sigstore-fulcio.crt" \
          SIGSTORE_REKOR_PUBLIC_KEY="$_cc_keys/sigstore-rekor.pub" \
          SIGSTORE_CT_LOG_PUBLIC_KEY_FILE="$_cc_keys/sigstore-ctfe.pub" \
          "$COSIGN" verify-blob --bundle "${_cc_tgz}.bundle" \
            --certificate-identity-regexp "$CHART_SIGNER_RE" \
            --certificate-oidc-issuer "$CHART_SIGNER_ISSUER" \
            --offline "$_cc_tgz"; then
        chart_refused "$1" "${_cc_url##*/} does not verify against ${_cc_url##*/}.bundle as $CHART_SIGNER_RE"
      fi
      log "chart check: ${_cc_url##*/} is signed by tracebloc's release workflow; upgrading from that file"
      CHECKED_CHART="$_cc_tgz"
    }
    # --- the chart's signature check: end -----------------------------------------

    # The Kubernetes API for the training gate below. The image has no kubectl, so
    # this is curl (in every alpine/helm tag the chart has pinned) with the mounted
    # ServiceAccount. The token reaches curl on stdin (-K -), never its argv.
    # TRACEBLOC_SA_DIR is set only by a test that runs this script outside a pod.
    TRACEBLOC_SA_DIR="${TRACEBLOC_SA_DIR:-/var/run/secrets/kubernetes.io/serviceaccount}"
    kube_api() {  # METHOD PATH [MERGE_PATCH_BODY]
      command -v curl >/dev/null 2>&1 || { echo "this image has no curl" >&2; return 1; }
      [ -n "${KUBERNETES_SERVICE_HOST:-}" ] || { echo "KUBERNETES_SERVICE_HOST is unset" >&2; return 1; }
      _ka_tok="$(cat "$TRACEBLOC_SA_DIR/token" 2>/dev/null)" && [ -n "$_ka_tok" ] \
        || { echo "cannot read the ServiceAccount token at $TRACEBLOC_SA_DIR/token" >&2; return 1; }
      _ka_host="$KUBERNETES_SERVICE_HOST"
      case "$_ka_host" in *:*) _ka_host="[$_ka_host]" ;; esac
      _ka_url="https://${_ka_host}:${KUBERNETES_SERVICE_PORT:-443}$2"
      if [ -n "${3:-}" ]; then
        printf 'header = "Authorization: Bearer %s"\n' "$_ka_tok" | curl -sS -f -K - --max-time 15 \
          --noproxy "$KUBERNETES_SERVICE_HOST" --cacert "$TRACEBLOC_SA_DIR/ca.crt" -X "$1" \
          -H "Content-Type: application/merge-patch+json" --data "$3" "$_ka_url"
      else
        printf 'header = "Authorization: Bearer %s"\n' "$_ka_tok" | curl -sS -f -K - --max-time 15 \
          --noproxy "$KUBERNETES_SERVICE_HOST" --cacert "$TRACEBLOC_SA_DIR/ca.crt" -X "$1" "$_ka_url"
      fi
    }
    kube_raw_get() { kube_api GET "$1"; }

    # The deferral count lives on this CronJob, so it survives from tick to tick
    # and goes with the release.
    UPGRADE_DEFER_KEY="tracebloc.io/upgrade-training-deferrals"
    upgrade_cronjob_path() {
      [ -n "${AUTO_UPGRADE_NAME:-}" ] || { echo "AUTO_UPGRADE_NAME is unset" >&2; return 1; }
      printf '/apis/batch/v1/namespaces/%s/cronjobs/%s' "$RELEASE_NAMESPACE" "$AUTO_UPGRADE_NAME"
    }
    gate_streak_read() {
      _gs_path="$(upgrade_cronjob_path)" || return 1
      _gs_body="$(kube_api GET "$_gs_path")" && [ -n "$_gs_body" ] || return 1
      printf '%s' "$_gs_body" | tr -d '\n' | awk -v key="\"$UPGRADE_DEFER_KEY\":" '
        $0 !~ /"kind":[ ]*"CronJob"/ { exit 1 }
        {
          i = index($0, key); if (i == 0) exit
          s = substr($0, i + length(key))
          if (match(s, /^[ ]*"[^"]*"/)) { v = substr(s, RSTART, RLENGTH); gsub(/[ "]/, "", v); print v }
        }'
    }
    gate_streak_write() {
      _gs_path="$(upgrade_cronjob_path)" || return 1
      kube_api PATCH "$_gs_path" "{\"metadata\":{\"annotations\":{\"$UPGRADE_DEFER_KEY\":\"$1\"}}}" >/dev/null
    }
    gate_streak_clear() {
      _gs_path="$(upgrade_cronjob_path)" || return 1
      kube_api PATCH "$_gs_path" "{\"metadata\":{\"annotations\":{\"$UPGRADE_DEFER_KEY\":null}}}" >/dev/null
    }
    {{- include "tracebloc.trainingGateSh" . | nindent 4 }}

    log "release=$RELEASE_NAME namespace=$RELEASE_NAMESPACE repo=$REPO_URL"

    UPGRADE_FAIL_REASON=download_failed
    helm repo add "$REPO_NAME" "$REPO_URL" >/dev/null
    helm repo update "$REPO_NAME" >/dev/null
    UPGRADE_FAIL_REASON=helm_error

    # auto-recover from an interrupted upgrade BEFORE attempting another
    # one. If a previous tick's `helm upgrade` was killed mid-operation — a
    # node-level OOM kill under memory pressure (this pod is now
    # Guaranteed QoS, oom_score_adj -997, so the kernel OOM-killer picks it last,
    # but Guaranteed is not unkillable under extreme pressure), node reboot, or a
    # cluster restart inside the upgrade window — the release is left in a
    # pending-upgrade state, and every
    # subsequent hourly tick then fails with "another operation is in progress"
    # forever: auto-upgrade (the security-fix delivery path) is silently dead
    # until a human runs `helm rollback`. Detect that wedge and roll back to the
    # last deployed revision; the tick then ENDS, and the next one upgrades from a
    # `deployed` release (see the deadline below). Parsed from the STATUS:
    # line jq-free — the alpine/helm image ships without jq. (pending-install
    # can't occur here: this CronJob is part of the release it upgrades, so the
    # release must have deployed at least once for this script to run.)
    # Helm 4 fetches every resource of the release for `helm status` (Helm 3 only
    # did with --show-resources); a resource it cannot read is logged, not an
    # error, and STATUS: still prints before the RESOURCES table. The line is
    # plain text here: helm colours it only on a terminal, and this is a pipe.
    # the highest revision `helm history -o json` reports as
    # `deployed`, or nothing. jq-free like the rest of this script: collapse the
    # body to one line, then split it into records on `{"revision":`, the key
    # helm writes first in every history entry. A description that quotes that
    # text, or `"status":"deployed"`, carries it backslash-escaped, so it can
    # neither start a record nor match the status test. An unreadable body, or
    # one with no deployed entry, prints nothing: the caller refuses. A FAILED
    # read never reaches here: the caller checks helm's exit
    # status first, so "could not read the history" and "the history names no
    # deployed revision" are two different log lines.
    last_deployed_revision() {
      printf '%s' "$1" | tr -d '\n' | awk '{
        n = split($0, recs, /\{[ ]*"revision":[ ]*/)
        best = ""
        for (i = 2; i <= n; i++) {
          r = recs[i]
          if (match(r, /^[0-9][0-9]*/) == 0) continue
          rev = substr(r, 1, RLENGTH) + 0
          if (r ~ /"status":[ ]*"deployed"/ && (best == "" || rev > best)) best = rev
        }
        if (best != "") print best
      }'
    }

    # The chart version of revision REV in the same history body, split into
    # records the same way: the `"chart":"<CHART_NAME>-<version>"` it names, or
    # nothing.
    revision_chart_version() {  # HISTORY_JSON REV
      printf '%s' "$1" | tr -d '\n' | awk -v rev="$2" -v chart="$CHART_NAME" '{
        n = split($0, recs, /\{[ ]*"revision":[ ]*/)
        for (i = 2; i <= n; i++) {
          r = recs[i]
          if (match(r, /^[0-9][0-9]*/) == 0 || rev == "" || substr(r, 1, RLENGTH) + 0 != rev + 0) continue
          if (match(r, /"chart":[ ]*"[^"]*"/) == 0) exit
          c = substr(r, RSTART, RLENGTH); sub(/^"chart":[ ]*"/, "", c); sub(/"$/, "", c)
          if (index(c, chart "-") == 1) print substr(c, length(chart) + 2)
          exit
        }
      }'
    }

    STATUS="$(helm status "$RELEASE_NAME" -n "$RELEASE_NAMESPACE" 2>/dev/null \
      | awk '/^STATUS:/ {print $2; exit}')"
    case "$STATUS" in
      pending-upgrade|pending-rollback)
        # `pending-upgrade` is NOT proof of a wedge. It is ALSO the state
        # of an upgrade that is CURRENTLY RUNNING — an operator's manual `helm
        # upgrade` (e.g. flipping a feature gate), or a slow
        # one of ours. Rolling that back silently reverts the in-flight upgrade
        # and discards the operator's new values, while the operator — seeing
        # `deployed` — proceeds as if it stuck. The two are indistinguishable by
        # status alone; the discriminator is AGE. A real wedge was left by an
        # earlier tick and is at least ~an hour old by now; an in-flight or
        # just-attempted upgrade is seconds/minutes old. Only reclaim a release
        # that has sat here past the threshold. Read the release JSON once (for
        # both the age and the discarded revision number).
        INFO_JSON="$(helm status "$RELEASE_NAME" -n "$RELEASE_NAMESPACE" -o json 2>/dev/null || true)"
        AGE="$(pending_age_seconds "$INFO_JSON")"
        # Guard: only an unsigned/negative integer is a usable age. A negative
        # age (node clock skew — the pending revision looks "in the future")
        # falls through as "too recent", which is the safe side: never clobber.
        case "$AGE" in ''|*[!0-9-]*) AGE="" ;; esac
        if [ -n "$AGE" ] && [ "$AGE" -ge "$WEDGE_MIN_AGE_SECONDS" ]; then
          # awk-only; `[0-9][0-9]*` (>=1 digit, no quote) so this matches only the
          # bare-number top-level release "version":N, never a quoted
          # chart-metadata "version":"1.2.3" that may also appear in the JSON.
          # `[ ]*` after the colon tolerates an optional space so
          # the match is independent of formatting: helm's real output is compact
          # (`"version":N`, no space) and `[ ]*` matches zero spaces, so this is a
          # strict superset of the previous regex — no behaviour change on the
          # real image, but it also survives a spaced `"version": N` from a
          # future indented body. Same defensive hardening as the `tr` above.
          PENDING_REV="$(printf '%s' "$INFO_JSON" | awk 'match($0, /"version":[ ]*[0-9][0-9]*/) {
            v = substr($0, RSTART, RLENGTH); sub(/"version":[ ]*/, "", v); print v; exit }')"
          # the target is the last revision whose status is
          # `deployed`, read from `helm history` -- never helm's revision-less
          # default, which is "current - 1". In a pending-rollback wedge (a Job
          # killed while `--atomic` was undoing a failed upgrade) history reads
          # N deployed, N+1 failed, N+2 pending-rollback, so "current - 1" is the
          # FAILED upgrade: the recovery re-applied the new chart, unwaited, and
          # called it a rollback. No deployed revision means there is nothing
          # known-good to return to, so refuse rather than guess.
          # a failed read (RBAC, an API timeout) must not look
          # like an empty history, or the refusal below names the wrong fact and
          # sends the operator to the history instead of the CronJob's access.
          # stderr goes to a file so a warning helm prints there on success can
          # never land in the JSON body; unique per tick, as atomic_upgrade's are.
          _hist_err="$(mktemp "${TMPDIR:-/tmp}/auto-upgrade-history-err.XXXXXX")"
          _hist_rc=0
          HISTORY_JSON="$(helm history "$RELEASE_NAME" -n "$RELEASE_NAMESPACE" -o json 2>"$_hist_err")" \
            || _hist_rc=$?
          _hist_msg="$(tail -n 1 "$_hist_err" 2>/dev/null || true)"
          rm -f "$_hist_err"
          if [ "$_hist_rc" -ne 0 ]; then
            log "ERROR: release '$RELEASE_NAME' is stuck in '$STATUS', but its history could not"
            log "be read (helm history exited $_hist_rc: $_hist_msg)."
            log "This is a failed read, not an empty history. Refusing the rollback: without the"
            log "history there is no known-good revision to return to. Check that"
            log "this CronJob can read the release, then recover by hand:"
            log "  helm history $RELEASE_NAME -n $RELEASE_NAMESPACE"
            log "  helm rollback $RELEASE_NAME <revision> -n $RELEASE_NAMESPACE --wait"
            exit 1
          fi
          TARGET_REV="$(last_deployed_revision "$HISTORY_JSON")"
          if [ -z "$TARGET_REV" ]; then
            log "ERROR: release '$RELEASE_NAME' is stuck in '$STATUS' and its history names no"
            log "'deployed' revision to return to. Refusing the rollback: a revision-less one"
            log "would land on whatever revision precedes the wedge, which may be the failed"
            log "upgrade itself. Recover by hand: read the history, then roll"
            log "back to the last revision that worked:"
            log "  helm history $RELEASE_NAME -n $RELEASE_NAMESPACE"
            log "  helm rollback $RELEASE_NAME <revision> -n $RELEASE_NAMESPACE --wait"
            exit 1
          fi
          # The killed upgrade's versions, for the event: the revision it goes back
          # to, and a pending-upgrade revision's own chart. A pending-rollback
          # revision carries the old chart, so it names no new one.
          UPGRADE_FROM="$(revision_chart_version "$HISTORY_JSON" "$TARGET_REV" || true)"
          if [ "$STATUS" = pending-upgrade ]; then
            UPGRADE_TO="$(revision_chart_version "$HISTORY_JSON" "${PENDING_REV:-}" || true)"
          fi
          # Surface it: the rollback discards the pending revision's
          # values. Log it loud and actionable — `restartPolicy: Never`
          # keeps this Pod's log readable so an operator can see
          # what was undone and recover the values.
          log "=========================== auto-upgrade WARNING ==========================="
          log "release '$RELEASE_NAME' has been stuck in '$STATUS' for ${AGE}s (>= threshold"
          log "${WEDGE_MIN_AGE_SECONDS}s): a previous 'helm upgrade' is presumed killed"
          log "mid-operation and ABANDONED. Rolling back to the last deployed revision"
          log "(revision $TARGET_REV) so auto-upgrade can proceed (#554). This DISCARDS the values from the"
          log "interrupted upgrade${PENDING_REV:+ (revision $PENDING_REV)}. If that upgrade was intentional,"
          log "recover its values BEFORE the next tick re-applies chart defaults:"
          log "  helm history $RELEASE_NAME -n $RELEASE_NAMESPACE"
          log "  helm get values $RELEASE_NAME -n $RELEASE_NAMESPACE${PENDING_REV:+ --revision $PENDING_REV}"
          log "============================================================================"
          # Wait on it: the rollback is this tick's only readiness
          # check on the revision it restores. The wait mode is the upgrade's
          # (--wait=legacy on Helm 4, for the GPU edge's name-only RBAC) and
          # Helm 3's boolean --wait on any other readable major; an unreadable
          # version passes no --wait, the same choice the upgrade makes, said above.
          ROLLBACK_WAIT_FLAG="$HELM_WAIT_FLAG"
          case "$HELM_VERSION_SHORT" in
            v[0-9]*) [ -n "$ROLLBACK_WAIT_FLAG" ] || ROLLBACK_WAIT_FLAG="--wait" ;;
          esac
          if ! helm rollback "$RELEASE_NAME" "$TARGET_REV" -n "$RELEASE_NAMESPACE" \
              ${ROLLBACK_WAIT_FLAG:+"$ROLLBACK_WAIT_FLAG"} \
              --timeout "$UPGRADE_TIMEOUT"; then
            log "ERROR: rollback of '$RELEASE_NAME' to revision $TARGET_REV failed; not upgrading this tick"
            exit 1
          fi
          # The tick ENDS here. The rollback just waited up to
          # $UPGRADE_TIMEOUT, and an `--atomic` upgrade can wait that twice more,
          # which is past the Job's activeDeadlineSeconds (sized for ONE
          # `--atomic`, below): killed mid-op, the release would be wedged again.
          # The next hourly tick finds it `deployed` and upgrades as usual.
          log "rollback to revision $TARGET_REV complete; the upgrade is deferred to the next tick"
          upgrade_failed rolled_back
          exit 0
        else
          # Recent (or indeterminate age): far more likely an upgrade in progress
          # than an abandoned wedge. Do NOT touch it — skip this tick cleanly (we
          # cannot `helm upgrade` over a pending operation anyway). The next tick
          # re-evaluates: by then the upgrade has either completed (STATUS:
          # deployed → normal upgrade path) or aged past the threshold (→ handled
          # above as a genuine wedge).
          log "release is '$STATUS' but only ${AGE:-an indeterminate number of} seconds old (< threshold ${WEDGE_MIN_AGE_SECONDS}s): an upgrade is most likely in progress. NOT rolling back — skipping this tick so an in-flight upgrade is never clobbered."
          exit 0
        fi
        ;;
      failed)
        # a release left `failed` by an earlier upgrade, e.g. a tick whose
        # rollback failed (exit 3). Not a wedge -- helm upgrades over `failed`
        # -- so the tick proceeds, but it says so, so the state is never
        # readable only from `helm status`.
        log "WARNING: release '$RELEASE_NAME' is 'failed' before this tick (an earlier upgrade or its rollback failed; see helm history $RELEASE_NAME -n $RELEASE_NAMESPACE); attempting the upgrade over it"
        ;;
      uninstalling)
        # A killed `helm uninstall` leaves this state. We can't clear it here — the
        # CronJob is part of the release, so completing the uninstall would delete
        # itself — but skip cleanly rather than fall through to a `helm upgrade`
        # that fails every tick with an opaque "another operation is in progress".
        log "release is mid-uninstall ('uninstalling'); skipping this tick until it settles (run 'helm uninstall $RELEASE_NAME -n $RELEASE_NAMESPACE' to finish it)"
        exit 0
        ;;
    esac

    # Latest published version.
    LATEST="$(helm search repo "${REPO_NAME}/${CHART_NAME}" -o yaml | parse_repo_version)"

    # Currently deployed chart version. `helm list -o yaml` emits
    # `chart: client-<version>` for the matching release.
    CURRENT_CHART="$(helm list -n "$RELEASE_NAMESPACE" \
      --filter "^${RELEASE_NAME}\$" -o yaml \
      | awk '/^[[:space:]]*chart:/ {print $2; exit}')"
    CURRENT="${CURRENT_CHART#${CHART_NAME}-}"

    if [ -z "$LATEST" ]; then
      log "ERROR: could not resolve latest chart version from $REPO_URL"
      exit 1
    fi
    if [ -z "$CURRENT" ] || [ "$CURRENT" = "$CURRENT_CHART" ]; then
      log "ERROR: could not parse deployed chart version (got '$CURRENT_CHART')"
      exit 1
    fi

    log "current=$CURRENT latest=$LATEST"
    UPGRADE_FROM="$CURRENT"
    UPGRADE_TO="$LATEST"

    if [ "$LATEST" = "$CURRENT" ]; then
      log "already at latest; nothing to upgrade"
      exit 0
    fi

    # Semver-aware compare via `sort -V` so 1.10.0 > 1.9.0.
    NEWER="$(printf '%s\n%s\n' "$CURRENT" "$LATEST" | sort -V | tail -n 1)"
    if [ "$NEWER" != "$LATEST" ]; then
      log "deployed version is ahead of repo (current=$CURRENT > latest=$LATEST); skipping the upgrade"
      exit 0
    fi

    # Only a chart tracebloc's release signed is a candidate at all, so the check
    # runs before the training gate counts a deferral for it.
    chart_check "$LATEST"

    # An upgrade replaces the jobs-manager pod, so it waits while the edge trains
    # (tracebloc.trainingGateSh); a deferred upgrade ends the tick with exit 0.
    training_gate "the upgrade $CURRENT -> $LATEST" autoUpgrade.deferWhileTraining || exit 0

    log "upgrading $CURRENT -> $LATEST"
    # --reset-then-reuse-values (helm 3.14+ and 4) is critical here: --reuse-values
    # alone re-uses the LAST RELEASE'S COMPUTED VALUES, so any new keys added
    # to values.yaml in the upgraded chart (e.g. a future autoUpgrade.foo
    # default) would silently fail to render with nil-pointer template errors
    # — verified on a dev-cluster 1.1.0 -> 1.3.0 dry-run.
    # --reset-then-reuse-values resets to the new chart's defaults first, then
    # layers the customer's user-supplied values on top, so operator overrides
    # (clientId, dockerRegistry creds, autoUpgrade.enabled=false, etc.) are
    # preserved while new defaults flow through.
    # --atomic (implies --wait): if the upgrade fails gracefully — bad manifest,
    # a pod that never goes ready within --timeout — helm rolls the release back
    # to the prior working revision instead of leaving it broken or pending. It
    # cannot undo an abrupt SIGKILL (the helm process is gone before it can roll
    # back); that residual pending-upgrade is caught by the recovery step above
    # on the next tick. --cleanup-on-fail removes any new resources the failed
    # attempt created so the rollback is clean.
    # --atomic STAYS, under Helm 4 too. Helm 4 renamed it --rollback-on-failure and
    # binds the old name to the SAME flag (deprecated: it works, and helm prints
    # one warning line). Helm 3 has no --rollback-on-failure, so the new name
    # would stop every tick on an edge whose operator pinned their own Helm 3
    # `autoUpgrade.image` (own tag, or own digest, which is always honoured).
    # Under Helm 4 it also changes the WAIT: with no explicit `--wait` it moves
    # helm's default wait to the kstatus watcher, which this ServiceAccount cannot
    # satisfy on a GPU edge. So a Helm 4 run passes `--wait=legacy` next to it
    # (HELM_WAIT_FLAG, read at the top), and the rollback on failure uses the same
    # wait. Re-check the name at the next helm MAJOR, and `--wait=legacy` whenever
    # the pinned helm image moves: a helm that no longer accepts it fails the tick
    # loudly rather than silently changing the wait.
    # No --server-side: Helm 4's `auto` applies with the method the release's
    # last revision recorded. A revision the Helm 3 image wrote records none, so
    # those edges stay client-side (3-way merge); see docs/MIGRATIONS.md.
    # Through atomic_upgrade: same argv, its failure classified. The chart is the
    # file chart_check verified, never a second download.
    atomic_upgrade "$CURRENT" "$LATEST" helm upgrade "$RELEASE_NAME" "$CHECKED_CHART" \
      --namespace "$RELEASE_NAMESPACE" \
      --reset-then-reuse-values \
      --atomic \
      ${HELM_WAIT_FLAG:+"$HELM_WAIT_FLAG"} \
      --cleanup-on-fail \
      --timeout "$UPGRADE_TIMEOUT"
    log "upgrade complete: $CURRENT -> $LATEST (signature checked)"
  {{- /* Sigstore's trust keys for chart_check, beside the script (autoUpgrade.cosign). */}}
  {{- range $key, $file := dict "sigstore-fulcio.crt" "files/sigstore/fulcio.crt" "sigstore-rekor.pub" "files/sigstore/rekor.pub" "sigstore-ctfe.pub" "files/sigstore/ctfe.pub" }}
  {{ $key }}: |
    {{- $.Files.Get $file | required (printf "the chart carries no %s, a Sigstore trust key of the auto-upgrade's chart check" $file) | trim | nindent 4 }}
  {{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "tracebloc.autoUpgradeName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tracebloc.labels" . | nindent 4 }}
    app.kubernetes.io/component: auto-upgrade
spec:
  schedule: {{ .Values.autoUpgrade.schedule | quote }}
  suspend: {{ .Values.autoUpgrade.suspend }}
  # Forbid: never run two upgrade attempts at once. A long upgrade that
  # crosses the next scheduled tick should not stack a second `helm upgrade`
  # on top of itself.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.autoUpgrade.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.autoUpgrade.failedJobsHistoryLimit }}
  startingDeadlineSeconds: {{ .Values.autoUpgrade.startingDeadlineSeconds }}
  jobTemplate:
    spec:
      # ONE attempt per tick. activeDeadlineSeconds below caps
      # the whole Job ACROSS retries, not each Pod, so a retry after a timed-out
      # `--atomic` attempt (which has already spent ~2 x timeout) would start a
      # fresh `helm upgrade` with only the headroom left and be killed mid-op --
      # the exact pending-* wedge the deadline is sized to prevent, and one
      # that the age threshold then leaves alone for a tick. Sizing the deadline
      # for three attempts instead (3 x 1800s at the defaults) crosses the ~1h
      # Forbid gap. A transient fetch failure therefore waits for the next tick.
      backoffLimit: 0
      # hard wall-clock cap on the Job. `timeout` bounds only
      # `helm upgrade --wait`; the earlier `helm repo add`/`helm repo update`
      # fetches can hang on a TCP black-hole with no timeout, and with
      # concurrencyPolicy: Forbid a single hung Job skips every future tick.
      # This backstop fails the Job so the next tick can run.
      #
      # The deadline must never undercut the helm op it wraps: killing the Pod
      # mid-`--atomic` leaves the release pending-upgrade/pending-rollback.
      # `--atomic` can spend `timeout` TWICE -- once waiting on the upgrade, then
      # again on the rollback, which uses the same wait (measured:
      # a 10m timeout under the old 900s cap was killed mid-rollback).
      # So take the MAX of the configured floor (default 900s) and 2 x the parsed
      # timeout plus 600s headroom: 300s for the repo fetch, the training gate's
      # API calls (15s each, at most four) and the `helm status` reads that
      # classify a failed upgrade; 2 x 120s for chart_check's two downloads, the
      # chart and its bundle, each capped by fetch's `curl --max-time 120`; and
      # 60s for cosign's offline verify-blob, which takes seconds.
      # Only one `--atomic` runs per tick, so 2 x timeout covers it. The
      # wedge recovery's rollback also waits up to `timeout`, but a tick that
      # recovers a wedge ends after that rollback and leaves the upgrade to the
      # next tick, so it never shares a tick with an `--atomic`:
      # that tick costs at most 1 x timeout + 600s. At the
      # 10m default the deadline is 1800s, inside the hourly schedule; a timeout
      # of 26m or more crosses it, and Forbid skips the tick that falls inside
      # the run. auto-upgrade-chart-verify.sh holds the 600s to fetch's cap.
      # `| default 900` preserves the reuse-values nil-guard when the key is absent.
      {{- $deadlineFloor := .Values.autoUpgrade.activeDeadlineSeconds | default 900 | int }}
      {{- $timeoutSeconds := include "tracebloc.durationSeconds" .Values.autoUpgrade.timeout | int }}
      activeDeadlineSeconds: {{ max $deadlineFloor (add (mul 2 $timeoutSeconds) 600) }}
      template:
        metadata:
          labels:
            {{- include "tracebloc.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: auto-upgrade
        spec:
          serviceAccountName: {{ include "tracebloc.autoUpgradeName" . }}
          # NEEDED. auto-upgrade-rbac.yaml binds this SA to a Role over `*` in the
          # release namespace plus a ClusterRole over namespaces, PVs,
          # StorageClasses and RBAC — it runs `helm upgrade`, which rewrites the
          # release. Without the token the CronJob cannot upgrade anything.
          automountServiceAccountToken: true
          # `Never`, NOT `OnFailure`. Kubernetes DELETES the Pod
          # of an `OnFailure` Job once `backoffLimit` is exhausted, so a
          # repeatedly-failing CronJob leaves its Jobs behind and **no logs** —
          # `failedJobsHistoryLimit` retains the Job object and cannot retain a
          # Pod that no longer exists. The upstream docs say so outright: "your
          # Pod running the Job will be terminated once the job backoff limit
          # has been reached. This can make debugging the Job's executable more
          # difficult. We suggest setting restartPolicy = 'Never'".
          #
          # MEASURED, not theoretical. A customer prod edge's auto-upgrade had
          # been failing hourly for 2.7 days; five `Failed` Jobs were retained
          # and every one of their Pods was gone, so the reason was
          # unrecoverable from the cluster and the namespace event window had
          # rolled past it. `lastSuccessfulTime` was the only surviving
          # evidence that anything was wrong.
          #
          # Under `Never` each attempt is its own Pod (backoffLimit+1 at most, so one),
          # and they persist with the Job — so the next failure is readable.
          # That is the whole point: a scheduled job whose failures leave no
          # evidence is unobservable by construction.
          restartPolicy: Never
          {{- if include "tracebloc.useImagePullSecrets" . }}
          imagePullSecrets:
            - name: {{ include "tracebloc.registrySecretName" . }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          # cosign for chart_check, copied out of its image into the pod
          # (autoUpgrade.cosign). Same resources as the helm container, so the
          # pod stays Guaranteed and reserves no more than that container alone.
          initContainers:
            - name: cosign
              image: {{ include "tracebloc.thirdPartyImage" (dict "site" "autoUpgrade.cosign.image" "root" $) | quote }}
              imagePullPolicy: {{ (dig "cosign" "image" "pullPolicy" "" (.Values.autoUpgrade | default dict)) | default "IfNotPresent" }}
              command: ["/busybox/cp", "/ko-app/cosign", "/verifier/cosign"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml .Values.autoUpgrade.resources | nindent 16 }}
              volumeMounts:
                - name: verifier
                  mountPath: /verifier
          containers:
            - name: helm
              # THROUGH THE ONE HELPER. This used to render
              # `mirrorPrefix + repository:tag`, which emits NOTHING when no
              # mirror is set -- a BARE reference, and a bare reference is a
              # Docker Hub reference. That is invisible: there is no `docker.io`
              # in the file to grep for, which is why three sites like this one
              # were missed by a sweep of `values.yaml`. `tracebloc.image` always
              # names the registry and can carry a digest, so both are
              # expressible here for the first time. `global.imageRegistry` still
              # wins when set, so an air-gapped install re-homes exactly as before.
              image: {{ include "tracebloc.thirdPartyImage" (dict "site" "autoUpgrade.image" "root" $) | quote }}
              imagePullPolicy: {{ (dig "image" "pullPolicy" "" (.Values.autoUpgrade | default dict)) | default "IfNotPresent" }}
              # `helm` is the entrypoint on alpine/helm; override so we run
              # our script instead.
              command: ["/bin/sh", "/scripts/auto-upgrade.sh"]
              env:
              {{- include "tracebloc.proxyEnv" . | nindent 16 }}
                - name: TRACEBLOC_RELEASE_NAME
                  value: {{ .Release.Name | quote }}
                - name: TRACEBLOC_RELEASE_NAMESPACE
                  value: {{ .Release.Namespace | quote }}
                - name: TRACEBLOC_HELM_REPO_URL
                  value: {{ .Values.autoUpgrade.repoUrl | quote }}
                - name: TRACEBLOC_HELM_REPO_NAME
                  value: {{ .Values.autoUpgrade.repoName | quote }}
                - name: TRACEBLOC_CHART_NAME
                  value: {{ .Values.autoUpgrade.chartName | quote }}
                - name: TRACEBLOC_UPGRADE_TIMEOUT
                  value: {{ .Values.autoUpgrade.timeout | quote }}
                # the wedge-vs-in-flight age threshold, in whole seconds.
                # The script's awk does the age math but not duration parsing, so
                # convert the human duration here. `| default "45m"` preserves the
                # reset-then-reuse-values nil-guard when an older values.yaml
                # predates the key (same pattern as activeDeadlineSeconds).
                - name: TRACEBLOC_WEDGE_MIN_AGE_SECONDS
                  value: {{ include "tracebloc.durationSeconds" (.Values.autoUpgrade.pendingWedgeMinAge | default "45m") | quote }}
                # The CronJob the training gate records its deferral count on.
                - name: TRACEBLOC_AUTO_UPGRADE_NAME
                  value: {{ include "tracebloc.autoUpgradeName" . | quote }}
                {{- include "tracebloc.trainingGateEnv" (dict "gate" .Values.autoUpgrade.deferWhileTraining "maxDefault" 24) | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml .Values.autoUpgrade.resources | nindent 16 }}
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: verifier
                  mountPath: /verifier
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: {{ include "tracebloc.autoUpgradeName" . }}
                defaultMode: 0555
            - name: tmp
              emptyDir: {}
            - name: verifier
              emptyDir:
                sizeLimit: 256Mi
{{- end }}
