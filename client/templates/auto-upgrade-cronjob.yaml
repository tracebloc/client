{{- if .Values.autoUpgrade.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tracebloc.autoUpgradeName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tracebloc.labels" . | nindent 4 }}
    app.kubernetes.io/component: auto-upgrade
data:
  auto-upgrade.sh: |
    #!/bin/sh
    # Self-upgrade loop. See client/values.yaml `autoUpgrade` for the
    # design + trust boundary discussion. Parsing is awk-only on purpose:
    # the upstream alpine/helm image ships without jq and we don't want to
    # apk-add at runtime under a runAsNonRoot pod.
    set -eu

    # Helm needs writable cache/config/data dirs. The Pod runs with
    # readOnlyRootFilesystem: true, so point Helm at the emptyDir mounted
    # at /tmp.
    export HOME=/tmp
    export HELM_CACHE_HOME=/tmp/.helm/cache
    export HELM_CONFIG_HOME=/tmp/.helm/config
    export HELM_DATA_HOME=/tmp/.helm/data
    mkdir -p "$HELM_CACHE_HOME" "$HELM_CONFIG_HOME" "$HELM_DATA_HOME"

    log() { printf '[auto-upgrade] %s\n' "$*"; }

    log "release=$RELEASE_NAME namespace=$RELEASE_NAMESPACE repo=$REPO_URL"

    helm repo add "$REPO_NAME" "$REPO_URL" >/dev/null
    helm repo update "$REPO_NAME" >/dev/null

    # #554: auto-recover from an interrupted upgrade BEFORE attempting another
    # one. If a previous tick's `helm upgrade` was killed mid-operation — OOM at
    # the 256Mi memory limit, node reboot, or a cluster restart inside the
    # upgrade window — the release is left in a pending-upgrade state, and every
    # subsequent hourly tick then fails with "another operation is in progress"
    # forever: auto-upgrade (the security-fix delivery path) is silently dead
    # until a human runs `helm rollback`. Detect that wedge and roll back to the
    # last deployed revision so this tick can proceed. Parsed from the STATUS:
    # line jq-free — the alpine/helm image ships without jq. (pending-install
    # can't occur here: this CronJob is part of the release it upgrades, so the
    # release must have deployed at least once for this script to run.)
    STATUS="$(helm status "$RELEASE_NAME" -n "$RELEASE_NAMESPACE" 2>/dev/null \
      | awk '/^STATUS:/ {print $2; exit}')"
    case "$STATUS" in
      pending-upgrade|pending-rollback)
        log "release wedged in '$STATUS' (a previous upgrade was killed mid-operation); rolling back to the last deployed revision before retrying"
        helm rollback "$RELEASE_NAME" -n "$RELEASE_NAMESPACE"
        log "rollback complete; continuing"
        ;;
      uninstalling)
        # A killed `helm uninstall` leaves this state. We can't clear it here — the
        # CronJob is part of the release, so completing the uninstall would delete
        # itself — but skip cleanly rather than fall through to a `helm upgrade`
        # that fails every tick with an opaque "another operation is in progress".
        log "release is mid-uninstall ('uninstalling'); skipping this tick until it settles (run 'helm uninstall $RELEASE_NAME -n $RELEASE_NAMESPACE' to finish it)"
        exit 0
        ;;
    esac

    # Latest published version. Helm orders search results newest-first,
    # so the first `version:` line in the YAML output is the latest.
    LATEST="$(helm search repo "${REPO_NAME}/${CHART_NAME}" -o yaml \
      | awk '/^[[:space:]]*version:/ {print $2; exit}')"

    # Currently deployed chart version. `helm list -o yaml` emits
    # `chart: client-<version>` for the matching release.
    CURRENT_CHART="$(helm list -n "$RELEASE_NAMESPACE" \
      --filter "^${RELEASE_NAME}\$" -o yaml \
      | awk '/^[[:space:]]*chart:/ {print $2; exit}')"
    CURRENT="${CURRENT_CHART#${CHART_NAME}-}"

    if [ -z "$LATEST" ]; then
      log "ERROR: could not resolve latest chart version from $REPO_URL"
      exit 1
    fi
    if [ -z "$CURRENT" ] || [ "$CURRENT" = "$CURRENT_CHART" ]; then
      log "ERROR: could not parse deployed chart version (got '$CURRENT_CHART')"
      exit 1
    fi

    log "current=$CURRENT latest=$LATEST"

    if [ "$LATEST" = "$CURRENT" ]; then
      log "already at latest; nothing to do"
      exit 0
    fi

    # Semver-aware compare via `sort -V` so 1.10.0 > 1.9.0.
    NEWER="$(printf '%s\n%s\n' "$CURRENT" "$LATEST" | sort -V | tail -n 1)"
    if [ "$NEWER" != "$LATEST" ]; then
      log "deployed version is ahead of repo (current=$CURRENT > latest=$LATEST); skipping"
      exit 0
    fi

    log "upgrading $CURRENT -> $LATEST"
    # --reset-then-reuse-values (helm 3.14+) is critical here: --reuse-values
    # alone re-uses the LAST RELEASE'S COMPUTED VALUES, so any new keys added
    # to values.yaml in the upgraded chart (e.g. a future autoUpgrade.foo
    # default) would silently fail to render with nil-pointer template errors
    # — verified on a dev-cluster 1.1.0 -> 1.3.0 dry-run when shipping #69.
    # --reset-then-reuse-values resets to the new chart's defaults first, then
    # layers the customer's user-supplied values on top, so operator overrides
    # (clientId, dockerRegistry creds, autoUpgrade.enabled=false, etc.) are
    # preserved while new defaults flow through.
    # --atomic (implies --wait): if the upgrade fails gracefully — bad manifest,
    # a pod that never goes ready within --timeout — helm rolls the release back
    # to the prior working revision instead of leaving it broken or pending. It
    # cannot undo an abrupt SIGKILL (the helm process is gone before it can roll
    # back); that residual pending-upgrade is caught by the recovery step above
    # on the next tick. --cleanup-on-fail removes any new resources the failed
    # attempt created so the rollback is clean.
    helm upgrade "$RELEASE_NAME" "${REPO_NAME}/${CHART_NAME}" \
      --namespace "$RELEASE_NAMESPACE" \
      --version "$LATEST" \
      --reset-then-reuse-values \
      --atomic \
      --cleanup-on-fail \
      --timeout "$UPGRADE_TIMEOUT"
    log "upgrade complete: $CURRENT -> $LATEST"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "tracebloc.autoUpgradeName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tracebloc.labels" . | nindent 4 }}
    app.kubernetes.io/component: auto-upgrade
spec:
  schedule: {{ .Values.autoUpgrade.schedule | quote }}
  suspend: {{ .Values.autoUpgrade.suspend }}
  # Forbid: never run two upgrade attempts at once. A long upgrade that
  # crosses the next scheduled tick should not stack a second `helm upgrade`
  # on top of itself.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.autoUpgrade.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.autoUpgrade.failedJobsHistoryLimit }}
  startingDeadlineSeconds: {{ .Values.autoUpgrade.startingDeadlineSeconds }}
  jobTemplate:
    spec:
      backoffLimit: 2
      # #555: hard wall-clock cap on the Job. `timeout` bounds only
      # `helm upgrade --wait`; the earlier `helm repo add`/`helm repo update`
      # fetches can hang on a TCP black-hole with no timeout, and with
      # concurrencyPolicy: Forbid a single hung Job skips every future tick.
      # This backstop fails the Job so the next tick can run.
      #
      # The deadline must never undercut a longer configured autoUpgrade.timeout:
      # that would kill a healthy `helm upgrade --wait` before its own timeout
      # fires. So take the MAX of the configured floor (default 900s) and the
      # parsed timeout plus 300s repo-fetch headroom (the same 900-600 headroom
      # baked into the defaults). `| default 900` preserves the reuse-values
      # nil-guard when the key is absent.
      {{- $deadlineFloor := .Values.autoUpgrade.activeDeadlineSeconds | default 900 | int }}
      {{- $timeoutSeconds := include "tracebloc.durationSeconds" .Values.autoUpgrade.timeout | int }}
      activeDeadlineSeconds: {{ max $deadlineFloor (add $timeoutSeconds 300) }}
      template:
        metadata:
          labels:
            {{- include "tracebloc.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: auto-upgrade
        spec:
          serviceAccountName: {{ include "tracebloc.autoUpgradeName" . }}
          # NEEDED. auto-upgrade-rbac.yaml binds this SA to a Role over `*` in the
          # release namespace plus a ClusterRole over namespaces, PVs,
          # StorageClasses and RBAC — it runs `helm upgrade`, which rewrites the
          # release. Without the token the CronJob cannot upgrade anything.
          automountServiceAccountToken: true
          # `Never`, NOT `OnFailure` (backend#2620). Kubernetes DELETES the Pod
          # of an `OnFailure` Job once `backoffLimit` is exhausted, so a
          # repeatedly-failing CronJob leaves its Jobs behind and **no logs** —
          # `failedJobsHistoryLimit` retains the Job object and cannot retain a
          # Pod that no longer exists. The upstream docs say so outright: "your
          # Pod running the Job will be terminated once the job backoff limit
          # has been reached. This can make debugging the Job's executable more
          # difficult. We suggest setting restartPolicy = 'Never'".
          #
          # MEASURED, not theoretical. A customer prod edge's auto-upgrade had
          # been failing hourly for 2.7 days; five `Failed` Jobs were retained
          # and every one of their Pods was gone, so the reason was
          # unrecoverable from the cluster and the namespace event window had
          # rolled past it. `lastSuccessfulTime` was the only surviving
          # evidence that anything was wrong.
          #
          # Under `Never` each attempt is its own Pod (backoffLimit+1 at most),
          # and they persist with the Job — so the next failure is readable.
          # That is the whole point: a scheduled job whose failures leave no
          # evidence is unobservable by construction.
          restartPolicy: Never
          {{- if include "tracebloc.useImagePullSecrets" . }}
          imagePullSecrets:
            - name: {{ include "tracebloc.registrySecretName" . }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: helm
              image: "{{ include "tracebloc.mirrorPrefix" $ }}{{ .Values.autoUpgrade.image.repository }}:{{ .Values.autoUpgrade.image.tag }}"
              imagePullPolicy: {{ .Values.autoUpgrade.image.pullPolicy }}
              # `helm` is the entrypoint on alpine/helm; override so we run
              # our script instead.
              command: ["/bin/sh", "/scripts/auto-upgrade.sh"]
              env:
              {{- include "tracebloc.proxyEnv" . | nindent 16 }}
                - name: RELEASE_NAME
                  value: {{ .Release.Name | quote }}
                - name: RELEASE_NAMESPACE
                  value: {{ .Release.Namespace | quote }}
                - name: REPO_URL
                  value: {{ .Values.autoUpgrade.repoUrl | quote }}
                - name: REPO_NAME
                  value: {{ .Values.autoUpgrade.repoName | quote }}
                - name: CHART_NAME
                  value: {{ .Values.autoUpgrade.chartName | quote }}
                - name: UPGRADE_TIMEOUT
                  value: {{ .Values.autoUpgrade.timeout | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml .Values.autoUpgrade.resources | nindent 16 }}
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: {{ include "tracebloc.autoUpgradeName" . }}
                defaultMode: 0555
            - name: tmp
              emptyDir: {}
{{- end }}
