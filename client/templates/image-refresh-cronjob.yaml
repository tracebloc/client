{{- if include "tracebloc.imageRefreshEnabled" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tracebloc.imageRefreshName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tracebloc.labels" . | nindent 4 }}
    app.kubernetes.io/component: image-refresh
data:
  image-refresh.sh: |
    #!/bin/sh
    # Polls the registry for a new manifest digest and reconciles it onto the
    # long-lived control-plane workloads, on docker.io under the floating
    # CLIENT_ENV tag (#154, extended by #569).
    #
    # Action on change: `kubectl set image <workload> <container>=repo@digest`.
    # It used to be `kubectl rollout restart`. #569 changed the mechanism so
    # the always-running pods can drop `imagePullPolicy: Always`: `Always`
    # forced a registry round-trip on every (re)start, so an offline Docker
    # Desktop / WSL2 restart landed in ImagePullBackOff even with the image
    # already cached in containerd. `restart` only works as an update path
    # BECAUSE of `Always` — the two are mutually exclusive unless the image
    # REFERENCE itself changes, which is exactly what `set image` does. The
    # pods now render `IfNotPresent` and the kubelet pulls because it has
    # never seen that digest, not because a policy told it to re-check a tag.
    #
    # Workloads reconciled (all in RELEASE_NAMESPACE unless noted):
    #   deployment/<release>-jobs-manager      api                       (tracebloc/jobs-manager)
    #                                          pods-monitor-container    (tracebloc/pods-monitor)
    #   deployment/<release>-requests-proxy    proxy                     (tracebloc/jobs-manager)
    #   daemonset/<release>-resource-monitor   tracebloc-resource-monitor
    #                                          in NODE_AGENTS_NAMESPACE  (tracebloc/resource-monitor)
    #
    # requests-proxy runs the SAME tracebloc/jobs-manager image, so it follows
    # the jobs-manager digest resolved in this tick — no second registry HEAD.
    # Before #569 it was not reconciled at all: it stayed on its old build
    # until some unrelated restart, then jumped to whatever the floating tag
    # pointed at, so the two pods routinely ran different builds of one image.
    # resource-monitor was likewise untouched (and a chart release does not
    # change its image ref either), so it only ever moved by accident.
    #
    # TWO KNOWN, BOUNDED LIMITATIONS of keeping the annotation (rather than the
    # live pod spec) as the source of truth. Both are self-healing at the next
    # upstream image change, which at the control plane's release cadence is
    # days, and neither can break a running edge — the pods stay offline-safe
    # throughout because IfNotPresent does not depend on any of this.
    #
    #   1. HELM RE-RENDER. `helm upgrade --reset-then-reuse-values` (the fleet
    #      auto-upgrade path) re-renders the templates, which write `repo:tag`
    #      and so revert an earlier `set image` pin. This tick will NOT re-pin:
    #      the annotation still records that digest, so `recorded == latest`
    #      and the loop no-ops. The edge floats on the tag until the next
    #      upstream release re-pins it. Note this only happens on a chart
    #      VERSION bump — auto-upgrade compares versions and skips otherwise —
    #      so it is not an hourly revert.
    #
    #   2. PRE-EXISTING SKEW. requests-proxy and jobs-manager may already be
    #      running different builds of the same image on an edge upgrading INTO
    #      this version, because nothing reconciled requests-proxy before now.
    #      This script converges them on the next digest change (both are set
    #      in the same tick); it does not detect and repair skew that predates
    #      it, because it compares registry-vs-annotation, never pod-vs-pod.
    #
    # Fixing either properly means reconciling against each workload's LIVE
    # container image instead of a shared annotation — a declarative reconcile,
    # which `set image` makes possible for the first time (`rollout restart`
    # was a blind action, which is why the annotation existed at all). That is
    # a deliberate follow-up, not an oversight.
    #
    # Source of truth: annotations on the JOBS-MANAGER deployment metadata
    # (`tracebloc.io/last-refreshed-<image>-digest`) — comparing the registry
    # digest to an annotation we wrote ourselves sidesteps imageID format
    # variation across container runtimes (kubernetes/kubernetes#108689 +
    # #115199) and multi-arch manifest-list vs platform-manifest divergence.
    # All records live on that one Deployment even for resource-monitor: they
    # are this script's private bookkeeping, not a property of the workload,
    # and keeping them in one object keeps get_annotation a single read.
    #
    # The ingestor image is intentionally NOT handled here. jobs-manager
    # spawns each ingestion Job by the floating tag `images.ingestor.tag`
    # with imagePullPolicy=Always (see jobs-manager-deployment.yaml and
    # client-runtime submit_ingestion_run._build_image_reference), so the
    # kubelet resolves the ingestor's current digest at every spawn — there
    # is nothing for this CronJob to reconcile. Until the floating-tag
    # migration a "class-2" pass here kept an INGESTOR_IMAGE_DIGEST env
    # current via `kubectl set env`; it was retired because a `helm upgrade`
    # that reset the env could revert the ingestor to a stale baseline (the
    # regression a customer hit). Spawning by floating tag is revert-proof.
    #
    # First-tick contract: annotation missing → record the current registry
    # digest WITHOUT touching the workload (no evidence of drift, no reason to
    # churn pods). #569 keeps this deliberately. Pinning on the first tick
    # would rewrite `repo:tag` to `repo@digest` on every fresh install — a spec
    # change, therefore a rollout, for byte-identical content, and for the
    # resource-monitor DaemonSet that is a rollout across every node. The cost
    # is that a freshly installed edge runs `repo:tag` until the first real
    # digest change: still restart-safe offline (IfNotPresent), just not yet
    # reproducible. Offline-safety is what #569 is fixing; reproducibility
    # follows on the next upstream release.
    #
    # Parsing: awk/sed/grep + jq. jq used only where JSON-with-dotted-keys
    # or container/env-array filtering motivates it; the rest stays in pure
    # shell so the script survives image swaps to leaner bases — same
    # constraint as the auto-upgrade script in this chart.
    #
    # All log() output goes to stderr so it never pollutes
    # command-substitution capture sites like `latest="$(...)"`.
    set -eu

    log() { printf '[image-refresh] %s\n' "$*" >&2; }

    # #563: guard a FLAPPING deployment. After this many consecutive FAILED
    # rollout attempts in a row, STOP re-restarting and flag the deployment for a
    # human instead of churning ReplicaSets every tick (no auto-resume). The
    # count is a plain integer in ATTEMPT_KEY that means one thing: consecutive
    # failed refresh attempts. It resets to 0 only on a genuinely successful
    # settled rollout. Once a flap is detected it is marked in FLAP_KEY so
    # a human / monitoring can see it.
    MAX_REFRESH_ATTEMPTS="${MAX_REFRESH_ATTEMPTS:-3}"
    ATTEMPT_KEY="tracebloc.io/refresh-attempt"
    FLAP_KEY="tracebloc.io/refresh-flap-detected"

    # backend#1964: guard a SKIP THAT NEVER ENDS. The settled guard below is
    # correct to skip a tick while a rollout is in flight, but it cannot tell
    # "in flight" from "will never settle" -- and the second case freezes image
    # refresh for ALL FOUR workloads while every tick exits 0 and the CronJob
    # stays green. Nobody looks at a green CronJob.
    #
    # This is reachable without anything crashing. jobs-manager's readiness
    # probe (jobs-manager-deployment.yaml) is a TCP connect to 8080, and
    # jobs_manager.py CATCHES a failed run_server_in_thread on purpose so
    # Service Bus polling and training survive. The pod then runs forever,
    # useful, and never Ready -- so `rollout status` never settles. Measured
    # triggers, all operator-reachable: a malformed ingestion-authz.yaml
    # (load_authz_policy raises), edgeuser losing CREATE/ALTER on the
    # ingestion_runs table (ensure_ingestion_runs_table raises), or 8080
    # already bound (make_server binds in _ServerThread.__init__).
    #
    # The flap counter above CANNOT cover this: it counts failed ROLLOUTS, and
    # everything after the settled guard is unreachable when the deployment
    # never settles. Hence a second counter with the same shape.
    #
    # Default 8 ticks = ~2h at the default 15m schedule: comfortably longer than
    # any legitimate rollout (including a resource-monitor DaemonSet roll across
    # every node) and far shorter than the days this went unnoticed.
    MAX_SKIP_TICKS="${MAX_SKIP_TICKS:-8}"
    SKIP_KEY="tracebloc.io/refresh-skip-streak"

    log "release=$RELEASE_NAME namespace=$RELEASE_NAMESPACE deployment=$DEPLOYMENT_NAME"
    log "  client images: tracebloc/{jobs-manager,pods-monitor,resource-monitor} on docker.io under tag=$IMAGE_TAG"
    log "  also reconciling: deployment/${REQUESTS_PROXY_DEPLOYMENT} (jobs-manager image), daemonset/${RESOURCE_MONITOR_DAEMONSET} in ${NODE_AGENTS_NAMESPACE}"

    # #569: a private-mirror install (global.imageRegistry) renders every pod
    # image as <mirror>/tracebloc/... , but the digests resolved below come from
    # docker.io. Writing a docker.io digest onto a mirror reference is not just
    # wrong, it is BREAKING: the mirror may not hold that digest at all, so
    # `set image` would pin the control plane to an unpullable ref. Under the
    # old `rollout restart` this mismatch was merely useless (it restarted pods
    # to re-pull the mirror's own tag); with `set image` it must fail closed.
    #
    # Exit 0, not 1: a mirror install has deliberately taken over image
    # distribution, so "nothing to reconcile" is the correct steady state, not
    # an error to page on. It is logged loudly rather than silently skipped —
    # a green-forever CronJob that never does its job is the #571 failure mode.
    # The CronJob is still RENDERED under a mirror (the alpine/k8s runner image
    # is re-homed onto it, per global_image_registry_test.yaml); only the
    # reconcile is inert.
    if [ "$IMAGE_REGISTRY" != "docker.io" ]; then
      log "NOTE: images are served from private mirror '${IMAGE_REGISTRY}' (global.imageRegistry), but this script resolves digests from docker.io."
      log "      Pinning a docker.io digest onto a mirrored reference could pin an image the mirror does not hold, so auto-refresh is INERT on this edge."
      log "      Update the control-plane images by syncing your mirror and restarting the workloads, or pin images.<image>.digest explicitly."
      log "      (That restart DOES re-pull: because this reconcile is inert here, the chart renders imagePullPolicy=Always on the unpinned control-plane images rather than IfNotPresent -- see the tracebloc.controlPlanePullPolicy helper. Offline-restart safety is traded away on this edge precisely so it is not left with no update path at all.)"
      log "tick complete"
      exit 0
    fi

    # kubectl in the alpine/k8s image does NOT reliably auto-detect in-cluster
    # config in this Job's pod: with no kubeconfig on disk it falls back to
    # http://localhost:8080 and every API call fails ("connection refused"),
    # even though the SA token and KUBERNETES_SERVICE_* env are both present
    # (#634 — observed failing fleet-wide, where it masqueraded as the generic
    # "cannot read deployment" below and cost a full live investigation). Build
    # an explicit in-cluster kubeconfig from the mounted ServiceAccount so every
    # `kubectl` below targets the real API server regardless of that quirk.
    # These `kubectl config` calls only write the local kubeconfig file
    # ($KUBECONFIG, on the writable /tmp emptyDir) — they make no API call.
    SA_DIR=/var/run/secrets/kubernetes.io/serviceaccount
    export KUBECONFIG=/tmp/kubeconfig
    # Bracket an IPv6 API host for the URL authority: client-go's in-cluster
    # config uses net.JoinHostPort, and a bare IPv6 literal without brackets is
    # an invalid server URL — dual-stack / IPv6 clusters would otherwise hit the
    # very refresh outage this change fixes.
    api_host="$KUBERNETES_SERVICE_HOST"
    case "$api_host" in *:*) api_host="[$api_host]" ;; esac
    kubectl config set-cluster in-cluster \
      --server="https://${api_host}:${KUBERNETES_SERVICE_PORT}" \
      --certificate-authority="${SA_DIR}/ca.crt" >/dev/null
    # tokenFile (a PATH), not --token=<value>: the bearer token must never land
    # on the kubectl process argv (readable via procfs), and a path lets kubectl
    # re-read the rotating projected ServiceAccount token on every call. No
    # token value is written to $KUBECONFIG either.
    kubectl config set "users.in-cluster.tokenFile" "${SA_DIR}/token" >/dev/null
    kubectl config set-context in-cluster \
      --cluster=in-cluster --user=in-cluster --namespace="$RELEASE_NAMESPACE" >/dev/null
    kubectl config use-context in-cluster >/dev/null

    # Get an anonymous pull-scope token for one repository on a
    # registry. Both docker.io and ghcr.io support anonymous tokens for
    # public images; only the issuer URL differs. tr cleanup handles
    # the trailing newline some curl builds emit.
    get_token() {
      _repo="$1"; _registry="$2"
      case "$_registry" in
        docker.io)
          _url="https://auth.docker.io/token?service=registry.docker.io&scope=repository:${_repo}:pull"
          ;;
        ghcr.io)
          _url="https://ghcr.io/token?service=ghcr.io&scope=repository:${_repo}:pull"
          ;;
        *)
          log "  WARN: unknown registry $_registry"
          return 1
          ;;
      esac
      curl -fsS --max-time 10 "$_url" \
        | sed -n 's/.*"token":"\([^"]*\)".*/\1/p' \
        | tr -d '\r\n'
    }

    # Resolve the manifest digest for repo:tag on a registry. We HEAD
    # the manifest endpoint with all four manifest media types in a
    # single comma-separated Accept header (registry v2 spec form; some
    # TLS-terminating proxies have been observed dropping repeated
    # Accept headers). The value returned in Docker-Content-Digest is
    # whatever the registry serves for that tag — for multi-arch tags
    # the index digest, for single-arch the manifest digest. Both work
    # here because we compare to OUR annotation (or live env), not to a
    # runtime imageID; tick-over-tick consistency is all we need.
    #
    # Case-fold with tr BEFORE awk: alpine/k8s ships BusyBox awk which
    # silently ignores gawk's IGNORECASE=1, and the header case differs
    # between HTTP/1.1 and HTTP/2. Digest values are lowercase-by-spec
    # (sha256:<64 hex>) so the value is unaffected.
    get_latest_digest() {
      _repo="$1"; _tag="$2"; _registry="$3"
      _token="$(get_token "$_repo" "$_registry")"
      if [ -z "$_token" ]; then
        log "  WARN: could not fetch auth token for $_registry/$_repo"
        return 1
      fi
      case "$_registry" in
        docker.io) _host="registry-1.docker.io" ;;
        ghcr.io)   _host="ghcr.io" ;;
        *)         log "  WARN: unknown registry host: $_registry"; return 1 ;;
      esac
      curl -fsSI --max-time 10 \
        -H "Authorization: Bearer $_token" \
        -H "Accept: application/vnd.docker.distribution.manifest.v2+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.oci.image.index.v1+json" \
        "https://${_host}/v2/${_repo}/manifests/${_tag}" \
        | tr '[:upper:]' '[:lower:]' \
        | awk '/^docker-content-digest:/ {print $2}' \
        | tr -d '\r\n'
    }

    # Read an annotation value off the deployment. Empty output means
    # the annotation is absent (first observation) — distinct from an
    # explicit empty string, which the chart never writes.
    #
    # Uses jq because kubectl-go's jsonpath parser returns empty for
    # bracket-notation keys that contain `.` or `/` (#156).
    #
    # #626: capture kubectl SEPARATELY (not straight into the jq pipe) so a
    # kubectl failure cannot be masked by jq succeeding on empty stdin — there
    # is no `pipefail` here, so a bare `kubectl | jq` pipeline would exit 0 even
    # when kubectl died. Return non-zero on EITHER a kubectl or a jq error.
    # A caller can then distinguish two cases that must not be conflated:
    #   * success + empty output  → the annotation is genuinely absent
    #   * non-zero return         → we could not read it (do NOT assume absent)
    get_annotation() {
      _key="$1"
      # --request-timeout bounds the API call so a wedged apiserver returns a read
      # ERROR (→ non-zero → fail-closed skip) instead of hanging the tick until
      # activeDeadlineSeconds while concurrencyPolicy:Forbid blocks later runs.
      _json="$(kubectl get deployment -n "$RELEASE_NAMESPACE" "$DEPLOYMENT_NAME" -o json --request-timeout=15s)" || return 1
      printf '%s\n' "$_json" | jq -r --arg k "$_key" '.metadata.annotations[$k] // empty'
    }

    # Skip the whole tick if the deployment isn't currently SETTLED (#546). A rollout
    # already in progress, or a pod stuck (e.g. Pending on volume binding), means a restart
    # can't help — it only churns ReplicaSets, and on a single-node local-path cluster that
    # churn itself wedges provisioning (incident #545: RWO deadlock produced 19 restarts
    # because each tick's rollout timed out and the next re-restarted, the digest annotation
    # only landing after a rollout SUCCEEDS). concurrencyPolicy: Forbid stops overlapping
    # JOBS; this stops the SEQUENTIAL restart storm. Retry on the next tick once settled.
    # A non-zero rollout status is NOT automatically "in progress -- skip" (#571). It is
    # also NotFound, RBAC denial, and API errors -- treating those as a benign skip
    # (exit 0) leaves the CronJob GREEN forever while refresh never runs. Only a
    # genuinely-present-but-unsettled deployment is a legit skip; anything else the job
    # must SURFACE. --request-timeout bounds each API CALL (not just the rollout wait),
    # so a wedged API cannot hang the tick with no activeDeadlineSeconds while
    # concurrencyPolicy: Forbid blocks every later tick.
    if ! kubectl rollout status -n "$RELEASE_NAMESPACE" "deployment/${DEPLOYMENT_NAME}" --request-timeout=15s --timeout=10s >/dev/null 2>&1; then
      if kubectl get deployment -n "$RELEASE_NAMESPACE" "$DEPLOYMENT_NAME" --request-timeout=15s >/dev/null 2>&1; then
        # COUNT the skip before taking it (backend#1964). A single skip is
        # normal; an unbroken run of them means refresh has stopped for all four
        # workloads and no rollout will ever happen to say so.
        #
        # Read FAIL-CLOSED, same reasoning as the ATTEMPT_KEY read below: we just
        # proved this deployment is readable, so an annotation read that fails
        # here is anomalous. Collapsing it to "0 skips" would restart the streak
        # every tick and the ceiling would never be reached -- the freeze would
        # be permanent AND unreported, which is strictly worse than today.
        if ! skips="$(get_annotation "$SKIP_KEY")"; then
          log "ERROR: deployment/${DEPLOYMENT_NAME} is not settled AND the ${SKIP_KEY} annotation could not be read (kubectl/jq error), so the skip streak cannot be counted. Failing the tick rather than skipping silently: an uncounted skip is how this freezes forever."
          exit 1
        fi
        case "$skips" in ''|*[!0-9]*) skips=0 ;; esac
        skips=$(( skips + 1 ))
        kubectl annotate deployment -n "$RELEASE_NAMESPACE" "$DEPLOYMENT_NAME" \
          "${SKIP_KEY}=${skips}" --overwrite --request-timeout=15s

        if [ "$skips" -ge "$MAX_SKIP_TICKS" ]; then
          # The freeze is now a FINDING, not an exit 0. Every image the CronJob
          # owns has been frozen for MAX_SKIP_TICKS ticks; a rollout in progress
          # does not last that long, so this deployment is not going to settle
          # on its own.
          log "ERROR: deployment/${DEPLOYMENT_NAME} has been unsettled for ${skips} consecutive ticks (>= MAX_SKIP_TICKS=${MAX_SKIP_TICKS}). IMAGE REFRESH IS FROZEN, and not only for jobs-manager: deployment/${REQUESTS_PROXY_DEPLOYMENT} and daemonset/${RESOURCE_MONITOR_DAEMONSET} are reconciled after this guard, so they have received NO image updates either."
          log "  MANUAL ATTENTION NEEDED. Most likely the jobs-manager pod is Running but never Ready, which the readiness probe reports and nothing kills:"
          log "    kubectl -n ${RELEASE_NAMESPACE} get pods -l app.kubernetes.io/component=jobs-manager"
          log "    kubectl -n ${RELEASE_NAMESPACE} logs deployment/${DEPLOYMENT_NAME} -c api | grep -i 'ingestion HTTP server'"
          log "  A 'Failed to start ingestion HTTP server' line means 8080 never opened: check ingestion-authz.yaml parses, that the DB user may create the ingestion_runs table, and that 8080 is free. Refresh resumes by itself once the pod goes Ready."
          exit 1
        fi

        log "deployment/${DEPLOYMENT_NAME} not settled (rollout in progress or pod not Ready) -- skipping this refresh tick ${skips}/${MAX_SKIP_TICKS}; will retry when settled"
        exit 0
      fi
      # Surface the REAL API error instead of swallowing it: the generic
      # message alone was indistinguishable between NotFound, a 403, and the
      # `localhost:8080` connection-refused of #634. Re-run the read capturing
      # only stderr so the failing tick names the actual cause in one log line.
      err="$(kubectl get deployment -n "$RELEASE_NAMESPACE" "$DEPLOYMENT_NAME" --request-timeout=15s 2>&1 >/dev/null || true)"
      log "ERROR: cannot read deployment/${DEPLOYMENT_NAME} (NotFound, RBAC denial, or API error): ${err:-unknown error} -- not a benign skip; failing the tick so it is visible"
      exit 1
    fi

    # Settled: the streak is over, so clear it (backend#1964). Only written when
    # there is something to clear, so a healthy edge is not patched every 15
    # minutes for nothing. A read error is NOT fatal here -- unlike the skip path
    # above, being unable to confirm a streak we are about to reset cannot hide a
    # freeze: we have just proved the deployment settled. Say so and carry on.
    #
    # Deliberately NOT auto-clearing FLAP_KEY/ATTEMPT_KEY: those two mean "a
    # rollout kept failing" and #563 requires a human to clear them. This one
    # means "the deployment was busy", which resolving it genuinely resolves.
    # The CLEAR is non-fatal too (backend#2007). The read above was already
    # deliberately non-fatal; leaving the WRITE fatal under `set -e` was an
    # asymmetry, not a decision -- and it aborted the tick BEFORE Pass 1, so a
    # transient API error on a bookkeeping annotation froze the refresh of
    # requests-proxy and resource-monitor on the very tick that proved the
    # deployment had recovered. That is #1964's own recovery path failing the
    # same way #1964 did, only red instead of green. Nothing below reads
    # SKIP_KEY, so a stale value costs exactly one thing: the NEXT unsettled
    # tick resumes counting from the old number instead of from zero, which
    # trips the ceiling EARLIER -- fail-safe in the direction #1964 wants.
    # Reported as a WARNING line rather than swallowed: "images did not update"
    # must never be inferable only from the Job's colour (backend#1964).
    if skips="$(get_annotation "$SKIP_KEY")" && [ -n "$skips" ]; then
      log "deployment/${DEPLOYMENT_NAME} is settled again after ${skips} skipped tick(s) -- clearing ${SKIP_KEY}"
      if ! clear_err="$(kubectl annotate deployment -n "$RELEASE_NAMESPACE" "$DEPLOYMENT_NAME" \
        "${SKIP_KEY}-" --request-timeout=15s 2>&1 >/dev/null)"; then
        log "  WARNING: could not clear ${SKIP_KEY} on deployment/${DEPLOYMENT_NAME}: ${clear_err:-unknown error}. Continuing with this tick anyway -- the annotation is bookkeeping and a stale value only makes the next skip streak trip its ceiling sooner. Clear it by hand if that is unwanted: kubectl annotate deployment -n ${RELEASE_NAMESPACE} ${DEPLOYMENT_NAME} ${SKIP_KEY}-"
      fi
    fi

    # =================================================================
    # Pass 1 — the control-plane images: jobs-manager, pods-monitor,
    # resource-monitor. docker.io, floating CLIENT_ENV tag,
    # annotation-based source of truth, action = kubectl set image.
    # =================================================================

    restart_needed=0
    annotate_args=""
    # `kubectl set image` argument lists, accumulated per WORKLOAD (a single
    # `set image` call can carry several container=ref pairs, so the
    # two-container jobs-manager Deployment is re-imaged in one patch and
    # therefore one rollout, not two).
    jm_set_args=""
    rp_set_args=""
    rm_set_args=""

    # Each entry: "<docker-hub-repo>|<annotation-key>|<pin-flag>".
    set -- \
      "tracebloc/jobs-manager|tracebloc.io/last-refreshed-jobs-manager-digest|${JOBS_MANAGER_PINNED}" \
      "tracebloc/pods-monitor|tracebloc.io/last-refreshed-pods-monitor-digest|${PODS_MONITOR_PINNED}" \
      "tracebloc/resource-monitor|tracebloc.io/last-refreshed-resource-monitor-digest|${RESOURCE_MONITOR_PINNED}"

    for entry in "$@"; do
      repo="${entry%%|*}"
      rest="${entry#*|}"
      key="${rest%%|*}"
      pinned="${rest#*|}"

      log "checking ${repo}:${IMAGE_TAG} (annotation=${key})"

      if [ "$pinned" = "1" ]; then
        log "  pinned by digest in values; skipping (auto-refresh disabled for this image)"
        continue
      fi

      latest="$(get_latest_digest "$repo" "$IMAGE_TAG" "docker.io" || true)"
      if [ -z "$latest" ]; then
        log "  WARN: could not resolve latest digest (rate-limited or transient); skipping this tick"
        continue
      fi

      recorded="$(get_annotation "$key" || true)"

      log "  latest=$latest"
      log "  recorded=${recorded:-<unset>}"

      if [ -z "$recorded" ]; then
        # First-observation path: record without re-imaging. No evidence
        # the running pod is on an older digest, and rewriting repo:tag to
        # repo@digest for identical content would roll every pod on install
        # (see the first-tick contract in the header).
        log "  first observation; recording without re-imaging"
        annotate_args="$annotate_args ${key}=${latest}"
        continue
      fi

      if [ "$recorded" = "$latest" ]; then
        log "  digest unchanged since last refresh; no-op"
        continue
      fi

      log "  digest changed (${recorded} -> ${latest}); re-image needed"
      annotate_args="$annotate_args ${key}=${latest}"
      restart_needed=1

      # The reference we pin. IMAGE_REGISTRY is docker.io here — a mirror
      # exits the tick far above — but render it from the variable so this
      # stays honest if that guard is ever relaxed.
      ref="${IMAGE_REGISTRY}/${repo}@${latest}"

      # Map the image onto the workload+container(s) that run it. Container
      # names are contractual with the templates; keep them in sync with
      # jobs-manager-deployment.yaml, requests-proxy-deployment.yaml and
      # resource-monitor-daemonset.yaml.
      case "$repo" in
        tracebloc/jobs-manager)
          jm_set_args="$jm_set_args api=${ref}"
          # requests-proxy runs this SAME image. It follows the jobs-manager
          # digest unless the operator pinned it separately via
          # images.requestsProxy.digest, which is a per-workload override.
          if [ "$REQUESTS_PROXY_PINNED" = "1" ]; then
            log "  requests-proxy is pinned by images.requestsProxy.digest; not following this digest"
          else
            rp_set_args="$rp_set_args proxy=${ref}"
          fi
          ;;
        tracebloc/pods-monitor)
          jm_set_args="$jm_set_args pods-monitor-container=${ref}"
          ;;
        tracebloc/resource-monitor)
          rm_set_args="$rm_set_args tracebloc-resource-monitor=${ref}"
          ;;
      esac
    done

    # Order matters: rollout FIRST, annotate AFTER `rollout status`
    # succeeds. Annotating first would let a failed rollout silently
    # freeze the deployment on the old image (next tick sees
    # recorded == latest and skips).
    if [ "$restart_needed" -eq 1 ]; then
      # #563: guard a FLAPPING deployment with a plain consecutive-failure
      # counter. If readiness oscillates (becomes Ready, then crashes after
      # warmup near the rollout-status timeout) the rollout below fails; under
      # `set -e` the tick then exits BEFORE the success reset lands, so `recorded`
      # stays old and every later settled tick re-detects the same change. We
      # persist an incremented failure count BEFORE the restart so it survives
      # that early exit; once MAX_REFRESH_ATTEMPTS failures accrue in a row we
      # STOP restarting and flag the deployment for a human (see below). The
      # counter resets ONLY on a genuinely successful settled rollout -- there is
      # deliberately no signature/target-change reset (it was fragile, CID
      # 3728806670) and no auto-resume (a wedged flap needs manual attention).
      #
      # #626: read the counter FAIL-CLOSED. A failed kubectl/jq must NOT collapse
      # to "0 attempts" (which would fail OPEN past the guard and re-restart a
      # possibly-flapping deployment). get_annotation returns non-zero on a read
      # error and zero-with-empty-output only when the annotation is genuinely
      # absent, so we can tell the two apart. On a read error we cannot confirm
      # we are clear to restart, so take the SAFE branch: skip this tick.
      if ! attempt="$(get_annotation "$ATTEMPT_KEY")"; then
        log "  WARN: could not read ${ATTEMPT_KEY} annotation (kubectl/jq error); cannot confirm the rollout attempt count -- skipping the re-image this tick rather than risk churning a flapping workload. Will retry next tick."
        log "tick complete"
        exit 0
      fi
      # Empty $attempt means the annotation is genuinely absent (zero prior
      # failures); anything non-numeric is treated the same, defensively.
      case "$attempt" in ''|*[!0-9]*) attempt=0 ;; esac

      if [ "$attempt" -ge "$MAX_REFRESH_ATTEMPTS" ]; then
        # Flap detected: MAX consecutive failed rollouts. STOP restarting and
        # SURFACE it -- do NOT auto-resume. Reaching this branch means the tick
        # already passed the top-of-tick settled guard, so a deployment that
        # keeps landing here is only intermittently settled: a genuine flap.
        # Churning it further only orphans ReplicaSets. Mark it for a human /
        # monitoring via FLAP_KEY (value = the failure count) and leave the count
        # in place; refresh re-arms once someone clears the ${ATTEMPT_KEY}
        # annotation (or fixes the image so the next rollout settles).
        log "  WARN: rollout for the current image digest(s) failed ${attempt} time(s) in a row (>= MAX_REFRESH_ATTEMPTS=${MAX_REFRESH_ATTEMPTS}) -- FLAP DETECTED. NOT re-imaging the control-plane workloads (a workload becomes Ready then crashes; retrying only churns ReplicaSets). MANUAL ATTENTION NEEDED: investigate deployment/${DEPLOYMENT_NAME}, deployment/${REQUESTS_PROXY_DEPLOYMENT} and daemonset/${RESOURCE_MONITOR_DAEMONSET}, then clear the ${ATTEMPT_KEY} annotation on deployment/${DEPLOYMENT_NAME} to re-arm refresh."
        kubectl annotate deployment -n "$RELEASE_NAMESPACE" "$DEPLOYMENT_NAME" \
          "${FLAP_KEY}=${attempt}" --overwrite --request-timeout=15s
        log "tick complete"
        exit 0
      fi

      new_count=$(( attempt + 1 ))
      # Persist the incremented failure count BEFORE restarting so a failed
      # rollout (which exits the tick under set -e) still advances the counter
      # for the next tick. A successful rollout resets it below.
      kubectl annotate deployment -n "$RELEASE_NAMESPACE" "$DEPLOYMENT_NAME" \
        "${ATTEMPT_KEY}=${new_count}" --overwrite --request-timeout=15s

      log "re-imaging control-plane workloads (attempt ${new_count}/${MAX_REFRESH_ATTEMPTS})"

      # `kubectl set image` per workload, each followed by its own
      # `rollout status`. Under `set -e` a rollout that does not settle exits
      # the tick here, leaving the incremented counter above in place — the
      # #563 flap semantics are unchanged by the mechanism swap.
      #
      # `set image` is IDEMPOTENT in a way `rollout restart` never was: it
      # writes a desired reference, so re-running it with the same digest is a
      # no-op patch that triggers no rollout. A tick that dies partway (say
      # resource-monitor fails after jobs-manager succeeded) can therefore be
      # retried wholesale on the next tick without re-rolling the workloads
      # that already landed.
      #
      # shellcheck disable=SC2086  # word-splitting the arg lists is intentional
      if [ -n "$jm_set_args" ]; then
        log "  set image deployment/${DEPLOYMENT_NAME}:${jm_set_args}"
        kubectl set image -n "$RELEASE_NAMESPACE" "deployment/${DEPLOYMENT_NAME}" \
          $jm_set_args --request-timeout=15s
        kubectl rollout status -n "$RELEASE_NAMESPACE" "deployment/${DEPLOYMENT_NAME}" \
          --timeout="$ROLLOUT_TIMEOUT"
        log "  deployment/${DEPLOYMENT_NAME} rollout complete"
      fi

      if [ -n "$rp_set_args" ]; then
        log "  set image deployment/${REQUESTS_PROXY_DEPLOYMENT}:${rp_set_args}"
        kubectl set image -n "$RELEASE_NAMESPACE" "deployment/${REQUESTS_PROXY_DEPLOYMENT}" \
          $rp_set_args --request-timeout=15s
        kubectl rollout status -n "$RELEASE_NAMESPACE" "deployment/${REQUESTS_PROXY_DEPLOYMENT}" \
          --timeout="$ROLLOUT_TIMEOUT"
        log "  deployment/${REQUESTS_PROXY_DEPLOYMENT} rollout complete"
      fi

      if [ -n "$rm_set_args" ]; then
        # Cross-namespace: the DaemonSet lives in the node-agents namespace,
        # reachable via the second, narrower Role (see image-refresh-rbac.yaml).
        log "  set image daemonset/${RESOURCE_MONITOR_DAEMONSET} in ${NODE_AGENTS_NAMESPACE}:${rm_set_args}"
        kubectl set image -n "$NODE_AGENTS_NAMESPACE" "daemonset/${RESOURCE_MONITOR_DAEMONSET}" \
          $rm_set_args --request-timeout=15s
        kubectl rollout status -n "$NODE_AGENTS_NAMESPACE" "daemonset/${RESOURCE_MONITOR_DAEMONSET}" \
          --timeout="$ROLLOUT_TIMEOUT"
        log "  daemonset/${RESOURCE_MONITOR_DAEMONSET} rollout complete"
      fi

      log "re-image complete"
      # Success (settled rollout): reset the failure counter and clear any flap
      # marker so a future change starts fresh. #626 (CID 3729110045): do this in
      # its OWN bounded annotate BEFORE the digest record below -- do NOT batch it
      # into the final annotate. Batching made the reset contingent on the digest
      # write: if that later annotate hung or failed under `set -e`, the rollout
      # had genuinely succeeded yet `refresh-attempt` stayed elevated, so
      # subsequent ticks could burn the budget and PERMANENTLY trip the flap
      # lockout while the CronJob stayed green. A dedicated --request-timeout-bounded
      # annotate makes the success reset reliable and independent of the digest
      # write. `key-` removes the annotation (a no-op if absent).
      kubectl annotate deployment -n "$RELEASE_NAMESPACE" "$DEPLOYMENT_NAME" \
        "${ATTEMPT_KEY}-" "${FLAP_KEY}-" --overwrite --request-timeout=15s
    fi

    if [ -n "$annotate_args" ]; then
      log "updating deployment annotations:$annotate_args"
      # shellcheck disable=SC2086  # word-split annotate_args intentional
      # #626: bound the digest-record annotate too (was unbounded, the root of CID
      # 3729110045). Even if this fails, the success reset above has already
      # landed, so a flap lockout can never stick after a successful rollout.
      kubectl annotate deployment -n "$RELEASE_NAMESPACE" "$DEPLOYMENT_NAME" \
        $annotate_args --overwrite --request-timeout=15s
    fi

    log "tick complete"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "tracebloc.imageRefreshName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tracebloc.labels" . | nindent 4 }}
    app.kubernetes.io/component: image-refresh
spec:
  schedule: {{ .Values.imageRefresh.schedule | quote }}
  suspend: {{ .Values.imageRefresh.suspend }}
  # Forbid: never run two checks at once. A long rollout that crosses the
  # next scheduled tick must not stack a second re-image on top of itself —
  # that would orphan the in-flight rollout's new ReplicaSet.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.imageRefresh.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.imageRefresh.failedJobsHistoryLimit }}
  startingDeadlineSeconds: {{ .Values.imageRefresh.startingDeadlineSeconds }}
  jobTemplate:
    spec:
      backoffLimit: 2
      # MUST exceed (number of reconciled workloads) x imageRefresh.rolloutTimeout.
      # A legitimate tick does `set image` and then waits on `rollout status` for up
      # to rolloutTimeout — and since #569 it may do so for up to THREE workloads IN
      # SEQUENCE (jobs-manager, requests-proxy, resource-monitor).
      #
      # This was a hardcoded 1800 (30m), which with the default 10m rolloutTimeout is
      # EXACTLY 3 x 10m — zero headroom (Bugbot). Blowing the deadline is not a benign
      # timeout: the Job is killed mid-wait, so under `set -e` the post-success
      # annotate never runs, the digest record never advances, and the
      # `refresh-attempt` counter stays incremented. Three such ticks trip the #563
      # flap lockout on the SHARED counter, which stops refresh for ALL control-plane
      # images at once — while the CronJob looks healthy from outside.
      #
      # Now a value, defaulting to 3600 (60m) = 3 x the default rolloutTimeout plus
      # 100% slack. An operator who raises rolloutTimeout must raise this too; the
      # schema and values.yaml say so. Still only a backstop — every API call is
      # already --request-timeout-bounded.
      activeDeadlineSeconds: {{ .Values.imageRefresh.activeDeadlineSeconds | default 3600 }}
      template:
        metadata:
          labels:
            {{- include "tracebloc.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: image-refresh
        spec:
          serviceAccountName: {{ include "tracebloc.imageRefreshName" . }}
          restartPolicy: OnFailure
          {{- if include "tracebloc.useImagePullSecrets" . }}
          imagePullSecrets:
            - name: {{ include "tracebloc.registrySecretName" . }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: refresh
              image: "{{ include "tracebloc.mirrorPrefix" $ }}{{ .Values.imageRefresh.image.repository }}:{{ .Values.imageRefresh.image.tag }}"
              imagePullPolicy: {{ .Values.imageRefresh.image.pullPolicy }}
              # alpine/k8s entrypoint is kubectl; override to run our script.
              command: ["/bin/sh", "/scripts/image-refresh.sh"]
              env:
              {{- include "tracebloc.proxyEnv" . | nindent 16 }}
                # alpine/k8s's kubectl writes a discovery cache under
                # $HOME/.kube. The pod runs uid 1000 with
                # readOnlyRootFilesystem, so point HOME at the writable
                # emptyDir mounted at /home/kubectl.
                - name: HOME
                  value: "/home/kubectl"
                - name: RELEASE_NAME
                  value: {{ .Release.Name | quote }}
                - name: RELEASE_NAMESPACE
                  value: {{ .Release.Namespace | quote }}
                - name: DEPLOYMENT_NAME
                  value: {{ printf "%s-jobs-manager" .Release.Name | quote }}
                # #569: the two additional workloads reconciled by `set image`.
                - name: REQUESTS_PROXY_DEPLOYMENT
                  value: {{ include "tracebloc.requestsProxyName" . | quote }}
                - name: RESOURCE_MONITOR_DAEMONSET
                  value: {{ include "tracebloc.resourceMonitorName" . | quote }}
                - name: NODE_AGENTS_NAMESPACE
                  value: {{ .Values.nodeAgents.namespace.name | quote }}
                # The registry the chart renders into every pod image. The
                # script resolves digests from docker.io only, so it goes inert
                # when this is a private mirror rather than pinning a digest the
                # mirror may not hold (see the guard at the top of the script).
                #
                # `| default "docker.io"` is NOT redundant with dig's default:
                # values.yaml ships `global.imageRegistry: ""`, so the key EXISTS
                # and dig returns the empty string rather than its fallback.
                # Without the trailing default this renders "", the mirror guard
                # below sees "" != "docker.io" and goes inert on every DEFAULT
                # install — silently disabling refresh fleet-wide. The
                # `tracebloc.image` helper handles the same trap with its own
                # `| default "docker.io"`.
                - name: IMAGE_REGISTRY
                  value: {{ dig "imageRegistry" "docker.io" (.Values.global | default dict) | default "docker.io" | quote }}
                - name: IMAGE_TAG
                  # RESOLVED, not raw. This is the tag the refresh pulls, so a
                  # documented alias here freezes the edge on a tag the publish
                  # pipeline never writes (backend#1723).
                  value: {{ include "tracebloc.clientEnv" . | quote }}
                - name: ROLLOUT_TIMEOUT
                  value: {{ .Values.imageRefresh.rolloutTimeout | quote }}
                # #563: consecutive failed-rollout threshold; stop + flag after this.
                - name: MAX_REFRESH_ATTEMPTS
                  value: {{ .Values.imageRefresh.maxRefreshAttempts | default 3 | quote }}
                # backend#1964: consecutive UNSETTLED-skip threshold. The failed-
                # rollout counter above cannot cover this — it lives after the
                # settled guard, which a never-Ready pod never gets past.
                - name: MAX_SKIP_TICKS
                  value: {{ .Values.imageRefresh.maxSkipTicks | default 8 | quote }}
                # Per-image opt-out flags. Pinning a class-1 image is
                # signalled by setting `images.<image>.digest` to a non-empty
                # value — the same signal the deployment uses to switch
                # imagePullPolicy to IfNotPresent. Both guards are nil-safe.
                # (The ingestor is no longer refreshed here — it is spawned
                # by jobs-manager from the floating tag; see header.)
                - name: JOBS_MANAGER_PINNED
                  value: {{ ternary "1" "0" (not (empty (default dict (default dict .Values.images).jobsManager).digest)) | quote }}
                - name: PODS_MONITOR_PINNED
                  value: {{ ternary "1" "0" (not (empty (default dict (default dict .Values.images).podsMonitor).digest)) | quote }}
                # #569: resource-monitor is refreshed too. It counts as "pinned"
                # (i.e. skip it) either when an operator set an explicit digest
                # OR when `resourceMonitor: false` disables the DaemonSet
                # entirely — with no workload to reconcile, attempting a
                # cross-namespace `set image` would just fail the tick.
                # Shares ONE definition with tracebloc.imageRefreshEnabled --
                # see tracebloc.resourceMonitorRefreshPinned. Writing the rule
                # twice is what let the render-time and runtime views disagree.
                - name: RESOURCE_MONITOR_PINNED
                  value: {{ ternary "1" "0" (not (empty (include "tracebloc.resourceMonitorRefreshPinned" .))) | quote }}
                # requests-proxy follows the jobs-manager digest by default;
                # this flag is the per-workload override that opts it out.
                - name: REQUESTS_PROXY_PINNED
                  value: {{ ternary "1" "0" (not (empty (default dict (default dict .Values.images).requestsProxy).digest)) | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml .Values.imageRefresh.resources | nindent 16 }}
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                # alpine/k8s's kubectl writes a cache under $HOME (default
                # /root). The pod runs as uid 1000 with readOnlyRootFilesystem,
                # so HOME=/home/kubectl needs to be writable; emptyDir mount.
                - name: home
                  mountPath: /home/kubectl
          volumes:
            - name: scripts
              configMap:
                name: {{ include "tracebloc.imageRefreshName" . }}
                defaultMode: 0555
            - name: tmp
              emptyDir: {}
            - name: home
              emptyDir: {}
{{- end }}
