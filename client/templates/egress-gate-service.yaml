{{- /* The egress gate. `record` is the read-only record port,
     read through the Kubernetes API's service proxy
     (/api/v1/namespaces/<ns>/services/egress-gate:record/proxy/v1/record);
     egress-gate-network-policy.yaml admits no pod to it. */}}
apiVersion: v1
kind: Service
metadata:
  name: egress-gate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tracebloc.labels" . | nindent 4 }}
    app: egress-gate
spec:
  selector:
    app: egress-gate
  ports:
    - name: send
      port: 8888
      targetPort: send
      protocol: TCP
    - name: record
      port: {{ include "tracebloc.egressRecordPort" . }}
      targetPort: record
      protocol: TCP
  type: ClusterIP
