{{- $name := include "tracebloc.clientDataPvc" . -}}
{{- $storage := include "tracebloc.clientDataStorage" . -}}
{{- include "tracebloc.jobDataRefusal" . }}
{{- $hostPath := include "tracebloc.claimHostPath" (dict "root" . "claim" "data") }}
{{- if $hostPath }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "tracebloc.clientDataPvName" . }}
  labels:
    {{- include "tracebloc.labels" . | nindent 4 }}
spec:
  storageClassName: {{ include "tracebloc.claimStorageClass" (dict "root" . "claim" "data") }}
  capacity:
    storage: {{ $storage }}
  accessModes:
    - ReadWriteOnce
  claimRef:
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
  hostPath:
    path: {{ $hostPath }}
    type: DirectoryOrCreate
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    {{- include "tracebloc.labels" . | nindent 4 }}
spec:
  storageClassName: {{ include "tracebloc.claimStorageClass" (dict "root" . "claim" "data") }}
  accessModes:
    - {{ include "tracebloc.claimAccessMode" (dict "root" . "claim" "data") }}
  resources:
    requests:
      storage: {{ $storage }}
