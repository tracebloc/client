{{- /*
  PodDisruptionBudget for the single-replica mysql Deployment.

  `podDisruptionBudget.mysql.create` is tri-state:
    null (default) -> AUTO, tracking the storage/topology mode:
                        * multi-node CSI clusters (hostPath.enabled=false,
                          i.e. AKS/EKS/OpenShift): RENDER. Blocks a surprise
                          autoscaler scale-down / node upgrade from evicting
                          the only mysql pod without operator intervention.
                        * single-node / bare-metal installs
                          (hostPath.enabled=true): SKIP. With one replica on
                          one node, minAvailable:1 leaves zero allowed voluntary
                          disruptions, so `kubectl drain`/cordon blocks forever
                          and the pod (RWO PVC) has nowhere to reschedule
                          anyway (tracebloc/client#560).
    true  -> force render regardless of topology.
    false -> never render.
*/}}
{{- $pdb := default dict .Values.podDisruptionBudget.mysql -}}
{{- $hostPathMode := (default dict .Values.hostPath).enabled | default false -}}
{{- $create := ternary $pdb.create (not $hostPathMode) (kindIs "bool" $pdb.create) -}}
{{- if $create }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mysql-client
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tracebloc.labels" . | nindent 4 }}
    app: mysql-client
spec:
  # minAvailable: 1 blocks *voluntary* disruptions (node drains, surge
  # upgrades, cluster-autoscaler scale-downs) while the only mysql pod is,
  # well, the only mysql pod. Involuntary kills (kernel OOM, node failure)
  # still happen — PriorityClass + memory parity cover those. This only
  # renders where a drain has somewhere to move the pod (multi-node CSI) or
  # is force-enabled — on single-node installs the whole object is skipped
  # (see header above).
  minAvailable: 1
  selector:
    matchLabels:
      app: mysql-client
{{- end }}
