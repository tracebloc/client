{{- /*
  The live Secret, looked up ONCE and reused by every credential below. This
  must come first: clientId/clientPassword now resolve against it too
  (backend#2571). `lookup` returns an empty dict during `helm template`/dry-run;
  each consumer below states what that means for it.
*/ -}}
{{- $secretName := include "tracebloc.secretName" . -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}
{{- /*
  Platform client credentials (backend#2571). Issued by the backend, NOT
  generated here — so tier 3 is a hard failure rather than `randAlphaNum`,
  unlike every other credential in this file.

    1. explicit .Values.clientId / .Values.clientPassword (first install, or a
       deliberate re-point at a different registered client), else
    2. the value already stored in the live Secret, else
    3. fail, naming both ways to fix it.

  WHY TIER 2 EXISTS. Both were previously `required`, so they had to be supplied
  as values on every install AND every upgrade — which meant they were
  necessarily written into the Helm release's user-supplied values in cleartext,
  in EVERY retained revision. Rotating the credential did not clear older
  revisions, and anyone with `get secret` in the namespace could read all of
  them. Tier 2 lets an operator pre-create the Secret out of band, or install
  once with values and then drop them, so the credential need never enter
  release values. Mirrors the 3-tier pattern already used by
  podTokenSigningSecret, credmgrPassword, tbMetaPassword, tbIngestPassword and
  bootstrapDbPassword — this file's own established shape.

  DRY-RUN: `lookup` is empty during `helm template`, so tier 2 cannot fire and
  an offline render without values fails — exactly as it did before this change.
  Offline rendering has always required the values to be passed in.

  AND THAT LIMIT HAS A NAME: ANY CLIENT-SIDE RENDERER (Bugbot/#859, saqlain).
  `lookup` needs a live cluster, so it is inert not only under `helm template`
  and `--dry-run` but under every tool that renders manifests WITHOUT one —
  ArgoCD's default renderer and Flux post-render among them. The other five
  credentials survive that: their tier 3 is `randAlphaNum`, so an inert lookup
  degrades to a generated value. These two CANNOT, because the backend issues
  them and the chart must never invent one — so tier 3 is a hard `fail` and a
  GitOps render with the values dropped does not degrade, it stops.

  SO, STATED PLAINLY RATHER THAN LEFT TO BE DISCOVERED: a GitOps-rendered
  install must keep clientId/clientPassword in its values, and for it the
  cleartext-in-revisions problem this change fixes is NOT fixed. Server-side
  apply (`argocd-repo-server` with a live cluster, or `helm upgrade` run from
  CI against the cluster) is what makes tier 2 reachable; the value-free path
  is for those. Narrowing that gap needs a different mechanism — an external
  secrets operator writing the Secret before render — and is out of scope here.

  TIER 2 TESTS THE DECODED VALUE, NOT THE KEY. `hasKey` alone would accept
  `CLIENT_ID: ""`, and it must not: `minLength: 1` had to come out of
  values.schema.json so lookup could run at all (schema validation happens
  before render), so this template is now the ONLY layer that can refuse an
  empty credential. Keying off presence would let helm succeed and ship blank
  credentials into the pods — the exact failure the schema used to catch
  (Bugbot, #859). An empty key therefore reads as ABSENT and falls to tier 3.
*/ -}}
{{- $secretClientId := "" -}}
{{- if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "CLIENT_ID") -}}
{{-   $secretClientId = (index $existingSecret.data "CLIENT_ID" | b64dec) -}}
{{- end -}}
{{- $secretClientPassword := "" -}}
{{- if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "CLIENT_PASSWORD") -}}
{{-   $secretClientPassword = (index $existingSecret.data "CLIENT_PASSWORD" | b64dec) -}}
{{- end -}}
{{- $clientId := "" -}}
{{- if .Values.clientId -}}
{{-   $clientId = .Values.clientId -}}
{{- else if $secretClientId -}}
{{-   $clientId = $secretClientId -}}
{{- else -}}
{{-   fail "clientId is required and could not be resolved. Either set it (--set clientId=... or a values file), or pre-create the release Secret with a non-empty CLIENT_ID key AND Helm's ownership metadata so the chart adopts that Secret instead of colliding with it -- values.yaml carries the exact commands (backend#2571)." -}}
{{- end -}}
{{- $clientPassword := "" -}}
{{- if .Values.clientPassword -}}
{{-   $clientPassword = .Values.clientPassword -}}
{{- else if $secretClientPassword -}}
{{-   $clientPassword = $secretClientPassword -}}
{{- else -}}
{{-   fail "clientPassword is required and could not be resolved. Either set it (--set clientPassword=... or a values file), or pre-create the release Secret with a non-empty CLIENT_PASSWORD key AND Helm's ownership metadata so the chart adopts that Secret instead of colliding with it -- values.yaml carries the exact commands (backend#2571)." -}}
{{- end -}}
{{- /*
  Placeholder guards run on the RESOLVED value, so a placeholder is caught
  whether it came from values or from a Secret someone pre-created badly.
*/ -}}
{{- if regexMatch "^<.*>$" $clientId -}}{{- fail "clientId looks like a placeholder (e.g. \"<CLIENT_ID>\"); set a real value" -}}{{- end -}}
{{- if regexMatch "^<.*>$" $clientPassword -}}{{- fail "clientPassword looks like a placeholder (e.g. \"<CLIENT_PASSWORD>\"); set a real value" -}}{{- end -}}
{{- /*
  Pod-proxy token signing secret (client-runtime#79). Stability is critical:
  a token minted before an upgrade must still verify after, so we must NOT
  regenerate the secret on every `helm upgrade`. Resolution order:
    1. explicit .Values.podTokenSigningSecret (operator pin / rotation), else
    2. the value already stored in the live Secret (preserve across upgrades), else
    3. a freshly generated random secret (first install).
  `lookup` returns an empty dict during `helm template`/dry-run; that's fine —
  it falls through to generate, and the rendered value is only consumed at a
  real install/upgrade.
*/ -}}
{{- $podTokenSecret := "" -}}
{{- if .Values.podTokenSigningSecret -}}
{{-   $podTokenSecret = .Values.podTokenSigningSecret -}}
{{- else if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "POD_TOKEN_SIGNING_SECRET") -}}
{{-   $podTokenSecret = (index $existingSecret.data "POD_TOKEN_SIGNING_SECRET" | b64dec) -}}
{{- else -}}
{{-   $podTokenSecret = randAlphaNum 48 -}}
{{- end -}}
{{- /*
  Credential-manager password (RFC-0003 D10, backend#1181). Same generate-once
  stability + 3-tier resolution as the signing secret above:
    1. explicit .Values.credmgrPassword (operator pin — DR, a pre-created
       MySQL account, or a forced rotation), else
    2. the value already stored in the live Secret (preserve across upgrades), else
    3. a freshly generated random secret (first install).
  jobs-manager syncs the tb_credmgr account to this value on every startup, so
  it must be stable across upgrades (regenerating it would churn the account).
  Emitted only when perExperimentDbCreds is on.
  NOTE (edge): because the key is emitted only while the flag is on, an
  off→on→off→on toggle drops then regenerates it via tier 3, rotating the
  account until jobs-manager re-syncs. Pin .Values.credmgrPassword to keep it
  stable across toggles — acceptable for the dev-first rollout; the pin is the
  fix (Saqlain review).
*/ -}}
{{- $credmgrPassword := "" -}}
{{- if .Values.perExperimentDbCreds -}}
{{-   if .Values.credmgrPassword -}}
{{-     if not (regexMatch "^[A-Za-z0-9]+$" .Values.credmgrPassword) -}}
{{-       fail "credmgrPassword must be alphanumeric ([A-Za-z0-9]+) — jobs-manager rejects other characters in the tb_credmgr password" -}}
{{-     end -}}
{{-     $credmgrPassword = .Values.credmgrPassword -}}
{{-   else if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "TB_CREDMGR_PASSWORD") -}}
{{-     $credmgrPassword = (index $existingSecret.data "TB_CREDMGR_PASSWORD" | b64dec) -}}
{{-   else -}}
{{-     $credmgrPassword = randAlphaNum 48 -}}
{{-   end -}}
{{- end -}}
{{- /*
  Dedicated service-account passwords (backend#1528 S1). tb_meta owns the
  metadata DB, tb_ingest writes the dataset DB; together they replace the
  root-equivalent edgeuser. Same generate-once stability + 3-tier resolution as
  the credmgr password above, one per account:
    1. explicit .Values.tbMetaPassword / .Values.tbIngestPassword (operator pin
       — DR, a pre-created MySQL account, or a forced rotation), else
    2. the value already stored in the live Secret (preserve across upgrades), else
    3. a freshly generated random secret (first install).
  jobs-manager re-syncs each account to its value on every startup, so both must
  be stable across upgrades (regenerating would churn the account). Emitted only
  when serviceDbAccounts is on; the same off->on->off->on toggle caveat as
  credmgr applies — pin the values to keep them stable across toggles.
*/ -}}
{{- $tbMetaPassword := "" -}}
{{- $tbIngestPassword := "" -}}
{{- if (include "tracebloc.serviceDbAccounts" .) -}}
{{-   if .Values.tbMetaPassword -}}
{{-     if not (regexMatch "^[A-Za-z0-9]+$" .Values.tbMetaPassword) -}}
{{-       fail "tbMetaPassword must be alphanumeric ([A-Za-z0-9]+) — jobs-manager rejects other characters in the tb_meta password" -}}
{{-     end -}}
{{-     $tbMetaPassword = .Values.tbMetaPassword -}}
{{-   else if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "TB_META_PASSWORD") -}}
{{-     $tbMetaPassword = (index $existingSecret.data "TB_META_PASSWORD" | b64dec) -}}
{{-   else -}}
{{-     $tbMetaPassword = randAlphaNum 48 -}}
{{-   end -}}
{{-   if .Values.tbIngestPassword -}}
{{-     if not (regexMatch "^[A-Za-z0-9]+$" .Values.tbIngestPassword) -}}
{{-       fail "tbIngestPassword must be alphanumeric ([A-Za-z0-9]+) — jobs-manager rejects other characters in the tb_ingest password" -}}
{{-     end -}}
{{-     $tbIngestPassword = .Values.tbIngestPassword -}}
{{-   else if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "TB_INGEST_PASSWORD") -}}
{{-     $tbIngestPassword = (index $existingSecret.data "TB_INGEST_PASSWORD" | b64dec) -}}
{{-   else -}}
{{-     $tbIngestPassword = randAlphaNum 48 -}}
{{-   end -}}
{{- end -}}
{{- /*
  Bootstrap re-parent password (backend#1528 S3). DB_BOOTSTRAP_PASSWORD is the
  password jobs-manager authenticates with to run the account-minting DDL
  (CREATE USER / GRANT for tb_credmgr / tb_meta / tb_ingest). S3 re-parents that
  mint OFF the root-equivalent edgeuser onto MySQL root (client-runtime#310), so
  edgeuser can finally be REVOKEd / DROPped.

  Resolution differs DELIBERATELY from the accounts above — jobs-manager
  AUTHENTICATES as this identity, it never mints or ALTERs it:
    1. explicit .Values.bootstrapDbPassword (the MySQL root password for the
       cluster — the mysql-client image's baked default, see backend#947), else
    2. the value already stored in the live Secret (preserve across upgrades), else
    3. FAIL. There is NO generate-random tier: a random password the server was
       never told to expect would lock jobs-manager out of MySQL — it runs no
       `ALTER USER root` to make the account match — CrashLooping the minter.
  No alphanumeric constraint (unlike the credmgr / tb_* passwords, which ARE
  interpolated into CREATE USER DDL): this value is only ever a mysql-connector
  connection parameter, and the baked root password is not alphanumeric. Emitted
  only when the S3 re-parent gate is on.
*/ -}}
{{- $bootstrapDbPassword := "" -}}
{{- if (include "tracebloc.bootstrapDbReparent" .) -}}
{{-   if .Values.bootstrapDbPassword -}}
{{-     if regexMatch "^<.*>$" .Values.bootstrapDbPassword -}}
{{-       fail "bootstrapDbPassword looks like a placeholder (e.g. \"<ROOT_PASSWORD>\"); set the real MySQL root password" -}}
{{-     end -}}
{{-     $bootstrapDbPassword = .Values.bootstrapDbPassword -}}
{{-   else if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "DB_BOOTSTRAP_PASSWORD") -}}
{{-     $bootstrapDbPassword = (index $existingSecret.data "DB_BOOTSTRAP_PASSWORD" | b64dec) -}}
{{-   else -}}
{{-     fail "bootstrapDbReparent is on but bootstrapDbPassword is unset (backend#1528 S3): set it to the MySQL root password for this cluster (the mysql-client image's baked default; see backend#947 for the value and its rotated replacement). There is no generated default — jobs-manager authenticates as root to run the account-minting DDL and cannot rotate root to match a random value, so a missing pin would lock the minter out. See values.yaml." -}}
{{-   end -}}
{{- end -}}
{{- /*
  Chart-managed mysql-client root password (backend#947 / backend#1528 Phase 0).
  Rotates root off the image's baked literal. Same generate-once stability +
  3-tier resolution as the credmgr / tb_* passwords:
    1. explicit .Values.mysqlRootPassword (operator pin — DR, or to match a
       pre-rotated account), else
    2. the value already stored in the live Secret (preserve across upgrades), else
    3. a freshly generated random secret (first install).
  mysql-deployment injects this as MYSQL_ROOT_PASSWORD, which the mysql entrypoint
  honours only at FRESH datadir init — so a fresh install is born rotated. An
  EXISTING datadir keeps root's current password until the one-time
  `ALTER USER 'root'@'%'/'@localhost' IDENTIFIED BY '<this value>'` rollout step
  reads this key and aligns the live account. Emitted only when the rotation gate
  is on; NOT constrained to alphanumeric (only ever a connection parameter, never
  interpolated into DDL). The same off->on->off toggle caveat as credmgr applies —
  pin .Values.mysqlRootPassword to keep it stable across toggles.
*/ -}}
{{- $mysqlRootPassword := "" -}}
{{- if (include "tracebloc.rotateMysqlRoot" .) -}}
{{-   if .Values.mysqlRootPassword -}}
{{-     if regexMatch "^<.*>$" .Values.mysqlRootPassword -}}
{{-       fail "mysqlRootPassword looks like a placeholder (e.g. \"<ROOT_PASSWORD>\"); set a real value" -}}
{{-     end -}}
{{-     if not (regexMatch "^[A-Za-z0-9]+$" .Values.mysqlRootPassword) -}}
{{-       fail "mysqlRootPassword must be alphanumeric ([A-Za-z0-9]+) — the backend#947 rotation runbook embeds this value in an ALTER USER ... IDENTIFIED BY '...' statement, so a quote or shell/SQL metacharacter would break the one-time rotation. (Generated randAlphaNum values already satisfy this.)" -}}
{{-     end -}}
{{-     $mysqlRootPassword = .Values.mysqlRootPassword -}}
{{-   else if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "MYSQL_ROOT_PASSWORD") -}}
{{-     $mysqlRootPassword = (index $existingSecret.data "MYSQL_ROOT_PASSWORD" | b64dec) -}}
{{-   else -}}
{{-     $mysqlRootPassword = randAlphaNum 48 -}}
{{-   end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tracebloc.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tracebloc.labels" . | nindent 4 }}
type: Opaque
data:
  CLIENT_ID: {{ $clientId | b64enc | quote }}
  CLIENT_PASSWORD: {{ $clientPassword | b64enc | quote }}
  POD_TOKEN_SIGNING_SECRET: {{ $podTokenSecret | b64enc | quote }}
{{- if .Values.perExperimentDbCreds }}
  TB_CREDMGR_PASSWORD: {{ $credmgrPassword | b64enc | quote }}
{{- end }}
{{- if (include "tracebloc.serviceDbAccounts" .) }}
  TB_META_PASSWORD: {{ $tbMetaPassword | b64enc | quote }}
  TB_INGEST_PASSWORD: {{ $tbIngestPassword | b64enc | quote }}
{{- end }}
{{- if (include "tracebloc.rotateMysqlRoot" .) }}
  MYSQL_ROOT_PASSWORD: {{ $mysqlRootPassword | b64enc | quote }}
{{- end }}
{{- if (include "tracebloc.bootstrapDbReparent" .) }}
  DB_BOOTSTRAP_PASSWORD: {{ $bootstrapDbPassword | b64enc | quote }}
{{- end }}
{{- if and (ne .Values.resourceMonitor false) (ne .Values.nodeAgents.namespace.name .Release.Namespace) }}
---
# Mirrored into the node-agents namespace so the resource-monitor DaemonSet
# can read CLIENT_ID / CLIENT_PASSWORD via secretKeyRef. Secrets are
# namespace-scoped; a pod cannot reference a Secret in another namespace.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tracebloc.secretName" . }}
  namespace: {{ .Values.nodeAgents.namespace.name }}
  labels:
    {{- include "tracebloc.labels" . | nindent 4 }}
    app: {{ include "tracebloc.resourceMonitorName" . }}
type: Opaque
data:
  CLIENT_ID: {{ $clientId | b64enc | quote }}
  CLIENT_PASSWORD: {{ $clientPassword | b64enc | quote }}
{{- end }}
