{{- /*
  The live Secret, looked up ONCE and reused by every credential below. This
  must come first: clientId/clientPassword now resolve against it too
  (backend#2571). `lookup` returns an empty dict during `helm template`/dry-run;
  each consumer below states what that means for it.
*/ -}}
{{- $secretName := include "tracebloc.secretName" . -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}
{{- /*
  REFUSE A RENAME OF A LIVE RELEASE (Bugbot, High, on client#911).

  `fullnameOverride` now routes `tracebloc.secretName`, which is correct for an
  INSTALL and unsafe for a RENAME. Setting the override on a release that already
  exists moves the Secret's name, so the `lookup` above misses, and four of the six
  credentials below fall to their tier-3 `randAlphaNum` and are MINTED FRESH. The
  MySQL PVC is `keep`'d and still holds the old ones, so:

      helm upgrade  -> STATUS: deployed
      mysql         -> ERROR 1045 (28000): Access denied

  A successful upgrade that leaves the database unopenable, with no warning at any
  layer. The completeness guard this PR adds cannot see it: every rendered name
  follows the override exactly as intended -- the bug is that the DATA did not.

  KEYED ON THE PERSISTED DATA, NOT ON A NAME (Arturo + Bugbot, re-review of
  ea6568dc). The first version of this guard looked for the Secret under the name
  the release would have had WITHOUT the override, and that name is a PROXY for
  the thing that causes the lockout. It caught one of three rename directions:

    none -> override A    live Secret is `<rel>-secrets`     -> caught
    override A -> B       live Secret is `A-secrets`, so the
                          `<rel>-secrets` probe missed        -> MISSED
    override A -> none    the two names are equal, so the
                          `ne` gate skipped the body entirely -> MISSED

  Both missed directions re-mint against the same kept `mysql-pvc` and produce the
  same silent lockout, so the guard read as closed while two thirds of the class
  was open.

  THE INVARIANT IS ABOUT STATE: persisted MySQL credentials exist, and the Secret
  under the CURRENT EFFECTIVE name does not. `tracebloc.mysqlPvc` is the constant
  `mysql-pvc` -- it never follows the override and carries
  `helm.sh/resource-policy: keep` -- so its presence IS "there is a database here
  whose credentials are already baked in". `$existingSecret` above is already the
  current effective name. Two facts, no name arithmetic, and every direction falls
  out of it:

    first install                     no PVC                  -> no refusal
    fresh install WITH an override    no PVC                  -> no refusal
    ordinary upgrade                  PVC + Secret present    -> no refusal
    none -> A, A -> B, A -> none      PVC present, Secret gone -> REFUSED
    reinstall over a kept PVC         PVC present, Secret gone -> REFUSED

  That last row is a case name-keying could not reach at all, and Arturo named it:
  uninstall drops the Secret and keeps the PVC, so a reinstall under any name
  re-mints against retained data.

  IT ALSO FIRES ON A DELETED SECRET, deliberately. An operator who removes the
  Secret expecting regeneration is walking into the same lockout; refusing names it
  before the fact instead of after.

  THE REMEDY IS CHEAP, which is why it leads the message. The credentials live in
  the Secret and the data lives in `mysql-pvc`, whose name never moves -- so a
  rename needs the Secret copied to the new effective name and nothing else. The
  old advice (back up, uninstall, reinstall, restore) was heavier than the problem.

  DRY-RUN, stated rather than discovered: both `lookup`s are empty under `helm
  template`, `--dry-run` and every client-side renderer, so this refusal is inert
  there for the same reason tier 2 above is. It is a live-cluster guard and cannot
  be otherwise -- the question it asks is "what is already in this namespace". The
  chart-test tier therefore cannot exercise it; `scripts/tests/` covers the
  reachable half.
*/ -}}
{{- $mysqlDataPresent := (lookup "v1" "PersistentVolumeClaim" .Release.Namespace (include "tracebloc.mysqlPvc" .)) -}}
{{- /*
  "NOTHING ELSE HAS TO MOVE" IS ONLY TRUE OFF hostPath (Bugbot, High).
  The PVC name is a literal and is `keep`-annotated, so it survives a rename --
  that half of the remedy is sound. The hostPath PVs are neither: their names go
  through `tracebloc.fullname` (`mysqlPvName` / `clientDataPvName` /
  `clientLogsPvName`) and only the PVCs carry `helm.sh/resource-policy: keep`.
  So on a bare-metal install the copy-the-Secret remedy is INCOMPLETE: the
  upgrade deletes `<old>-mysql-pv` / `-data-pv` / `-logs-pv` and creates them
  under the new name, while the retained PVCs stay Bound to the objects that
  just went away. Telling an operator "nothing else has to move" there sends
  them into exactly that.
*/ -}}
{{- $pvCaveat := "" -}}
{{- /* NIL-GUARDED: `--reuse-values` from a release that predates the key leaves
   `.Values.hostPath` nil, and an unguarded `.enabled` then dies mid-render
   (Bugbot, Medium).

   NOT "like every other read in this chart" -- that was this comment's first
   wording and it is not true. Measured on this tree: 8 sites go through
   `default dict`, 9 read `.enabled` bare, so the guarded form is barely half.
   The nine are backend#2910. The practical consequence for anyone reading this
   line as reassurance: a whole-chart render under `hostPath: null` still dies at
   `shared-images-pvc.yaml:3`, before this file, so this guard is provable only
   under a TEMPLATE-SCOPED render -- which is what
   `client/tests/secrets_test.yaml` does. */ -}}
{{- if (default dict .Values.hostPath).enabled -}}
{{-   $pvCaveat = printf " NOTE, and this install is one: with hostPath enabled the PersistentVolumes %q, %q and %q DO follow fullnameOverride, and unlike the PVCs they carry no helm.sh/resource-policy: keep -- so copying the Secret is NOT sufficient on its own. The upgrade would delete those PVs and create them under the new name while the retained PVCs stay Bound to the deleted ones. Either keep the name (the ALTERNATIVELY path below), or re-point the PVCs at the new PVs by hand before re-running." (include "tracebloc.mysqlPvName" .) (include "tracebloc.clientDataPvName" .) (include "tracebloc.clientLogsPvName" .) -}}
{{- end -}}
{{- if and $mysqlDataPresent (not $existingSecret) -}}
{{-   fail (printf "release %q in namespace %q already has MySQL data (PersistentVolumeClaim %q, retained by helm.sh/resource-policy: keep), but there is no Secret named %q -- the name this render resolves to. The credentials below would therefore be re-minted while that database still holds the old ones: the upgrade would report deployed and MySQL would refuse every login. FIX: copy the existing credentials to the name this render wants, then re-run --  kubectl -n %s get secret <current-secret-name> -o json | jq '.metadata.name=\"%s\" | del(.metadata.uid,.metadata.resourceVersion,.metadata.creationTimestamp,.metadata.ownerReferences)' | kubectl apply -f -  . The MySQL PVC is named %q and never follows fullnameOverride, so the DATABASE does not have to move.%s ALTERNATIVELY: put fullnameOverride back to the value this release was last rendered with, so the existing Secret matches again. IF YOU ARE DELIBERATELY STARTING FROM AN EMPTY DATABASE and there is no Secret to copy -- the uninstall-and-recover flow in docs/MIGRATIONS.md Option C, where the uninstall deleted it -- then delete the datadir and let this render mint fresh credentials:  kubectl -n %s delete pvc %s  . That is the accept-data-loss path and it is the only other way past this refusal." .Release.Name .Release.Namespace (include "tracebloc.mysqlPvc" .) $secretName .Release.Namespace $secretName (include "tracebloc.mysqlPvc" .) $pvCaveat .Release.Namespace (include "tracebloc.mysqlPvc" .)) -}}
{{- end -}}
{{- /*
  AND THE PV RENAME IS REFUSED ON ITS OWN TERMS, not only described.

  WHY THIS EXISTS ALONGSIDE THE NOTES.txt CAVEAT. Those two cover different
  halves and neither covers both. NOTES.txt renders on every hostPath install,
  including `helm template` and every dry-run, so it is the half that is always
  VISIBLE -- but it is advisory: it prints after a successful render and cannot
  stop the upgrade that deletes the PVs. This guard is the half that BLOCKS. It
  is `lookup`-based and therefore inert in every client-side renderer, so it can
  only ever fire where the damage would actually happen. Advisory-everywhere plus
  blocking-where-it-counts; drop either and the other does not cover for it.

  WHAT IT COMPARES, and why the claim rather than a PV lookup: the claim is
  namespaced and already fetched above, and its `spec.volumeName` records the PV
  it is actually Bound to -- written by the binding controller, which is why no
  template sets it and no chart test can see it. Reading it needs no
  cluster-scoped PV read, so a client without PV RBAC gets a correct answer
  instead of an empty `lookup` that would read as "renamed" on every upgrade and
  refuse all of them.

  WHY `$hostPathOn` IS LOAD-BEARING rather than decoration: off hostPath the
  volume is provisioned dynamically and named `pvc-<uuid>` by the provisioner,
  which never matches `tracebloc.fullname`. Without that conjunct this guard
  would refuse every single storage-class install.

  IT STATES WHAT IT MEASURED. A mismatch here is a rename in the overwhelming
  case, but it is also what "hostPath switched on over a dynamically provisioned
  claim" looks like, and that needs the same hand-repair. The message names the
  observed pair and both causes rather than asserting one.
*/ -}}
{{- $hostPathOn := (default dict .Values.hostPath).enabled | default false -}}
{{- $boundPv := "" -}}
{{- if $mysqlDataPresent -}}
{{-   $boundPv = dig "spec" "volumeName" "" $mysqlDataPresent -}}
{{- end -}}
{{- if and $hostPathOn $boundPv (ne $boundPv (include "tracebloc.mysqlPvName" .)) -}}
{{-   fail (printf "release %q in namespace %q has hostPath enabled and its retained PersistentVolumeClaim %q is Bound to PersistentVolume %q, but this render names that volume %q. The hostPath PersistentVolumes follow fullnameOverride (%q, %q, %q) and, unlike the PVCs, carry no helm.sh/resource-policy: keep -- so this upgrade would DELETE the three PVs the claims are Bound to and create them under the new names, leaving the kept PVCs Bound to objects that no longer exist. The datadir itself is not at risk: the on-disk path keeps the RELEASE name, which this value does not change. TWO CAUSES look like this. (1) fullnameOverride moved on a live release -- put it back to the value this release was last rendered with, or delete and recreate the three PVCs against the new PVs by hand before re-running. (2) hostPath was switched ON over a release whose claims were dynamically provisioned -- a provisioner-generated name looks like pvc-<uuid>, so compare that against %q rather than taking this guess -- and that is a storage migration, not a config change; keep hostPath off, or move the data deliberately. NOTE: copying the Secret, which the credential refusal asks for, does NOT cover this -- the two are independent, which is why you can see this message without having seen that one." .Release.Name .Release.Namespace (include "tracebloc.mysqlPvc" .) $boundPv (include "tracebloc.mysqlPvName" .) (include "tracebloc.mysqlPvName" .) (include "tracebloc.clientDataPvName" .) (include "tracebloc.clientLogsPvName" .) $boundPv) -}}
{{- end -}}
{{- /*
  Platform client credentials (backend#2571). Issued by the backend, NOT
  generated here — so tier 3 is a hard failure rather than `randAlphaNum`,
  unlike every other credential in this file.

    1. explicit .Values.clientId / .Values.clientPassword (first install, or a
       deliberate re-point at a different registered client), else
    2. the value already stored in the live Secret, else
    3. fail, naming both ways to fix it.

  WHY TIER 2 EXISTS. Both were previously `required`, so they had to be supplied
  as values on every install AND every upgrade — which meant they were
  necessarily written into the Helm release's user-supplied values in cleartext,
  in EVERY retained revision. Rotating the credential did not clear older
  revisions, and anyone with `get secret` in the namespace could read all of
  them. Tier 2 lets an operator pre-create the Secret out of band, or install
  once with values and then drop them, so the credential need never enter
  release values. Mirrors the 3-tier pattern already used by
  podTokenSigningSecret, credmgrPassword, tbMetaPassword, tbIngestPassword and
  bootstrapDbPassword — this file's own established shape.

  DRY-RUN: `lookup` is empty during `helm template`, so tier 2 cannot fire and
  an offline render without values fails — exactly as it did before this change.
  Offline rendering has always required the values to be passed in.

  AND THAT LIMIT HAS A NAME: ANY CLIENT-SIDE RENDERER (Bugbot/#859, saqlain).
  `lookup` needs a live cluster, so it is inert not only under `helm template`
  and `--dry-run` but under every tool that renders manifests WITHOUT one —
  ArgoCD's default renderer and Flux post-render among them. The other five
  credentials survive that: their tier 3 is `randAlphaNum`, so an inert lookup
  degrades to a generated value. These two CANNOT, because the backend issues
  them and the chart must never invent one — so tier 3 is a hard `fail` and a
  GitOps render with the values dropped does not degrade, it stops.

  SO, STATED PLAINLY RATHER THAN LEFT TO BE DISCOVERED: a GitOps-rendered
  install must keep clientId/clientPassword in its values, and for it the
  cleartext-in-revisions problem this change fixes is NOT fixed. Server-side
  apply (`argocd-repo-server` with a live cluster, or `helm upgrade` run from
  CI against the cluster) is what makes tier 2 reachable; the value-free path
  is for those. Narrowing that gap needs a different mechanism — an external
  secrets operator writing the Secret before render — and is out of scope here.

  TIER 2 TESTS THE DECODED VALUE, NOT THE KEY. `hasKey` alone would accept
  `CLIENT_ID: ""`, and it must not: `minLength: 1` had to come out of
  values.schema.json so lookup could run at all (schema validation happens
  before render), so this template is now the ONLY layer that can refuse an
  empty credential. Keying off presence would let helm succeed and ship blank
  credentials into the pods — the exact failure the schema used to catch
  (Bugbot, #859). An empty key therefore reads as ABSENT and falls to tier 3.
*/ -}}
{{- $secretClientId := "" -}}
{{- if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "CLIENT_ID") -}}
{{-   $secretClientId = (index $existingSecret.data "CLIENT_ID" | b64dec) -}}
{{- end -}}
{{- $secretClientPassword := "" -}}
{{- if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "CLIENT_PASSWORD") -}}
{{-   $secretClientPassword = (index $existingSecret.data "CLIENT_PASSWORD" | b64dec) -}}
{{- end -}}
{{- $clientId := "" -}}
{{- if .Values.clientId -}}
{{-   $clientId = .Values.clientId -}}
{{- else if $secretClientId -}}
{{-   $clientId = $secretClientId -}}
{{- else -}}
{{-   fail "clientId is required and could not be resolved. Either set it (--set clientId=... or a values file), or pre-create the release Secret with a non-empty CLIENT_ID key AND Helm's ownership metadata so the chart adopts that Secret instead of colliding with it -- values.yaml carries the exact commands (backend#2571)." -}}
{{- end -}}
{{- $clientPassword := "" -}}
{{- if .Values.clientPassword -}}
{{-   $clientPassword = .Values.clientPassword -}}
{{- else if $secretClientPassword -}}
{{-   $clientPassword = $secretClientPassword -}}
{{- else -}}
{{-   fail "clientPassword is required and could not be resolved. Either set it (--set clientPassword=... or a values file), or pre-create the release Secret with a non-empty CLIENT_PASSWORD key AND Helm's ownership metadata so the chart adopts that Secret instead of colliding with it -- values.yaml carries the exact commands (backend#2571)." -}}
{{- end -}}
{{- /*
  Placeholder guards run on the RESOLVED value, so a placeholder is caught
  whether it came from values or from a Secret someone pre-created badly.
*/ -}}
{{- if regexMatch "^<.*>$" $clientId -}}{{- fail "clientId looks like a placeholder (e.g. \"<CLIENT_ID>\"); set a real value" -}}{{- end -}}
{{- if regexMatch "^<.*>$" $clientPassword -}}{{- fail "clientPassword looks like a placeholder (e.g. \"<CLIENT_PASSWORD>\"); set a real value" -}}{{- end -}}
{{- /*
  Pod-proxy token signing secret (client-runtime#79). Stability is critical:
  a token minted before an upgrade must still verify after, so we must NOT
  regenerate the secret on every `helm upgrade`. Resolution order:
    1. explicit .Values.podTokenSigningSecret (operator pin / rotation), else
    2. the value already stored in the live Secret (preserve across upgrades), else
    3. a freshly generated random secret (first install).
  `lookup` returns an empty dict during `helm template`/dry-run; that's fine —
  it falls through to generate, and the rendered value is only consumed at a
  real install/upgrade.
*/ -}}
{{- $podTokenSecret := "" -}}
{{- if .Values.podTokenSigningSecret -}}
{{-   $podTokenSecret = .Values.podTokenSigningSecret -}}
{{- else if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "POD_TOKEN_SIGNING_SECRET") -}}
{{-   $podTokenSecret = (index $existingSecret.data "POD_TOKEN_SIGNING_SECRET" | b64dec) -}}
{{- else -}}
{{-   $podTokenSecret = randAlphaNum 48 -}}
{{- end -}}
{{- /*
  Credential-manager password (RFC-0003 D10, backend#1181). Same generate-once
  stability + 3-tier resolution as the signing secret above:
    1. explicit .Values.credmgrPassword (operator pin — DR, a pre-created
       MySQL account, or a forced rotation), else
    2. the value already stored in the live Secret (preserve across upgrades), else
    3. a freshly generated random secret (first install).
  jobs-manager syncs the tb_credmgr account to this value on every startup, so
  it must be stable across upgrades (regenerating it would churn the account).
  Emitted only when perExperimentDbCreds is on.
  NOTE (edge): because the key is emitted only while the flag is on, an
  off→on→off→on toggle drops then regenerates it via tier 3, rotating the
  account until jobs-manager re-syncs. Pin .Values.credmgrPassword to keep it
  stable across toggles — acceptable for the dev-first rollout; the pin is the
  fix (Saqlain review).
*/ -}}
{{- $credmgrPassword := "" -}}
{{- if (include "tracebloc.perExperimentDbCreds" .) -}}
{{-   if .Values.credmgrPassword -}}
{{-     if not (regexMatch "^[A-Za-z0-9]+$" .Values.credmgrPassword) -}}
{{-       fail "credmgrPassword must be alphanumeric ([A-Za-z0-9]+) — jobs-manager rejects other characters in the tb_credmgr password" -}}
{{-     end -}}
{{-     $credmgrPassword = .Values.credmgrPassword -}}
{{-   else if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "TB_CREDMGR_PASSWORD") -}}
{{-     $credmgrPassword = (index $existingSecret.data "TB_CREDMGR_PASSWORD" | b64dec) -}}
{{-   else -}}
{{-     $credmgrPassword = randAlphaNum 48 -}}
{{-   end -}}
{{- end -}}
{{- /*
  Dedicated service-account passwords (backend#1528 S1). tb_meta owns the
  metadata DB, tb_ingest writes the dataset DB; together they replace the
  root-equivalent edgeuser. Same generate-once stability + 3-tier resolution as
  the credmgr password above, one per account:
    1. explicit .Values.tbMetaPassword / .Values.tbIngestPassword (operator pin
       — DR, a pre-created MySQL account, or a forced rotation), else
    2. the value already stored in the live Secret (preserve across upgrades), else
    3. a freshly generated random secret (first install).
  jobs-manager re-syncs each account to its value on every startup, so both must
  be stable across upgrades (regenerating would churn the account). Emitted only
  when serviceDbAccounts is on; the same off->on->off->on toggle caveat as
  credmgr applies — pin the values to keep them stable across toggles.
*/ -}}
{{- $tbMetaPassword := "" -}}
{{- $tbIngestPassword := "" -}}
{{- if (include "tracebloc.serviceDbAccounts" .) -}}
{{-   if .Values.tbMetaPassword -}}
{{-     if not (regexMatch "^[A-Za-z0-9]+$" .Values.tbMetaPassword) -}}
{{-       fail "tbMetaPassword must be alphanumeric ([A-Za-z0-9]+) — jobs-manager rejects other characters in the tb_meta password" -}}
{{-     end -}}
{{-     $tbMetaPassword = .Values.tbMetaPassword -}}
{{-   else if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "TB_META_PASSWORD") -}}
{{-     $tbMetaPassword = (index $existingSecret.data "TB_META_PASSWORD" | b64dec) -}}
{{-   else -}}
{{-     $tbMetaPassword = randAlphaNum 48 -}}
{{-   end -}}
{{-   if .Values.tbIngestPassword -}}
{{-     if not (regexMatch "^[A-Za-z0-9]+$" .Values.tbIngestPassword) -}}
{{-       fail "tbIngestPassword must be alphanumeric ([A-Za-z0-9]+) — jobs-manager rejects other characters in the tb_ingest password" -}}
{{-     end -}}
{{-     $tbIngestPassword = .Values.tbIngestPassword -}}
{{-   else if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "TB_INGEST_PASSWORD") -}}
{{-     $tbIngestPassword = (index $existingSecret.data "TB_INGEST_PASSWORD" | b64dec) -}}
{{-   else -}}
{{-     $tbIngestPassword = randAlphaNum 48 -}}
{{-   end -}}
{{- end -}}
{{- /*
  Chart-managed mysql-client root password (backend#947 / backend#1528 Phase 0).
  Rotates root off the image's baked literal. Same generate-once stability +
  3-tier resolution as the credmgr / tb_* passwords:
    1. explicit .Values.mysqlRootPassword (operator pin — DR, or to match a
       pre-rotated account), else
    2. the value already stored in the live Secret (preserve across upgrades), else
    3. a freshly generated random secret (first install).
  mysql-deployment injects this as MYSQL_ROOT_PASSWORD, which the mysql entrypoint
  honours only at FRESH datadir init — so a fresh install is born rotated. An
  EXISTING datadir keeps root's current password until the one-time
  `ALTER USER 'root'@'%'/'@localhost' IDENTIFIED BY '<this value>'` rollout step
  reads this key and aligns the live account. Emitted only when the rotation gate
  is on; NOT constrained to alphanumeric (only ever a connection parameter, never
  interpolated into DDL). The same off->on->off toggle caveat as credmgr applies —
  pin .Values.mysqlRootPassword to keep it stable across toggles.
*/ -}}
{{- $mysqlRootPassword := "" -}}
{{- if (include "tracebloc.rotateMysqlRoot" .) -}}
{{-   if .Values.mysqlRootPassword -}}
{{-     if regexMatch "^<.*>$" .Values.mysqlRootPassword -}}
{{-       fail "mysqlRootPassword looks like a placeholder (e.g. \"<ROOT_PASSWORD>\"); set a real value" -}}
{{-     end -}}
{{-     if not (regexMatch "^[A-Za-z0-9]+$" .Values.mysqlRootPassword) -}}
{{-       fail "mysqlRootPassword must be alphanumeric ([A-Za-z0-9]+) — the backend#947 rotation runbook embeds this value in an ALTER USER ... IDENTIFIED BY '...' statement, so a quote or shell/SQL metacharacter would break the one-time rotation. (Generated randAlphaNum values already satisfy this.)" -}}
{{-     end -}}
{{-     $mysqlRootPassword = .Values.mysqlRootPassword -}}
{{-   else if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "MYSQL_ROOT_PASSWORD") -}}
{{-     $mysqlRootPassword = (index $existingSecret.data "MYSQL_ROOT_PASSWORD" | b64dec) -}}
{{-   else -}}
{{- /*
      TIER 3 MINTS A NEW ROOT PASSWORD -- SAFE ONLY ON A FRESH DATADIR
      (backend#2879). The mysql entrypoint honours MYSQL_ROOT_PASSWORD ONLY at
      first datadir init, so a fresh install is born with this generated value
      and root authenticates with it. An EXISTING datadir ignores the env: its
      live root account keeps the install-time (baked) password while this new
      value lands in the Secret and the pod env. Nothing in the chart runs the
      one-time `ALTER USER 'root'` that aligns them (it would need root's CURRENT
      password), so after the flip root authenticates with NEITHER value -- helm
      reports success while jobs-manager CrashLoops on `1045 Access denied for
      user 'root'` and the upgrade times out on `Deployment not ready`. That
      migration is documented, mandatory and entirely manual
      (docs/migration-tools/rotate-mysql-root.md); refuse to render it as a
      silent flag-flip.

      A tier-3 mint is refused (unless acknowledged) in THREE cases, because the
      render must be able to prove the datadir is fresh before it mints -- and
      cluster-less it cannot (backend#2892):
        (1) LIVE existing datadir -- `mysql-pvc` is found by `lookup`.
        (2) DECLARED existing datadir -- `mysqlDatadirExists: true` in values, an
            explicit operator assertion (e.g. a live render whose PVC is named
            differently, or belt-and-braces on a known-existing fleet).
        (3) CANNOT SEE A CLUSTER AT ALL -- `lookup` of `kube-system` is empty:
            `helm template`, `--dry-run=client`, ArgoCD's default (non-server-
            side) render, Flux post-render. This is the fail-CLOSED arm. Offline
            the chart can neither check for an existing datadir NOR preserve the
            value it mints (tier-2 preservation is a live `lookup` too), so an
            offline mint re-randomises every render and never converges -- fresh
            or not, that render is broken. Refuse it rather than mint a password
            the database may never accept.
      `unknown` (cannot-see-cluster) is a THIRD answer, not a tidier `no`: reading
      it as "datadir absent, mint away" is the silent-zero shape this epic keeps
      finding (cf. `tracebloc.telemetryTokenPresent`, which triages the same
      empty `lookup` of `kube-system`). The ONLY render that reaches the mint is a
      FRESH install on a LIVE cluster -- PVC absent, cluster visible, nothing
      declared -> born rotated, and the next live render's tier 2 preserves it.
      The operator clears all three arms, per the runbook, with
      `mysqlRootRotationAcknowledged=true`; a cluster-less fleet that actually
      wants the rotation pins mysqlRootPassword (tier 1, below -- deterministic
      and it bypasses this mint) or renders server-side (argocd-repo-server
      against the live cluster) -- see docs/migration-tools/rotate-mysql-root.md.

      SCOPED TO THE MINT ON PURPOSE. Tier 1 is left unguarded by design, not
      omission: a pin is an explicit operator assertion of root's password (the
      DR / pre-rotated-account path), and a fleet already pinned to root's LIVE
      password is HEALTHY -- guarding tier 1 would fail its every auto-upgrade
      (`--reset-then-reuse-values`) and break a working fleet. The mint is
      different: a tier-3 existing-datadir fleet is never healthy (the random
      value matches nothing), so refusing it only ever converts a silent auth
      break into a loud, actionable one. This is also why the guard cannot
      regress any currently-working fleet.
*/ -}}
{{-     $mysqlPvcName := include "tracebloc.mysqlPvc" . -}}
{{-     $datadirPvc := (lookup "v1" "PersistentVolumeClaim" .Release.Namespace $mysqlPvcName) -}}
{{- /*
      backend#2892: the fail-CLOSED guard. `$clusterVisible` is the three-valued
      cluster-presence probe (empty `lookup` of kube-system == cannot see a
      cluster == offline render). `$datadirExists` OR-s the live PVC with the
      values-level declaration. Refuse the mint (unless acknowledged) when an
      existing datadir is known (live or declared) OR the render is offline and
      cannot prove one absent. A FRESH install on a LIVE cluster -- PVC absent,
      cluster visible, nothing declared -- is the only render that mints.
*/ -}}
{{-     $clusterVisible := (lookup "v1" "Namespace" "" "kube-system") -}}
{{-     $datadirExists := or $datadirPvc .Values.mysqlDatadirExists -}}
{{-     if not .Values.mysqlRootRotationAcknowledged -}}
{{-       if $datadirExists -}}
{{-         fail (printf "rotateMysqlRoot is on for this fleet, but its MySQL datadir already exists (PersistentVolumeClaim %q in namespace %q) and predates the rotation, so root still holds its install-time password. Rendering now would mint a NEW random root password into the Secret that the live database was never told about; because the mysql entrypoint reads MYSQL_ROOT_PASSWORD only at FRESH datadir init, root would then authenticate with neither value and the fleet would lose MySQL auth (helm reports success, jobs-manager CrashLoops on `1045 Access denied for user 'root'`, the upgrade times out on `Deployment not ready`). Enabling the rotation on an existing datadir REQUIRES the one-time, manual `ALTER USER 'root'` migration in docs/migration-tools/rotate-mysql-root.md -- the chart cannot run it (it would have to authenticate as root with the CURRENT password). Follow that runbook: it has you set `mysqlRootRotationAcknowledged=true` to acknowledge the manual step and let this render through. A FRESH install needs none of this -- with no datadir yet, root is initialised with the generated value and is born rotated. (A leftover EMPTY datadir -- a first install that failed before MySQL ever initialised, whose PVC persists under resource-policy: keep -- is the same fresh case wearing a PVC: there is no live password to migrate, so set mysqlRootRotationAcknowledged=true and the next init is born rotated; the ALTER USER step then has nothing to run against and is skipped.)" $mysqlPvcName .Release.Namespace) -}}
{{-       else if not $clusterVisible -}}
{{-         fail "rotateMysqlRoot is on, but this render cannot see a live cluster (an empty lookup of kube-system: `helm template`, `--dry-run=client`, or a cluster-less GitOps renderer such as ArgoCD's default render or Flux post-render). On the tier-3 mint path the chart would generate a NEW random root password, and cluster-less it can neither confirm the datadir is fresh -- if one already exists, root keeps its old password and the fleet loses MySQL auth (`1045 Access denied for user 'root'`) -- nor preserve the value across renders, because tier-2 preservation is itself a live lookup, so the mint re-randomises every render and never converges. Refusing rather than minting a password the database may never accept (backend#2892). To roll the rotation on a cluster-less fleet, do ONE of: render SERVER-SIDE (e.g. argocd-repo-server against the live cluster) so the chart sees the datadir and preserves the value; PIN mysqlRootPassword to a fixed alphanumeric value (tier 1 -- deterministic across renders, and it bypasses this mint); or, once you have run the one-time manual migration in docs/migration-tools/rotate-mysql-root.md, set mysqlRootRotationAcknowledged=true. A FRESH install on a LIVE cluster is unaffected -- born rotated; only cluster-less renders reach this. (If you already know the datadir exists, set mysqlDatadirExists=true for the datadir-specific message.)" -}}
{{-       end -}}
{{-     end -}}
{{-     $mysqlRootPassword = randAlphaNum 48 -}}
{{-   end -}}
{{- end -}}
{{- /*
  Bootstrap re-parent password (backend#1528 S3). DB_BOOTSTRAP_PASSWORD is the
  password jobs-manager authenticates with to run the account-minting DDL
  (CREATE USER / GRANT for tb_credmgr / tb_meta / tb_ingest). S3 re-parents that
  mint OFF the root-equivalent edgeuser onto MySQL root (client-runtime#310), so
  edgeuser can finally be REVOKEd / DROPped.

  Resolution differs DELIBERATELY from the accounts above — jobs-manager
  AUTHENTICATES as this identity, it never mints or ALTERs it:
    1. explicit .Values.bootstrapDbPassword (the MySQL root password for the
       cluster — the mysql-client image's baked default, see backend#947), else
    2. DERIVED from $mysqlRootPassword when rotateMysqlRoot is on — the chart is
       then the authority on root's password, so this is the same secret under a
       second name (backend#2738; see the long note at that branch for why it
       outranks the live Secret rather than following it), else
    3. the value already stored in the live Secret (preserve across upgrades), else
    4. FAIL. There is NO generate-random tier: a random password the server was
       never told to expect would lock jobs-manager out of MySQL — it runs no
       `ALTER USER root` to make the account match — CrashLooping the minter.
  Tier 2 is why this block sits BELOW the mysqlRootPassword resolution: it reads
  that variable, so it cannot run before it is assigned.
  No alphanumeric constraint (unlike the credmgr / tb_* passwords, which ARE
  interpolated into CREATE USER DDL): this value is only ever a mysql-connector
  connection parameter, and the baked root password is not alphanumeric. Emitted
  only when the S3 re-parent gate is on.
*/ -}}
{{- $bootstrapDbPassword := "" -}}
{{- if (include "tracebloc.bootstrapDbReparent" .) -}}
{{-   if .Values.bootstrapDbPassword -}}
{{-     if regexMatch "^<.*>$" .Values.bootstrapDbPassword -}}
{{-       fail "bootstrapDbPassword looks like a placeholder (e.g. \"<ROOT_PASSWORD>\"); set the real MySQL root password" -}}
{{-     end -}}
{{-     $bootstrapDbPassword = .Values.bootstrapDbPassword -}}
{{-   else if (include "tracebloc.rotateMysqlRoot" .) -}}
{{- /*
      DERIVED FROM THE ROTATION, not preserved separately (backend#2738).

      When rotateMysqlRoot is on, THIS CHART IS THE AUTHORITY ON ROOT'S PASSWORD:
      `$mysqlRootPassword` is what the mysql entrypoint initialises root with on a
      fresh datadir ("a fresh install is born rotated"), and what the one-time
      `ALTER USER root ... IDENTIFIED BY` step aligns an existing datadir to. So
      the value jobs-manager must authenticate with is not merely knowable, it is
      the value immediately above -- the same secret under two names.

      THIS IS WHAT MAKES THE ByEnv DEFAULT BAKEABLE. backend#1528 prescribes
      baking each fleet's achieved posture into the ByEnv defaults; backend#2738
      measured that impossible for this gate, because tiers 1 and 2 both need
      something an operator supplies and tier 3 could not invent one (a random
      value locks the minter out -- jobs-manager authenticates as root and never
      runs ALTER USER root). Deriving from the rotation invents nothing: it reads
      a value the chart already chose, and it renders on a FRESH install and under
      `helm template`, which the live-Secret tier cannot (lookup is empty there).

      ORDERED ABOVE THE LIVE SECRET DELIBERATELY, and this fixes a latent bug
      rather than only unblocking the default. If a fleet enabled the re-parent
      BEFORE rotating, its stored DB_BOOTSTRAP_PASSWORD is the pre-rotation
      literal while MYSQL_ROOT_PASSWORD is the new value -- two copies of "root's
      password" that disagree, with the stale one winning. dev and staging
      happened to rotate first (so their stored value is current), which is why
      this has not bitten. Preferring the rotation value removes the divergence
      class instead of relying on the order fleets happen to use.

      The alphanumeric constraint on mysqlRootPassword is a strict subset of what
      this key accepts (it is only ever a connection parameter), so nothing is
      lost by sharing the value.
*/ -}}
{{-     $bootstrapDbPassword = $mysqlRootPassword -}}
{{-   else if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "DB_BOOTSTRAP_PASSWORD") -}}
{{-     $bootstrapDbPassword = (index $existingSecret.data "DB_BOOTSTRAP_PASSWORD" | b64dec) -}}
{{-   else -}}
{{-     fail "bootstrapDbReparent is on but bootstrapDbPassword is unset (backend#1528 S3): set it to the MySQL root password for this cluster (the mysql-client image's baked default; see backend#947 for the value and its rotated replacement). There is no generated default — jobs-manager authenticates as root to run the account-minting DDL and cannot rotate root to match a random value, so a missing pin would lock the minter out. Alternatively enable rotateMysqlRoot for this fleet: with the rotation on, the chart owns root's password and this pin is derived from it automatically (backend#2738) -- which is also the only combination that can be baked into the ByEnv defaults. See values.yaml." -}}
{{-   end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tracebloc.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tracebloc.labels" . | nindent 4 }}
type: Opaque
data:
  CLIENT_ID: {{ $clientId | b64enc | quote }}
  CLIENT_PASSWORD: {{ $clientPassword | b64enc | quote }}
  POD_TOKEN_SIGNING_SECRET: {{ $podTokenSecret | b64enc | quote }}
{{- if (include "tracebloc.perExperimentDbCreds" .) }}
  TB_CREDMGR_PASSWORD: {{ $credmgrPassword | b64enc | quote }}
{{- end }}
{{- if (include "tracebloc.serviceDbAccounts" .) }}
  TB_META_PASSWORD: {{ $tbMetaPassword | b64enc | quote }}
  TB_INGEST_PASSWORD: {{ $tbIngestPassword | b64enc | quote }}
{{- end }}
{{- if (include "tracebloc.rotateMysqlRoot" .) }}
  MYSQL_ROOT_PASSWORD: {{ $mysqlRootPassword | b64enc | quote }}
{{- end }}
{{- if (include "tracebloc.bootstrapDbReparent" .) }}
  DB_BOOTSTRAP_PASSWORD: {{ $bootstrapDbPassword | b64enc | quote }}
{{- end }}
{{- if and (ne .Values.resourceMonitor false) (ne .Values.nodeAgents.namespace.name .Release.Namespace) }}
---
# Mirrored into the node-agents namespace so the resource-monitor DaemonSet
# can read CLIENT_ID / CLIENT_PASSWORD via secretKeyRef. Secrets are
# namespace-scoped; a pod cannot reference a Secret in another namespace.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tracebloc.secretName" . }}
  namespace: {{ .Values.nodeAgents.namespace.name }}
  labels:
    {{- include "tracebloc.labels" . | nindent 4 }}
    app: {{ include "tracebloc.resourceMonitorName" . }}
type: Opaque
data:
  CLIENT_ID: {{ $clientId | b64enc | quote }}
  CLIENT_PASSWORD: {{ $clientPassword | b64enc | quote }}
{{- end }}
