{{- if include "tracebloc.createRegistrySecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tracebloc.registrySecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tracebloc.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ template "imagePullSecret" . }}
{{- /*
  Mirrored into the node-agents namespace for BOTH its tenants (backend#1906):
  resource-monitor and the telemetry Collector. Gated on resource-monitor alone,
  a Collector-only install got the namespace but no pull Secret — ImagePullBackOff
  on every node. Every dependent resource shares the feature's gate.
  (Bugbot on #779.)
*/}}
{{- $tcReg := default (dict) .Values.telemetryCollector -}}
{{- if and (or (ne .Values.resourceMonitor false) $tcReg.enabled) (ne .Values.nodeAgents.namespace.name .Release.Namespace) }}
---
# Mirrored into the node-agents namespace so the resource-monitor DaemonSet
# can pull its image via imagePullSecrets. dockerconfigjson Secrets are
# namespace-scoped like all Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tracebloc.registrySecretName" . }}
  namespace: {{ .Values.nodeAgents.namespace.name }}
  labels:
    {{- include "tracebloc.labels" . | nindent 4 }}
    app: {{ include "tracebloc.resourceMonitorName" . }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ template "imagePullSecret" . }}
{{- end }}
{{- /* client#564: mirror the pull secret into the GPU device-plugin namespace
     (kube-system by default) so the Helm-managed DaemonSet can pull its image
     from an authenticated mirror. Same pattern as the node-agents block above;
     nil-safe for reuse-values. Skipped when that namespace is the release
     namespace (the secret above already covers it). */ -}}
{{- $dp := (.Values.gpu | default dict).devicePlugin | default dict }}
{{- $gpuNs := $dp.namespace | default "kube-system" }}
{{- if and $dp.enabled (ne $gpuNs .Release.Namespace) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tracebloc.registrySecretName" . }}
  namespace: {{ $gpuNs }}
  labels:
    {{- include "tracebloc.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ template "imagePullSecret" . }}
{{- end }}
{{- end }}
