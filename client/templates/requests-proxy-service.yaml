{{- /* The requests-proxy's in-cluster name, kept as an alias of the egress gate
     so a pod spawned before the upgrade keeps posting. Send port only: the
     record port is on egress-gate-service.yaml. */}}
apiVersion: v1
kind: Service
metadata:
  name: requests-proxy-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tracebloc.labels" . | nindent 4 }}
    app: egress-gate
spec:
  selector:
    app: egress-gate
  ports:
    - name: http
      port: 8888
      targetPort: 8888
      protocol: TCP
  type: ClusterIP
