suite: image-refresh CronJob and RBAC
templates:
  - templates/image-refresh-cronjob.yaml
  - templates/image-refresh-rbac.yaml
release:
  name: stg
  namespace: tracebloc
set:
  clientId: "test-id"
  clientPassword: "test"
tests:
  - it: cronjob template renders ConfigMap + CronJob by default
    template: templates/image-refresh-cronjob.yaml
    asserts:
      - hasDocuments:
          count: 2

  # #569 added a SECOND Role + RoleBinding, in the node-agents namespace, so the
  # CronJob can `kubectl set image` the resource-monitor DaemonSet that lives
  # there. 3 documents -> 5.
  - it: rbac template renders ServiceAccount + both Roles + both RoleBindings by default
    template: templates/image-refresh-rbac.yaml
    asserts:
      - hasDocuments:
          count: 5

  # The node-agents grant is pure unused surface when there is no DaemonSet to
  # reconcile, so it is not rendered at all in that case — back to 3 documents.
  - it: rbac template omits the node-agents Role when resourceMonitor is disabled
    template: templates/image-refresh-rbac.yaml
    set:
      resourceMonitor: false
      # BOTH TENANTS, EXPLICITLY. `resourceMonitor: false` alone stopped meaning
      # "the node-agents namespace has no pod-bearing tenant" when backend#1906
      # made the Collector tri-state: with `telemetryCollector.enabled` ABSENT the
      # chart resolves to fleet mode, which is `enabled`, so the Collector IS a
      # tenant and this namespace does get a DaemonSet. Without the line below this
      # test asserts the fleet-default path while claiming to assert the empty one.
      telemetryCollector:
        enabled: false
    asserts:
      - hasDocuments:
          count: 3

  - it: cronjob template renders nothing when imageRefresh.enabled=false
    template: templates/image-refresh-cronjob.yaml
    set:
      imageRefresh:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: rbac template renders nothing when imageRefresh.enabled=false
    template: templates/image-refresh-rbac.yaml
    set:
      imageRefresh:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: cronjob template renders nothing when all three refreshed images are pinned
    # jobs-manager + pods-monitor + resource-monitor are the images this CronJob
    # refreshes. The ingestor is spawned by jobs-manager from a floating tag, not
    # refreshed here; requests-proxy runs the jobs-manager IMAGE and follows its
    # digest, so it needs no entry of its own. When all three are digest-pinned
    # there is nothing left to reconcile, so the CronJob renders nothing.
    # A pinned image is signalled by a non-empty `digest`.
    template: templates/image-refresh-cronjob.yaml
    set:
      images:
        jobsManager:
          digest: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
        podsMonitor:
          digest: "sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
        resourceMonitor:
          digest: "sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"
    asserts:
      - hasDocuments:
          count: 0

  # #569 regression guard: pinning only the two class-1 images is no longer
  # enough to retire the CronJob, because resource-monitor can still drift.
  # Before #569 this combination rendered nothing, which would have left the
  # DaemonSet with no update path at all.
  - it: cronjob STILL renders when resource-monitor is unpinned but both class-1 images are
    template: templates/image-refresh-cronjob.yaml
    set:
      images:
        jobsManager:
          digest: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
        podsMonitor:
          digest: "sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
    asserts:
      - hasDocuments:
          count: 2

  - it: rbac template renders nothing when all three refreshed images are pinned
    template: templates/image-refresh-rbac.yaml
    set:
      images:
        jobsManager:
          digest: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
        podsMonitor:
          digest: "sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
        resourceMonitor:
          digest: "sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"
    asserts:
      - hasDocuments:
          count: 0

  - it: cronjob STILL renders when the ingestor is pinned but a class-1 image is not
    # Regression guard: the ingestor no longer gates this CronJob. Setting
    # any ingestor field (here a pinned digest) must NOT make the CronJob
    # disappear — as long as a class-1 image (here pods-monitor) can still
    # drift, the CronJob must render. This is the inverse of the old
    # "ingestor keeps the CronJob alive" behaviour, retired with the
    # floating-tag migration.
    template: templates/image-refresh-cronjob.yaml
    set:
      images:
        jobsManager:
          digest: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
        ingestor:
          digest: "sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"
    asserts:
      - hasDocuments:
          count: 2

  - it: cronjob still renders when only ONE image is digest-pinned
    # The other images can still drift, so the CronJob must run and the
    # script skips pinned images via env flags.
    template: templates/image-refresh-cronjob.yaml
    documentIndex: 1
    set:
      images:
        jobsManager:
          digest: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    asserts:
      - isKind:
          of: CronJob
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: JOBS_MANAGER_PINNED
            value: "1"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: PODS_MONITOR_PINNED
            value: "0"
      # The ingestor is no longer wired into this CronJob — no
      # INGESTOR_PINNED / INGESTOR_TAG / INGESTOR_RESOLVE_FAIL_THRESHOLD env.
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: INGESTOR_PINNED
            value: "0"

  - it: ConfigMap holds the digest-poll script
    template: templates/image-refresh-cronjob.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: stg-image-refresh
      # #569: the action is `kubectl set image`, NOT `kubectl rollout restart`.
      # A restart only picks up a new build because of imagePullPolicy=Always,
      # and Always is exactly what makes an offline restart fail. Changing the
      # image REFERENCE is what lets the pods run IfNotPresent, so assert the
      # new verb is present AND the old one is gone — a silent revert to
      # `rollout restart` would leave the pull policy fix updating nothing.
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: "kubectl set image"
      # Anchored to a COMMAND line (leading whitespace, no `#`) so the header
      # comments that explain why the mechanism changed don't trip it.
      - notMatchRegex:
          path: data["image-refresh.sh"]
          pattern: '(?m)^\s*kubectl rollout restart'
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: "registry-1.docker.io"
      # Regression guard (#634): kubectl in the alpine/k8s image does not
      # reliably auto-detect in-cluster config in this pod, so the script MUST
      # build an explicit in-cluster kubeconfig from the mounted ServiceAccount
      # (API server from KUBERNETES_SERVICE_*, ca + token from the projected SA
      # volume) before any API call. Without this every tick failed against
      # http://localhost:8080 fleet-wide. Lock the preamble in place.
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: "export KUBECONFIG="
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: 'kubectl config set-cluster in-cluster'
      # The server authority is built from the *bracketed* API host so an IPv6
      # KUBERNETES_SERVICE_HOST yields a valid URL (client-go net.JoinHostPort).
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: 'api_host="\[\$api_host\]"'
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: 'server="https://\$\{api_host\}:\$\{KUBERNETES_SERVICE_PORT\}"'
      # The bearer token goes in via tokenFile (a path) and MUST NOT be passed
      # as --token=<value> on the kubectl argv (credential exposure via procfs).
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: 'users\.in-cluster\.tokenFile'
      - notMatchRegex:
          path: data["image-refresh.sh"]
          pattern: 'set-credentials in-cluster --token'
      # Regression guard (#546): the tick MUST skip when the deployment isn't settled,
      # so a stuck/unschedulable jobs-manager (e.g. the RWO-PVC deadlock #545) can't be
      # re-restarted every tick into a ReplicaSet storm. The guard runs `rollout status`
      # and exits early before the digest loop.
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: "not settled .* skipping this refresh tick"
      # Regression guard: the digest-pinned skip MUST stay in the script.
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: "pinned by digest in values"
      # Regression guard (Bugbot #1008): the requests-proxy is a SEPARATE
      # deployment running the SAME jobs-manager image, so the no-op "already on
      # the pinned digest" decision MUST also read the proxy and fall through
      # when it is off the digest -- else a partial re-pin (api pinned, proxy
      # still on :tag) is declared unchanged forever off the api match alone and
      # never retried. Lock the reader and the per-workload digest check in
      # place. (The BEHAVIOUR -- that an inverted check reddens -- is asserted in
      # scripts/tests/image-refresh-repin-on-revert.bats; this only pins that the
      # two pieces still exist in the shipped script.)
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: 'requests_proxy_image\(\)'
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: 'proxy_on_digest'
      # Regression guard: the script must HEAD the manifest with all
      # four Accept media types in a SINGLE comma-separated Accept
      # header per the Docker registry v2 spec (some proxies have been
      # observed dropping repeated Accept headers — caught in PR #155
      # review, bugbot medium severity).
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: 'Accept: application/vnd\.docker\.distribution\.manifest\.v2\+json,application/vnd\.docker\.distribution\.manifest\.list\.v2\+json,application/vnd\.oci\.image\.manifest\.v1\+json,application/vnd\.oci\.image\.index\.v1\+json'
      # Regression guard: case-fold response headers with tr BEFORE awk.
      # alpine/k8s ships BusyBox awk which silently ignores gawk's
      # IGNORECASE=1; a mixed-case `Docker-Content-Digest` from an
      # HTTP/1.1 proxy would otherwise never match. Caught in PR #155
      # review (bugbot medium severity).
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: "tr '\\[:upper:\\]' '\\[:lower:\\]'"
      - notMatchRegex:
          path: data["image-refresh.sh"]
          pattern: "BEGIN[{ ]IGNORECASE"
      # Regression guard: log() MUST write to stderr (>&2) so log lines
      # cannot pollute command-substitution capture sites like
      # `latest="$(get_latest_digest "$repo")"`. Caught in PR #155
      # review (bugbot medium severity).
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: 'log\(\) \{ printf .*>&2'
      # Regression guards for the annotation-based comparison model.
      # Source of truth is `tracebloc.io/last-refreshed-*-digest`
      # annotations on the deployment, NOT the pod's
      # containerStatuses[].imageID. This shape is deliberate — it
      # sidesteps imageID format variance across runtimes and the
      # multi-arch index-vs-platform-digest divergence. A future
      # refactor that re-introduces imageID comparison would re-
      # introduce that whole class of bugs.
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: "tracebloc\\.io/last-refreshed-jobs-manager-digest"
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: "tracebloc\\.io/last-refreshed-pods-monitor-digest"
      # Regression guard: read annotations with jq, not kubectl
      # bracket-notation jsonpath. kubectl-go's jsonpath parser returns
      # empty for `annotations['key.with.dots']` — verified on
      # alpine/k8s 1.30.5 in dev-cluster smoke test. Switching to
      # `kubectl get -o json | jq` made the read work.
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: "jq -r --arg k"
      # And the script must NOT regress back to bracket-notation
      # jsonpath for reading annotations.
      - notMatchRegex:
          path: data["image-refresh.sh"]
          pattern: "annotations\\[.\\$_key.\\]"
      # The script must NOT reach into pod containerStatuses to read
      # imageIDs — that's the runtime-variant data shape we explicitly
      # designed around. Pattern targets the only call shape that could
      # do it (`kubectl get pod`) rather than the words, so the design-
      # rationale comments are free to keep mentioning containerStatuses
      # / imageID as history.
      - notMatchRegex:
          path: data["image-refresh.sh"]
          pattern: "kubectl get pod"
      # First-observation contract: when an annotation is absent
      # (recorded is empty), the script must record the current digest
      # WITHOUT touching the workload. #569 keeps this deliberately —
      # re-imaging on the first tick would rewrite repo:tag to repo@digest
      # for byte-identical content on every fresh install, rolling the
      # jobs-manager Deployment and the resource-monitor DaemonSet across
      # every node for nothing.
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: "first observation; recording without re-imaging"
      # Order-of-operations contract: the re-image (`kubectl set image` +
      # `kubectl rollout status`) MUST run before the `kubectl annotate` that
      # records the digest. If we annotated first and the rollout then failed,
      # the next tick would see recorded == latest and skip — leaving the
      # deployment frozen on the old image with no signal.
      #
      # ANCHORED TO COMMAND LINES (`(?m)^\s+kubectl`). This assertion used to
      # name `kubectl rollout restart`, which #569 REMOVED — and the sibling
      # notMatchRegex above forbids it on a command line. So the only thing it
      # could still match was the header comments that explain the old
      # mechanism, and it passed no matter what order the real commands ran in.
      # A regress that annotated before re-imaging would have frozen workloads
      # on the old image with a green suite (Bugbot, client#713).
      #
      # PINNED TO THE DIGEST ANNOTATE (`$annotate_args`), not just any annotate.
      # A bare `kubectl annotate deployment` also matches the flap-counter-reset
      # annotate (`${ATTEMPT_KEY}- ${FLAP_KEY}-`), which sits after the rollout BY
      # DESIGN. So moving ONLY the digest-recording annotate above the re-image
      # left that reset still satisfying the old pattern — the suite stayed green
      # while the digest was recorded BEFORE the image was applied, which is the
      # exact freeze the guard exists to catch. Requiring the `$annotate_args`
      # continuation line ties the ordering to the digest write itself; the flap
      # reset carries different arguments and can no longer stand in for it
      # (Bugbot, client#714).
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: '(?ms)^\s+kubectl set image.*^\s+kubectl rollout status.*^\s+kubectl annotate deployment[^\n]*\n\s*\$annotate_args'
      # The ingestor is spawned by jobs-manager from a floating tag and is
      # no longer reconciled by this script — the entire class-2 pass was
      # removed (no `kubectl set env` on INGESTOR_IMAGE_DIGEST, no ghcr.io
      # poll for the spawned image, no last-refreshed-ingestor-digest
      # annotation, no get_container_env helper). These guards lock the
      # removal so a refactor can't quietly reintroduce the revert-prone
      # mechanism the floating tag replaced. (The script's design-rationale
      # comments still mention the retired mechanism as history, so these
      # target the actual code shapes — the env assignment, the helper
      # name, the annotation key — not the words.)
      - notMatchRegex:
          path: data["image-refresh.sh"]
          pattern: 'INGESTOR_IMAGE_DIGEST='
      - notMatchRegex:
          path: data["image-refresh.sh"]
          pattern: "get_container_env"
      - notMatchRegex:
          path: data["image-refresh.sh"]
          pattern: "last-refreshed-ingestor-digest"

  - it: CronJob has the right schedule, concurrency, and SA wiring
    template: templates/image-refresh-cronjob.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: metadata.name
          value: stg-image-refresh
      - equal:
          path: spec.schedule
          value: "7,22,37,52 * * * *"
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: stg-image-refresh
      # `Never`, CHANGED FROM `OnFailure` (backend#2620). Kubernetes deletes an
      # OnFailure Job's Pod once backoffLimit is exhausted, so a failing tick
      # left retained Jobs and no logs — measured on a customer prod edge that
      # had been failing hourly for 2.7 days with the reason unrecoverable.
      # `scripts/tests/cronjob-failures-are-readable.sh` sweeps every rendered
      # CronJob for the same property, so a third one is covered on arrival.
      - equal:
          path: spec.jobTemplate.spec.template.spec.restartPolicy
          value: Never

  - it: CronJob env carries release identity and tag to the script
    template: templates/image-refresh-cronjob.yaml
    documentIndex: 1
    set:
      env:
        CLIENT_ENV: "prod"
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: RELEASE_NAME
            value: stg
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: RELEASE_NAMESPACE
            value: tracebloc
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: DEPLOYMENT_NAME
            value: stg-jobs-manager
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: IMAGE_TAG
            value: prod
      # The ingestor is spawned by jobs-manager from a floating tag, so this
      # CronJob no longer carries INGESTOR_TAG / INGESTOR_PINNED /
      # INGESTOR_RESOLVE_FAIL_THRESHOLD env (the dedicated ingestor-env tests
      # were removed with the class-2 pass).

  - it: schema rejects ingestor.tag=latest
    template: templates/image-refresh-cronjob.yaml
    set:
      images:
        ingestor:
          tag: "latest"
    asserts:
      # BARE, deliberately. values.schema.json rejects this at CHART LOAD,
      # before any template renders, so helm-unittest 0.5.2 reports an "errored"
      # test and no message assertion can match a template render error that
      # never happened. This assertion therefore proves the configuration IS
      # REFUSED, not which refusal fired -- and says so instead of pretending
      # otherwise. Do NOT "strengthen" it with `errorPattern`: that key is
      # SILENTLY IGNORED by this plugin version (a pattern appearing nowhere in
      # the output still passes, so any failure satisfies it), which is the
      # defect backend#2606 removed. scripts/tests/helm-unittest-error-assertions.sh
      # fails if it reappears. To pin the specific schema text, assert it from
      # OUTSIDE the plugin (`helm template` + grep stderr), the way
      # scripts/tests/chart-env-vocabulary.sh already does.
      - failedTemplate: {}

  - it: CronJob pod satisfies PSA restricted (runAsNonRoot, dropped caps, RO root, seccomp)
    template: templates/image-refresh-cronjob.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.capabilities.drop[0]
          value: ALL

  - it: CronJob is Guaranteed QoS (cpu AND memory request==limit) so a node OOM picks it last (backend#2935)
    # backend#2935: image-refresh was exit-137 killed in lock-step with
    # auto-upgrade — the SHARED, node-level OOM cause. kubectl's measured peak
    # here is ~40-80Mi, well under 128Mi, so no ceiling was the constraint. Pin
    # BOTH cpu and memory request==limit so the pod is Guaranteed (oom_score_adj
    # -997) — a memory pin alone barely moves a Burstable pod's oom_score_adj
    # (client#948 review). No initContainers here, so cpu==limit AND memory==limit
    # is the in-manifest proxy for Guaranteed. Guard against reopening either gap.
    template: templates/image-refresh-cronjob.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources.requests.cpu
          value: 200m
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources.limits.cpu
          value: 200m
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources.requests.memory
          value: 128Mi
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources.limits.memory
          value: 128Mi

  - it: Role is namespace-scoped, deployments-only (no pods, no cluster-admin)
    # The annotation pattern eliminated the need to read pods entirely —
    # the script reads the recorded digest from a deployment annotation,
    # not from containerStatuses[].imageID. Tightening RBAC to just
    # apps/deployments shrinks the blast radius of a compromised refresh
    # Pod to one resource type in one namespace. Lock the rule list
    # with `equal` so a regression that adds back a pods rule (or worse,
    # a cluster role) fails loudly.
    #
    # #569 added requests-proxy as a `set image` target WITHOUT touching this
    # rule list: it is a Deployment in the same namespace, already covered.
    # The resource-monitor DaemonSet needed a separate Role — asserted below.
    template: templates/image-refresh-rbac.yaml
    asserts:
      - hasDocuments:
          count: 5
      - isKind:
          of: ServiceAccount
        documentIndex: 0
      - equal:
          path: metadata.name
          value: stg-image-refresh
        documentIndex: 0
      - isKind:
          of: Role
        documentIndex: 1
      - equal:
          path: rules
          value:
            - apiGroups: ["apps"]
              resources: ["deployments"]
              verbs: ["get", "list", "patch", "watch"]
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: tracebloc
        documentIndex: 1
      - equal:
          path: roleRef.kind
          value: Role
        documentIndex: 2
      - equal:
          path: subjects[0].name
          value: stg-image-refresh
        documentIndex: 2

  - it: should accept operator overrides for schedule, image, and timeout
    template: templates/image-refresh-cronjob.yaml
    documentIndex: 1
    set:
      imageRefresh:
        enabled: true
        schedule: "*/5 * * * *"
        rolloutTimeout: "20m"
        image:
          repository: my-mirror/k8s
          tag: "1.30.5"
          pullPolicy: Always
    asserts:
      - equal:
          path: spec.schedule
          value: "*/5 * * * *"
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: my-mirror/k8s:1.30.5
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].imagePullPolicy
          value: Always
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: ROLLOUT_TIMEOUT
            value: "20m"

  - it: schema rejects image.tag=latest (image-refresh behaviour must not drift)
    template: templates/image-refresh-cronjob.yaml
    set:
      imageRefresh:
        image:
          tag: "latest"
    asserts:
      # BARE, deliberately. values.schema.json rejects this at CHART LOAD,
      # before any template renders, so helm-unittest 0.5.2 reports an "errored"
      # test and no message assertion can match a template render error that
      # never happened. This assertion therefore proves the configuration IS
      # REFUSED, not which refusal fired -- and says so instead of pretending
      # otherwise. Do NOT "strengthen" it with `errorPattern`: that key is
      # SILENTLY IGNORED by this plugin version (a pattern appearing nowhere in
      # the output still passes, so any failure satisfies it), which is the
      # defect backend#2606 removed. scripts/tests/helm-unittest-error-assertions.sh
      # fails if it reappears. To pin the specific schema text, assert it from
      # OUTSIDE the plugin (`helm template` + grep stderr), the way
      # scripts/tests/chart-env-vocabulary.sh already does.
      - failedTemplate: {}

  - it: cronjob template renders nothing (no crash) when imageRefresh key is entirely absent
    # Regression guard for the --reuse-values upgrade path. Customers
    # who upgrade with `helm upgrade --reuse-values --version 1.4.0`
    # (instead of the autoUpgrade-recommended --reset-then-reuse-values)
    # replay stored 1.3.x values that have NO `imageRefresh` block at
    # all. The template must degrade silently (no resources rendered)
    # rather than crash with nil-pointer — see the "nil-guard every new
    # top-level value key" rule in CLAUDE.md.
    template: templates/image-refresh-cronjob.yaml
    set:
      imageRefresh: null
    asserts:
      - hasDocuments:
          count: 0

  - it: rbac template renders nothing (no crash) when imageRefresh key is entirely absent
    template: templates/image-refresh-rbac.yaml
    set:
      imageRefresh: null
    asserts:
      - hasDocuments:
          count: 0

  # =====================================================================
  # #569 — digest-on-update: offline-restart-safe control-plane pods.
  # =====================================================================

  - it: node-agents Role is scoped to the one resource-monitor DaemonSet
    # The single genuinely new piece of trust surface in #569. The CronJob's
    # namespace-scoped Role cannot reach the resource-monitor DaemonSet, which
    # lives in the node-agents namespace, so a SECOND Role goes there. That
    # namespace runs under the `privileged` PSA profile, so keep the grant as
    # narrow as RBAC allows and lock it with `equal`:
    #   * get + patch are resourceNames-scoped to this chart's own DaemonSet.
    #   * list + watch CANNOT be resourceNames-scoped (the authorizer ignores
    #     resourceNames for collection verbs) and `rollout status` needs both,
    #     so they stay namespace-wide and read-only. That is the residual
    #     widening and it is deliberate — assert it so it cannot grow silently.
    template: templates/image-refresh-rbac.yaml
    documentIndex: 3
    asserts:
      - isKind:
          of: Role
      # DISTINCT name from the release-namespace Role. Reusing it collided when
      # nodeAgents.namespace.name points back at the release namespace — a
      # supported layout — and the loser was the deployments Role, silently
      # costing image-refresh its patch on jobs-manager and requests-proxy.
      - equal:
          path: metadata.name
          value: stg-image-refresh-node-agents
      - equal:
          path: metadata.namespace
          value: tracebloc-node-agents
      - equal:
          path: rules
          value:
            - apiGroups: ["apps"]
              resources: ["daemonsets"]
              resourceNames: ["stg-resource-monitor"]
              verbs: ["get", "patch"]
            - apiGroups: ["apps"]
              resources: ["daemonsets"]
              verbs: ["list", "watch"]

  - it: node-agents RoleBinding binds the release-namespace ServiceAccount
    # Cross-namespace binding: the Role and RoleBinding live in the node-agents
    # namespace, but the subject SA lives in the release namespace. Getting the
    # subject namespace wrong yields a silent 403 at `set image` time.
    template: templates/image-refresh-rbac.yaml
    documentIndex: 4
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: metadata.namespace
          value: tracebloc-node-agents
      - equal:
          path: subjects[0].namespace
          value: tracebloc
      - equal:
          path: metadata.name
          value: stg-image-refresh-node-agents
      # The SUBJECT keeps the un-suffixed name: there is only ONE
      # ServiceAccount and it lives in the release namespace. Only the Role and
      # RoleBinding are renamed.
      - equal:
          path: subjects[0].name
          value: stg-image-refresh
      - equal:
          path: roleRef.kind
          value: Role
      - equal:
          path: roleRef.name
          value: stg-image-refresh-node-agents

  - it: cronjob wires the workload names the set-image reconcile targets
    template: templates/image-refresh-cronjob.yaml
    documentIndex: 1
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: REQUESTS_PROXY_DEPLOYMENT
            value: "stg-requests-proxy"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: RESOURCE_MONITOR_DAEMONSET
            value: "stg-resource-monitor"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: NODE_AGENTS_NAMESPACE
            value: "tracebloc-node-agents"

  - it: IMAGE_REGISTRY defaults to docker.io, not the empty string
    # Regression guard with teeth. values.yaml ships `global.imageRegistry: ""`,
    # so `dig "imageRegistry" "docker.io" .Values.global` returns "" — the key
    # EXISTS, so dig's own default never applies. Rendering "" here would make
    # the script's mirror guard see "" != "docker.io" and go INERT on every
    # default install, silently disabling auto-refresh fleet-wide. The template
    # needs a trailing `| default "docker.io"`; this test is what catches its
    # removal.
    template: templates/image-refresh-cronjob.yaml
    documentIndex: 1
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: IMAGE_REGISTRY
            value: "docker.io"

  - it: IMAGE_REGISTRY follows a configured private mirror
    template: templates/image-refresh-cronjob.yaml
    documentIndex: 1
    set:
      global:
        imageRegistry: "mirror.example.com"
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: IMAGE_REGISTRY
            value: "mirror.example.com"

  - it: resource-monitor counts as pinned when the DaemonSet is disabled
    # With `resourceMonitor: false` there is no DaemonSet to reconcile, so the
    # script must skip it rather than fail the tick on a cross-namespace
    # `set image` against a workload that does not exist.
    template: templates/image-refresh-cronjob.yaml
    documentIndex: 1
    set:
      resourceMonitor: false
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: RESOURCE_MONITOR_PINNED
            value: "1"

  - it: requests-proxy follows the jobs-manager digest unless explicitly pinned
    template: templates/image-refresh-cronjob.yaml
    documentIndex: 1
    set:
      images:
        requestsProxy:
          digest: "sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd"
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: REQUESTS_PROXY_PINNED
            value: "1"

  - it: script reconciles all three workloads and goes inert behind a mirror
    template: templates/image-refresh-cronjob.yaml
    documentIndex: 0
    asserts:
      # jobs-manager (both containers), requests-proxy, resource-monitor.
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: '\$jm_set_args --request-timeout'
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: 'deployment/\$\{REQUESTS_PROXY_DEPLOYMENT\}"'
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: 'daemonset/\$\{RESOURCE_MONITOR_DAEMONSET\}"'
      # The resource-monitor patch must target the node-agents namespace, not
      # the release namespace.
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: 'kubectl set image -n "\$NODE_AGENTS_NAMESPACE"'
      # Mirror guard: a digest resolved on a public registry must never be pinned
      # onto a mirrored reference the mirror may not hold. The verdict is the
      # chart-rendered IMAGE_REGISTRY_RESOLVABLE (tracebloc_registry_test.yaml
      # covers its values); anything but "true" -- including absent -- refuses.
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: 'if \[ "\$\{IMAGE_REGISTRY_RESOLVABLE:-\}" != "true" \]; then'
      # The pods-monitor container name is contractual with the deployment.
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: "pods-monitor-container="

  - it: the Job budget covers three sequential rollouts (#569, Bugbot)
    # activeDeadlineSeconds MUST exceed 3 x rolloutTimeout: a tick re-images
    # jobs-manager, requests-proxy and the resource-monitor DaemonSet in sequence
    # and blocks on each. It was a hardcoded 1800, which with the default 10m
    # rolloutTimeout is EXACTLY 3 x 10m — no headroom. Blowing it kills the Job
    # mid-wait, so the annotate never lands, the recorded digest never advances,
    # and three such ticks trip the shared flap lockout for every control-plane
    # image at once while the CronJob still looks healthy.
    template: templates/image-refresh-cronjob.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: spec.jobTemplate.spec.activeDeadlineSeconds
          value: 3600

  - it: activeDeadlineSeconds is operator-overridable
    template: templates/image-refresh-cronjob.yaml
    documentIndex: 1
    set:
      imageRefresh:
        activeDeadlineSeconds: 5400
    asserts:
      - equal:
          path: spec.jobTemplate.spec.activeDeadlineSeconds
          value: 5400

  - it: retires the CronJob when the DaemonSet is disabled and both class-1 images are pinned (#569, Bugbot)
    # The helper-vs-runtime disagreement: `imageRefreshEnabled` checked only
    # `images.resourceMonitor.digest`, while RESOURCE_MONITOR_PINNED also treated
    # `resourceMonitor: false` as pinned. So this combination kept rendering a
    # CronJob that skipped every image and exited green every tick forever —
    # where before #569 it retired cleanly. Both now read one helper.
    template: templates/image-refresh-cronjob.yaml
    set:
      resourceMonitor: false
      images:
        jobsManager:
          digest: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
        podsMonitor:
          digest: "sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
    asserts:
      - hasDocuments:
          count: 0

  - it: rbac renders nothing for that same combination
    template: templates/image-refresh-rbac.yaml
    set:
      resourceMonitor: false
      images:
        jobsManager:
          digest: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
        podsMonitor:
          digest: "sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
    asserts:
      - hasDocuments:
          count: 0

  - it: still renders when the DaemonSet is disabled but a class-1 image can drift
    # Guard the other direction: disabling resource-monitor must NOT retire the
    # CronJob while jobs-manager or pods-monitor is still floating.
    template: templates/image-refresh-cronjob.yaml
    documentIndex: 1
    set:
      resourceMonitor: false
    asserts:
      - isKind:
          of: CronJob
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: RESOURCE_MONITOR_PINNED
            value: "1"

  - it: RBAC names do not collide when node-agents shares the release namespace (#569, Bugbot High)
    # `nodeAgents.namespace.name` pointing back at the release namespace is a
    # supported layout — node-agents-namespace.yaml documents it and skips
    # creating the Namespace in that case. Both Role/RoleBinding pairs then land
    # in ONE namespace, so they must have distinct names or Helm refuses the
    # release (or the DaemonSet-only Role overwrites the deployments Role, which
    # silently strips image-refresh's patch on jobs-manager and requests-proxy —
    # and with IfNotPresent those pods would have no update path left).
    template: templates/image-refresh-rbac.yaml
    set:
      nodeAgents:
        namespace:
          name: tracebloc
    asserts:
      - hasDocuments:
          count: 5
      - equal:
          path: metadata.name
          value: stg-image-refresh
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: tracebloc
        documentIndex: 1
      - equal:
          path: metadata.name
          value: stg-image-refresh-node-agents
        documentIndex: 3
      - equal:
          path: metadata.namespace
          value: tracebloc
        documentIndex: 3
      - equal:
          path: metadata.name
          value: stg-image-refresh
        documentIndex: 2
      - equal:
          path: metadata.name
          value: stg-image-refresh-node-agents
        documentIndex: 4

  # =====================================================================
  # Two-sided-contract guards. Three of #569's review findings were one
  # side of a contract moving without the other. These pin the sides that
  # are still spelled out in two places.
  # =====================================================================

  - it: reconcile targets match the workload names the chart actually renders
    # DEPLOYMENT_NAME re-derives `<release>-jobs-manager` with its own printf,
    # and five other call sites spell it out too (NOTES.txt, the PDB,
    # tracebloc.serviceAccountName, ...). Unifying that is a mechanical refactor
    # across templates this change does not touch, so it is left for its own PR
    # — this test is the interim binding. A `set image` against a name that no
    # longer exists fails the tick, freezes the digest record, and eventually
    # trips the shared flap lockout for every control-plane image.
    # requests-proxy IS unified now (tracebloc.requestsProxyName); resource-monitor
    # already was (tracebloc.resourceMonitorName). Cross-check these literals
    # against jobs_manager_test / requests_proxy_test / resource_monitor_test,
    # which pin the same strings from the workload side.
    template: templates/image-refresh-cronjob.yaml
    documentIndex: 1
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: DEPLOYMENT_NAME
            value: "stg-jobs-manager"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: REQUESTS_PROXY_DEPLOYMENT
            value: "stg-requests-proxy"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: RESOURCE_MONITOR_DAEMONSET
            value: "stg-resource-monitor"

  - it: set-image container names match the containers the chart renders
    # `kubectl set image <workload> <container>=<ref>` fails outright if the
    # container name is wrong, so these four strings are a hard contract with
    # the workload templates. Pinned from the workload side too.
    template: templates/image-refresh-cronjob.yaml
    documentIndex: 0
    asserts:
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: 'jm_set_args api='
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: 'jm_set_args pods-monitor-container='
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: 'rp_set_args proxy='
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: 'rm_set_args tracebloc-resource-monitor='

  - it: reconcile re-pins when a helm re-render reverted the workload off the digest
    # Guards the client-runtime#199 fix: with `recorded == latest` the loop must
    # NOT unconditionally no-op -- it must read the live workload image and
    # re-pin when it is not `repo@latest` (a `helm upgrade --reset-then-reuse-values`
    # reverted the pin onto the bare :tag, where a stale node cache serves an old
    # image). The helper + the fall-through into the re-image path are the fix.
    template: templates/image-refresh-cronjob.yaml
    documentIndex: 0
    asserts:
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: 'workload_image_for_repo\(\)'
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: 'have="\$\(workload_image_for_repo "\$repo"'
      # the true no-op now requires BOTH digest-unchanged AND workload-on-digest
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: 'workload already on the pinned digest; no-op'

  - it: a fresh install is gated OUT of the re-pin roll, but the legacy fleet is not
    # Guards #1008 item 2. With `recorded == latest` and the workload on :tag, the
    # loop must tell a FRESH install (watched born on :tag here) from a helm-revert
    # of an applied pin AND from a pre-marker/legacy edge, and skip ONLY the fresh
    # one -- else either every fresh install pays the #563 flap-path / Recreate
    # cost for byte-identical content, or (if it skipped on absence alone) the
    # whole existing fleet is stranded on a stale :tag on the upgrade hop. Two
    # markers discriminate: `first-observed-<image>` (stamped by first-observation)
    # and `digest-applied-<image>` (stamped only on a successful re-image). Skip =
    # first_observed present AND applied absent. image-refresh-repin-on-revert.bats
    # asserts the BEHAVIOUR across all three shapes (fresh / established / legacy);
    # these lock the code shapes so a refactor cannot silently drop the gate.
    template: templates/image-refresh-cronjob.yaml
    documentIndex: 0
    asserts:
      # both marker keys, derived per image with the same suffix as stale-pin keys
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: 'applied_key="tracebloc\.io/digest-applied-\$\{repo#\*/\}"'
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: 'first_observed_key="tracebloc\.io/first-observed-\$\{repo#\*/\}"'
      # the skip fires ONLY on positive fresh-install evidence, not on absence
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: '\[ -n "\$first_observed" \] && \[ -z "\$applied" \]'
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: 'this is a fresh install .* -- NOT rolling'
      # first-observation stamps first_observed (the positive fresh-install signal)
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: 'annotate_args="\$annotate_args \$\{key\}=\$\{latest\} \$\{first_observed_key\}=1"'
      # a re-image stamps applied alongside the digest record (one shared fate)
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: 'annotate_args="\$annotate_args \$\{key\}=\$\{latest\} \$\{applied_key\}=1"'
      # the digest-record read is FAIL-CLOSED: a read error must not collapse to ""
      # and enter the first-observation arm (which stamps first_observed and
      # suppresses the #199 repair on a legacy edge) -- Bugbot on #1008. The
      # fail-open `|| true` form must be gone; the guarded read must be present.
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: 'if ! recorded="\$\(get_annotation "\$key"\)"; then'
      - notMatchRegex:
          path: data["image-refresh.sh"]
          pattern: 'recorded="\$\(get_annotation "\$key" \|\| true\)"'

  - it: stale-pin annotations are written BEFORE the restart block, so they survive a latched flap
    # Guards #1008 item 1. The #563 flap guard does WARN + FLAP_KEY +
    # exit 0 once refresh-attempt >= MAX, BEFORE the final digest-record annotate.
    # Batching the stale-pin CLEARS into that final annotate dropped them on a
    # tick that is both off-digest and latched -- leaving a FALSE stale-pin
    # finding to persist. They now accumulate in their own list and are annotated
    # above the restart block. image-refresh-latched-annotate.bats asserts the
    # BEHAVIOUR; these lock the code shapes.
    template: templates/image-refresh-cronjob.yaml
    documentIndex: 0
    asserts:
      # the stale-pin writes go to their own accumulator, not annotate_args
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: 'stale_pin_args="\$stale_pin_args \$\{stale_key\}-"'
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: 'stale_pin_args="\$stale_pin_args \$\{unpinned_stale_key\}-"'
      # and that accumulator is annotated BEFORE the restart block (ordering)
      - matchRegex:
          path: data["image-refresh.sh"]
          pattern: '(?s)if \[ -n "\$stale_pin_args" \]; then.*if \[ "\$restart_needed" -eq 1 \]; then'
      # the stale-pin keys must NOT ride the final digest-record annotate_args
      - notMatchRegex:
          path: data["image-refresh.sh"]
          pattern: 'annotate_args="\$annotate_args \$\{stale_key\}'
      - notMatchRegex:
          path: data["image-refresh.sh"]
          pattern: 'annotate_args="\$annotate_args \$\{unpinned_stale_key\}'
