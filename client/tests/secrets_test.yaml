suite: Secrets
templates:
  - templates/secrets.yaml
  - templates/docker-registry-secret.yaml
tests:
  # --- a nil `hostPath` must not nil-pointer this template (backend#2626, Bugbot Medium) ---
  # `hostPath` is reachable as nil: `-f` with `hostPath: null`, or `--reuse-values`
  # from a release predating the key. The chart is SPLIT on how it reads it -- 8
  # sites go through `default dict`, 9 read `.Values.hostPath.enabled` bare -- so
  # a full render of that input dies at `shared-images-pvc.yaml:3` no matter what
  # this template does (backend#2910 tracks the other nine). This suite scopes to
  # `secrets.yaml`, which is what makes the assertion observable at all: it proves
  # THIS template survives the input, which a whole-chart render cannot show while
  # an earlier site still panics on it.
  - it: renders under a nil hostPath instead of nil-pointering
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      hostPath: null
    asserts:
      - isKind:
          of: Secret
        documentIndex: 0

  - it: should create tracebloc secret with encoded password
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
    asserts:
      - isKind:
          of: Secret
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-secrets
        documentIndex: 0
      - equal:
          path: type
          value: Opaque
        documentIndex: 0
      - isNotEmpty:
          path: data.CLIENT_ID
        documentIndex: 0
      - isNotEmpty:
          path: data.CLIENT_PASSWORD
        documentIndex: 0
      - matchRegex:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          pattern: Helm
        documentIndex: 0

  - it: should create docker registry secret when create is true
    template: templates/docker-registry-secret.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      dockerRegistry:
        create: true
        server: https://index.docker.io/v1/
        username: testuser
        password: testpass
        email: test@test.com
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-regcred
      - equal:
          path: type
          value: kubernetes.io/dockerconfigjson
      - isNotEmpty:
          path: data[".dockerconfigjson"]

  - it: should not create docker registry secret when create is omitted (default false)
    template: templates/docker-registry-secret.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      dockerRegistry:
        server: https://index.docker.io/v1/
        username: testuser
        password: testpass
        email: test@test.com
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create docker registry secret when dockerRegistry is omitted (public images)
    template: templates/docker-registry-secret.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
    values:
      - values-public-images.yaml
    asserts:
      - hasDocuments:
          count: 0

  # Placeholders are refused by values.schema.json (`not: {pattern: "^<.*>$"}`),
  # which fails at CHART LOAD, before any template renders. helm-unittest 0.5.2
  # surfaces that as an "errored" test whose message `failedTemplate` cannot
  # match, so these stay a bare assertion — deliberately, and noted rather than
  # dressed up. WARNING for whoever strengthens them: `failedTemplate` with
  # `errorPattern` is SILENTLY IGNORED by this plugin version — a pattern
  # appearing nowhere in the output still passes. Use `errorMessage` (exact),
  # which is honoured, as the tier-3 tests below do.
  - it: should reject placeholder clientId value
    template: templates/secrets.yaml
    set:
      clientId: "<CLIENT_ID>"
      clientPassword: "real-pass"
    asserts:
      - failedTemplate: {}

  - it: should reject placeholder clientPassword value
    template: templates/secrets.yaml
    set:
      clientId: "real-id"
      clientPassword: "<CLIENT_PASSWORD>"
    asserts:
      - failedTemplate: {}

  # backend#2571 tier 3, asserted by exact message so it cannot pass for the
  # wrong reason. `lookup` is inert under helm-unittest, so tier 2 cannot fire
  # here — which is precisely the state these describe: neither a value nor a
  # readable Secret. The message must name BOTH remedies.
  #
  # These only became reachable when clientId/clientPassword were dropped from
  # the schema's top-level `required` and lost `minLength: 1`. Before that,
  # schema validation rejected an empty value first and the template's own
  # refusal was dead code — which is also why the old "should reject empty
  # credentials" test was passing on the schema, not on anything in this file.
  - it: fails when clientId resolves from neither values nor an existing Secret
    template: templates/secrets.yaml
    set:
      clientId: ""
      clientPassword: "real-pass"
    asserts:
      - failedTemplate:
          errorMessage: "clientId is required and could not be resolved. Either set it (--set clientId=... or a values file), or pre-create the release Secret with a non-empty CLIENT_ID key AND Helm's ownership metadata so the chart adopts that Secret instead of colliding with it -- values.yaml carries the exact commands (backend#2571)."

  - it: fails when clientPassword resolves from neither values nor an existing Secret
    template: templates/secrets.yaml
    set:
      clientId: "real-id"
      clientPassword: ""
    asserts:
      - failedTemplate:
          errorMessage: "clientPassword is required and could not be resolved. Either set it (--set clientPassword=... or a values file), or pre-create the release Secret with a non-empty CLIENT_PASSWORD key AND Helm's ownership metadata so the chart adopts that Secret instead of colliding with it -- values.yaml carries the exact commands (backend#2571)."

  - it: should reject empty credentials
    template: templates/secrets.yaml
    set:
      clientId: ""
      clientPassword: ""
    asserts:
      # clientId resolves first, so its refusal is the one that surfaces.
      - failedTemplate:
          errorMessage: "clientId is required and could not be resolved. Either set it (--set clientId=... or a values file), or pre-create the release Secret with a non-empty CLIENT_ID key AND Helm's ownership metadata so the chart adopts that Secret instead of colliding with it -- values.yaml carries the exact commands (backend#2571)."

  # Tier 1 still wins, and both keys land base64-encoded in the Secret.
  - it: resolves both credentials from values (tier 1)
    template: templates/secrets.yaml
    set:
      clientId: "tier1-id"
      clientPassword: "tier1-pass"
    asserts:
      - equal:
          path: data.CLIENT_ID
          value: "dGllcjEtaWQ="
        documentIndex: 0
      - equal:
          path: data.CLIENT_PASSWORD
          value: "dGllcjEtcGFzcw=="
        documentIndex: 0


  # RFC-0003 D10 (backend#1181): TB_CREDMGR_PASSWORD is flag-gated (Saqlain #D).
  - it: TB_CREDMGR_PASSWORD absent by default (byte-for-byte off)
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
    asserts:
      - notExists:
          path: data.TB_CREDMGR_PASSWORD
        documentIndex: 0

  - it: TB_CREDMGR_PASSWORD rendered when perExperimentDbCreds is on
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      perExperimentDbCreds: true
    asserts:
      - isNotEmpty:
          path: data.TB_CREDMGR_PASSWORD
        documentIndex: 0

  - it: credmgrPassword operator pin flows into the Secret
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      perExperimentDbCreds: true
      credmgrPassword: "PinnedAlnum123"
    asserts:
      - equal:
          path: data.TB_CREDMGR_PASSWORD
          value: "UGlubmVkQWxudW0xMjM="
        documentIndex: 0

  - it: rejects a non-alphanumeric credmgrPassword pin
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      perExperimentDbCreds: true
      credmgrPassword: "bad-pass!"
    asserts:
      - failedTemplate: {}

  # backend#1528 S1: tb_meta / tb_ingest passwords are flag-gated on
  # serviceDbAccounts, mirroring TB_CREDMGR_PASSWORD.
  - it: TB_META/INGEST_PASSWORD absent by default (byte-for-byte off)
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
    asserts:
      - notExists:
          path: data.TB_META_PASSWORD
        documentIndex: 0
      - notExists:
          path: data.TB_INGEST_PASSWORD
        documentIndex: 0

  - it: TB_META/INGEST_PASSWORD rendered when serviceDbAccounts is on
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      serviceDbAccounts: true
    asserts:
      - isNotEmpty:
          path: data.TB_META_PASSWORD
        documentIndex: 0
      - isNotEmpty:
          path: data.TB_INGEST_PASSWORD
        documentIndex: 0

  - it: tbMetaPassword / tbIngestPassword operator pins flow into the Secret
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      serviceDbAccounts: true
      tbMetaPassword: "MetaPin123"
      tbIngestPassword: "IngestPin123"
    asserts:
      - equal:
          path: data.TB_META_PASSWORD
          value: "TWV0YVBpbjEyMw=="
        documentIndex: 0
      - equal:
          path: data.TB_INGEST_PASSWORD
          value: "SW5nZXN0UGluMTIz"
        documentIndex: 0

  - it: rejects a non-alphanumeric tbMetaPassword pin
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      serviceDbAccounts: true
      tbMetaPassword: "bad-pass!"
    asserts:
      - failedTemplate: {}

  - it: rejects a non-alphanumeric tbIngestPassword pin
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      serviceDbAccounts: true
      tbIngestPassword: "bad-pass!"
    asserts:
      - failedTemplate: {}

  # backend#1528 S3: DB_BOOTSTRAP_PASSWORD is gated on the bootstrapDbReparent
  # resolution. Unlike the accounts above it has NO generate-random tier — a
  # missing pin fails the render — and NO alphanumeric constraint (it is a
  # connection parameter, never DDL; the baked root password contains '@').
  - it: DB_BOOTSTRAP_PASSWORD absent by default (byte-for-byte off)
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
    asserts:
      - notExists:
          path: data.DB_BOOTSTRAP_PASSWORD
        documentIndex: 0

  - it: bootstrapDbPassword pin flows into the Secret when the gate is on (non-alphanumeric allowed)
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      bootstrapDbReparent: true
      bootstrapDbPassword: "test-root-pw"
    asserts:
      - equal:
          path: data.DB_BOOTSTRAP_PASSWORD
          value: "dGVzdC1yb290LXB3"
        documentIndex: 0

  - it: resolves the gate via bootstrapDbReparentByEnv (dev on)
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      env:
        CLIENT_ENV: dev
      bootstrapDbReparentByEnv:
        dev: true
      bootstrapDbPassword: "test-root-pw"
      # PINNED (tier 1), backend#2892: CLIENT_ENV=dev also turns rotateMysqlRoot on
      # (ByEnv default), so the cluster-less render would hit the fail-closed mint
      # guard before this bootstrap assertion. The pin sources root tier-1; this
      # test is about bootstrapDbReparentByEnv resolution, unrelated to the mint.
      mysqlRootPassword: "RotatedRootPw123"
    asserts:
      - isNotEmpty:
          path: data.DB_BOOTSTRAP_PASSWORD
        documentIndex: 0

  - it: fails when the gate is on but bootstrapDbPassword is unset (no generated default)
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      bootstrapDbReparent: true
    asserts:
      # `errorMessage` (EXACT), never `errorPattern`: helm-unittest 0.5.2
      # SILENTLY IGNORES errorPattern under failedTemplate, so the prefix-match
      # this used to claim was never happening — any failure satisfied it
      # (backend#2606). The full message is reproduced below, which is safe for
      # a public repo for the same reason the template's own text is: it names
      # the credential's SOURCE indirectly (backend#947) and carries no literal
      # value (backend#1528 review). Guarded by
      # scripts/tests/helm-unittest-error-assertions.sh.
      - failedTemplate:
          errorMessage: "bootstrapDbReparent is on but bootstrapDbPassword is unset (backend#1528 S3): set it to the MySQL root password for this cluster (the mysql-client image's baked default; see backend#947 for the value and its rotated replacement). There is no generated default — jobs-manager authenticates as root to run the account-minting DDL and cannot rotate root to match a random value, so a missing pin would lock the minter out. Alternatively enable rotateMysqlRoot for this fleet: with the rotation on, the chart owns root's password and this pin is derived from it automatically (backend#2738) -- which is also the only combination that can be baked into the ByEnv defaults. See values.yaml."

  - it: derives the pin from the rotation when both gates are on (backend#2738)
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      bootstrapDbReparent: true
      rotateMysqlRoot: true
      # PINNED (tier 1), backend#2892. #2738's property is derivation — the pin is
      # the SAME secret as root's, whichever tier supplies $mysqlRootPassword — so
      # a pin proves it exactly. It also has to be pinned now: helm-unittest is
      # cluster-less, and the fail-closed guard refuses a cluster-less UNPINNED
      # mint (that render re-randomises every sync and never converges, so it was
      # never a value anyone applied — only a render that exited 0). Tier 1
      # bypasses the mint guard and gives a stable value, the honest shape for a
      # "baked" fleet.
      mysqlRootPassword: "RotatedRootPw123"
    asserts:
      # THE POINT OF backend#2738: the re-parent pin is DERIVED from the rotation,
      # not separately demanded. documentIndex 0 throughout: the rotation gate
      # makes this template emit a SECOND document, so an unscoped assertion is
      # evaluated against the wrong one and reports "unknown path".
      - isNotNullOrEmpty:
          path: data.DB_BOOTSTRAP_PASSWORD
        documentIndex: 0
      - isNotNullOrEmpty:
          path: data.MYSQL_ROOT_PASSWORD
        documentIndex: 0

  - it: the derived pin is the SAME value as the rotated root password
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      bootstrapDbReparent: true
      rotateMysqlRoot: true
      # Pinned so the two keys can be compared to a KNOWN value. Without a pin
      # both are randAlphaNum and equality could only be asserted against each
      # other, which a template that emitted one variable twice would satisfy
      # even if it were the wrong variable.
      mysqlRootPassword: "RotatedRootPw123"
    asserts:
      - equal:
          path: data.MYSQL_ROOT_PASSWORD
          value: "Um90YXRlZFJvb3RQdzEyMw=="
        documentIndex: 0
      - equal:
          path: data.DB_BOOTSTRAP_PASSWORD
          value: "Um90YXRlZFJvb3RQdzEyMw=="
        documentIndex: 0

  - it: an explicit bootstrapDbPassword pin still beats the rotation value
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      bootstrapDbReparent: true
      rotateMysqlRoot: true
      mysqlRootPassword: "RotatedRootPw123"
      # NOT SECRET-SHAPED, ON PURPOSE. The value here is arbitrary -- the case
      # asserts that an explicit pin BEATS the derived one, so any distinct
      # string proves it. A high-entropy one tripped `generic-api-key`
      # (gitleaks 8.30.1, entropy 3.73) and the only ways to silence that are
      # widening .gitleaks.toml -- a permanent hole in a broad test file -- or
      # an inline marker this pipeline does not honour (see .gitleaks.toml).
      # Not looking like a secret costs nothing and adds no hole.
      bootstrapDbPassword: "operator-pinned-value"
    asserts:
      # The DR / pre-rotated-account case must survive the new tier: an operator
      # who states the value explicitly is not overridden by a derived one.
      - equal:
          path: data.DB_BOOTSTRAP_PASSWORD
          value: "b3BlcmF0b3ItcGlubmVkLXZhbHVl"
        documentIndex: 0
      - equal:
          path: data.MYSQL_ROOT_PASSWORD
          value: "Um90YXRlZFJvb3RQdzEyMw=="
        documentIndex: 0

  - it: the ByEnv pair renders together (dev), which is what baking needs
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      env.CLIENT_ENV: dev
      bootstrapDbReparentByEnv.dev: true
      rotateMysqlRootByEnv.dev: true
      # PINNED (tier 1), backend#2892 — same reason as the flat-flag derivation
      # test above: helm-unittest is cluster-less and the fail-closed guard
      # refuses a cluster-less UNPINNED mint. The property under test is that the
      # ByEnv PAIR resolves on together and DB_BOOTSTRAP is derived, not that an
      # unpinned mint renders offline (it re-randomises every render and never
      # converges). A dev fleet baking these ByEnv defaults must likewise pin or
      # render server-side — see values.yaml.
      mysqlRootPassword: "RotatedRootPw123"
    asserts:
      # backend#2738 measured this combination FAILING. It is the exact shape
      # backend#1528's close-out needs to bake, so it is asserted through the
      # ByEnv path and not only through the flat flags.
      - isNotNullOrEmpty:
          path: data.DB_BOOTSTRAP_PASSWORD
        documentIndex: 0

  - it: rejects a placeholder bootstrapDbPassword pin
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      bootstrapDbReparent: true
      bootstrapDbPassword: "<ROOT_PASSWORD>"
    asserts:
      - failedTemplate:
          errorMessage: "bootstrapDbPassword looks like a placeholder (e.g. \"<ROOT_PASSWORD>\"); set the real MySQL root password"

  # backend#947 Phase 0: MYSQL_ROOT_PASSWORD is gated on rotateMysqlRoot, 3-tier
  # generate-and-persist (pin -> existing Secret -> randAlphaNum).
  - it: MYSQL_ROOT_PASSWORD absent by default (byte-for-byte off)
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
    asserts:
      - notExists:
          path: data.MYSQL_ROOT_PASSWORD
        documentIndex: 0

  - it: refuses an UNPINNED cluster-less mint (fail-closed, backend#2892)
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      rotateMysqlRoot: true
    asserts:
      # backend#2892 INVERTS this case. It used to assert the mint (isNotEmpty);
      # under the fail-closed guard it REFUSES. helm-unittest renders cluster-less,
      # so the kube-system probe is empty: rotation on + unpinned + nothing
      # declared + no ack is a render that can never converge (it re-randomises
      # every sync — it was never a value anyone applied, only a render that
      # exited 0), so the guard refuses it. A real mint needs a LIVE cluster and is
      # DRIVEN on k3d; helm-unittest can only reach the refuse arms (and the
      # ack/pin mint paths). errorMessage EXACT — helm-unittest 0.5.2 ignores
      # errorPattern (scripts/tests/helm-unittest-error-assertions.sh) — and it is
      # the `else if not $clusterVisible` arm's string, so rewording that reddens.
      - failedTemplate:
          errorMessage: "rotateMysqlRoot is on, but this render cannot see a live cluster (an empty lookup of kube-system: `helm template`, `--dry-run=client`, or a cluster-less GitOps renderer such as ArgoCD's default render or Flux post-render). On the tier-3 mint path the chart would generate a NEW random root password, and cluster-less it can neither confirm the datadir is fresh -- if one already exists, root keeps its old password and the fleet loses MySQL auth (`1045 Access denied for user 'root'`) -- nor preserve the value across renders, because tier-2 preservation is itself a live lookup, so the mint re-randomises every render and never converges. Refusing rather than minting a password the database may never accept (backend#2892). To roll the rotation on a cluster-less fleet, do ONE of: render SERVER-SIDE (e.g. argocd-repo-server against the live cluster) so the chart sees the datadir and preserves the value; PIN mysqlRootPassword to a fixed alphanumeric value (tier 1 -- deterministic across renders, and it bypasses this mint); or, once you have run the one-time manual migration in docs/migration-tools/rotate-mysql-root.md, set mysqlRootRotationAcknowledged=true. A FRESH install on a LIVE cluster is unaffected -- born rotated; only cluster-less renders reach this. (If you already know the datadir exists, set mysqlDatadirExists=true for the datadir-specific message.)"

  - it: mysqlRootRotationAcknowledged clears the guard on a cluster-less render (backend#2879, backend#2892)
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      rotateMysqlRoot: true
      # backend#2892: cluster-less + rotation on + unpinned would now REFUSE (the
      # fail-closed offline arm, tested just above) — the acknowledgement is
      # exactly what lets it through. So this pins that ack clears ALL the refuse
      # arms (offline included) and the mint proceeds: drop the `not ack` term and
      # the refuse tests go red, or wire `if ack` into the mint decision and THIS
      # goes red.
      mysqlRootRotationAcknowledged: true
    asserts:
      - isNotEmpty:
          path: data.MYSQL_ROOT_PASSWORD
        documentIndex: 0

  # ── backend#2892: the cluster-less refuse arms (GitOps / ArgoCD / Flux /
  #    `helm template` / --dry-run). helm-unittest renders WITHOUT a cluster, so
  #    the kube-system probe is empty and these prove which MESSAGE each arm
  #    raises — the arm-2 (declared) case here, the arm-3 (offline) case above.
  - it: a DECLARED existing datadir gives the datadir-specific refusal, not the offline one (backend#2892)
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      rotateMysqlRoot: true
      # $datadirExists is true (declared), so the guard takes the existing-datadir
      # arm and raises THAT message — not the generic offline one it would raise
      # for the same cluster-less render with nothing declared (the test above).
      # Deleting the mysqlDatadirExists term drops this to the offline message, so
      # the errorMessage below reddens; the mysqlDatadirExists=true assertion is
      # what pins arm-2 as distinct from arm-3.
      mysqlDatadirExists: true
    asserts:
      # errorMessage EXACT (helm-unittest 0.5.2 SILENTLY IGNORES errorPattern —
      # see scripts/tests/helm-unittest-error-assertions.sh): the SAME refusal the
      # live existing-datadir path raises, so a reworded message reddens together.
      - failedTemplate:
          errorMessage: "rotateMysqlRoot is on for this fleet, but its MySQL datadir already exists (PersistentVolumeClaim \"mysql-pvc\" in namespace \"NAMESPACE\") and predates the rotation, so root still holds its install-time password. Rendering now would mint a NEW random root password into the Secret that the live database was never told about; because the mysql entrypoint reads MYSQL_ROOT_PASSWORD only at FRESH datadir init, root would then authenticate with neither value and the fleet would lose MySQL auth (helm reports success, jobs-manager CrashLoops on `1045 Access denied for user 'root'`, the upgrade times out on `Deployment not ready`). Enabling the rotation on an existing datadir REQUIRES the one-time, manual `ALTER USER 'root'` migration in docs/migration-tools/rotate-mysql-root.md -- the chart cannot run it (it would have to authenticate as root with the CURRENT password). Follow that runbook: it has you set `mysqlRootRotationAcknowledged=true` to acknowledge the manual step and let this render through. A FRESH install needs none of this -- with no datadir yet, root is initialised with the generated value and is born rotated. (A leftover EMPTY datadir -- a first install that failed before MySQL ever initialised, whose PVC persists under resource-policy: keep -- is the same fresh case wearing a PVC: there is no live password to migrate, so set mysqlRootRotationAcknowledged=true and the next init is born rotated; the ALTER USER step then has nothing to run against and is skipped.)"

  - it: mysqlDatadirExists + acknowledgement lets the mint through offline (backend#2892)
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      rotateMysqlRoot: true
      mysqlDatadirExists: true
      # The documented escape hatch works cluster-less too: acknowledging the
      # manual ALTER USER lets the SAME declared-existing-datadir render mint. This
      # pins that the guard's `not .Values.mysqlRootRotationAcknowledged` term is
      # wired on the cluster-less path — drop it and this goes red (still refused).
      mysqlRootRotationAcknowledged: true
    asserts:
      - isNotEmpty:
          path: data.MYSQL_ROOT_PASSWORD
        documentIndex: 0

  - it: mysqlRootPassword operator pin flows into the Secret
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      rotateMysqlRoot: true
      mysqlRootPassword: "RootPin123"
    asserts:
      - equal:
          path: data.MYSQL_ROOT_PASSWORD
          value: "Um9vdFBpbjEyMw=="
        documentIndex: 0

  - it: resolves the rotation gate via rotateMysqlRootByEnv (dev on)
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      env:
        CLIENT_ENV: dev
      rotateMysqlRootByEnv:
        dev: true
      # PINNED (tier 1), backend#2892: this pins that the ByEnv gate RESOLVES ON
      # (gate off → no MYSQL_ROOT_PASSWORD key at all), not the mint path. Unpinned
      # it would hit the fail-closed offline arm (helm-unittest is cluster-less)
      # and refuse; the pin bypasses the mint and keeps a positive assertion.
      mysqlRootPassword: "RotatedRootPw123"
    asserts:
      - isNotEmpty:
          path: data.MYSQL_ROOT_PASSWORD
        documentIndex: 0

  - it: rejects a placeholder mysqlRootPassword pin
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      rotateMysqlRoot: true
      mysqlRootPassword: "<ROOT_PASSWORD>"
    asserts:
      - failedTemplate:
          errorMessage: 'mysqlRootPassword looks like a placeholder (e.g. "<ROOT_PASSWORD>"); set a real value'

  - it: rejects a non-alphanumeric mysqlRootPassword pin (it lands in the runbook ALTER DDL)
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      rotateMysqlRoot: true
      mysqlRootPassword: "bad-pass!"
    asserts:
      - failedTemplate:
          errorMessage: "mysqlRootPassword must be alphanumeric ([A-Za-z0-9]+) \u2014 the backend#947 rotation runbook embeds this value in an ALTER USER ... IDENTIFIED BY '...' statement, so a quote or shell/SQL metacharacter would break the one-time rotation. (Generated randAlphaNum values already satisfy this.)"
