suite: Secrets
templates:
  - templates/secrets.yaml
  - templates/docker-registry-secret.yaml
tests:
  - it: should create tracebloc secret with encoded password
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
    asserts:
      - isKind:
          of: Secret
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-secrets
        documentIndex: 0
      - equal:
          path: type
          value: Opaque
        documentIndex: 0
      - isNotEmpty:
          path: data.CLIENT_ID
        documentIndex: 0
      - isNotEmpty:
          path: data.CLIENT_PASSWORD
        documentIndex: 0
      - matchRegex:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          pattern: Helm
        documentIndex: 0

  - it: should create docker registry secret when create is true
    template: templates/docker-registry-secret.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      dockerRegistry:
        create: true
        server: https://index.docker.io/v1/
        username: testuser
        password: testpass
        email: test@test.com
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-regcred
      - equal:
          path: type
          value: kubernetes.io/dockerconfigjson
      - isNotEmpty:
          path: data[".dockerconfigjson"]

  - it: should not create docker registry secret when create is omitted (default false)
    template: templates/docker-registry-secret.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      dockerRegistry:
        server: https://index.docker.io/v1/
        username: testuser
        password: testpass
        email: test@test.com
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create docker registry secret when dockerRegistry is omitted (public images)
    template: templates/docker-registry-secret.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
    values:
      - values-public-images.yaml
    asserts:
      - hasDocuments:
          count: 0

  # Placeholders are refused by values.schema.json (`not: {pattern: "^<.*>$"}`),
  # which fails at CHART LOAD, before any template renders. helm-unittest 0.5.2
  # surfaces that as an "errored" test whose message `failedTemplate` cannot
  # match, so these stay a bare assertion — deliberately, and noted rather than
  # dressed up. WARNING for whoever strengthens them: `failedTemplate` with
  # `errorPattern` is SILENTLY IGNORED by this plugin version — a pattern
  # appearing nowhere in the output still passes. Use `errorMessage` (exact),
  # which is honoured, as the tier-3 tests below do.
  - it: should reject placeholder clientId value
    template: templates/secrets.yaml
    set:
      clientId: "<CLIENT_ID>"
      clientPassword: "real-pass"
    asserts:
      - failedTemplate: {}

  - it: should reject placeholder clientPassword value
    template: templates/secrets.yaml
    set:
      clientId: "real-id"
      clientPassword: "<CLIENT_PASSWORD>"
    asserts:
      - failedTemplate: {}

  # backend#2571 tier 3, asserted by exact message so it cannot pass for the
  # wrong reason. `lookup` is inert under helm-unittest, so tier 2 cannot fire
  # here — which is precisely the state these describe: neither a value nor a
  # readable Secret. The message must name BOTH remedies.
  #
  # These only became reachable when clientId/clientPassword were dropped from
  # the schema's top-level `required` and lost `minLength: 1`. Before that,
  # schema validation rejected an empty value first and the template's own
  # refusal was dead code — which is also why the old "should reject empty
  # credentials" test was passing on the schema, not on anything in this file.
  - it: fails when clientId resolves from neither values nor an existing Secret
    template: templates/secrets.yaml
    set:
      clientId: ""
      clientPassword: "real-pass"
    asserts:
      - failedTemplate:
          errorMessage: "clientId is required and could not be resolved. Either set it (--set clientId=... or a values file), or pre-create the release Secret with a CLIENT_ID key so the chart reads it without storing the credential in the release values (backend#2571)."

  - it: fails when clientPassword resolves from neither values nor an existing Secret
    template: templates/secrets.yaml
    set:
      clientId: "real-id"
      clientPassword: ""
    asserts:
      - failedTemplate:
          errorMessage: "clientPassword is required and could not be resolved. Either set it (--set clientPassword=... or a values file), or pre-create the release Secret with a CLIENT_PASSWORD key so the chart reads it without storing the credential in the release values (backend#2571)."

  - it: should reject empty credentials
    template: templates/secrets.yaml
    set:
      clientId: ""
      clientPassword: ""
    asserts:
      # clientId resolves first, so its refusal is the one that surfaces.
      - failedTemplate:
          errorMessage: "clientId is required and could not be resolved. Either set it (--set clientId=... or a values file), or pre-create the release Secret with a CLIENT_ID key so the chart reads it without storing the credential in the release values (backend#2571)."

  # Tier 1 still wins, and both keys land base64-encoded in the Secret.
  - it: resolves both credentials from values (tier 1)
    template: templates/secrets.yaml
    set:
      clientId: "tier1-id"
      clientPassword: "tier1-pass"
    asserts:
      - equal:
          path: data.CLIENT_ID
          value: "dGllcjEtaWQ="
        documentIndex: 0
      - equal:
          path: data.CLIENT_PASSWORD
          value: "dGllcjEtcGFzcw=="
        documentIndex: 0


  # RFC-0003 D10 (backend#1181): TB_CREDMGR_PASSWORD is flag-gated (Saqlain #D).
  - it: TB_CREDMGR_PASSWORD absent by default (byte-for-byte off)
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
    asserts:
      - notExists:
          path: data.TB_CREDMGR_PASSWORD
        documentIndex: 0

  - it: TB_CREDMGR_PASSWORD rendered when perExperimentDbCreds is on
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      perExperimentDbCreds: true
    asserts:
      - isNotEmpty:
          path: data.TB_CREDMGR_PASSWORD
        documentIndex: 0

  - it: credmgrPassword operator pin flows into the Secret
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      perExperimentDbCreds: true
      credmgrPassword: "PinnedAlnum123"
    asserts:
      - equal:
          path: data.TB_CREDMGR_PASSWORD
          value: "UGlubmVkQWxudW0xMjM="
        documentIndex: 0

  - it: rejects a non-alphanumeric credmgrPassword pin
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      perExperimentDbCreds: true
      credmgrPassword: "bad-pass!"
    asserts:
      - failedTemplate: {}

  # backend#1528 S1: tb_meta / tb_ingest passwords are flag-gated on
  # serviceDbAccounts, mirroring TB_CREDMGR_PASSWORD.
  - it: TB_META/INGEST_PASSWORD absent by default (byte-for-byte off)
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
    asserts:
      - notExists:
          path: data.TB_META_PASSWORD
        documentIndex: 0
      - notExists:
          path: data.TB_INGEST_PASSWORD
        documentIndex: 0

  - it: TB_META/INGEST_PASSWORD rendered when serviceDbAccounts is on
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      serviceDbAccounts: true
    asserts:
      - isNotEmpty:
          path: data.TB_META_PASSWORD
        documentIndex: 0
      - isNotEmpty:
          path: data.TB_INGEST_PASSWORD
        documentIndex: 0

  - it: tbMetaPassword / tbIngestPassword operator pins flow into the Secret
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      serviceDbAccounts: true
      tbMetaPassword: "MetaPin123"
      tbIngestPassword: "IngestPin123"
    asserts:
      - equal:
          path: data.TB_META_PASSWORD
          value: "TWV0YVBpbjEyMw=="
        documentIndex: 0
      - equal:
          path: data.TB_INGEST_PASSWORD
          value: "SW5nZXN0UGluMTIz"
        documentIndex: 0

  - it: rejects a non-alphanumeric tbMetaPassword pin
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      serviceDbAccounts: true
      tbMetaPassword: "bad-pass!"
    asserts:
      - failedTemplate: {}

  - it: rejects a non-alphanumeric tbIngestPassword pin
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      serviceDbAccounts: true
      tbIngestPassword: "bad-pass!"
    asserts:
      - failedTemplate: {}

  # backend#1528 S3: DB_BOOTSTRAP_PASSWORD is gated on the bootstrapDbReparent
  # resolution. Unlike the accounts above it has NO generate-random tier — a
  # missing pin fails the render — and NO alphanumeric constraint (it is a
  # connection parameter, never DDL; the baked root password contains '@').
  - it: DB_BOOTSTRAP_PASSWORD absent by default (byte-for-byte off)
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
    asserts:
      - notExists:
          path: data.DB_BOOTSTRAP_PASSWORD
        documentIndex: 0

  - it: bootstrapDbPassword pin flows into the Secret when the gate is on (non-alphanumeric allowed)
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      bootstrapDbReparent: true
      bootstrapDbPassword: "test-root-pw"
    asserts:
      - equal:
          path: data.DB_BOOTSTRAP_PASSWORD
          value: "dGVzdC1yb290LXB3"
        documentIndex: 0

  - it: resolves the gate via bootstrapDbReparentByEnv (dev on)
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      env:
        CLIENT_ENV: dev
      bootstrapDbReparentByEnv:
        dev: true
      bootstrapDbPassword: "test-root-pw"
    asserts:
      - isNotEmpty:
          path: data.DB_BOOTSTRAP_PASSWORD
        documentIndex: 0

  - it: fails when the gate is on but bootstrapDbPassword is unset (no generated default)
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      bootstrapDbReparent: true
    asserts:
      # Assert the stable prefix via errorPattern, not the full message — the
      # message names the credential's source indirectly (backend#947) and must
      # never carry the literal value (public repo; backend#1528 review).
      - failedTemplate:
          errorPattern: "bootstrapDbReparent is on but bootstrapDbPassword is unset"

  - it: rejects a placeholder bootstrapDbPassword pin
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      bootstrapDbReparent: true
      bootstrapDbPassword: "<ROOT_PASSWORD>"
    asserts:
      - failedTemplate:
          errorMessage: "bootstrapDbPassword looks like a placeholder (e.g. \"<ROOT_PASSWORD>\"); set the real MySQL root password"

  # backend#947 Phase 0: MYSQL_ROOT_PASSWORD is gated on rotateMysqlRoot, 3-tier
  # generate-and-persist (pin -> existing Secret -> randAlphaNum).
  - it: MYSQL_ROOT_PASSWORD absent by default (byte-for-byte off)
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
    asserts:
      - notExists:
          path: data.MYSQL_ROOT_PASSWORD
        documentIndex: 0

  - it: MYSQL_ROOT_PASSWORD generated when rotateMysqlRoot is on
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      rotateMysqlRoot: true
    asserts:
      - isNotEmpty:
          path: data.MYSQL_ROOT_PASSWORD
        documentIndex: 0

  - it: mysqlRootPassword operator pin flows into the Secret
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      rotateMysqlRoot: true
      mysqlRootPassword: "RootPin123"
    asserts:
      - equal:
          path: data.MYSQL_ROOT_PASSWORD
          value: "Um9vdFBpbjEyMw=="
        documentIndex: 0

  - it: resolves the rotation gate via rotateMysqlRootByEnv (dev on)
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      env:
        CLIENT_ENV: dev
      rotateMysqlRootByEnv:
        dev: true
    asserts:
      - isNotEmpty:
          path: data.MYSQL_ROOT_PASSWORD
        documentIndex: 0

  - it: rejects a placeholder mysqlRootPassword pin
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      rotateMysqlRoot: true
      mysqlRootPassword: "<ROOT_PASSWORD>"
    asserts:
      - failedTemplate:
          errorMessage: 'mysqlRootPassword looks like a placeholder (e.g. "<ROOT_PASSWORD>"); set a real value'

  - it: rejects a non-alphanumeric mysqlRootPassword pin (it lands in the runbook ALTER DDL)
    template: templates/secrets.yaml
    set:
      clientId: "my-client-id"
      clientPassword: "my-secret-pass"
      rotateMysqlRoot: true
      mysqlRootPassword: "bad-pass!"
    asserts:
      - failedTemplate:
          errorMessage: "mysqlRootPassword must be alphanumeric ([A-Za-z0-9]+) \u2014 the backend#947 rotation runbook embeds this value in an ALTER USER ... IDENTIFIED BY '...' statement, so a quote or shell/SQL metacharacter would break the one-time rotation. (Generated randAlphaNum values already satisfy this.)"
