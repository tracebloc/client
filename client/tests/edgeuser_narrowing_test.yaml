suite: narrowEdgeuser — a retired fleet stays retired, and a half-migrated one is refused (backend#1528 S3)
# WHY THIS SUITE EXISTS
#
# mysql-client-initdb/10-edgeuser-bridge-grants.sql re-grants edgeuser its broad
# privileges at every FRESH datadir initialization and cannot branch on a runtime
# flag: it is COPYd into a digest-frozen image and the mysql entrypoint runs it
# before jobs-manager exists. So a fleet that completed the whole retirement can
# be handed a root-equivalent edgeuser again by a reinstall or a datadir loss --
# silently, with no operator action and nothing to notice it by.
#
# narrowEdgeuser closes that: jobs-manager REVOKEs edgeuser back to USAGE on every
# boot. But narrowing a fleet where ANY consumer still authenticates as edgeuser
# breaks it, and because the heartbeat's information_schema enumeration is
# privilege-filtered, over-revoking does not error -- it silently stops returning
# datasets. So the gate is legal ONLY with all three predecessors on, and that
# pairing is ENFORCED at render time rather than documented.
#
# The refusal is asserted with `errorMessage` and the EXACT string, never
# `errorPattern`. helm-unittest 0.5.2 SILENTLY IGNORES errorPattern -- a pattern
# appearing nowhere in the output still passes, so such an assertion is exactly
# equivalent to a bare `failedTemplate: {}` and cannot tell you which refusal
# fired. The first cut of this suite used errorPattern throughout; the repo's own
# scripts/tests/helm-unittest-error-assertions.sh guard caught all eight, which is
# that guard doing precisely the job it was written for. Asserting the full
# message also means each case pins its own DIAGNOSIS, so a reworded reason or a
# reason silently dropped from the list reddens here.
#
# The environment matters and is stated per case. At CLIENT_ENV=dev,
# serviceDbAccountsByEnv and perExperimentDbCredsByEnv are ALREADY true, so a dev
# render exercises only the re-parent. As of backend#947, prod/stg bake
# rotateMysqlRoot + bootstrapDbReparent on (datadir-gated), so the full
# three-reason refusal now forces `bootstrapDbReparent: false` explicitly to make
# the re-parent blocker reachable — serviceDbAccounts + perExperimentDbCreds still
# default false for prod, so the other two blockers come from the env default.
#
# THE SUITE RENDERS THREE TEMPLATES, because the posture it calls "whole" spans
# three (Bugbot, #900). The bake flips five gates; two of them -- rotateMysqlRoot
# and the Secret half of the re-parent -- render NOWHERE in
# jobs-manager-deployment.yaml, so a suite pinned to that one file could not see
# a revert of `rotateMysqlRootByEnv.dev` at all. Every case therefore names its
# own `template:` explicitly rather than inheriting the list.
templates:
  - templates/jobs-manager-deployment.yaml
  - templates/secrets.yaml
  - templates/mysql-deployment.yaml
release:
  name: narrow
  namespace: tracebloc
set:
  clientId: "test-id"
  clientPassword: "test"
  storageClass.create: false
  # backend#2892: helm-unittest renders CLUSTER-LESS, and the fail-closed guard
  # refuses an unpinned rotation-on mint offline. dev's ByEnv default turns
  # rotation ON, so every dev render here would otherwise hit that refusal. The
  # pin sources root's value from tier 1 so the cluster-less render succeeds. It
  # does NOT change whether rotation RESOLVES on (the dev ByEnv default still
  # does that -- the `exists MYSQL_ROOT_PASSWORD` assertions below still prove the
  # gate is on); it only supplies the value. The default-UNPINNED rotation render
  # is a live-cluster property, driven in e2e (scripts/tests/e2e-auto-upgrade.sh).
  mysqlRootPassword: "RotatedRootPw123"

tests:
  # ---- default off: byte-identical ------------------------------------
  - it: "dev NARROWS by default — its posture is baked (backend#1528)"
    template: templates/jobs-manager-deployment.yaml
    set:
      env.CLIENT_ENV: dev
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NARROW_EDGEUSER
            value: "1"

  - it: "a DEFAULT dev install renders the whole retired posture, no --set needed"
    template: templates/jobs-manager-deployment.yaml
    # This is what the bake buys: a values-resetting upgrade or a fresh-datadir
    # reinstall on dev lands RETIRED instead of landing on defaults that put the
    # account mint back on edgeuser.
    set:
      env.CLIENT_ENV: dev
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: SERVICE_DB_ACCOUNTS, value: "1"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: PER_EXPERIMENT_DB_CREDS, value: "1"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: NARROW_EDGEUSER, value: "1"}
      # The re-parent's env half. `bootstrapDbReparentByEnv.dev` is the third
      # gate the bake flips, and client-runtime#310's _bootstrap_db_config reads
      # USER and PASSWORD both-or-neither -- so both are asserted, not just the
      # one that is a plain literal.
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: DB_BOOTSTRAP_USER, value: "root"}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_BOOTSTRAP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: narrow-secrets
                key: DB_BOOTSTRAP_PASSWORD

  # ---- the two gates that render outside jobs-manager ------------------
  # WHY THESE EXIST (Bugbot, #900). The case above says "the whole retired
  # posture". It asserted three of the five gates the bake flips, and both
  # omissions rendered in files the suite did not load -- so a revert of
  # `rotateMysqlRootByEnv.dev`, or a break in the Secret/mysql wiring on the
  # bake path, changed nothing here and the suite stayed green while claiming
  # to cover the whole thing. `rotateMysqlRoot` is not a narrowing predecessor
  # either, so no refusal case reached it by accident.

  - it: "a DEFAULT dev install rotates root off the image literal — the Secret carries it"
    template: templates/secrets.yaml
    documentIndex: 0
    set:
      env.CLIENT_ENV: dev
    asserts:
      - exists:
          path: data.MYSQL_ROOT_PASSWORD
      # BOTH DIRECTIONS OF THE RE-PARENT, not just the one (Bugbot, #900). The
      # case above asserts jobs-manager REFERENCES `DB_BOOTSTRAP_PASSWORD` via
      # secretKeyRef; this asserts the Secret actually CARRIES it. A reference
      # to a key the Secret does not render is not a passing render -- it is a
      # dev install whose jobs-manager fails on a missing Secret key, and with
      # only the reference asserted the suite stayed green through it. Same
      # asymmetry the rotation pair above was split to avoid, missed once on
      # the half that already had an env assertion.
      - exists:
          path: data.DB_BOOTSTRAP_PASSWORD

  - it: "and the mysql pod actually consumes it — the Secret alone proves nothing"
    # A key in the Secret that no pod reads is a rotation nobody performs. This
    # is the consuming half, and it is a separate render.
    template: templates/mysql-deployment.yaml
    set:
      env.CLIENT_ENV: dev
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MYSQL_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: narrow-secrets
                key: MYSQL_ROOT_PASSWORD

  # ---- prod is baked (backend#2800), gated on a fresh/rotated datadir --------
  # rotateMysqlRootByEnv.prod / bootstrapDbReparentByEnv.prod are now true, but the
  # baked path resolves on ONLY via tracebloc.bakedRootRotationOn: a mysqlRootPassword
  # pin (this suite sets one), an already-rotated Secret, or a fresh datadir on a live
  # cluster. With the suite pin, prod renders the rotation; the fall-back case below
  # drops the pin to prove a blind prod edge is NOT rotated (backend#947, Lukas 2026-09-02).
  - it: "prod is rotated by the bake — the Secret carries both keys (pinned/fresh)"
    template: templates/secrets.yaml
    documentIndex: 0
    set:
      env.CLIENT_ENV: prod
    asserts:
      - exists:
          path: data.MYSQL_ROOT_PASSWORD
      - exists:
          path: data.DB_BOOTSTRAP_PASSWORD

  - it: "prod's mysql pod injects MYSQL_ROOT_PASSWORD from the Secret"
    template: templates/mysql-deployment.yaml
    set:
      env.CLIENT_ENV: prod
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MYSQL_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: narrow-secrets
                key: MYSQL_ROOT_PASSWORD

  - it: "prod's jobs-manager is re-parented onto root (baked)"
    template: templates/jobs-manager-deployment.yaml
    set:
      env.CLIENT_ENV: prod
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: DB_BOOTSTRAP_USER, value: "root"}

  - it: "a BLIND prod edge falls back to its existing password — baked rotation resolves OFF"
    # The core of the datadir gate: cluster-less (helm-unittest) with NO
    # mysqlRootPassword pin cannot prove the datadir fresh or already-rotated, so
    # the baked default resolves OFF and the edge keeps its current password rather
    # than wedging. Empty pin overrides the suite-level pin to reach this path.
    template: templates/secrets.yaml
    documentIndex: 0
    set:
      env.CLIENT_ENV: prod
      mysqlRootPassword: ""
    asserts:
      - notExists:
          path: data.MYSQL_ROOT_PASSWORD
      - notExists:
          path: data.DB_BOOTSTRAP_PASSWORD

  - it: "renders no NARROW_EDGEUSER by default on prod"
    template: templates/jobs-manager-deployment.yaml
    set:
      env.CLIENT_ENV: prod
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NARROW_EDGEUSER
            value: "1"

  # ---- stg is unbaked, and asserted so it can FAIL ---------------------
  # THE OLD CASE HERE WAS VACUOUS (Arturo, #900), and measured: with
  # `narrowEdgeuserByEnv.stg: true` the whole suite still passed 22/22. A bare
  # `notContains NARROW_EDGEUSER` at a plain stg render cannot fail, because
  # the resolver declines stg narrowing on the PREDECESSORS regardless of the
  # ByEnv map -- so the assertion was reading the predecessors and reporting on
  # the map. The bake follows RETIREMENT one fleet at a time (staging is
  # REVOKEd but not DROPped), so stg needs the same three negatives prod has,
  # and each has to be able to redden.

  - it: "stg does not narrow, and it is the ByEnv map saying so — not the posture"
    template: templates/jobs-manager-deployment.yaml
    # The full posture is FORCED ON here so the predecessors cannot be what
    # declines. `rotateMysqlRoot` is forced too because it is not optional
    # company for the re-parent on an unbaked fleet: without it (or an explicit
    # bootstrapDbPassword pin) secrets.yaml FAILS the render outright, so a
    # posture-forced stg case that omits it tests the refusal, not the map.
    # With this set, `narrowEdgeuserByEnv.stg` is the only remaining input --
    # flip it and NARROW_EDGEUSER appears.
    set:
      env.CLIENT_ENV: stg
      serviceDbAccounts: true
      perExperimentDbCreds: true
      bootstrapDbReparent: true
      rotateMysqlRoot: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NARROW_EDGEUSER
            value: "1"

  - it: "stg is rotated by the bake — the Secret carries both keys (pinned/fresh)"
    template: templates/secrets.yaml
    documentIndex: 0
    set:
      env.CLIENT_ENV: stg
    asserts:
      - exists:
          path: data.MYSQL_ROOT_PASSWORD
      - exists:
          path: data.DB_BOOTSTRAP_PASSWORD

  - it: "stg's mysql pod injects MYSQL_ROOT_PASSWORD from the Secret"
    template: templates/mysql-deployment.yaml
    set:
      env.CLIENT_ENV: stg
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MYSQL_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: narrow-secrets
                key: MYSQL_ROOT_PASSWORD

  - it: "stg's jobs-manager is re-parented onto root (baked)"
    template: templates/jobs-manager-deployment.yaml
    set:
      env.CLIENT_ENV: stg
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: DB_BOOTSTRAP_USER, value: "root"}

  - it: "prod still defaults OFF too"
    template: templates/jobs-manager-deployment.yaml
    set:
      env.CLIENT_ENV: prod
      serviceDbAccounts: true
      perExperimentDbCreds: true
      bootstrapDbReparent: true
      rotateMysqlRoot: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NARROW_EDGEUSER
            value: "1"

  - it: "renders NARROW_EDGEUSER=1 when all three predecessors are on"
    template: templates/jobs-manager-deployment.yaml
    set:
      env.CLIENT_ENV: prod
      narrowEdgeuser: true
      bootstrapDbReparent: true
      bootstrapDbPassword: "root-pw"
      serviceDbAccounts: true
      perExperimentDbCreds: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NARROW_EDGEUSER
            value: "1"

  - it: "resolves through the ByEnv map, not only the operator override"
    template: templates/jobs-manager-deployment.yaml
    set:
      env.CLIENT_ENV: prod
      narrowEdgeuserByEnv.prod: true
      bootstrapDbReparent: true
      bootstrapDbPassword: "root-pw"
      serviceDbAccounts: true
      perExperimentDbCreds: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NARROW_EDGEUSER
            value: "1"

  - it: "an explicit narrowEdgeuser:false overrides a ByEnv true"
    template: templates/jobs-manager-deployment.yaml
    set:
      env.CLIENT_ENV: prod
      narrowEdgeuser: false
      narrowEdgeuserByEnv.prod: true
      bootstrapDbReparent: true
      bootstrapDbPassword: "root-pw"
      serviceDbAccounts: true
      perExperimentDbCreds: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NARROW_EDGEUSER
            value: "1"

  # ---- the refusals, each naming ITS OWN precondition -----------------
  - it: "refuses when the bootstrap is still edgeuser — naming the mid-flight self-revoke"
    template: templates/jobs-manager-deployment.yaml
    set:
      env.CLIENT_ENV: prod
      narrowEdgeuser: true
      serviceDbAccounts: true
      perExperimentDbCreds: true
      # prod now bakes reparent on (via the suite's mysqlRootPassword pin); force it
      # off so the mid-flight-self-revoke blocker this case asserts is reachable.
      bootstrapDbReparent: false
    asserts:
      - failedTemplate:
          errorMessage: |-
            narrowEdgeuser is on but this fleet is not ready to narrow edgeuser (backend#1528 S3). Blocking reasons: bootstrapDbReparent is off, so the account-minting bootstrap still authenticates AS edgeuser -- the REVOKE would strip the privileges of the connection issuing it, mid-flight. Narrowing now would break a live consumer, and because the heartbeat's information_schema enumeration is privilege-filtered it would degrade SILENTLY rather than error -- datasets would simply stop being listed. Complete the posture first (serviceDbAccounts, then perExperimentDbCreds, then bootstrapDbReparent, verified per fleet with docs/migration-tools/edgeuser-drop-readiness.sh), or leave narrowEdgeuser off.

  - it: "refuses when the data plane is still edgeuser — naming serviceDbAccounts"
    template: templates/jobs-manager-deployment.yaml
    set:
      env.CLIENT_ENV: prod
      narrowEdgeuser: true
      bootstrapDbReparent: true
      bootstrapDbPassword: "root-pw"
      perExperimentDbCreds: true
      # prod now bakes serviceDbAccounts on, so force it off to reconstruct the
      # "data plane still edgeuser" blocker this case asserts (backend#2800).
      serviceDbAccounts: false
    asserts:
      - failedTemplate:
          errorMessage: |-
            narrowEdgeuser is on but this fleet is not ready to narrow edgeuser (backend#1528 S3). Blocking reasons: serviceDbAccounts is off, so the metadata and dataset data plane still connects as edgeuser. Narrowing now would break a live consumer, and because the heartbeat's information_schema enumeration is privilege-filtered it would degrade SILENTLY rather than error -- datasets would simply stop being listed. Complete the posture first (serviceDbAccounts, then perExperimentDbCreds, then bootstrapDbReparent, verified per fleet with docs/migration-tools/edgeuser-drop-readiness.sh), or leave narrowEdgeuser off.

  - it: "refuses when training pods still share the credential — naming perExperimentDbCreds"
    template: templates/jobs-manager-deployment.yaml
    set:
      env.CLIENT_ENV: prod
      narrowEdgeuser: true
      bootstrapDbReparent: true
      bootstrapDbPassword: "root-pw"
      serviceDbAccounts: true
      # prod now bakes perExperimentDbCreds on, so force it off to reconstruct the
      # "training pods still share the credential" blocker this case asserts.
      perExperimentDbCreds: false
    asserts:
      - failedTemplate:
          errorMessage: |-
            narrowEdgeuser is on but this fleet is not ready to narrow edgeuser (backend#1528 S3). Blocking reasons: perExperimentDbCreds is off, so training pods still receive the shared edgeuser credential. Narrowing now would break a live consumer, and because the heartbeat's information_schema enumeration is privilege-filtered it would degrade SILENTLY rather than error -- datasets would simply stop being listed. Complete the posture first (serviceDbAccounts, then perExperimentDbCreds, then bootstrapDbReparent, verified per fleet with docs/migration-tools/edgeuser-drop-readiness.sh), or leave narrowEdgeuser off.

  - it: "lists ALL missing preconditions at once, not just the first"
    template: templates/jobs-manager-deployment.yaml
    set:
      env.CLIENT_ENV: prod
      narrowEdgeuser: true
      # prod now bakes reparent + serviceDbAccounts + perExperimentDbCreds on
      # (backend#947 + backend#2800); force ALL THREE off so every predecessor is
      # missing and the full three-reason refusal is reachable.
      bootstrapDbReparent: false
      serviceDbAccounts: false
      perExperimentDbCreds: false
    asserts:
      - failedTemplate:
          errorMessage: |-
            narrowEdgeuser is on but this fleet is not ready to narrow edgeuser (backend#1528 S3). Blocking reasons: bootstrapDbReparent is off, so the account-minting bootstrap still authenticates AS edgeuser -- the REVOKE would strip the privileges of the connection issuing it, mid-flight; serviceDbAccounts is off, so the metadata and dataset data plane still connects as edgeuser; perExperimentDbCreds is off, so training pods still receive the shared edgeuser credential. Narrowing now would break a live consumer, and because the heartbeat's information_schema enumeration is privilege-filtered it would degrade SILENTLY rather than error -- datasets would simply stop being listed. Complete the posture first (serviceDbAccounts, then perExperimentDbCreds, then bootstrapDbReparent, verified per fleet with docs/migration-tools/edgeuser-drop-readiness.sh), or leave narrowEdgeuser off.

  - it: "the refusal explains that over-revoking degrades SILENTLY — the reason it refuses at all"
    template: templates/jobs-manager-deployment.yaml
    set:
      env.CLIENT_ENV: prod
      narrowEdgeuser: true
      bootstrapDbReparent: false
      serviceDbAccounts: false
      perExperimentDbCreds: false
    asserts:
      - failedTemplate:
          errorMessage: |-
            narrowEdgeuser is on but this fleet is not ready to narrow edgeuser (backend#1528 S3). Blocking reasons: bootstrapDbReparent is off, so the account-minting bootstrap still authenticates AS edgeuser -- the REVOKE would strip the privileges of the connection issuing it, mid-flight; serviceDbAccounts is off, so the metadata and dataset data plane still connects as edgeuser; perExperimentDbCreds is off, so training pods still receive the shared edgeuser credential. Narrowing now would break a live consumer, and because the heartbeat's information_schema enumeration is privilege-filtered it would degrade SILENTLY rather than error -- datasets would simply stop being listed. Complete the posture first (serviceDbAccounts, then perExperimentDbCreds, then bootstrapDbReparent, verified per fleet with docs/migration-tools/edgeuser-drop-readiness.sh), or leave narrowEdgeuser off.

  - it: "the refusal points at the readiness verifier, not at prose"
    template: templates/jobs-manager-deployment.yaml
    set:
      env.CLIENT_ENV: prod
      narrowEdgeuser: true
      bootstrapDbReparent: false
      serviceDbAccounts: false
      perExperimentDbCreds: false
    asserts:
      - failedTemplate:
          errorMessage: |-
            narrowEdgeuser is on but this fleet is not ready to narrow edgeuser (backend#1528 S3). Blocking reasons: bootstrapDbReparent is off, so the account-minting bootstrap still authenticates AS edgeuser -- the REVOKE would strip the privileges of the connection issuing it, mid-flight; serviceDbAccounts is off, so the metadata and dataset data plane still connects as edgeuser; perExperimentDbCreds is off, so training pods still receive the shared edgeuser credential. Narrowing now would break a live consumer, and because the heartbeat's information_schema enumeration is privilege-filtered it would degrade SILENTLY rather than error -- datasets would simply stop being listed. Complete the posture first (serviceDbAccounts, then perExperimentDbCreds, then bootstrapDbReparent, verified per fleet with docs/migration-tools/edgeuser-drop-readiness.sh), or leave narrowEdgeuser off.

  - it: "a BAKED default declines silently when the posture is incomplete, it does not refuse"
    template: templates/jobs-manager-deployment.yaml
    # THE DESIGN FIX THAT BAKING DEV EXPOSED. A flat ByEnv `true` used to assert
    # over the posture, so turning ONE predecessor off on a baked environment was a
    # hard render failure -- an operator stepping back (debugging, partial rollback)
    # had to discover a second flag they never set. It broke 5 chart tests and the
    # gate-byenv-resolution guard, which renders each gate OFF by design.
    #
    # A default tracks the posture; an explicit request is honoured or refused
    # loudly. NOT narrowing is the safe direction -- edgeuser keeps its grants and
    # nothing breaks -- while narrowing too early degrades the heartbeat silently.
    set:
      env.CLIENT_ENV: dev
      perExperimentDbCreds: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NARROW_EDGEUSER
            value: "1"

  - it: "an EXPLICIT request with a broken posture is still refused loudly"
    template: templates/jobs-manager-deployment.yaml
    set:
      env.CLIENT_ENV: dev
      narrowEdgeuser: true
      perExperimentDbCreds: false
    asserts:
      - failedTemplate:
          errorMessage: |-
            narrowEdgeuser is on but this fleet is not ready to narrow edgeuser (backend#1528 S3). Blocking reasons: perExperimentDbCreds is off, so training pods still receive the shared edgeuser credential. Narrowing now would break a live consumer, and because the heartbeat's information_schema enumeration is privilege-filtered it would degrade SILENTLY rather than error -- datasets would simply stop being listed. Complete the posture first (serviceDbAccounts, then perExperimentDbCreds, then bootstrapDbReparent, verified per fleet with docs/migration-tools/edgeuser-drop-readiness.sh), or leave narrowEdgeuser off.

  - it: "on dev nothing blocks any more — the re-parent is baked too"
    template: templates/jobs-manager-deployment.yaml
    set:
      env.CLIENT_ENV: dev
      narrowEdgeuser: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NARROW_EDGEUSER
            value: "1"

  - it: "dev narrows once the re-parent is on, needing no other override"
    template: templates/jobs-manager-deployment.yaml
    set:
      env.CLIENT_ENV: dev
      narrowEdgeuser: true
      bootstrapDbReparent: true
      bootstrapDbPassword: "root-pw"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NARROW_EDGEUSER
            value: "1"
