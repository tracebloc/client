suite: Jobs Manager Deployment
templates:
  - templates/jobs-manager-deployment.yaml
set:
  clientId: "test-id"
  clientPassword: "test"
  dockerRegistry:
    server: https://index.docker.io/v1/
    username: test
    password: test
    email: test@test.com
tests:
  - it: should create a Deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-jobs-manager

  # jobs-manager mounts ReadWriteOnce PVCs (client-pvc, client-logs-pvc); it MUST use
  # Recreate, never RollingUpdate. RollingUpdate's maxSurge brings up a second pod that
  # contends for the RWO volume and permanently deadlocks WaitForFirstConsumer
  # provisioning on a single-node local-path cluster after a restart (production incident:
  # jobs-manager Pending for hours, blocking ingestion). Regression guard for that fix.
  - it: must use the Recreate strategy (RWO PVC — no surge pod), not RollingUpdate
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
      - notExists:
          path: spec.strategy.rollingUpdate

  - it: should have standard labels
    asserts:
      - exists:
          path: metadata.labels["app.kubernetes.io/name"]
      - exists:
          path: metadata.labels["app.kubernetes.io/instance"]
      - exists:
          path: metadata.labels["helm.sh/chart"]

  - it: should use dedicated service account
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-jobs-manager

  - it: should have security context
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: should drop all capabilities on api container
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: "ALL"

  - it: should have resource limits on api container
    asserts:
      - isNotEmpty:
          path: spec.template.spec.containers[0].resources.requests
      - isNotEmpty:
          path: spec.template.spec.containers[0].resources.limits
      # #1144: requests.memory pinned == limits.memory (1Gi api / 512Mi
      # pods-monitor) to lower oom_score_adj during a mass restart.
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 1Gi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1Gi
      - equal:
          path: spec.template.spec.containers[1].resources.requests.memory
          value: 512Mi
      - equal:
          path: spec.template.spec.containers[1].resources.limits.memory
          value: 512Mi

  # SELECTED BY NAME, NOT BY POSITION. This was `env[0]`, and `env[0]` was
  # CLIENT_ID only for as long as nothing was ever prepended — which stopped being
  # true when backend#2400 ungated the telemetry token coordinates that render
  # above it. A positional assertion in a list the chart appends to is a test that
  # changes what it means without changing what it says.
  - it: should reference secret via helper
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="CLIENT_ID")].valueFrom.secretKeyRef.name
          value: RELEASE-NAME-secrets

  - it: should use docker.io registry by default
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^docker\\.io/tracebloc/"

  - it: should set JOB_IMAGE_HOST to docker.io
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: JOB_IMAGE_HOST
            value: "docker.io/"

  # ---------------------------------------------------------------------------
  # Ingestor image distribution (backend#1028 pin, backend#1245 distribution).
  #
  # The prod pin `images.ingestor.prodDigest` is a CHART DEFAULT, gated to prod
  # by the resolved CLIENT_ENV, so a standard prod install is reproducible and a
  # republished pin propagates through `helm upgrade --reset-then-reuse-values`
  # (the fleet auto-upgrade) — which an install-time `-f` overlay never could.
  # These cases lock in both halves of the gate: prod pinned, non-prod floating.
  # ---------------------------------------------------------------------------
  - it: pins the ingestor digest on prod by chart default (CLIENT_ENV unset => prod)
    # Chart defaults only: no env.CLIENT_ENV, which the template resolves to
    # "prod" — exactly what the standard prod installer produces (it writes
    # CLIENT_ENV into the generated values ONLY for dev/stg). Asserting the
    # chart-default digest here is the regression guard for #1245: the pin must
    # be reachable with no `-f` overlay and no `--set`.
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_REPOSITORY
            value: "ghcr.io/tracebloc/ingestor"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_TAG
            value: "0.8"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_DIGEST
            value: "sha256:05e124945a2ef61868661a9137abb5e75dac96a090cb41a7b4e8be520c4b5873"

  - it: keeps the ingestor floating on dev (CLIENT_ENV=dev => no digest, :dev channel)
    # Since backend#1360 the dev float is the per-environment INTERNAL
    # channel (:dev) rather than the 0.7 release float — the point of the
    # change: a dev edge tracks develop, so an ingestor change can be
    # validated on a real edge without a production release.
    # dev/staging carry env.CLIENT_ENV in their user-supplied values, so the prod
    # pin does not apply: DIGEST empty => client-runtime spawns repo:tag with
    # imagePullPolicy=Always and the edge is never frozen on a stale build.
    set:
      env:
        CLIENT_ENV: dev
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_DIGEST
            value: ""
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_TAG
            value: "dev"

  - it: keeps the ingestor floating on staging (CLIENT_ENV=stg => no digest)
    set:
      env:
        CLIENT_ENV: stg
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_DIGEST
            value: ""

  - it: renders the prod pin when CLIENT_ENV is set explicitly to prod
    set:
      env:
        CLIENT_ENV: prod
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_DIGEST
            value: "sha256:05e124945a2ef61868661a9137abb5e75dac96a090cb41a7b4e8be520c4b5873"

  - it: prodPin=false floats a canary prod edge while the fleet stays pinned
    set:
      images:
        ingestor:
          prodPin: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_DIGEST
            value: ""

  - it: an empty prodDigest falls back to the floating tag (never renders a bare @)
    set:
      images:
        ingestor:
          prodDigest: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_DIGEST
            value: ""

  - it: pins the ingestor digest when images.ingestor.digest is set (opt-in reproducibility)
    # The per-edge explicit pin wins over the prod default, in any environment —
    # here on a dev edge, which the CLIENT_ENV gate would otherwise float.
    set:
      env:
        CLIENT_ENV: dev
      images:
        ingestor:
          digest: "sha256:dfdaa7e633a8df0f46b403e9422eba5c16bdb7d9c39047e6d3738f9e38fbdba8"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_DIGEST
            value: "sha256:dfdaa7e633a8df0f46b403e9422eba5c16bdb7d9c39047e6d3738f9e38fbdba8"

  - it: an explicit images.ingestor.digest overrides the prod pin on prod too
    set:
      images:
        ingestor:
          digest: "sha256:dfdaa7e633a8df0f46b403e9422eba5c16bdb7d9c39047e6d3738f9e38fbdba8"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_DIGEST
            value: "sha256:dfdaa7e633a8df0f46b403e9422eba5c16bdb7d9c39047e6d3738f9e38fbdba8"

  - it: ingestor repository + tag are overridable for a private mirror / air-gapped registry
    set:
      images:
        ingestor:
          repository: "private.registry/ingestor"
          tag: "0.4"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_REPOSITORY
            value: "private.registry/ingestor"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_TAG
            value: "0.4"

  # client-runtime#92: SINGLE_NODE gates jobs-manager's GPU->CPU pending
  # fallback; it defaults to hostPath.enabled so managed (dynamic-PVC)
  # clusters never auto-downgrade while installer/bare-metal single-host
  # clusters keep the hard rule.
  - it: should default SINGLE_NODE to "false" on managed (hostPath disabled) clusters
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SINGLE_NODE
            value: "false"

  - it: should set SINGLE_NODE to "true" when hostPath is enabled
    set:
      hostPath:
        enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SINGLE_NODE
            value: "true"

  - it: should let an explicit env.SINGLE_NODE override the hostPath-derived default
    set:
      hostPath:
        enabled: true
      env:
        SINGLE_NODE: "false"
    asserts:
      # explicit "false" wins over hostPath.enabled=true, and is emitted
      # exactly once (not duplicated by the generic env range).
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SINGLE_NODE
            value: "false"
          count: 1

  # backend#664 (Utilization Ladder L0, supersedes the backend#745 pin): with
  # no operator value the chart must NOT inject RESOURCE_REQUESTS /
  # RESOURCE_LIMITS. Omitting them is what lets jobs-manager choose — which
  # today means its built-in cpu=2,memory=8Gi literal (the exact literal the
  # chart used to inject, so omission is behavior-identical on any pre-#664
  # image), and means the node-allocatable derivation only where the operator
  # has also opted in via DERIVE_JOB_ENVELOPE (backend#2167, backend#2250).
  # This block asserts the omission; the DERIVE_JOB_ENVELOPE cases below assert
  # the gate that decides what the omission resolves to.
  # Assert absence on BOTH containers that used to receive it
  # (api + pods-monitor).
  - it: omits spawned-job RESOURCE_REQUESTS/LIMITS by default (jobs-manager derives from node)
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: RESOURCE_REQUESTS}
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: RESOURCE_LIMITS}
          any: true
      - notContains:
          path: spec.template.spec.containers[1].env
          content: {name: RESOURCE_REQUESTS}
          any: true
      - notContains:
          path: spec.template.spec.containers[1].env
          content: {name: RESOURCE_LIMITS}
          any: true

  # backend#2220: RESOURCE_PROVENANCE records WHO chose the envelope. It never
  # changes the envelope; it exists because RESOURCE_* has no unset state once
  # helm's --reset-then-reuse-values has seen it, so an installer-written value
  # and a deliberate `tracebloc resources set` are otherwise indistinguishable.
  # It rides inside the same gate as the pair it describes: a marker with no
  # envelope to describe is noise, and gating them together means one explicit
  # unset clears all three.
  - it: omits RESOURCE_PROVENANCE when the envelope itself is unset
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: RESOURCE_PROVENANCE}
          any: true
      - notContains:
          path: spec.template.spec.containers[1].env
          content: {name: RESOURCE_PROVENANCE}
          any: true

  # backend#2250: DERIVE_JOB_ENVELOPE is the gate on the L0 node-derived
  # envelope. It has no dedicated template block on purpose — it carries no
  # chart-side default and no derived value, so it rides the generic
  # .Values.env passthrough exactly as GPU_VISIBLE_DEVICES does. These cases
  # exist because that is precisely the wiring nobody could verify before: the
  # flag was readable only by jobs_manager.py, named in no chart file, so
  # "expose the flag" is not done until a test proves the value reaches the
  # container. Asserted on BOTH containers — the api container is the one that
  # runs jobs_manager.py, and pods-monitor is kept symmetric.
  - it: omits DERIVE_JOB_ENVELOPE by default (the derive path stays gated off)
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: DERIVE_JOB_ENVELOPE}
          any: true
      - notContains:
          path: spec.template.spec.containers[1].env
          content: {name: DERIVE_JOB_ENVELOPE}
          any: true

  - it: passes DERIVE_JOB_ENVELOPE through to both containers when set
    set:
      env:
        DERIVE_JOB_ENVELOPE: "true"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DERIVE_JOB_ENVELOPE
            value: "true"
          count: 1
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: DERIVE_JOB_ENVELOPE
            value: "true"
          count: 1

  - it: emits an explicit off value rather than swallowing it
    # "false" is not the same as unset to a reader debugging an edge: it says
    # someone considered the gate and declined. The passthrough range skips
    # FALSY values, and a non-empty string is truthy to Helm, so "false"
    # survives — the assertion pins that, because the range's `$value` guard
    # makes it a real question rather than an obvious one.
    set:
      env:
        DERIVE_JOB_ENVELOPE: "false"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DERIVE_JOB_ENVELOPE
            value: "false"
          count: 1

  - it: drops an empty DERIVE_JOB_ENVELOPE instead of emitting a blank gate
    # "" is off to jobs-manager either way, so both shapes are correct at
    # runtime; this pins WHICH one the chart produces (the passthrough's falsy
    # guard drops it) so a future template change cannot flip it unnoticed.
    set:
      env:
        DERIVE_JOB_ENVELOPE: ""
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: DERIVE_JOB_ENVELOPE}
          any: true

  - it: keeps DERIVE_JOB_ENVELOPE and an explicit envelope independent
    # The gate is inert when RESOURCE_* is set (jobs-manager never reaches the
    # derive branch), but the chart must still ship both values untouched —
    # silently dropping the flag here would hide the operator's intent from
    # anyone reading the Deployment, and the runtime, not the chart, owns the
    # precedence rule.
    set:
      env:
        DERIVE_JOB_ENVELOPE: "true"
        RESOURCE_REQUESTS: "cpu=4,memory=16Gi"
        RESOURCE_LIMITS: "cpu=4,memory=16Gi"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DERIVE_JOB_ENVELOPE
            value: "true"
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RESOURCE_REQUESTS
            value: "cpu=4,memory=16Gi"
          count: 1

  - it: defaults RESOURCE_PROVENANCE to unknown when the envelope is set without it
    # The pre-#2220 release shape. "unknown" is the honest answer, and consumers
    # must treat it as "user" — guessing "installer" here would let a future
    # ladder overrule a human choice.
    set:
      env:
        RESOURCE_LIMITS: "cpu=4,memory=16Gi"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RESOURCE_PROVENANCE
            value: "unknown"
          count: 1
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: RESOURCE_PROVENANCE
            value: "unknown"
          count: 1

  - it: carries an explicit RESOURCE_PROVENANCE through to both containers
    set:
      env:
        RESOURCE_REQUESTS: "cpu=4,memory=16Gi"
        RESOURCE_LIMITS: "cpu=4,memory=16Gi"
        RESOURCE_PROVENANCE: "user"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RESOURCE_PROVENANCE
            value: "user"
          count: 1
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: RESOURCE_PROVENANCE
            value: "user"
          count: 1

  - it: lets operators override spawned-job resources via env.RESOURCE_REQUESTS/LIMITS
    set:
      env:
        RESOURCE_REQUESTS: "cpu=4,memory=16Gi"
        RESOURCE_LIMITS: "cpu=4,memory=16Gi"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RESOURCE_REQUESTS
            value: "cpu=4,memory=16Gi"
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RESOURCE_LIMITS
            value: "cpu=4,memory=16Gi"
          count: 1
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: RESOURCE_REQUESTS
            value: "cpu=4,memory=16Gi"
          count: 1
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: RESOURCE_LIMITS
            value: "cpu=4,memory=16Gi"
          count: 1

  # Bugbot on the #664 PR: the two vars share ONE gate, so a values file that
  # sets only one still renders the PAIR (the missing one gets the historic
  # literal, exactly as the always-inject template did) — a lone
  # RESOURCE_REQUESTS/RESOURCE_LIMITS env var must never be emitted.
  - it: pairs the literal when only one of RESOURCE_REQUESTS/LIMITS is set
    set:
      env:
        RESOURCE_LIMITS: "cpu=4,memory=16Gi"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RESOURCE_REQUESTS
            value: "cpu=2,memory=8Gi"
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RESOURCE_LIMITS
            value: "cpu=4,memory=16Gi"
          count: 1
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: RESOURCE_REQUESTS
            value: "cpu=2,memory=8Gi"
          count: 1
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: RESOURCE_LIMITS
            value: "cpu=4,memory=16Gi"
          count: 1

  - it: does not render PER_INGESTION_TABLES by default (RFC-0003 D16 knob off)
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PER_INGESTION_TABLES
            value: "1"

  - it: renders PER_INGESTION_TABLES=1 when perIngestionTables is enabled
    set:
      perIngestionTables: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PER_INGESTION_TABLES
            value: "1"

  - it: does not render PER_DATASET_PVCS by default (RFC-0003 D9 Track B knob off)
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PER_DATASET_PVCS
            value: "1"

  - it: renders PER_DATASET_PVCS=1 when perDatasetPvcs is enabled
    set:
      perDatasetPvcs: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PER_DATASET_PVCS
            value: "1"

  - it: does not render per-experiment DB-cred env by default (RFC-0003 D10 knob off)
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PER_EXPERIMENT_DB_CREDS
            value: "1"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: TB_CREDMGR_USER
            value: "tb_credmgr"

  - it: renders per-experiment DB-cred env (flag + credmgr identity + secret ref) when enabled
    set:
      perExperimentDbCreds: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PER_EXPERIMENT_DB_CREDS
            value: "1"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TB_CREDMGR_USER
            value: "tb_credmgr"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TB_CREDMGR_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets
                key: TB_CREDMGR_PASSWORD

  # #611: /data/shared (client-pvc) AND /data/logs (client-logs-pvc) must be writable by
  # the non-root pods that mount them — the ingest-staging pod writes to /data/shared, the
  # spawned training pods write to /data/logs. hostPath ignores fsGroup (k8s#138411), so a
  # privileged init makes both volumes world-writable. No fsGroup is set: it's a no-op on
  # hostPath and on CSI would strip the spawned pods' group-0 access; CSI skips the init.
  - it: "hostPath install adds init-writable-data to make /data/shared and /data/logs writable (#611)"
    set:
      hostPath:
        enabled: true
    asserts:
      # no fsGroup — no-op on hostPath, and a regression risk on CSI (see template comment)
      - notExists:
          path: spec.template.spec.securityContext.fsGroup
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: init-writable-data
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 0
      - contains:
          path: spec.template.spec.initContainers[0].securityContext.capabilities.add
          content: CHOWN
      - contains:
          path: spec.template.spec.initContainers[0].securityContext.capabilities.add
          content: FOWNER
      # FSETID is required or the kernel strips the setgid bit when chmod runs after
      # the chown to GID 1000 (root without FSETID can't set setgid on a non-owned-group dir)
      - contains:
          path: spec.template.spec.initContainers[0].securityContext.capabilities.add
          content: FSETID
      # each dir is fixed INDEPENDENTLY (a for-loop): chown 1000:1000 then chmod its OWN mode.
      # (?s) so . spans the newlines of the multi-line script (#672).
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: '(?s)for e in /data/shared:2777 /data/logs:3777.*chown 1000:1000.*chmod'
      # /data/shared must NOT be sticky. `data delete` removes a tree the INGEST wrote: the
      # ingestion Job runs as uid 65534 (or HOST_UID), the CLI teardown pod as 65532. Sticky
      # allows an unlink only by the entry's owner, the dir's owner, or root — none of which the
      # teardown is — so sticky here made a documented operation impossible: table dropped, files
      # stranded. fsGroup can't align them either (kubelet ignores it on hostPath, k8s#138411).
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "/data/shared:2777"
      # ...while /data/logs KEEPS sticky: nothing has to delete another writer's logs, so the
      # /tmp-style protection costs nothing there. Both keep setgid (2) for GID inheritance.
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "/data/logs:3777"
      # best-effort: a failing chown/chmod is logged, not fatal, so the other dir is still fixed
      # and jobs-manager still starts (e.g. /data/shared on an NFS root_squash export). The
      # per-dir report is an echo per outcome, and the script always exits 0 (#672 replaced the
      # single `|| echo` tail — which was also what swallowed the chmod — with per-dir OK/FAIL).
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: 'echo "init-writable-data: OK '
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: 'echo "init-writable-data: FAIL '
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: '(?m)^exit 0$'
      # the init must mount BOTH hostPath volumes it chowns, or the chown is a no-op
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: shared-volume
            mountPath: /data/shared
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: logs-volume
            mountPath: /data/logs

  # #672: the chmod must NOT be gated behind the chown's success. They were chained
  # (`chown 1000:1000 "$d" && chmod "$m" "$d" || echo ...`), so on any mount that refuses the
  # chown — pre-provisioned volume, NFS root_squash export, Windows/Docker-Desktop bind mount —
  # the chmod was never attempted and the dir kept kubelet's root:root 0755, while the log said
  # "leaving as-is". The mode is the load-bearing half: hostPath ignores fsGroup (k8s#138411),
  # so /data/shared must be OTHER-writable for the ingestion Job (uid 65534 / HOST_UID) and the
  # CLI staging+teardown pod (uid 65532), neither of which is 1000 or shares a group with it.
  # Losing the chmod is strictly worse than losing the chown, so the chown must never guard it.
  - it: "init-writable-data never gates the chmod behind the chown (#672)"
    set:
      hostPath:
        enabled: true
    asserts:
      # THE REGRESSION GUARD: no `&&` may ever join the two calls on one line, in either order.
      # Deliberately NOT scoped to executable lines. The obvious way to exclude comments —
      # `^[^#\n]*chown...` — is silently vacuous here, because the loop body legitimately contains
      # a '#' (`${e#*:}`) BEFORE the chown, so `[^#\n]*` can never reach it and the guard passes
      # against the very one-liner it is meant to reject. Verified by running this assertion
      # against the old command: comment-scoped it passed, unscoped it fails. So the rendered
      # command must not contain that shape ANYWHERE, prose included — hence the template
      # describes the old behaviour in words ("chained with a logical AND") rather than in code.
      - notMatchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: 'chown[^\n]*&&[^\n]*chmod'
      - notMatchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: 'chmod[^\n]*&&[^\n]*chown'
      # each call is its OWN statement, and each records which one failed rather than sharing a tail
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: '(?m)^\s*chown 1000:1000 "\$d" \|\| failed='
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: '(?m)^\s*chmod "\$want" "\$d" \|\| failed='
      # the verdict is read back from the OBSERVED mode, not from an exit status: a bind mount can
      # accept a chmod and ignore it, so "the command returned 0" is not evidence the mode landed
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: 'ls -ldn "\$d"'
      # other-write bit (mode char 9) is what decides OK/FAIL — ownership is NOT a pass condition,
      # since a successful chown with a failed chmod leaves a 0755 dir no writer can use
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: '\?{8}w\*\)'
      # `stat -c` is GNU-only and fails SILENTLY on busybox/BSD (empty mode -> spurious FAIL on a
      # perfectly good install), which is why the check is ls -ldn. Keep it that way.
      - notMatchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: 'stat -c'
      # a partial result must be reported as such, not implied — and the note must not claim the
      # chmod achieved the mode. A dir that was ALREADY other-writable when both calls failed is
      # still OK, but nothing this container did made it so: an earlier draft said "mode applied
      # anyway" there, which was false (verified by running that exact case: pre-set 1777, both
      # calls refused -> "want 2777 got drwxrwxrwt ... mode applied anyway"). Claim only the
      # observation: the dir is other-writable, whatever refused us.
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: '\$failed failed; other-writable regardless'
      - notMatchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: 'mode applied anyway'
      # still non-fatal: jobs-manager must start even when a mount refuses everything
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: '(?m)^exit 0$'

  - it: "CSI install (hostPath disabled) skips the privileged init and sets no fsGroup (#611)"
    set:
      hostPath:
        enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.securityContext.fsGroup
      - notExists:
          path: spec.template.spec.initContainers

  # backend#1528 S1: the tb_meta / tb_ingest env is flag-gated on
  # serviceDbAccounts so a default install is byte-identical.
  - it: service DB account env absent by default (byte-for-byte off)
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICE_DB_ACCOUNTS
            value: "1"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: TB_META_USER
            value: "tb_meta"

  - it: service DB account env wired when serviceDbAccounts is on
    set:
      serviceDbAccounts: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICE_DB_ACCOUNTS
            value: "1"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TB_META_USER
            value: "tb_meta"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TB_INGEST_USER
            value: "tb_ingest"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TB_META_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets
                key: TB_META_PASSWORD
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TB_INGEST_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets
                key: TB_INGEST_PASSWORD

  # backend#1528 S3: the bootstrap re-parent env (edgeuser -> root for the mint
  # DDL) is flag-gated on bootstrapDbReparent so a default install is
  # byte-identical. DB_BOOTSTRAP_USER/PASSWORD render together (both-or-neither),
  # only on jobs-manager (the sole minter).
  - it: bootstrap re-parent env absent by default (byte-for-byte off)
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_BOOTSTRAP_USER
            value: "root"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_BOOTSTRAP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets
                key: DB_BOOTSTRAP_PASSWORD

  - it: bootstrap re-parent env wired when bootstrapDbReparent is on
    set:
      bootstrapDbReparent: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_BOOTSTRAP_USER
            value: "root"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_BOOTSTRAP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets
                key: DB_BOOTSTRAP_PASSWORD

  # -------------------------------------------------------------------------
  # Readiness probe — backend#1779
  #
  # Before this, jobs-manager had no probes, so the kubelet called the
  # container Ready as soon as it was running and `kubectl rollout status`
  # reported success over a crash-loop (backend#1723, 2026-08-11).
  #
  # The probe is `httpGet: /healthz`, NOT `tcpSocket: 8080`. It shipped as a
  # TCP connect (client#699) only because `/healthz` was an unconditional
  # `200 {"status":"ok"}` at the time and so could not go red;
  # client-runtime#327 replaced it with `_healthz_report`, which 503s when
  # authz_mount / schema / metadata_db fail. Each of those is a state where
  # the socket IS bound — a TCP connect passes and the Service routes
  # POST /internal/submit-ingestion-run at a pod that answers 403 or 500.
  # The `tcpSocket` must-not-exist assertion below is what stops a revert to
  # the weaker signal passing as "there is still a readiness probe".
  #
  # READINESS ONLY, on purpose. Both livenessProbe and startupProbe kill the
  # container when they fail, and jobs_manager.py deliberately survives a
  # failed ingestion-server start so Service Bus polling and training keep
  # working. /healthz depending on MySQL makes that sharper, not softer. The
  # two "must not exist" tests below are the guard on that.
  # -------------------------------------------------------------------------

  - it: should give the api container a readiness probe on GET /healthz
    template: templates/jobs-manager-deployment.yaml
    asserts:
      - isNotEmpty:
          path: spec.template.spec.containers[0].readinessProbe
      # Path AND port are both load-bearing, and each is asserted separately
      # so a failure says which half broke. `isNotEmpty` on the probe alone
      # would pass for a probe pointed anywhere at all.
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: 8080
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 3

  - it: should NOT fall back to a bare TCP connect on 8080
    template: templates/jobs-manager-deployment.yaml
    asserts:
      # The specific regression this ticket exists to prevent, named as its own
      # case rather than folded into the httpGet test. The httpGet assertions
      # above already redden on a straight revert, so this is not there to
      # catch a case they miss — it is there so that WHEN they redden, one of
      # the failures says `tcpSocket expected to NOT exists` instead of three
      # `unknown path …httpGet.*` lines that read like a typo. A revert to the
      # weaker signal should not have to be diagnosed.
      #
      # It is also the one assertion that is independent of what replaced the
      # httpGet block, so it keeps holding if the probe is ever restructured.
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket

  - it: should give the readiness probe room for a slow auth + migration start
    template: templates/jobs-manager-deployment.yaml
    asserts:
      # jobs-manager retries backend auth and runs a MySQL migration before it
      # listens. Failing readiness during that costs nothing (the pod is just
      # NotReady, nothing kills it), but the delay keeps the event log honest.
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 10
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 10

  - it: should let /healthz outlive a half-open MySQL before the probe times out
    template: templates/jobs-manager-deployment.yaml
    asserts:
      # Derived from the endpoint, not chosen: ping_metadata_db passes
      # connection_timeout=2 AND read_timeout=2 (sql_utils.py), so a MySQL
      # that completes the handshake and then stops answering takes ~4s to
      # raise. The 3s that was fine for a TCP connect would cut that off, and
      # a probe timeout reports "timeout" where the 503 body would have named
      # metadata_db. Both mark the pod NotReady; only one says why.
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 5

  - it: should NOT give the api container any probe that restarts it (deliberate)
    template: templates/jobs-manager-deployment.yaml
    asserts:
      # BOTH of these kill the container on failure — liveness on every
      # threshold breach, and a startupProbe likewise ("if the startup probe
      # fails, the kubelet kills the container"). jobs_manager.py catches a
      # failed run_server_in_thread on purpose so that Service Bus polling and
      # training submissions keep working, so either probe would reverse that
      # decision from the chart and turn a degraded-but-useful pod into a
      # CrashLoopBackOff. Readiness (remove from Service) is the correct
      # response; restarting a process that is still training models is not.
      #
      # Now that readiness is GET /healthz, this matters MORE: _healthz_report
      # pings MySQL, and its own docstring says the result is "safe for
      # READINESS and wrong for LIVENESS or a startupProbe" — on either of
      # those a MySQL blip would restart jobs-manager, not just deroute it.
      #
      # An earlier revision of client#699 shipped a startupProbe with a 150s
      # budget and had exactly that bug. This test is why it cannot come back
      # silently.
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
      - notExists:
          path: spec.template.spec.containers[0].startupProbe

  - it: should drop the probe when the ingestion server is disabled
    template: templates/jobs-manager-deployment.yaml
    set:
      # The runtime treats ANY non-empty value as "disabled"
      # (`not os.getenv("INGESTION_HTTP_DISABLED")`), so the chart must too —
      # otherwise the probe would GET a path nothing serves and the pod would
      # never become Ready.
      env.INGESTION_HTTP_DISABLED: "1"
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe

  - it: should still probe when INGESTION_HTTP_DISABLED is present but empty
    template: templates/jobs-manager-deployment.yaml
    set:
      # Empty string is falsey to both Python's os.getenv guard and Helm, so
      # ingestion IS enabled and the probes must stay.
      env.INGESTION_HTTP_DISABLED: ""
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: 8080

  - it: should not probe the pods-monitor sidecar (no HTTP surface)
    template: templates/jobs-manager-deployment.yaml
    asserts:
      # Recorded, not overlooked: pods-monitor listens on nothing, so there is
      # no port to probe. backend#1779 leaves it open; giving it a probe needs
      # a health surface first, which is a separate change.
      - equal:
          path: spec.template.spec.containers[1].name
          value: pods-monitor-container
      - notExists:
          path: spec.template.spec.containers[1].readinessProbe

  # =====================================================================
  # #569 pull policy. NOT unconditional — it tracks whether an update path
  # exists that does not depend on `Always`. See the
  # tracebloc.controlPlanePullPolicy helper.
  # =====================================================================

  - it: both containers are IfNotPresent by default (refresh on, docker.io)
    # The offline-restart fix: `Always` forced a registry round-trip on every
    # (re)start, so a Docker/WSL restart without the registry landed in
    # ImagePullBackOff on a cached image. Safe here because image-refresh drives
    # updates by changing the image REFERENCE (`kubectl set image repo@digest`).
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent
      - equal:
          path: spec.template.spec.containers[1].imagePullPolicy
          value: IfNotPresent

  - it: falls back to Always behind a private mirror (#569, Bugbot High)
    # The reconcile resolves digests from docker.io, so it goes inert under a
    # mirror rather than pinning a digest the mirror may not hold. If the pods
    # were IfNotPresent anyway, that edge would have NO update path at all:
    # syncing the mirror and restarting would keep serving the cached tag, and
    # the CronJob would stay green while the control plane froze. Keep the
    # pre-#569 semantics exactly where they are still the only thing that works.
    set:
      global:
        imageRegistry: "mirror.example.com"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
      - equal:
          path: spec.template.spec.containers[1].imagePullPolicy
          value: Always

  - it: falls back to Always when imageRefresh is disabled (#569, Bugbot High)
    # values.schema.json has always told these operators that the images stay
    # put "until manual restart" — which is only true with Always.
    set:
      imageRefresh:
        enabled: false
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
      - equal:
          path: spec.template.spec.containers[1].imagePullPolicy
          value: Always

  - it: an explicit digest pin is IfNotPresent even with refresh disabled
    # A digest is immutable, so re-checking the registry can only return the
    # same image. Updates come from changing the pin, not from the policy.
    set:
      imageRefresh:
        enabled: false
      images:
        jobsManager:
          digest: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent
      # pods-monitor is NOT pinned and refresh is off -> still Always.
      - equal:
          path: spec.template.spec.containers[1].imagePullPolicy
          value: Always

  - it: container names are the ones image-refresh set-images by name (#569)
    # Contract with image-refresh-cronjob.yaml's `set image` args. Renaming a
    # container here without updating that script breaks every future refresh
    # tick. Pinned on both sides; see image_refresh_test.yaml.
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: api
      - equal:
          path: spec.template.spec.containers[1].name
          value: pods-monitor-container

  # The heartbeat version inventory needs to know where the resource-monitor
  # DaemonSet lives — the one chart workload outside the release namespace.
  - it: passes the node-agents namespace to the api container
    set:
      nodeAgents:
        namespace:
          name: tracebloc-node-agents
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_AGENTS_NAMESPACE
            value: "tracebloc-node-agents"

  # The empty value is load-bearing: the runtime reads unset as "use the
  # built-in default" and set-but-empty as "no node-agents namespace".
  - it: empties the node-agents namespace when resourceMonitor is off
    set:
      resourceMonitor: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_AGENTS_NAMESPACE
            value: ""
