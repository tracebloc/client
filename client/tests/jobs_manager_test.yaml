suite: Jobs Manager Deployment
templates:
  - templates/jobs-manager-deployment.yaml
set:
  clientId: "test-id"
  clientPassword: "test"
  dockerRegistry:
    server: https://index.docker.io/v1/
    username: test
    password: test
    email: test@test.com
tests:
  - it: should create a Deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-jobs-manager

  # jobs-manager mounts ReadWriteOnce PVCs (client-pvc, client-logs-pvc); it MUST use
  # Recreate, never RollingUpdate. RollingUpdate's maxSurge brings up a second pod that
  # contends for the RWO volume and permanently deadlocks WaitForFirstConsumer
  # provisioning on a single-node local-path cluster after a restart (production incident:
  # jobs-manager Pending for hours, blocking ingestion). Regression guard for that fix.
  - it: must use the Recreate strategy (RWO PVC — no surge pod), not RollingUpdate
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
      - notExists:
          path: spec.strategy.rollingUpdate

  - it: should have standard labels
    asserts:
      - exists:
          path: metadata.labels["app.kubernetes.io/name"]
      - exists:
          path: metadata.labels["app.kubernetes.io/instance"]
      - exists:
          path: metadata.labels["helm.sh/chart"]

  - it: should use dedicated service account
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-jobs-manager

  - it: should have security context
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: should drop all capabilities on api container
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: "ALL"

  - it: should have resource limits on api container
    asserts:
      - isNotEmpty:
          path: spec.template.spec.containers[0].resources.requests
      - isNotEmpty:
          path: spec.template.spec.containers[0].resources.limits
      # v1.1.0 floor: 512Mi/1Gi for api, after the prod OOM investigation.
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 512Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1Gi
      - equal:
          path: spec.template.spec.containers[1].resources.requests.memory
          value: 256Mi
      - equal:
          path: spec.template.spec.containers[1].resources.limits.memory
          value: 512Mi

  - it: should reference secret via helper
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: RELEASE-NAME-secrets

  - it: should use docker.io registry by default
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^docker\\.io/tracebloc/"

  - it: should set JOB_IMAGE_HOST to docker.io
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: JOB_IMAGE_HOST
            value: "docker.io/"

  # ---------------------------------------------------------------------------
  # Ingestor image distribution (backend#1028 pin, backend#1245 distribution).
  #
  # The prod pin `images.ingestor.prodDigest` is a CHART DEFAULT, gated to prod
  # by the resolved CLIENT_ENV, so a standard prod install is reproducible and a
  # republished pin propagates through `helm upgrade --reset-then-reuse-values`
  # (the fleet auto-upgrade) — which an install-time `-f` overlay never could.
  # These cases lock in both halves of the gate: prod pinned, non-prod floating.
  # ---------------------------------------------------------------------------
  - it: pins the ingestor digest on prod by chart default (CLIENT_ENV unset => prod)
    # Chart defaults only: no env.CLIENT_ENV, which the template resolves to
    # "prod" — exactly what the standard prod installer produces (it writes
    # CLIENT_ENV into the generated values ONLY for dev/stg). Asserting the
    # chart-default digest here is the regression guard for #1245: the pin must
    # be reachable with no `-f` overlay and no `--set`.
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_REPOSITORY
            value: "ghcr.io/tracebloc/ingestor"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_TAG
            value: "0.7"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_DIGEST
            value: "sha256:9098b3c9b83951f825e262d6ff1e9c47c46c5b5cafbfc8fef1ed82ccbadebb24"

  - it: keeps the ingestor floating on dev (CLIENT_ENV=dev => no digest, :dev channel)
    # Since backend#1360 the dev float is the per-environment INTERNAL
    # channel (:dev) rather than the 0.7 release float — the point of the
    # change: a dev edge tracks develop, so an ingestor change can be
    # validated on a real edge without a production release.
    # dev/staging carry env.CLIENT_ENV in their user-supplied values, so the prod
    # pin does not apply: DIGEST empty => client-runtime spawns repo:tag with
    # imagePullPolicy=Always and the edge is never frozen on a stale build.
    set:
      env:
        CLIENT_ENV: dev
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_DIGEST
            value: ""
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_TAG
            value: "dev"

  - it: keeps the ingestor floating on staging (CLIENT_ENV=stg => no digest)
    set:
      env:
        CLIENT_ENV: stg
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_DIGEST
            value: ""

  - it: renders the prod pin when CLIENT_ENV is set explicitly to prod
    set:
      env:
        CLIENT_ENV: prod
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_DIGEST
            value: "sha256:9098b3c9b83951f825e262d6ff1e9c47c46c5b5cafbfc8fef1ed82ccbadebb24"

  - it: prodPin=false floats a canary prod edge while the fleet stays pinned
    set:
      images:
        ingestor:
          prodPin: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_DIGEST
            value: ""

  - it: an empty prodDigest falls back to the floating tag (never renders a bare @)
    set:
      images:
        ingestor:
          prodDigest: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_DIGEST
            value: ""

  - it: pins the ingestor digest when images.ingestor.digest is set (opt-in reproducibility)
    # The per-edge explicit pin wins over the prod default, in any environment —
    # here on a dev edge, which the CLIENT_ENV gate would otherwise float.
    set:
      env:
        CLIENT_ENV: dev
      images:
        ingestor:
          digest: "sha256:dfdaa7e633a8df0f46b403e9422eba5c16bdb7d9c39047e6d3738f9e38fbdba8"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_DIGEST
            value: "sha256:dfdaa7e633a8df0f46b403e9422eba5c16bdb7d9c39047e6d3738f9e38fbdba8"

  - it: an explicit images.ingestor.digest overrides the prod pin on prod too
    set:
      images:
        ingestor:
          digest: "sha256:dfdaa7e633a8df0f46b403e9422eba5c16bdb7d9c39047e6d3738f9e38fbdba8"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_DIGEST
            value: "sha256:dfdaa7e633a8df0f46b403e9422eba5c16bdb7d9c39047e6d3738f9e38fbdba8"

  - it: ingestor repository + tag are overridable for a private mirror / air-gapped registry
    set:
      images:
        ingestor:
          repository: "private.registry/ingestor"
          tag: "0.4"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_REPOSITORY
            value: "private.registry/ingestor"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_TAG
            value: "0.4"

  # client-runtime#92: SINGLE_NODE gates jobs-manager's GPU->CPU pending
  # fallback; it defaults to hostPath.enabled so managed (dynamic-PVC)
  # clusters never auto-downgrade while installer/bare-metal single-host
  # clusters keep the hard rule.
  - it: should default SINGLE_NODE to "false" on managed (hostPath disabled) clusters
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SINGLE_NODE
            value: "false"

  - it: should set SINGLE_NODE to "true" when hostPath is enabled
    set:
      hostPath:
        enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SINGLE_NODE
            value: "true"

  - it: should let an explicit env.SINGLE_NODE override the hostPath-derived default
    set:
      hostPath:
        enabled: true
      env:
        SINGLE_NODE: "false"
    asserts:
      # explicit "false" wins over hostPath.enabled=true, and is emitted
      # exactly once (not duplicated by the generic env range).
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SINGLE_NODE
            value: "false"
          count: 1

  # tracebloc/backend#745: the per-spawned-training-job resource request/limit
  # the jobs-manager hands to each Job it creates. The chart is the single
  # effective source of truth — it ALWAYS injects RESOURCE_REQUESTS /
  # RESOURCE_LIMITS, so client-runtime's jobs_manager.py only falls back to its
  # own default when they are absent. Pin the rendered value here so the two
  # cannot silently diverge again, on BOTH containers that receive it
  # (api + pods-monitor).
  - it: defaults spawned-job RESOURCE_REQUESTS/LIMITS to cpu=2,memory=8Gi (req==limit => Guaranteed QoS)
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RESOURCE_REQUESTS
            value: "cpu=2,memory=8Gi"
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RESOURCE_LIMITS
            value: "cpu=2,memory=8Gi"
          count: 1
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: RESOURCE_REQUESTS
            value: "cpu=2,memory=8Gi"
          count: 1
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: RESOURCE_LIMITS
            value: "cpu=2,memory=8Gi"
          count: 1

  - it: lets operators override spawned-job resources via env.RESOURCE_REQUESTS/LIMITS
    set:
      env:
        RESOURCE_REQUESTS: "cpu=4,memory=16Gi"
        RESOURCE_LIMITS: "cpu=4,memory=16Gi"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RESOURCE_REQUESTS
            value: "cpu=4,memory=16Gi"
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RESOURCE_LIMITS
            value: "cpu=4,memory=16Gi"
          count: 1

  - it: does not render PER_INGESTION_TABLES by default (RFC-0003 D16 knob off)
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PER_INGESTION_TABLES
            value: "1"

  - it: renders PER_INGESTION_TABLES=1 when perIngestionTables is enabled
    set:
      perIngestionTables: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PER_INGESTION_TABLES
            value: "1"

  - it: does not render PER_DATASET_PVCS by default (RFC-0003 D9 Track B knob off)
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PER_DATASET_PVCS
            value: "1"

  - it: renders PER_DATASET_PVCS=1 when perDatasetPvcs is enabled
    set:
      perDatasetPvcs: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PER_DATASET_PVCS
            value: "1"

  - it: does not render per-experiment DB-cred env by default (RFC-0003 D10 knob off)
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PER_EXPERIMENT_DB_CREDS
            value: "1"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: TB_CREDMGR_USER
            value: "tb_credmgr"

  - it: renders per-experiment DB-cred env (flag + credmgr identity + secret ref) when enabled
    set:
      perExperimentDbCreds: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PER_EXPERIMENT_DB_CREDS
            value: "1"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TB_CREDMGR_USER
            value: "tb_credmgr"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TB_CREDMGR_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets
                key: TB_CREDMGR_PASSWORD

  # #611: /data/shared (client-pvc) AND /data/logs (client-logs-pvc) must be writable by
  # the non-root pods that mount them — the ingest-staging pod writes to /data/shared, the
  # spawned training pods write to /data/logs. hostPath ignores fsGroup (k8s#138411), so a
  # privileged init makes both volumes world-writable; CSI relies on fsGroup and skips it.
  - it: "hostPath install adds init-writable-data to make /data/shared and /data/logs writable (#611)"
    set:
      hostPath:
        enabled: true
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: init-writable-data
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 0
      - contains:
          path: spec.template.spec.initContainers[0].securityContext.capabilities.add
          content: CHOWN
      - contains:
          path: spec.template.spec.initContainers[0].securityContext.capabilities.add
          content: FOWNER
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "chown 1000:1000 /data/shared /data/logs && chmod 3777 /data/shared /data/logs"
      # the init must mount BOTH hostPath volumes it chowns, or the chown is a no-op
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: shared-volume
            mountPath: /data/shared
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: logs-volume
            mountPath: /data/logs

  - it: "CSI install (hostPath disabled) keeps fsGroup but skips the privileged init (#611)"
    set:
      hostPath:
        enabled: false
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000
      - notExists:
          path: spec.template.spec.initContainers
