suite: auto-upgrade CronJob and RBAC
templates:
  - templates/auto-upgrade-cronjob.yaml
  - templates/auto-upgrade-rbac.yaml
release:
  name: stg
  namespace: tracebloc
set:
  clientId: "test-id"
  clientPassword: "test"
tests:
  - it: cronjob template renders ConfigMap + CronJob by default
    template: templates/auto-upgrade-cronjob.yaml
    asserts:
      - hasDocuments:
          count: 2

  - it: rbac template renders SA + release-ns Role/RoleBinding + scoped ClusterRole/ClusterRoleBinding + node-agents-ns Role/RoleBinding by default
    template: templates/auto-upgrade-rbac.yaml
    asserts:
      # 7 = SA, release-ns Role+RoleBinding, ClusterRole+ClusterRoleBinding, and
      # the node-agents-ns Role+RoleBinding (backend#953 Bugbot: the SA must
      # reconcile resource-monitor/image-refresh objects in the separate
      # tracebloc-node-agents namespace, else --atomic upgrades 403 there).
      - hasDocuments:
          count: 7

  - it: cronjob template renders nothing when autoUpgrade.enabled=false
    template: templates/auto-upgrade-cronjob.yaml
    set:
      autoUpgrade:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: rbac template renders nothing when autoUpgrade.enabled=false
    template: templates/auto-upgrade-rbac.yaml
    set:
      autoUpgrade:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: rbac grants the auto-upgrade SA a Role in the node-agents namespace by default (backend#953 Bugbot)
    template: templates/auto-upgrade-rbac.yaml
    documentIndex: 5
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.namespace
          value: tracebloc-node-agents
      - equal:
          path: metadata.name
          value: stg-auto-upgrade-node-agents

  - it: rbac omits the node-agents Role/RoleBinding when resource-monitor is disabled (nothing to reconcile there)
    template: templates/auto-upgrade-rbac.yaml
    set:
      resourceMonitor: false
    asserts:
      - hasDocuments:
          count: 5

  - it: ConfigMap holds the upgrade script
    template: templates/auto-upgrade-cronjob.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: stg-auto-upgrade
      - matchRegex:
          path: data["auto-upgrade.sh"]
          pattern: "helm upgrade"
      # Must be --reset-then-reuse-values, NOT plain --reuse-values:
      # --reuse-values re-uses the last release's computed values, so any
      # new keys added to values.yaml in a future chart version silently
      # fail to render with nil-pointer template errors. Verified on a
      # dev-cluster 1.1.0 -> 1.3.0 dry-run during the #69 verification.
      - matchRegex:
          path: data["auto-upgrade.sh"]
          pattern: "--reset-then-reuse-values"
      # Regression guard: the script MUST use sort -V (semver), not lexical
      # string compare. A naive string compare would block 1.10.x upgrades
      # because "1.10.0" < "1.9.0" lexically.
      - matchRegex:
          path: data["auto-upgrade.sh"]
          pattern: "sort -V"

  - it: script auto-recovers from an interrupted (pending-*) upgrade before retrying (#554)
    template: templates/auto-upgrade-cronjob.yaml
    documentIndex: 0
    asserts:
      # Must read the release status before it upgrades…
      - matchRegex:
          path: data["auto-upgrade.sh"]
          pattern: "helm status \"\\$RELEASE_NAME\""
      # …match the pending-upgrade/pending-rollback wedge left by a killed helm…
      - matchRegex:
          path: data["auto-upgrade.sh"]
          pattern: "pending-upgrade\\|pending-rollback"
      # …and roll back to the last deployed revision so the tick can proceed
      # instead of failing forever with "another operation is in progress".
      - matchRegex:
          path: data["auto-upgrade.sh"]
          pattern: "helm rollback \"\\$RELEASE_NAME\""
      # The recovery MUST come before the upgrade attempt in the script.
      - matchRegex:
          path: data["auto-upgrade.sh"]
          pattern: "(?s)helm rollback \"\\$RELEASE_NAME\".*helm upgrade \"\\$RELEASE_NAME\""
      # --atomic so a graceful upgrade failure self-rolls-back instead of
      # leaving the release broken/pending (belt-and-braces with the recovery).
      - matchRegex:
          path: data["auto-upgrade.sh"]
          pattern: "--atomic"
      # A killed uninstall (status 'uninstalling') must skip the tick cleanly
      # rather than fall through to a helm upgrade that fails every tick (#554).
      - matchRegex:
          path: data["auto-upgrade.sh"]
          pattern: "uninstalling\\)"

  - it: CronJob has the right schedule, concurrency, and SA wiring
    template: templates/auto-upgrade-cronjob.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: metadata.name
          value: stg-auto-upgrade
      - equal:
          path: spec.schedule
          value: "23 * * * *"
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: stg-auto-upgrade
      - equal:
          path: spec.jobTemplate.spec.template.spec.restartPolicy
          value: OnFailure

  - it: CronJob env carries release identity to the upgrade script
    template: templates/auto-upgrade-cronjob.yaml
    documentIndex: 1
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: RELEASE_NAME
            value: stg
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: RELEASE_NAMESPACE
            value: tracebloc
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: REPO_URL
            value: https://tracebloc.github.io/client

  - it: CronJob pod satisfies PSA restricted (runAsNonRoot, dropped caps, RO root, seccomp)
    template: templates/auto-upgrade-cronjob.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.capabilities.drop[0]
          value: ALL

  - it: RBAC is least-privilege — namespaced Role plus a scoped ClusterRole, NOT cluster-admin (backend#953)
    template: templates/auto-upgrade-rbac.yaml
    asserts:
      # The ServiceAccount the CronJob runs as.
      - equal:
          path: metadata.name
          value: stg-auto-upgrade
        documentSelector:
          path: kind
          value: ServiceAccount
      # Namespaced Role: full control, but confined to the release namespace.
      - equal:
          path: rules[0].apiGroups
          value: ["*"]
        documentIndex: 1
      - equal:
          path: rules[0].resources
          value: ["*"]
        documentIndex: 1
      - equal:
          path: rules[0].verbs
          value: ["*"]
        documentIndex: 1
      # RoleBinding targets the chart's own namespaced Role, not a built-in.
      - equal:
          path: roleRef.kind
          value: Role
        documentIndex: 2
      - equal:
          path: roleRef.name
          value: stg-auto-upgrade
        documentIndex: 2
      # The regression that #953 fixes: the ClusterRoleBinding must bind the
      # chart's OWN scoped ClusterRole (stg-auto-upgrade), never cluster-admin.
      - equal:
          path: roleRef.name
          value: stg-auto-upgrade
        documentSelector:
          path: kind
          value: ClusterRoleBinding
      # The binding is deliberately RENAMED (`-scoped`): the pre-#953 binding of
      # this name bound cluster-admin and roleRef is immutable, so a same-name
      # binding would make the first upgrade fail. A distinct name lets helm
      # create-new + delete-old. Locking the name in guards that fix.
      - equal:
          path: metadata.name
          value: stg-auto-upgrade-scoped
        documentSelector:
          path: kind
          value: ClusterRoleBinding
      - equal:
          path: subjects[0].name
          value: stg-auto-upgrade
        documentSelector:
          path: kind
          value: ClusterRoleBinding
      # The scoped ClusterRole carries escalate + bind on the RBAC kinds
      # (required to re-apply the chart's other ClusterRoles during upgrade)…
      - contains:
          path: rules
          content:
            apiGroups: ["rbac.authorization.k8s.io"]
            resources: ["clusterroles", "clusterrolebindings"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "escalate", "bind"]
        documentSelector:
          path: kind
          value: ClusterRole
      # …and read-only apiservices so the resource-monitor metrics-server
      # pre-flight `lookup` resolves under the scoped SA (backend#953 Bugbot).
      - contains:
          path: rules
          content:
            apiGroups: ["apiregistration.k8s.io"]
            resources: ["apiservices"]
            verbs: ["get", "list", "watch"]
        documentSelector:
          path: kind
          value: ClusterRole
      # …but must NOT grant blanket cluster-wide wildcard power.
      - notContains:
          path: rules
          content:
            apiGroups: ["*"]
            resources: ["*"]
            verbs: ["*"]
        documentSelector:
          path: kind
          value: ClusterRole

  - it: should accept operator overrides for schedule, image, and timeout
    template: templates/auto-upgrade-cronjob.yaml
    documentIndex: 1
    set:
      autoUpgrade:
        enabled: true
        schedule: "0 4 * * 0"
        timeout: "30m"
        image:
          repository: my-mirror/helm
          tag: "3.16.4"
          pullPolicy: Always
    asserts:
      - equal:
          path: spec.schedule
          value: "0 4 * * 0"
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: my-mirror/helm:3.16.4
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].imagePullPolicy
          value: Always
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: UPGRADE_TIMEOUT
            value: "30m"

  - it: schema rejects image.tag=latest (auto-upgrade behaviour must not drift)
    template: templates/auto-upgrade-cronjob.yaml
    set:
      autoUpgrade:
        image:
          tag: "latest"
    asserts:
      - failedTemplate:
          errorPattern: "must not be valid against schema"
