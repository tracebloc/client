suite: Edge telemetry Collector (backend#1906)
templates:
  - templates/telemetry-collector-configmap.yaml
  - templates/telemetry-collector-daemonset.yaml
  - templates/telemetry-collector-rbac.yaml
  - templates/telemetry-collector-status.yaml
  - templates/telemetry-collector-scc.yaml
  - templates/telemetry-token-rbac.yaml
  - templates/jobs-manager-deployment.yaml
  - templates/auto-upgrade-rbac.yaml
  - templates/image-refresh-rbac.yaml
  # Not a Collector template, but the Collector is now a second tenant of the
  # node-agents namespace, so its gate is part of this feature's surface.
  - templates/node-agents-namespace.yaml
  - templates/docker-registry-secret.yaml
set:
  clientId: "test-id"
  clientPassword: "test"
  storageClass:
    create: false
release:
  name: edge
  # SET EXPLICITLY. helm-unittest renders `.Release.Namespace` as the literal
  # placeholder `NAMESPACE` when it is not given, so the Class A path assertions
  # below would compare against a placeholder rather than a namespace — passing or
  # failing for a reason unrelated to the scoping they exist to check.
  namespace: tracebloc
tests:
  # ── it ships inert ────────────────────────────────────────────────────────
  # THIS TEST USED TO READ "renders nothing at all by default", and its premise
  # was that "the exporter authenticates with a token jobs-manager does not write
  # yet". backend#2400 ended that: jobs-manager now always holds the Secret's
  # coordinates and the RBAC to write it, so an edge becomes eligible on its own.
  # backend#1906 then made `enabled` tri-state and removed the `false` default,
  # so "by default" no longer means "off" — it means "the chart decides".
  #
  # THE RISK THE OLD TEST GUARDED IS STILL LIVE, and is still guarded: a DaemonSet
  # must never appear on a node that cannot deliver what it spools (D7). What
  # changed is that the condition is now checked rather than assumed — the chart
  # renders only where a token Secret exists, and records why when it does not.
  # The two skip paths are asserted below and in the k3d gate.
  - it: an operator who opts out gets nothing at all
    set:
      telemetryCollector.enabled: false
    templates:
      - templates/telemetry-collector-configmap.yaml
      - templates/telemetry-collector-daemonset.yaml
      - templates/telemetry-collector-rbac.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: the opt-out is RECORDED, not merely silent
    set:
      telemetryCollector.enabled: false
    template: templates/telemetry-collector-status.yaml
    asserts:
      - equal:
          path: data.state
          value: disabled-by-operator

  # THE UNATTENDED SKIP, and the reason this whole tri-state exists. A release
  # whose stored values predate the Collector arrives with the entire
  # `telemetryCollector` map deleted (helm drops a null key and --reuse-values
  # does not coalesce defaults back). Fleet mode must then decline to render and
  # SAY SO — never `fail`, because the only thing watching an auto-upgrade is a
  # CronJob, and a render failure costs that edge every future security fix.
  - it: fleet mode SKIPS rather than failing when the values are incomplete
    set:
      telemetryCollector: null
    templates:
      - templates/telemetry-collector-configmap.yaml
      - templates/telemetry-collector-daemonset.yaml
      - templates/telemetry-collector-rbac.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: and the skip names its reason on the cluster
    set:
      telemetryCollector: null
    template: templates/telemetry-collector-status.yaml
    asserts:
      - equal:
          path: data.state
          value: skipped-incomplete-values
      - matchRegex:
          path: data.reason
          pattern: "reset-then-reuse-values"

  # THE ATTENDED PATH IS UNCHANGED — and the way it is unchanged could not be
  # asserted here, which is worth writing down rather than leaving as a gap.
  #
  # The intended test was "an operator who set enabled: true with the Class A
  # lists nulled still gets a loud refusal, not a skip". IT CANNOT BE CONSTRUCTED
  # THROUGH VALUES: values.schema.json lists `classAContainers` and
  # `classANodeAgentContainers` in `telemetryCollector.required`, so nulling one
  # while keeping the map is refused by SCHEMA VALIDATION before any template
  # renders —
  #
  #   Error: values don't meet the specifications of the schema(s) in the
  #   following chart(s)
  #
  # — and a `failedTemplate` assertion written against it passes on the schema
  # error rather than on the guard it names. The first cut of this test did
  # exactly that in the other direction: with the lists left at their defaults
  # nothing failed at all, and `failedTemplate` reported
  # "Invalid rendering: %!s(<nil>)" while appearing to cover the refusal.
  #
  # So the partial-map case is unreachable in practice, which is the correct
  # answer and not a missing test. The reachable attended refusal is the TOKEN
  # one, and it needs a live `lookup`; it is asserted in the k3d gate, not here.
  # What IS asserted here is that an opt-in with a complete config renders — every
  # `telemetryCollector.enabled: true` test below.
  # (No test here: helm-unittest surfaces a schema refusal as a SUITE error, not
  # as something `failedTemplate` can assert, so an assertion would only be able
  # to pass by not running. Reproduced by hand instead —
  #   helm template ... --set telemetryCollector.enabled=true \
  #                     --set telemetryCollector.classAContainers=null
  # -> at '/telemetryCollector': missing property 'classAContainers'.)

  - it: the status ConfigMap is ALWAYS rendered, so absence means only "chart too old"
    template: templates/telemetry-collector-status.yaml
    asserts:
      - hasDocuments:
          count: 1

  # THE UPGRADE GUARD, and the most important test in this file after the
  # ships-inert one. `helm upgrade --reuse-values` replays the values STORED WITH
  # THE PREVIOUS RELEASE and does not merge values.yaml defaults — so every
  # release made before this block existed has NO `telemetryCollector` key. A bare
  # `.Values.telemetryCollector.enabled` is then a nil-pointer dereference and the
  # UPGRADE FAILS: not the feature, the whole release, on every existing customer.
  #
  # Caught by the Fleet auto-upgrade E2E rather than by review, which is why this
  # exists — that job upgrades from the last published chart exactly this way, and
  # no amount of reading the template would have shown it.
  - it: survives an upgrade whose stored values predate this block entirely
    set:
      # `null`, not `false`: absent is the case that broke. Setting it false would
      # test a key that exists, which is a different and already-covered thing.
      telemetryCollector: null
    templates:
      - templates/telemetry-collector-configmap.yaml
      - templates/telemetry-collector-daemonset.yaml
      - templates/telemetry-collector-rbac.yaml
    asserts:
      # Renders nothing AND, crucially, does not error. A template that failed here
      # would surface as a suite error rather than a clean zero-document render.
      - hasDocuments:
          count: 0

  - it: renders all three documents when explicitly enabled
    set:
      telemetryCollector.enabled: true
    templates:
      - templates/telemetry-collector-configmap.yaml
      - templates/telemetry-collector-daemonset.yaml
      - templates/telemetry-collector-rbac.yaml
    asserts:
      - hasDocuments:
          count: 1

  # ── Class A scoping (D12) ────────────────────────────────────────────────
  - it: scopes filelog to the Class A containers and nothing else
    set:
      telemetryCollector.enabled: true
    template: templates/telemetry-collector-configmap.yaml
    asserts:
      # CONTAINER names, from the rendered chart — `api` is jobs-manager,
      # `pods-monitor-container` runs controller.py, `squid` is the egress proxy.
      # The first version of this test asserted WORKLOAD names, which match no
      # path, so it agreed with a values list that collected nothing.
      # `scripts/tests/collector-class-a-agreement.sh` is the derived check that
      # would have caught that; these are the specific-path assertions beside it.
      - matchRegex:
          path: data["config.yaml"]
          pattern: '/var/log/pods/tracebloc_[*]/api/[*][.]log'
      - matchRegex:
          path: data["config.yaml"]
          pattern: '/var/log/pods/tracebloc_[*]/pods-monitor-container/[*][.]log'
      - matchRegex:
          path: data["config.yaml"]
          pattern: '/var/log/pods/tracebloc_[*]/squid/[*][.]log'
      # A DIFFERENT NAMESPACE. resource-monitor is a DaemonSet in
      # `nodeAgents.namespace`, so scoping every path to the release namespace
      # missed a whole Class A component while the Collector reported healthy.
      - matchRegex:
          path: data["config.yaml"]
          # RELEASE-SCOPED (`edge-` here, the suite's release name). A bare pod
          # wildcard in the SHARED node-agents namespace matched every release's
          # `tracebloc-resource-monitor` — container names are identical across
          # releases by design — so one edge's Collector would ingest another
          # edge's Class A logs and ship them under its own ingest token.
          # (Bugbot on #779.) The pattern pins the prefix, so dropping it reddens.
          pattern: '/var/log/pods/tracebloc-node-agents_edge-[*]/tracebloc-resource-monitor/[*][.]log'

  # THE CLASS B GUARD. Class B is training and ingestion output, gated on
  # backend#1908's content redaction — the bounding that exists today is SECRET
  # redaction, and raw customer cell values have already reached central telemetry
  # once (backend#1879). A wildcard include would collect them silently.
  - it: never collects with a bare wildcard, which would sweep in Class B pods
    set:
      telemetryCollector.enabled: true
    template: templates/telemetry-collector-configmap.yaml
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: '/var/log/pods/[*]'
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: '/var/log/pods/[*][*]'

  # ── the redaction floor (D6 precondition 2) ──────────────────────────────
  # Reading stdout through filelog BYPASSES controller.py's app-side handler, so
  # without these the move would silently REMOVE a protection that exists today.
  # RENAMED, because the old title — "carries all six of controller.py's secret
  # patterns" — asserted something this mechanism cannot see. It greps the
  # rendered config for six substrings it holds ITSELF; controller.py is in
  # another repository and is never read. So it agreed with itself and reported
  # that as agreement with a file it has no access to, and a seventh redaction
  # added over there would leave every assertion below green (backend#1729
  # rules 1 and 9).
  #
  # What it does check is still worth keeping: each pattern is present in the
  # rendered config at all. The FLOOR — that these patterns actually scrub real
  # secrets, and do not scrub the diagnosis — is proven behaviourally in
  # scripts/tests/collector-redaction-floor.sh, which derives the regexes from
  # the render and feeds them specimens.
  #
  # Since backend#2378 the statements are GENERATED from client/log_redactions.json
  # (the one declaration, vendored from client-runtime), so these fragments are no
  # longer a second hand copy of a hand copy — they are a cheap smoke test that the
  # generation ran at all. That the render IS the declaration, pair for pair and in
  # order, is scripts/tests/collector-redaction-derived.sh's job.
  - it: names all six redaction families in the rendered config
    set:
      telemetryCollector.enabled: true
    template: templates/telemetry-collector-configmap.yaml
    asserts:
      - matchRegex:   # scheme://user:pass@host
          path: data["config.yaml"]
          pattern: '\[\^:/@'
      - matchRegex:   # Azure / ServiceBus keys
          path: data["config.yaml"]
          pattern: 'SharedAccessKey\|AccountKey'
      - matchRegex:   # auth headers
          path: data["config.yaml"]
          pattern: 'authorization\|x-api-key'
      - matchRegex:   # bearer / DRF token
          path: data["config.yaml"]
          pattern: 'bearer\|token'
      - matchRegex:   # generic secret assignments
          path: data["config.yaml"]
          pattern: 'client\[_-\]\?secret'
      - matchRegex:   # AWS access key ids
          path: data["config.yaml"]
          pattern: 'AKIA\[0-9A-Z\]'

  - it: puts redaction BEFORE the exporter in the pipeline
    set:
      telemetryCollector.enabled: true
    template: templates/telemetry-collector-configmap.yaml
    asserts:
      # Order is the whole protection: a redaction processor listed after the
      # exporter, or absent from the pipeline, scrubs nothing while still existing
      # in the config — which reads exactly like a configured floor.
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'processors: \[transform/redaction, batch\]'

  # ── D7's bounds ──────────────────────────────────────────────────────────
  - it: bounds the queue in BYTES at 1 GiB, as an integer
    set:
      telemetryCollector.enabled: true
    template: templates/telemetry-collector-configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'sizer: bytes'
      # An INTEGER, not 1.073741824e\+09. Helm parses the value as float64 and
      # renders scientific notation without `int64` — the Collector would start
      # and the cap would not be the number in values.yaml.
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'queue_size: 1073741824'
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'queue_size: [0-9.]+e\+'

  - it: retries forever, so the byte cap is the only bound
    set:
      telemetryCollector.enabled: true
    template: templates/telemetry-collector-configmap.yaml
    asserts:
      # D7: a second, time-based bound silently overrides the byte cap, because a
      # batch past max_elapsed_time is DROPPED rather than requeued.
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'max_elapsed_time: 0'

  - it: backs the queue with disk, not memory
    set:
      telemetryCollector.enabled: true
    template: templates/telemetry-collector-configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'storage: file_storage'

  # ── the credential ───────────────────────────────────────────────────────
  - it: sends the Token scheme, not the default Bearer
    set:
      telemetryCollector.enabled: true
    template: templates/telemetry-collector-configmap.yaml
    asserts:
      # The edge holds a DRF user token (`Authorization: Token <key>`), which the
      # ingest endpoint accepts via TokenAuthentication. `Bearer` is the OTHER
      # credential type (ClientAccessToken) and 401s silently.
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'scheme: "Token"'

  - it: posts to the versioned ingest path, not otlphttp default /v1/logs
    set:
      telemetryCollector.enabled: true
    template: templates/telemetry-collector-configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'logs_endpoint: "https://api\.tracebloc\.io/telemetry/v1/records/"'

  - it: follows CLIENT_ENV to the matching backend
    set:
      telemetryCollector.enabled: true
      env.CLIENT_ENV: stg
    template: templates/telemetry-collector-configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'logs_endpoint: "https://stg-api\.tracebloc\.io/'

  # backend#1745: a documented alias must not route an install at the wrong
  # backend. `staging` reduces to `stg` through tracebloc.clientEnv.
  - it: resolves the staging alias rather than falling through to prod
    set:
      telemetryCollector.enabled: true
      env.CLIENT_ENV: staging
    template: templates/telemetry-collector-configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'logs_endpoint: "https://stg-api\.tracebloc\.io/'

  # ── the DaemonSet ────────────────────────────────────────────────────────
  - it: mounts the node log directory READ-ONLY
    set:
      telemetryCollector.enabled: true
    template: templates/telemetry-collector-daemonset.yaml
    asserts:
      # The Collector must never be able to modify or truncate the logs it reads.
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[2].name
          value: host-logs
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[2].readOnly
          value: true

  - it: treats the token Secret as OPTIONAL so a missing token does not crashloop
    set:
      telemetryCollector.enabled: true
    template: templates/telemetry-collector-daemonset.yaml
    asserts:
      # jobs-manager writes this Secret. A Collector deployed before it exists must
      # BUFFER, not fail — telemetry may never be the reason a node looks unhealthy.
      - equal:
          path: spec.template.spec.volumes[1].secret.optional
          value: true

  - it: keeps the queue on a hostPath so it survives a pod restart
    set:
      telemetryCollector.enabled: true
    template: templates/telemetry-collector-daemonset.yaml
    asserts:
      # D7: the queue must outlive the restart that is the common case during an
      # outage. An emptyDir would silently make the buffer pod-lifetime only.
      - equal:
          path: spec.template.spec.volumes[3].hostPath.path
          value: /var/lib/tracebloc/edge/telemetry

  - it: rolls the pods when the pipeline config changes
    set:
      telemetryCollector.enabled: true
    template: templates/telemetry-collector-daemonset.yaml
    asserts:
      # Without this a helm upgrade that edits the pipeline leaves every node
      # running the old one, reporting healthy throughout.
      - exists:
          path: spec.template.metadata.annotations["checksum/config"]

  - it: applies D7's resource ceiling
    set:
      telemetryCollector.enabled: true
    template: templates/telemetry-collector-daemonset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "500m"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: "512Mi"

  - it: grants no Kubernetes API permissions at all
    set:
      telemetryCollector.enabled: true
    template: templates/telemetry-collector-rbac.yaml
    asserts:
      # It reads files off the node; it never calls the API. A Role or ClusterRole
      # here would be privilege this workload has no use for, on a DaemonSet
      # running on every node of a customer's cluster.
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: ServiceAccount

  # The same claim, asserted from the POD side. The Role/ClusterRole assertion
  # above says the SA may not call the API; this one says the token is not handed
  # to the container in the first place. Without it the DaemonSet can drop back to
  # the Kubernetes default of `true` — mounting an unused credential on every node
  # of a customer's cluster — and nothing in the suite would notice, because a
  # value that is absent renders as no key rather than as a failure. (Bugbot
  # Medium on #789, backend#2344.)
  - it: does not automount the service account token
    set:
      telemetryCollector.enabled: true
    template: templates/telemetry-collector-daemonset.yaml
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  # ── the image has a feature floor ────────────────────────────────────────
  # The first version pinned 0.109.0, which predates `block_on_overflow`
  # (upstream 2025-03, ~0.122+) and `sizer: bytes` on a persistent queue (~0.130).
  # The Collector REJECTS unknown configuration keys, so an old image does not
  # silently ignore them — it fails to start, on every node. (Bugbot on #779.)
  #
  # Asserts the FLOOR, not the exact tag: pinning an exact version here would
  # make this a second place to update on every bump, and it would pass by
  # agreeing with itself.
  - it: pins a Collector image new enough for the queue options it configures
    set:
      telemetryCollector.enabled: true
    template: templates/telemetry-collector-daemonset.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          # 0.13x-0.99x, or any 1.x+. Anything below 0.130 cannot run this config.
          pattern: 'opentelemetry-collector-contrib:(0\.(1[3-9][0-9]|[2-9][0-9][0-9])|[1-9][0-9]*)\.'

  # ── the global image mirror ──────────────────────────────────────────────
  # #585 precedence: global mirror, then per-image registry, then docker.io.
  # Passing `image.registry` alone ignored `global.imageRegistry`, so on a
  # mirrored or air-gapped fleet the Collector ImagePullBackOffs while every
  # other image pulls from the mirror. (Bugbot on #779.)
  - it: honours the global image mirror
    set:
      telemetryCollector.enabled: true
      global.imageRegistry: mirror.example.com
    template: templates/telemetry-collector-daemonset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "mirror.example.com/otel/opentelemetry-collector-contrib:0.159.0"

  - it: falls back to the per-image registry when no mirror is set
    set:
      telemetryCollector.enabled: true
    template: templates/telemetry-collector-daemonset.yaml
    asserts:
      # Asserted as well as the mirror case: a precedence chain that only ever
      # gets exercised at one end is half-tested, and the fallback is what every
      # unmirrored fleet uses.
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/otel/opentelemetry-collector-contrib:0.159.0"

  # ── the Collector is a second tenant of the node-agents namespace ─────────
  # With resource-monitor off, the namespace this DaemonSet targets was never
  # created — every dependent resource must share the feature's gate.
  # (Bugbot on #779.)
  - it: creates the node-agents namespace even when resource-monitor is off
    set:
      telemetryCollector.enabled: true
      resourceMonitor: false
    template: templates/node-agents-namespace.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: tracebloc-node-agents

  # THE NEGATIVE HALF MOVED (backend#2400). It used to be "no tenant, no
  # namespace", and that is no longer true: the token Role and RoleBinding occupy
  # this namespace with no flag of their own, so the namespace is unconditional
  # and a tenant predicate over it would be a constant `true` wearing a question
  # mark. What still has to be pinned is the thing the old assertion was really
  # protecting — that `nodeAgents.namespace.create` and the release-namespace
  # collision check both still bite. Widening the namespace gate to a literal
  # `always` reddens this.
  - it: still skips the namespace when the operator manages it out of band
    set:
      resourceMonitor: false
      nodeAgents:
        namespace:
          create: false
          name: pre-existing-node-agents
    template: templates/node-agents-namespace.yaml
    asserts:
      - hasDocuments:
          count: 0

  # ── the mirrored pull Secret shares the gate too ─────────────────────────
  # @aptracebloc on #779: the namespace gate was mutation-pinned and this one was
  # not. It was verified by hand at the time (render diff: 4 node-agents resources
  # with the fix, 3 without) — but a by-hand check leaves nothing behind, which is
  # the gap worth closing rather than the fix.
  #
  # Needs real registry values: `dockerRegistry.server` is `format: uri` in
  # values.schema.json and `email` is required by its `allOf`, so a partial set is
  # rejected by the schema before any template renders — and helm-unittest reports
  # that as a plugin ERROR, not a template failure, which is easy to misread as a
  # code defect. (It cost me three confused renders before I stopped suppressing
  # stderr.)
  - it: mirrors the pull Secret into node-agents when only the Collector is on
    set:
      telemetryCollector.enabled: true
      resourceMonitor: false
      dockerRegistry:
        create: true
        server: https://registry.example.com
        username: u
        password: p
        email: ops@example.com
    template: templates/docker-registry-secret.yaml
    documentIndex: 1
    asserts:
      # Index 1 is the MIRRORED copy; index 0 is the release-namespace one. Without
      # the widened gate this document does not exist at all, so the assertion is
      # on its namespace rather than merely on the document count.
      - equal:
          path: metadata.namespace
          value: tracebloc-node-agents
      - equal:
          path: kind
          value: Secret

  - it: does not mirror the pull Secret when neither tenant is enabled
    set:
      resourceMonitor: false
      # BOTH TENANTS, EXPLICITLY. `resourceMonitor: false` alone stopped meaning
      # "the node-agents namespace has no pod-bearing tenant" when backend#1906
      # made the Collector tri-state: with `telemetryCollector.enabled` ABSENT the
      # chart resolves to fleet mode, which is `enabled`, so the Collector IS a
      # tenant and this namespace does get a DaemonSet. Without the line below this
      # test asserts the fleet-default path while claiming to assert the empty one.
      telemetryCollector:
        enabled: false
      dockerRegistry:
        create: true
        server: https://registry.example.com
        username: u
        password: p
        email: ops@example.com
    template: templates/docker-registry-secret.yaml
    asserts:
      # The negative half, so widening the gate to `true` cannot make the test
      # above pass for free — the same vacuity the namespace pair guards against.
      - hasDocuments:
          count: 1

  # THE POSITIVE COUNTERPART to the `enabled: false` added above, and the
  # behaviour this PR actually changes. That line made the negative case say what
  # it means again — but it also STOPPED it exercising the fleet path, which is
  # now the default. Correcting a stale assertion and deleting the coverage it
  # used to provide look identical in a green suite.
  #
  # So: `enabled` ABSENT is fleet mode, the Collector DaemonSet renders, and a
  # rendering DaemonSet with a mirrored registry MUST have a pull Secret in its
  # namespace or every node hits ImagePullBackOff.
  - it: mirrors the pull Secret in fleet mode, where enabled is absent
    set:
      resourceMonitor: false
      dockerRegistry:
        create: true
        server: https://registry.example.com
        username: u
        password: p
        email: ops@example.com
    template: templates/docker-registry-secret.yaml
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.namespace
          value: tracebloc-node-agents
        documentIndex: 1

  # ── the pre-flight must not break offline rendering ──────────────────────
  # @aptracebloc: the `lookup`-based `fail` is inherently un-pinnable here, because
  # `lookup` returns empty under `helm template` so the guard never fires. Agreed —
  # but the INVERSE is both testable and the thing that would actually hurt: a
  # pre-flight that fired offline would break every `helm template`, every CI
  # render and every `--dry-run` in the fleet.
  - it: renders offline despite the token pre-flight, because lookup is empty
    set:
      telemetryCollector.enabled: true
    template: templates/telemetry-collector-daemonset.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: DaemonSet

  # ── the queue must be writable by the user the pod actually runs as ─────────
  # `runAsNonRoot: false` PERMITS root; it does not SELECT it. The pinned image
  # declares `USER 10001`, and the kubelet creates a DirectoryOrCreate hostPath
  # root-owned 0755 — so under the previous securityContext the Collector ran as
  # 10001 and could not write its own file_storage queue. D7's disk-backed queue
  # would have failed the moment the Collector was enabled. (Bugbot on #779.)
  #
  # This asserts the SELECTION, not the permission: deleting `runAsUser: 0` and
  # leaving `runAsNonRoot: false` behind reddens this test, which is precisely the
  # regression that shipped.
  - it: selects root explicitly, so the disk-backed queue is writable
    set:
      telemetryCollector.enabled: true
    template: templates/telemetry-collector-daemonset.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 0
      # Both halves pinned: root permitted AND root chosen. Either alone is the bug.
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: false
      # The narrowing that makes root defensible, so it cannot quietly be dropped
      # while the root stays.
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  # ── OpenShift: the Collector needs its own SCC ──────────────────────────────
  # Chart-managed SCCs gated on `resourceMonitor` alone and bound only that
  # ServiceAccount, so on a cluster with openshift.scc.enabled the Collector's
  # pods had nothing admitting their hostPath mounts. (Bugbot on #779.)
  #
  # A SEPARATE SCC, not a widening: resource-monitor's declares
  # MustRunAsNonRoot, which is right for it — read-only mounts, no write anywhere
  # — and granting RunAsAny there to serve the Collector would hand a broader
  # run-as rule to a workload that does not need one.
  - it: gives the Collector its own SCC on OpenShift, permitting hostPath and root
    set:
      telemetryCollector.enabled: true
      openshift.scc.enabled: true
    template: templates/telemetry-collector-scc.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: kind
          value: SecurityContextConstraints
      - equal:
          path: allowHostDirVolumePlugin
          value: true
      # RunAsAny, because the pod pins runAsUser: 0. MustRunAsNonRoot here would
      # leave the Collector covered on paper and refused at admission — the exact
      # half-fix scripts/tests/openshift-scc-coverage.sh exists to catch.
      - equal:
          path: runAsUser.type
          value: RunAsAny
      - contains:
          path: requiredDropCapabilities
          content: ALL
      - equal:
          path: allowPrivilegedContainer
          value: false
      - equal:
          path: allowPrivilegeEscalation
          value: false

  - it: binds the SCC to the Collector's own ServiceAccount, not another
    set:
      telemetryCollector.enabled: true
      openshift.scc.enabled: true
    template: templates/telemetry-collector-scc.yaml
    documentIndex: 0
    asserts:
      # The name is derived from the same helper the DaemonSet's
      # serviceAccountName uses; the cross-document agreement between the two is
      # asserted in scripts/tests/openshift-scc-coverage.sh, which helm-unittest
      # cannot express.
      - contains:
          path: users
          content: system:serviceaccount:tracebloc-node-agents:edge-telemetry-collector

  # Both negatives, so widening either half of the `and` cannot make the positive
  # test above pass for free.
  - it: renders no Collector SCC when the Collector is off
    set:
      # EXPLICIT NOW. This used to lean on the `enabled: false` chart default,
      # which backend#1906 removed — without it this asserts the fleet-default
      # path rather than the "Collector is off" path it is named for.
      telemetryCollector.enabled: false
      openshift.scc.enabled: true
    template: templates/telemetry-collector-scc.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no Collector SCC when the cluster is not OpenShift
    set:
      telemetryCollector.enabled: true
    template: templates/telemetry-collector-scc.yaml
    asserts:
      - hasDocuments:
          count: 0

  # The `helm upgrade --reuse-values` nil-deref trap, on the new template too:
  # an explicit null must not blow up the `and`. The chart documents this on
  # resource-monitor and it broke every existing customer's upgrade once already.
  - it: survives an explicit null telemetryCollector on OpenShift
    set:
      telemetryCollector: null
      openshift.scc.enabled: true
    template: templates/telemetry-collector-scc.yaml
    asserts:
      - hasDocuments:
          count: 0

  # ── one predicate for the node-agents namespace ────────────────────────────
  # @saadqbal's review of #779. Five templates put something in that namespace and
  # each held its own copy of "is resource-monitor on"; two were widened for the
  # Collector and the rest were not, so `resourceMonitor: false` +
  # `telemetryCollector.enabled: true` — the configuration this feature exists to
  # enable — created the namespace, landed the DaemonSet, and left the RBAC that
  # manages it behind. `tracebloc.nodeAgentsInUse` is now the single predicate.
  #
  # The cross-document invariant (a DaemonSet-mutating Role must exist whenever a
  # DaemonSet does) is asserted in scripts/tests/node-agents-tenancy.sh, which
  # helm-unittest cannot express. These pin the per-template half.
  # AUTO-UPGRADE IS NO LONGER A WITNESS FOR THE HELPER (backend#2400, Bugbot on
  # #801) — it stopped reading it. auto-upgrade re-applies the WHOLE chart, so its
  # reach has to follow "does the chart put anything in that namespace", which is
  # now unconditional; the helper answers "does a POD run there", which is a
  # different question and the one image-refresh below still asks. While it was
  # gated, `resourceMonitor: false` with the Collector off left the token
  # Role/RoleBinding in a namespace auto-upgrade could not write, so the next
  # hourly tick would 403 and ROLL BACK — the expensive form of backend#953's
  # failure mode, and no later chart could land on that edge either.
  #
  # Every column, because the property is that no configuration removes the reach.
  - it: keeps auto-upgrade's node-agents Role in every tenant configuration
    set:
      resourceMonitor: false
      telemetryCollector.enabled: false
    template: templates/auto-upgrade-rbac.yaml
    asserts:
      # 7 = 5 release-namespace documents plus the node-agents Role/RoleBinding
      # PAIR. The pair is what `helm upgrade --atomic --wait` needs.
      - hasDocuments:
          count: 7

  - it: keeps auto-upgrade's node-agents Role with only the Collector enabled
    set:
      resourceMonitor: false
      telemetryCollector.enabled: true
    template: templates/auto-upgrade-rbac.yaml
    asserts:
      - hasDocuments:
          count: 7

  # The condition that IS still load-bearing here: when the two namespaces
  # coincide the release-namespace Role already covers everything, so the pair
  # would be redundant. Without this, the gate could be deleted outright and the
  # two above would still pass.
  - it: drops auto-upgrade's node-agents Role when node-agents IS the release namespace
    set:
      resourceMonitor: false
      nodeAgents:
        namespace:
          name: tracebloc
    template: templates/auto-upgrade-rbac.yaml
    asserts:
      - hasDocuments:
          count: 5

  - it: grants image-refresh its node-agents Role with ONLY the Collector enabled
    set:
      resourceMonitor: false
      telemetryCollector.enabled: true
    template: templates/image-refresh-rbac.yaml
    asserts:
      - hasDocuments:
          count: 5

  # The negative half, so widening the predicate to a constant `true` cannot make
  # the positive pass for free — which is exactly what a mutation showed it does.
  # ON IMAGE-REFRESH, not auto-upgrade: after backend#2400 auto-upgrade renders its
  # node-agents pair in every configuration, so it can no longer witness the
  # predicate in either direction. image-refresh still reads it, and should — it
  # patches DaemonSets, and there are none.
  - it: grants image-refresh no node-agents Role when the namespace has no pod tenant
    set:
      resourceMonitor: false
      telemetryCollector.enabled: false
    template: templates/image-refresh-rbac.yaml
    asserts:
      # 3, i.e. 5 minus the node-agents pair.
      - hasDocuments:
          count: 3

  # THE `--reuse-values` NIL TRAP, on the predicate itself rather than five times
  # over. A bare `.Values.telemetryCollector.enabled` throws "nil pointer
  # evaluating interface {}.enabled" for an operator upgrading from a chart that
  # predates the key, and fails before a single resource lands.
  #
  # `resourceMonitor: false` IS THE WHOLE TEST. Go's `or` short-circuits, so with
  # resource-monitor on, the second operand is never evaluated and a null
  # telemetryCollector cannot deref — the first version of this test set
  # `resourceMonitor: true` and passed happily with the nil-guard DELETED. It took
  # a mutation to show it was asserting nothing.
  - it: survives an explicit null telemetryCollector through the shared predicate
    set:
      telemetryCollector: null
      resourceMonitor: false
    template: templates/image-refresh-rbac.yaml
    asserts:
      # 3 = the render minus the node-agents pair: no pod tenant, so no Role there.
      # Reaching this number at all means the predicate evaluated without
      # throwing, which is the property. Moved off auto-upgrade with the two above,
      # for the same reason: it no longer reads the predicate, so it could reach
      # its number without ever evaluating it.
      - hasDocuments:
          count: 3

  # ── the two host paths are asymmetric on purpose ────────────────────────────
  - it: fails the pod when the kubelet log path is absent, but self-creates the queue
    set:
      telemetryCollector.enabled: true
    template: templates/telemetry-collector-daemonset.yaml
    asserts:
      # `Directory`: the log path is the KUBELET'S and we only read it. With
      # `DirectoryOrCreate` a wrong `hostLogsPath` made the kubelet create an empty
      # directory and the Collector ran healthy matching nothing — forever.
      # (Bugbot on #779.) resource-monitor's /proc and /sys have always used
      # `Directory` for the same reason.
      - equal:
          path: spec.template.spec.volumes[?(@.name=="host-logs")].hostPath.type
          value: Directory
      # `DirectoryOrCreate`: this path is OURS and does not exist on a node's first
      # install, so `Directory` would refuse to start on every fresh node. Both
      # asserted together, because the asymmetry IS the design and a well-meaning
      # "make them consistent" edit breaks one of the two.
      - equal:
          path: spec.template.spec.volumes[?(@.name=="queue")].hostPath.type
          value: DirectoryOrCreate

  - it: lets the Collector read MCS-labelled container logs on OpenShift
    set:
      telemetryCollector.enabled: true
      openshift.scc.enabled: true
    template: templates/telemetry-collector-scc.yaml
    documentIndex: 0
    asserts:
      # Container logs under /var/log/pods are `container_log_t` with per-container
      # MCS categories; a namespace MCS context from `MustRunAs` cannot read them,
      # so the pods would be admitted, run as root, and take a permission error on
      # every include glob — a healthy DaemonSet shipping zero records.
      # (Bugbot on #779.) resource-monitor keeps MustRunAs, which is right for
      # /proc and /sys, and is not relaxed here.
      - equal:
          path: seLinuxContext.type
          value: RunAsAny

  # ── the token Secret's RBAC and the writer's env (backend#2274) ─────────────
  - it: grants jobs-manager create AND patch on the token Secret
    set:
      telemetryCollector.enabled: true
    template: templates/telemetry-token-rbac.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: kind
          value: Role
      # TWO rules, and the split is forced by Kubernetes: `resourceNames` is not
      # honoured for `create` (the API server cannot match a name that does not
      # exist yet), so `create` is namespace-scoped while `get`/`patch` are pinned
      # to the one Secret. Collapsing them either way is wrong in one direction —
      # too broad, or a create that 403s.
      - lengthEqual:
          path: rules
          count: 2
      - contains:
          path: rules[0].verbs
          content: create
      - contains:
          path: rules[1].verbs
          content: patch
      # `patch` is the whole reason this Role exists: the cluster-wide rule in
      # rbac.yaml grants create+get and NOT patch, so without it the Collector
      # works until the first token rotation and then 401s on every export.
      #
      # RELEASE-SCOPED (`edge-`, the suite's release name), backend#2625. Pinning the
      # `get`/`patch` grant to the SAME name jobs-manager writes and the Collector
      # reads is the property; a bare fixed name here would grant one release the
      # refresh of another release's Secret in the shared node-agents namespace.
      - contains:
          path: rules[1].resourceNames
          content: edge-telemetry-token

  # THE GATE THAT WAS HERE IS THE HALF THAT MADE THE FIX FAIL SOFT (backend#2400).
  # `{{- if $tcTok.enabled }}` meant jobs-manager could hold the Secret's
  # coordinates and still be 403'd on the write — and `sync_telemetry_token_secret`
  # logs and returns False rather than raising, so that produces a green release,
  # a healthy jobs-manager, and no Secret. Of the three gates, this is the one
  # whose omission would have looked like a fix.
  - it: grants the token RBAC even when the Collector is off, so it can be turned on
    template: templates/telemetry-token-rbac.yaml
    asserts:
      - hasDocuments:
          count: 2

  # Rendered with the SAME least privilege as when the Collector is on — this is
  # not a broader standing grant bought to unblock the bootstrap. Split out because
  # `documentIndex` scopes a whole test, not one assertion.
  - it: keeps the off-state Role as narrow as the on-state one
    template: templates/telemetry-token-rbac.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: kind
          value: Role
      - lengthEqual:
          path: rules
          count: 2
      - contains:
          path: rules[0].verbs
          content: create
      - contains:
          path: rules[1].resourceNames
          content: edge-telemetry-token
      - contains:
          path: rules[1].verbs
          content: patch

  - it: binds the off-state Role to the ServiceAccount that does the writing
    template: templates/telemetry-token-rbac.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: kind
          value: RoleBinding
      # The writer runs in the RELEASE namespace; the Role is in the node-agents
      # one. A binding that named the wrong subject namespace would 403 exactly the
      # way the missing Role did, and just as quietly.
      - equal:
          path: subjects[0].namespace
          value: tracebloc

  - it: survives an explicit null telemetryCollector
    set:
      telemetryCollector: null
    template: templates/telemetry-token-rbac.yaml
    asserts:
      # The `helm upgrade --reuse-values` trap. It bites HARDER now than when this
      # template was gated: an operator upgrading from a chart that predates the
      # key used to skip the file entirely, and now renders it, so
      # `$tcTok.tokenSecret` is dereferenced on a value that may be an explicit
      # null. Reaching two documents at all is the property.
      - hasDocuments:
          count: 2

  - it: passes the Secret coordinates to the container that actually writes it
    set:
      telemetryCollector.enabled: true
    template: templates/jobs-manager-deployment.yaml
    asserts:
      # containers[0] is `api`, which runs the tracebloc/jobs-manager image.
      # containers[1] is `pods-monitor-container`, whose `env:` opening is
      # BYTE-IDENTICAL — so a patch anchored on that text alone lands on the wrong
      # container, sets three variables on a process that never reads them, and
      # the Collector still gets no token. Asserted on both containers for that
      # reason, not just the right one.
      - equal:
          path: spec.template.spec.containers[0].name
          value: api
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TELEMETRY_TOKEN_SECRET_NAMESPACE
            value: tracebloc-node-agents
      # RELEASE-SCOPED, backend#2625: the WRITER is told `edge-telemetry-token`, the
      # same name the reader mounts and the RBAC pins. A fixed name here let two
      # edges on one cluster write one Secret and misattribute each other's telemetry.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TELEMETRY_TOKEN_SECRET_NAME
            value: edge-telemetry-token
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TELEMETRY_TOKEN_SECRET_KEY
            value: token
      - notContains:
          path: spec.template.spec.containers[1].env
          content:
            name: TELEMETRY_TOKEN_SECRET_NAME
            value: edge-telemetry-token

  # The Secret is the daemonset's PRECONDITION, so it cannot be conditional on the
  # daemonset (backend#2400). Asserted on all three variables rather than one: the
  # reader refuses to guess a missing name and logs a misconfiguration instead of
  # writing, so two-of-three is the same outcome as none.
  - it: passes the Secret coordinates even when the Collector is off
    template: templates/jobs-manager-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TELEMETRY_TOKEN_SECRET_NAMESPACE
            value: tracebloc-node-agents
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TELEMETRY_TOKEN_SECRET_NAME
            value: edge-telemetry-token
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TELEMETRY_TOKEN_SECRET_KEY
            value: token
      # Still only on the container that runs the writer. The wrong-container
      # mistake is silent in both directions and does not stop being possible
      # because the gate went away.
      - notContains:
          path: spec.template.spec.containers[1].env
          content:
            name: TELEMETRY_TOKEN_SECRET_NAME
            value: edge-telemetry-token

  # ── the token Secret name is release-scoped (backend#2625) ─────────────────
  # The node-agents namespace is SHARED across releases, so a FIXED Secret name let
  # two edges on one cluster write one Secret — last writer wins, and the loser's
  # Collector authenticated as the wrong tenant. The name now follows the release.
  #
  # helm-unittest renders one release per job, so the two-release DISTINCTNESS the
  # acceptance names is asserted here as "release A → name A" and "release B → a
  # different name", and end-to-end across a single render pair in
  # scripts/tests/telemetry-token-agreement.sh.
  - it: scopes the token Secret to release A across writer, reader and RBAC
    release:
      name: tenant-a
      namespace: tracebloc
    set:
      telemetryCollector.enabled: true
    templates:
      - templates/jobs-manager-deployment.yaml
      - templates/telemetry-collector-daemonset.yaml
      - templates/telemetry-token-rbac.yaml
    asserts:
      - template: templates/jobs-manager-deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TELEMETRY_TOKEN_SECRET_NAME
            value: tenant-a-telemetry-token
      - template: templates/telemetry-collector-daemonset.yaml
        equal:
          path: spec.template.spec.volumes[1].secret.secretName
          value: tenant-a-telemetry-token
      - template: templates/telemetry-token-rbac.yaml
        documentIndex: 0
        contains:
          path: rules[1].resourceNames
          content: tenant-a-telemetry-token

  - it: scopes the token Secret to release B, a DIFFERENT name than release A
    release:
      name: tenant-b
      namespace: tracebloc
    set:
      telemetryCollector.enabled: true
    templates:
      - templates/jobs-manager-deployment.yaml
      - templates/telemetry-collector-daemonset.yaml
      - templates/telemetry-token-rbac.yaml
    asserts:
      - template: templates/jobs-manager-deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TELEMETRY_TOKEN_SECRET_NAME
            value: tenant-b-telemetry-token
      - template: templates/telemetry-collector-daemonset.yaml
        equal:
          path: spec.template.spec.volumes[1].secret.secretName
          value: tenant-b-telemetry-token
      # The negative half: release B must NOT resolve to release A's name. Without
      # release-scoping both would be the fixed `tracebloc-telemetry-token` and this
      # would still pass — so pin that A's specific name is not what B renders.
      - template: templates/telemetry-collector-daemonset.yaml
        notEqual:
          path: spec.template.spec.volumes[1].secret.secretName
          value: tenant-a-telemetry-token

  # THE reuse-values MIGRATION, and the subtlety the naive rename misses. The old
  # default `tracebloc-telemetry-token` is an EXPLICIT value baked into every
  # existing release's stored values, so `helm upgrade --reuse-values` replays it —
  # a resolver that only defaulted an ABSENT name would leave every installed edge on
  # the colliding fixed name forever. Resolving the legacy sentinel to the release-
  # scoped name is what actually migrates them; --set here stands in for that replay.
  - it: treats the legacy fixed name as "migrate me", not as an override
    set:
      telemetryCollector.enabled: true
      telemetryCollector.tokenSecret.name: tracebloc-telemetry-token
    template: templates/telemetry-collector-daemonset.yaml
    asserts:
      - equal:
          path: spec.template.spec.volumes[1].secret.secretName
          value: edge-telemetry-token
      - notEqual:
          path: spec.template.spec.volumes[1].secret.secretName
          value: tracebloc-telemetry-token

  # A GENUINELY custom name is a real operator choice, honoured verbatim — the
  # migration reinterprets only the one legacy sentinel, nothing else. Asserted on
  # reader AND RBAC so an override that moved the mount without the grant (or vice
  # versa) reddens.
  - it: honours a genuinely custom tokenSecret.name verbatim
    set:
      telemetryCollector.enabled: true
      telemetryCollector.tokenSecret.name: acme-ingest-token
    templates:
      - templates/telemetry-collector-daemonset.yaml
      - templates/telemetry-token-rbac.yaml
    asserts:
      - template: templates/telemetry-collector-daemonset.yaml
        equal:
          path: spec.template.spec.volumes[1].secret.secretName
          value: acme-ingest-token
      - template: templates/telemetry-token-rbac.yaml
        documentIndex: 0
        contains:
          path: rules[1].resourceNames
          content: acme-ingest-token

  # The bootstrap wiring is ungated; the WORKLOAD is not. If these ever stop being
  # different questions, a default install puts a DaemonSet on every customer node.
  - it: still ships no Collector workload when the wiring is present but the flag is off
    set:
      # EXPLICIT NOW — see the note on the SCC test above.
      telemetryCollector.enabled: false
    templates:
      - templates/telemetry-collector-daemonset.yaml
      - templates/telemetry-collector-configmap.yaml
    asserts:
      - hasDocuments:
          count: 0

  # ── the Class A lists cannot silently shrink (backend#2341) ────────────────
  # Bugbot High on the client#789 promotion. Its stated mechanism — a partial
  # `telemetryCollector` map under `--reuse-values` — does NOT reproduce: helm
  # coalesces chart defaults at render time, so an ABSENT key comes back. This
  # test pins that, because it is the behaviour the finding assumed was broken
  # and a change that really did break coalescing would be serious.
  - it: fills the Class A lists from chart defaults when the map is partial
    set:
      telemetryCollector:
        enabled: true
    template: templates/telemetry-collector-configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: '/var/log/pods/tracebloc_[*]/api/[*][.]log'
      - matchRegex:
          path: data["config.yaml"]
          pattern: '/var/log/pods/tracebloc_[*]/pods-monitor-container/[*][.]log'
      - matchRegex:
          path: data["config.yaml"]
          pattern: '/var/log/pods/tracebloc_[*]/squid/[*][.]log'
      - matchRegex:
          path: data["config.yaml"]
          pattern: '/var/log/pods/tracebloc-node-agents_edge-[*]/tracebloc-resource-monitor/[*][.]log'
