suite: GPU device plugin (client#564)
# The GPU device plugin is a Helm-managed DaemonSet gated on
# gpu.devicePlugin.enabled, so it is reconciled on upgrade and removed on
# `helm uninstall` — replacing the imperative `kubectl apply` of an upstream
# manifest the installer used to run outside any release.
templates:
  - templates/gpu-device-plugin.yaml
set:
  clientId: "test-id"
  clientPassword: "test"
tests:
  - it: renders nothing by default (CPU-only install — gpu.devicePlugin.enabled false)
    asserts:
      - hasDocuments:
          count: 0

  - it: is null-safe when gpu is explicitly null (does not panic)
    # helm-unittest still coalesces this to the chart's values.yaml defaults, so
    # it does NOT reproduce the true --reuse-values omission — that is proven by
    # `helm template` against a chart whose values.yaml has no gpu key (see the
    # PR's verification). The `| default dict` guard makes both paths safe by
    # construction; this case pins that an explicit null never panics.
    set:
      gpu: null
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when disabled even if a vendor is set
    set:
      gpu:
        devicePlugin:
          enabled: false
          vendor: nvidia
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the NVIDIA DaemonSet in kube-system when enabled
    set:
      gpu:
        devicePlugin:
          enabled: true
          vendor: nvidia
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: DaemonSet
      - equal:
          path: metadata.name
          value: nvidia-device-plugin-daemonset
      - equal:
          path: metadata.namespace
          value: kube-system
      - equal:
          path: spec.template.spec.containers[0].image
          value: nvcr.io/nvidia/k8s-device-plugin:v0.14.5
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: FAIL_ON_INIT_ERROR
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: "false"

  # client#835: on native Linux the plugin can only enumerate GPUs (init NVML) if
  # its own pod runs under the `nvidia` RuntimeClass baked into the k3s-cuda node
  # image, so the Linux installer sets gpu.devicePlugin.nvidia.runtimeClassName
  # when the GPU is wired. Default is unset (correct for the Windows/WSL2 path,
  # which doesn't run this plugin, and any future non-CDI node).
  - it: sets no runtimeClassName by default (unset value)
    set:
      gpu:
        devicePlugin:
          enabled: true
          vendor: nvidia
    asserts:
      - notExists:
          path: spec.template.spec.runtimeClassName

  - it: sets runtimeClassName on the NVIDIA plugin pod when configured (client#835)
    set:
      gpu:
        devicePlugin:
          enabled: true
          vendor: nvidia
          nvidia:
            runtimeClassName: nvidia
    asserts:
      - equal:
          path: spec.template.spec.runtimeClassName
          value: nvidia

  - it: honours an overridden namespace and image registry/repository/tag/digest
    set:
      gpu:
        devicePlugin:
          enabled: true
          vendor: nvidia
          namespace: gpu-operator
          nvidia:
            registry: private.example
            repository: nv/device-plugin
            tag: v0.15.0
    asserts:
      - equal:
          path: metadata.namespace
          value: gpu-operator
      - equal:
          path: spec.template.spec.containers[0].image
          value: private.example/nv/device-plugin:v0.15.0

  - it: a nvidia digest pins the image by @sha256 rather than a tag
    set:
      gpu:
        devicePlugin:
          enabled: true
          vendor: nvidia
          nvidia:
            digest: "sha256:deadbeef"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: nvcr.io/nvidia/k8s-device-plugin@sha256:deadbeef

  - it: global.imageRegistry re-homes the plugin image onto the mirror (air-gap / #585)
    set:
      global:
        imageRegistry: mirror.corp.example
      gpu:
        devicePlugin:
          enabled: true
          vendor: nvidia
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: mirror.corp.example/nvidia/k8s-device-plugin:v0.14.5

  - it: sets imagePullSecrets when a private registry credential is configured
    set:
      dockerRegistry:
        create: true
        server: https://mirror.corp.example
        username: u
        password: p
        email: e@x.io
      gpu:
        devicePlugin:
          enabled: true
          vendor: nvidia
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: RELEASE-NAME-regcred

  - it: sets no imagePullSecrets when no private registry is configured (public pull)
    set:
      gpu:
        devicePlugin:
          enabled: true
          vendor: nvidia
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: renders the AMD DaemonSet when vendor is amd
    set:
      gpu:
        devicePlugin:
          enabled: true
          vendor: amd
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: DaemonSet
      - equal:
          path: metadata.name
          value: amdgpu-device-plugin-daemonset
      - equal:
          path: spec.template.spec.nodeSelector['kubernetes.io/arch']
          value: amd64
      - equal:
          path: spec.template.spec.containers[0].securityContext.privileged
          value: true
      # runtimeClassName is NVIDIA-only (client#835); the AMD path never emits it.
      - notExists:
          path: spec.template.spec.runtimeClassName

  - it: carries the standard tracebloc labels so Helm owns and can remove it
    set:
      gpu:
        devicePlugin:
          enabled: true
          vendor: nvidia
    asserts:
      - equal:
          path: metadata.labels['app.kubernetes.io/managed-by']
          value: Helm

  - it: fails the render when enabled but no vendor is set
    set:
      gpu:
        devicePlugin:
          enabled: true
          vendor: ""
    asserts:
      - failedTemplate:
          errorMessage: 'gpu.devicePlugin.enabled is true but gpu.devicePlugin.vendor is ""; set it to "nvidia" or "amd"'

  # Both vendors' DaemonSets name no ServiceAccount, so before backend#2345 they
  # mounted kube-system's `default` token onto every GPU node. The upstream
  # plugins talk to the kubelet over the device-plugin socket, never to the API
  # server. Asserted per vendor because they are two separate pod specs in one
  # file — a fix applied to one and not the other would otherwise pass.
  - it: the NVIDIA DaemonSet refuses the default ServiceAccount token
    set:
      gpu:
        devicePlugin:
          enabled: true
          vendor: nvidia
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - notExists:
          path: spec.template.spec.serviceAccountName

  - it: the AMD DaemonSet refuses the default ServiceAccount token
    set:
      gpu:
        devicePlugin:
          enabled: true
          vendor: amd
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - notExists:
          path: spec.template.spec.serviceAccountName
