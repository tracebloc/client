suite: PriorityClass and PodDisruptionBudget
templates:
  - templates/priority-class.yaml
  - templates/mysql-pdb.yaml
  - templates/jobs-manager-pdb.yaml
set:
  clientId: "test-id"
  clientPassword: "test"
tests:
  - it: should NOT render the PriorityClass by default (dropped)
    template: templates/priority-class.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should render the PriorityClass when explicitly enabled
    template: templates/priority-class.yaml
    set:
      priorityClass:
        create: true
        name: tracebloc-data-plane
    asserts:
      - isKind:
          of: PriorityClass
      - equal:
          path: metadata.name
          value: tracebloc-data-plane
      - equal:
          path: value
          value: 1000000
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: globalDefault
          value: false

  - it: should respect a custom PriorityClass name and value
    template: templates/priority-class.yaml
    set:
      priorityClass:
        create: true
        name: tb-prio
        value: 500000
    asserts:
      - equal:
          path: metadata.name
          value: tb-prio
      - equal:
          path: value
          value: 500000

  - it: should not render PriorityClass when create is false
    template: templates/priority-class.yaml
    set:
      priorityClass:
        create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: schema should reject create=true with an empty name
    template: templates/priority-class.yaml
    set:
      priorityClass:
        create: true
        name: ""
    asserts:
      - failedTemplate:
          errorPattern: "name: String length must be greater than or equal to 1"

  - it: should create the mysql PDB by default
    template: templates/mysql-pdb.yaml
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: metadata.name
          value: mysql-client
      - equal:
          path: spec.minAvailable
          value: 1
      - equal:
          path: spec.selector.matchLabels.app
          value: mysql-client

  - it: should not render mysql PDB when disabled
    template: templates/mysql-pdb.yaml
    set:
      podDisruptionBudget:
        mysql:
          create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: jobs-manager PDB should use minAvailable (not maxUnavailable) to actually protect a 1-replica deployment
    templates:
      - templates/jobs-manager-pdb.yaml
    template: templates/jobs-manager-pdb.yaml
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 1
      - notExists:
          path: spec.maxUnavailable

  # tracebloc/client#560: on a single-node / bare-metal install
  # (hostPath.enabled=true) a minAvailable:1 PDB over a 1-replica pod makes the
  # sole node undrainable. In AUTO mode (create=null, the default) the PDBs must
  # be skipped there so `kubectl drain` can proceed.
  - it: should NOT render mysql PDB on single-node/bare-metal (hostPath.enabled=true) in auto mode
    template: templates/mysql-pdb.yaml
    set:
      hostPath:
        enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should NOT render jobs-manager PDB on single-node/bare-metal (hostPath.enabled=true) in auto mode
    template: templates/jobs-manager-pdb.yaml
    set:
      hostPath:
        enabled: true
    asserts:
      - hasDocuments:
          count: 0

  # AUTO mode on multi-node CSI (hostPath.enabled=false) must still render the
  # protective PDBs — this is the default topology and preserves prior behavior.
  - it: should render mysql PDB on multi-node CSI (hostPath.enabled=false) in auto mode
    template: templates/mysql-pdb.yaml
    set:
      hostPath:
        enabled: false
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 1

  - it: should render jobs-manager PDB on multi-node CSI (hostPath.enabled=false) in auto mode
    template: templates/jobs-manager-pdb.yaml
    set:
      hostPath:
        enabled: false
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 1

  # Explicit override: create=true forces the PDB even on single-node/bare-metal
  # (for a fixed multi-node bare-metal cluster that still wants drain protection).
  - it: create=true should force the mysql PDB even on hostPath (override)
    template: templates/mysql-pdb.yaml
    set:
      hostPath:
        enabled: true
      podDisruptionBudget:
        mysql:
          create: true
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 1

  - it: create=true should force the jobs-manager PDB even on hostPath (override)
    template: templates/jobs-manager-pdb.yaml
    set:
      hostPath:
        enabled: true
      podDisruptionBudget:
        jobsManager:
          create: true
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 1

  # Explicit override: create=false disables even on multi-node CSI.
  - it: create=false should disable the jobs-manager PDB even on CSI (override)
    template: templates/jobs-manager-pdb.yaml
    set:
      hostPath:
        enabled: false
      podDisruptionBudget:
        jobsManager:
          create: false
    asserts:
      - hasDocuments:
          count: 0
