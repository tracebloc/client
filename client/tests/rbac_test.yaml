suite: RBAC
templates:
  - templates/rbac.yaml
set:
  clientId: "test-id"
  clientPassword: "test"
  dockerRegistry:
    server: https://index.docker.io/v1/
    username: test
    password: test
    email: test@test.com
tests:
  - it: should create ServiceAccount
    set:
      clusterScope: true
    documentIndex: 0
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-jobs-manager

  - it: should create ClusterRole when clusterScope is true
    set:
      clusterScope: true
    documentIndex: 1
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: metadata.name
          value: RELEASE-NAME-jobs-manager-rbac

  - it: should create ClusterRoleBinding when clusterScope is true
    set:
      clusterScope: true
    documentIndex: 2
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: subjects[0].name
          value: RELEASE-NAME-jobs-manager

  - it: should create Role when clusterScope is false
    set:
      clusterScope: false
    documentIndex: 1
    asserts:
      - isKind:
          of: Role

  - it: should create RoleBinding when clusterScope is false
    set:
      clusterScope: false
    documentIndex: 2
    asserts:
      - isKind:
          of: RoleBinding

  - it: should have least-privilege rules for jobs-manager
    set:
      clusterScope: true
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["batch"]
            resources: ["jobs"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["pods", "pods/log", "events"]
            verbs: ["get", "list", "watch"]

  # Assert both branches — a clusterScope: false edge needs the grant too.
  - it: ClusterRole grants read on deployments and daemonsets for the version inventory
    set:
      clusterScope: true
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: ["deployments", "daemonsets"]
            verbs: ["get", "list", "watch"]

  - it: namespaced Role grants read on deployments and daemonsets too
    set:
      clusterScope: false
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: ["deployments", "daemonsets"]
            verbs: ["get", "list", "watch"]

  # resource-monitor is a DaemonSet in nodeAgents.namespace, not the release
  # namespace, so a release-namespace grant does not reach it.
  - it: a clusterScope=false edge gets a node-agents Role for the DaemonSet
    set:
      clusterScope: false
      nodeAgents:
        namespace:
          name: tracebloc-node-agents
    documentIndex: 3
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.namespace
          value: tracebloc-node-agents
      - contains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: ["daemonsets"]
            verbs: ["get", "list", "watch"]

  - it: the node-agents RoleBinding binds the release-namespace ServiceAccount
    set:
      clusterScope: false
      nodeAgents:
        namespace:
          name: tracebloc-node-agents
    documentIndex: 4
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: metadata.namespace
          value: tracebloc-node-agents
      - equal:
          path: subjects[0].namespace
          value: NAMESPACE

  - it: no node-agents pair when that namespace IS the release namespace
    set:
      clusterScope: false
      nodeAgents:
        namespace:
          name: NAMESPACE
    asserts:
      # Already granted by the Role above, and a second pair would collide on name.
      - hasDocuments:
          count: 3

  # backend#1876: the GPU->CPU pending fallback needs list nodes. `nodes` is
  # cluster-scoped, so it must be in the ClusterRole and CANNOT be in the
  # namespaced Role — assert both.
  - it: ClusterRole grants list on nodes for the GPU->CPU fallback (backend#1876)
    set:
      clusterScope: true
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["nodes"]
            verbs: ["list"]

  - it: namespaced Role does not (cannot) grant nodes (backend#1876)
    set:
      clusterScope: false
    documentIndex: 1
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["nodes"]
            verbs: ["list"]

  # RFC-0003 D10 (backend#1181): the Secret-delete verb the jobs-manager
  # revoke/sweep path needs must be flag-gated + secrets-only (Saqlain review).
  - it: default-off grants no delete on configmaps/secrets (byte-for-byte)
    set:
      clusterScope: true
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["configmaps", "secrets"]
            verbs: ["create", "get"]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["delete"]

  - it: perExperimentDbCreds adds delete on secrets only (ClusterRole)
    set:
      clusterScope: true
      perExperimentDbCreds: true
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["delete"]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["configmaps", "secrets"]
            verbs: ["create", "get"]

  - it: perExperimentDbCreds adds delete on secrets only (Role)
    set:
      clusterScope: false
      perExperimentDbCreds: true
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["delete"]

  # RFC-0003 D9 Track B (client-runtime#203/#261): the PV/PVC provisioning +
  # GC verbs jobs-manager needs are flag-gated and cluster-scope-only.
  - it: default-off grants nothing on persistentvolumes/persistentvolumeclaims (byte-for-byte)
    set:
      clusterScope: true
    documentIndex: 1
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["persistentvolumes"]
            verbs: ["create", "get", "list", "patch", "delete"]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["persistentvolumeclaims"]
            verbs: ["create", "list", "delete"]

  - it: perDatasetPvcs adds PV provisioning/GC + PVC grants (ClusterRole)
    set:
      clusterScope: true
      perDatasetPvcs: true
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["persistentvolumes"]
            verbs: ["create", "get", "list", "patch", "delete"]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["persistentvolumeclaims"]
            verbs: ["create", "list", "delete"]

  - it: perDatasetPvcs with clusterScope false fails the render (PVs not grantable by a namespace Role)
    set:
      clusterScope: false
      perDatasetPvcs: true
    asserts:
      # `errorMessage` (EXACT match), never `errorPattern`: helm-unittest 0.5.2
      # SILENTLY IGNORES errorPattern under failedTemplate — a pattern appearing
      # nowhere in the output still passes, so the assertion degrades to a bare
      # `failedTemplate: {}` while reading like a precise one (backend#2606).
      # The string below is the whole `fail` message from templates/rbac.yaml;
      # rewording the template without rewording this reddens the test, which is
      # the point. Guarded against reintroduction by
      # scripts/tests/helm-unittest-error-assertions.sh.
      - failedTemplate:
          errorMessage: 'perDatasetPvcs requires clusterScope: PersistentVolumes are cluster-scoped, so the namespaced Role cannot grant the PV provisioning/GC verbs jobs-manager needs — Job spawns would 403 at runtime. Set clusterScope: true (the default) or disable perDatasetPvcs.'
