suite: Requests Proxy Deployment
# requests-proxy-deployment.yaml had no unit test. It is a workload pod that
# runs in the data plane, so the security-context invariants (see
# docs/SECURITY.md) and the single-worker constraint (the proxy keeps the pod
# token registry in process-local memory — more than one worker silently
# breaks token lookups) need a regression guard. The resources block is also
# nil-guarded against `helm upgrade --reuse-values` from pre-1.3.6 releases;
# pinning the rendered defaults catches a guard that eats the preceding
# newline (the historic `readOnlyRootFilesystem: trueresources:` bug).
templates:
  - templates/requests-proxy-deployment.yaml
set:
  clientId: "test-id"
  clientPassword: "test"
  dockerRegistry:
    server: https://index.docker.io/v1/
    username: test
    password: test
    email: test@test.com
tests:
  - it: should create the requests-proxy Deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-requests-proxy

  - it: should carry standard chart labels
    asserts:
      - exists:
          path: metadata.labels["app.kubernetes.io/name"]
      - exists:
          path: metadata.labels["helm.sh/chart"]

  - it: should run exactly one replica
    # Token registry is process-local; replicas>1 would shard token lookups.
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: should not automount the service account token
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: should enforce a hardened pod security context
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: should enforce a hardened container security context
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 1001
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: "ALL"

  - it: should pull the jobs-manager image from docker.io
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^docker\\.io/tracebloc/jobs-manager[:@]"

  # #569: still floats on the tag by default, but the pull policy is now
  # IfNotPresent REGARDLESS of pinning. `Always` forced a registry round-trip on
  # every restart, so an offline Docker/WSL restart landed in ImagePullBackOff
  # with the image already cached. The update path moved to the image-refresh
  # CronJob, which reconciles this Deployment to `repo@digest` with
  # `kubectl set image` — a reference change the kubelet pulls on its own.
  - it: floats on the tag with imagePullPolicy IfNotPresent when no digest is pinned (default)
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^docker\\.io/tracebloc/jobs-manager:"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent

  - it: pins repo@digest with imagePullPolicy IfNotPresent when a digest is set (#552)
    # Was hardcoded Always — a pinned digest was ignored for the pull policy, so a
    # restart re-pulled instead of using the cached image. Now digest-aware.
    set:
      images:
        requestsProxy:
          digest: "sha256:dfdaa7e633a8df0f46b403e9422eba5c16bdb7d9c39047e6d3738f9e38fbdba8"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/tracebloc/jobs-manager@sha256:dfdaa7e633a8df0f46b403e9422eba5c16bdb7d9c39047e6d3738f9e38fbdba8
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent

  - it: should expose the proxy on container port 8888
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8888

  - it: should run gunicorn with a single worker
    # Mirrors the replica constraint at the process level — the token registry
    # lives in one worker's memory.
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--workers=1"

  - it: should render the default resource requests and limits
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 256Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 1000m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi

  - it: should honor a resource override through the nil-guard
    set:
      resources:
        requestsProxy:
          limits:
            memory: 1Gi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1Gi

  # backend#1528 S2: the proxy authenticates its metadata-DB access as the
  # dedicated tb_meta identity (metadata only — the proxy never touches the
  # dataset DB, so no tb_ingest here). Flag-gated on serviceDbAccounts so a
  # default install is byte-identical (mirrors the jobs-manager S1 block).
  - it: service DB account env absent by default (byte-for-byte off)
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICE_DB_ACCOUNTS
            value: "1"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: TB_META_USER
            value: "tb_meta"

  - it: wires the tb_meta metadata identity when serviceDbAccounts is on
    set:
      serviceDbAccounts: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICE_DB_ACCOUNTS
            value: "1"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TB_META_USER
            value: "tb_meta"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TB_META_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets
                key: TB_META_PASSWORD
      # the proxy never touches the dataset DB — tb_ingest must NOT be wired here
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: TB_INGEST_USER
            value: "tb_ingest"

  # #569 (Bugbot): requests-proxy runs the jobs-manager image, so pinning
  # jobs-manager must pin the proxy too. Before this fallback, pinning
  # jobs-manager alone left the proxy on the floating tag AND made image-refresh
  # skip it (pinned images are skipped), so it froze on the tag forever while
  # jobs-manager ran the pin — a different build of the same image, which is the
  # exact skew #569 exists to close.
  - it: follows images.jobsManager.digest when requestsProxy.digest is unset (#569)
    set:
      images:
        jobsManager:
          digest: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/tracebloc/jobs-manager@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent

  - it: requestsProxy.digest overrides the jobsManager digest (per-workload pin)
    set:
      images:
        jobsManager:
          digest: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
        requestsProxy:
          digest: "sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/tracebloc/jobs-manager@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb

  - it: still renders (no nil-pointer) when the images block is entirely absent
    # --reuse-values replay from a release predating these keys.
    set:
      images: null
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^docker\\.io/tracebloc/jobs-manager:"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent
