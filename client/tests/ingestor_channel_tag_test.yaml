suite: ingestor per-environment channel tag (backend#1360)
templates:
  - templates/jobs-manager-deployment.yaml
release:
  name: stg
  namespace: tracebloc
set:
  clientId: "test-id"
  clientPassword: "test"
tests:
  - it: dev edges spawn the :dev internal channel
    set:
      env.CLIENT_ENV: dev
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_TAG
            value: "dev"

  - it: staging edges spawn the :stg internal channel
    set:
      env.CLIENT_ENV: stg
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_TAG
            value: "stg"

  - it: prod stays on the semver float, never a :prod tag (none is published)
    set:
      env.CLIENT_ENV: prod
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_TAG
            value: "0.8"

  - it: defaults to the prod float when CLIENT_ENV is unset
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_TAG
            value: "0.8"

  - it: an explicit tag override wins over the channel for every environment
    set:
      env.CLIENT_ENV: dev
      images.ingestor.tag: "0.8.0"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_TAG
            value: "0.8.0"

  - it: an unknown CLIENT_ENV falls back to the literal rather than rendering empty
    set:
      env.CLIENT_ENV: produktion
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_TAG
            value: "0.8"

  # ---- the last-resort fallback is per-environment ---------------------
  #
  # These four replace a single case that asserted `0.8` for a DEV edge with
  # `channelTags` absent. That was the bug, written down as an expectation: the
  # `--reuse-values` replay this branch exists for made a dev/stg edge spawn the
  # PROD line, which is the opposite of what dev/stg channels are for
  # (backend#1360 — validate an ingestor change on a real edge without a prod
  # release). See the fallback rationale in _helpers.tpl.
  - it: a dev edge predating channelTags falls back to its OWN channel, not prod's
    set:
      env.CLIENT_ENV: dev
      images.ingestor.channelTags: null
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_TAG
            value: "dev"

  - it: a stg edge predating channelTags falls back to its OWN channel
    set:
      env.CLIENT_ENV: stg
      images.ingestor.channelTags: null
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_TAG
            value: "stg"

  # The control for the two above: the same missing-channelTags input on a PROD
  # edge must still yield the prod float. Without this, "dev falls back to dev"
  # would also pass if the fallback simply echoed the resolved environment.
  - it: a prod edge predating channelTags still falls back to the prod float
    set:
      env.CLIENT_ENV: prod
      images.ingestor.channelTags: null
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_TAG
            value: "0.8"

  # The alias must reach the fallback too — the fallback dict is keyed on the
  # RESOLVED env, so this passes only because it reads tracebloc.clientEnv and
  # not .Values.env.CLIENT_ENV. backend#1723 was that exact class of miss.
  - it: an alias resolves before the fallback is keyed
    set:
      env.CLIENT_ENV: development
      images.ingestor.channelTags: null
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_TAG
            value: "dev"

  # The prod fallback literal is a SECOND copy of values.yaml channelTags.prod
  # and cannot read the first (see _helpers.tpl). Pinning both in one suite is
  # what makes a half-done bump fail CI instead of drifting: the case above
  # pins the literal, this one pins the values.yaml default they must match.
  - it: the values.yaml prod channel and the prod fallback literal agree
    set:
      env.CLIENT_ENV: prod
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_TAG
            value: "0.8"

  - it: prod still pins by digest, so the tag is not the spawn target there
    set:
      env.CLIENT_ENV: prod
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_DIGEST
            value: "sha256:05e124945a2ef61868661a9137abb5e75dac96a090cb41a7b4e8be520c4b5873"

  - it: dev gets no digest, so it spawns by the floating channel tag
    set:
      env.CLIENT_ENV: dev
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_DIGEST
            value: ""

  - it: the documented alias "staging" resolves to the stg channel, not the prod float
    # Review catch (#494): the schema documents dev|staging|prod while these
    # keys are dev|stg|prod, so CLIENT_ENV=staging previously missed
    # channelTags and silently fell back to 0.7 while client-runtime
    # normalized it to stg at runtime — the split-brain of client-runtime#227.
    set:
      env.CLIENT_ENV: staging
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_TAG
            value: "stg"

  - it: the documented alias "development" resolves to the dev channel
    set:
      env.CLIENT_ENV: development
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_TAG
            value: "dev"

  - it: the documented alias "production" resolves to the prod float
    set:
      env.CLIENT_ENV: production
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_TAG
            value: "0.8"

  - it: the "production" alias keeps the prod reproducibility pin
    # Bugbot catch (#494): the first alias fix normalized inside
    # tracebloc.ingestorTag only, so CLIENT_ENV=production got the prod float
    # tag while tracebloc.ingestorDigest still compared the RAW value to
    # "prod" and returned nothing — silently dropping the pin
    # (backend#1028/#1245) on an edge that looked correctly configured. Both
    # helpers now share tracebloc.clientEnv.
    set:
      env.CLIENT_ENV: production
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_DIGEST
            value: "sha256:05e124945a2ef61868661a9137abb5e75dac96a090cb41a7b4e8be520c4b5873"
