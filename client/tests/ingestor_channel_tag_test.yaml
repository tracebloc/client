suite: ingestor per-environment channel tag (backend#1360)
templates:
  - templates/jobs-manager-deployment.yaml
release:
  name: stg
  namespace: tracebloc
set:
  clientId: "test-id"
  clientPassword: "test"
tests:
  - it: dev edges spawn the :dev internal channel
    set:
      env.CLIENT_ENV: dev
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_TAG
            value: "dev"

  - it: staging edges spawn the :stg internal channel
    set:
      env.CLIENT_ENV: stg
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_TAG
            value: "stg"

  - it: prod stays on the semver float, never a :prod tag (none is published)
    set:
      env.CLIENT_ENV: prod
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_TAG
            value: "0.8"

  - it: defaults to the prod float when CLIENT_ENV is unset
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_TAG
            value: "0.8"

  - it: an explicit tag override wins over the channel for every environment
    set:
      env.CLIENT_ENV: dev
      images.ingestor.tag: "0.8.0"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_TAG
            value: "0.8.0"

  # An "unknown CLIENT_ENV falls back to the literal" case lived here, setting
  # `produktion`. It is gone because the input is gone: the CLIENT_ENV
  # vocabulary is now closed by a values.schema.json `enum` plus a `fail` in
  # tracebloc.clientEnv, so `produktion` is refused at install time instead of
  # becoming a literal image tag.
  #
  # It could not simply be re-pointed at the new behaviour: helm-unittest
  # validates values against the packaged schema and reports a violation as a
  # plugin-level ERROR, so `failedTemplate` cannot assert it and there is no
  # flag to skip validation and reach the helper's `fail`. Both gates are
  # covered from outside the plugin, in scripts/tests/chart-env-vocabulary.sh,
  # which pairs every rejection with an accept control on the same command line.
  #
  # What remains testable here is that the fallback is still reached by a legal
  # route — an env whose channelTags ENTRY is absent, rather than an env that is
  # itself illegal. Deliberately asserted on prod, whose fallback is the same
  # `0.8` on this branch and on the sibling PR that makes the fallback
  # per-environment, so this case does not depend on their merge order.
  - it: an env with no channelTags entry still falls back rather than rendering empty
    set:
      env.CLIENT_ENV: prod
      images.ingestor.channelTags:
        dev: "dev"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_TAG
            value: "0.8"

  - it: renders for a release predating channelTags (--reuse-values replay)
    set:
      env.CLIENT_ENV: dev
      images.ingestor.channelTags: null
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_TAG
            value: "0.8"

  - it: prod still pins by digest, so the tag is not the spawn target there
    set:
      env.CLIENT_ENV: prod
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_DIGEST
            value: "sha256:05e124945a2ef61868661a9137abb5e75dac96a090cb41a7b4e8be520c4b5873"

  - it: dev gets no digest, so it spawns by the floating channel tag
    set:
      env.CLIENT_ENV: dev
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_DIGEST
            value: ""

  - it: the documented alias "staging" resolves to the stg channel, not the prod float
    # Review catch (#494): the schema documents dev|staging|prod while these
    # keys are dev|stg|prod, so CLIENT_ENV=staging previously missed
    # channelTags and silently fell back to 0.7 while client-runtime
    # normalized it to stg at runtime — the split-brain of client-runtime#227.
    set:
      env.CLIENT_ENV: staging
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_TAG
            value: "stg"

  - it: the documented alias "development" resolves to the dev channel
    set:
      env.CLIENT_ENV: development
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_TAG
            value: "dev"

  - it: the documented alias "production" resolves to the prod float
    set:
      env.CLIENT_ENV: production
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_TAG
            value: "0.8"

  - it: the "production" alias keeps the prod reproducibility pin
    # Bugbot catch (#494): the first alias fix normalized inside
    # tracebloc.ingestorTag only, so CLIENT_ENV=production got the prod float
    # tag while tracebloc.ingestorDigest still compared the RAW value to
    # "prod" and returned nothing — silently dropping the pin
    # (backend#1028/#1245) on an edge that looked correctly configured. Both
    # helpers now share tracebloc.clientEnv.
    set:
      env.CLIENT_ENV: production
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INGESTOR_IMAGE_DIGEST
            value: "sha256:05e124945a2ef61868661a9137abb5e75dac96a090cb41a7b4e8be520c4b5873"
