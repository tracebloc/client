suite: MySQL
templates:
  - templates/mysql-deployment.yaml
  - templates/mysql-configmap.yaml
  - templates/mysql-service.yaml
set:
  clientId: "test-id"
  clientPassword: "test"
  dockerRegistry:
    server: https://index.docker.io/v1/
    username: test
    password: test
    email: test@test.com
tests:
  - it: should create MySQL Deployment
    template: templates/mysql-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: mysql-client
      - equal:
          path: spec.strategy.type
          value: Recreate

  - it: should have liveness and readiness probes
    template: templates/mysql-deployment.yaml
    asserts:
      - isNotEmpty:
          path: spec.template.spec.containers[0].livenessProbe
      - isNotEmpty:
          path: spec.template.spec.containers[0].readinessProbe
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command[0]
          value: mysqladmin

  - it: should have memory parity (requests == limits) and no cpu limit on mysql
    template: templates/mysql-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 1Gi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1Gi
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 250m
      # CPU limit deliberately unset — InnoDB lock-wait timeouts under throttling.
      - notExists:
          path: spec.template.spec.containers[0].resources.limits.cpu

  - it: "liveness probe should tolerate CPU pressure (timeoutSeconds 5)"
    template: templates/mysql-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 5

  - it: should NOT set priorityClassName by default (PriorityClass dropped)
    template: templates/mysql-deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.priorityClassName

  - it: should reference the PriorityClass when a name is set
    template: templates/mysql-deployment.yaml
    set:
      priorityClass:
        create: true
        name: tracebloc-data-plane
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: tracebloc-data-plane

  - it: should keep priorityClassName when create=false (externally managed PriorityClass)
    template: templates/mysql-deployment.yaml
    set:
      priorityClass:
        create: false
        name: tracebloc-data-plane
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: tracebloc-data-plane

  - it: should drop priorityClassName only when name is empty
    template: templates/mysql-deployment.yaml
    set:
      priorityClass:
        # Schema rejects create=true with empty name (no point templating a
        # nameless PriorityClass), so disable creation as well to model the
        # "no PriorityClass at all" path.
        create: false
        name: ""
    asserts:
      - notExists:
          path: spec.template.spec.priorityClassName

  - it: should render an explicit mysql cpu limit when operator opts in
    template: templates/mysql-deployment.yaml
    set:
      resources:
        mysql:
          limits:
            cpu: "1500m"
            memory: "2Gi"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 1500m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 2Gi

  - it: should create ConfigMap with MySQL config
    template: templates/mysql-configmap.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: mysql-client-config
      - isNotEmpty:
          path: data["mysql.cnf"]

  - it: should create MySQL Service on port 3306
    template: templates/mysql-service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.ports[0].port
          value: 3306
      - equal:
          path: spec.selector.app
          value: mysql-client

  # --- Regression guards (backend#767): the kill-loop was a healthy mysqld
  # killed by a probe pointed at the wrong socket. Lock the probe to TCP so a
  # future edit (or an image socket-path change) can't reintroduce it. ---
  - it: all three probes must use TCP (127.0.0.1), never the unix socket (-h localhost)
    template: templates/mysql-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].startupProbe.exec.command
          content: "127.0.0.1"
      - contains:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          content: "127.0.0.1"
      - contains:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          content: "127.0.0.1"
      - notContains:
          path: spec.template.spec.containers[0].startupProbe.exec.command
          content: "localhost"
      - notContains:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          content: "localhost"
      - notContains:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          content: "localhost"
  - it: mysqld keeps its writable scratch mounts under readOnlyRootFilesystem (socket/pid dir + tmp)
    template: templates/mysql-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: mysql-run
            mountPath: /var/run/mysqld
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: mysql-tmp
            mountPath: /tmp

  - it: pins the mysql-client image by digest (chart default — fleets stay on the 5.7-lineage image)
    template: templates/mysql-deployment.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ^docker\.io/tracebloc/mysql-client@sha256:[a-f0-9]{64}$

  # ── Engine/datadir format guard (backend#723, decision A2) ──
  # The first assert doubles as the digest↔helper sync pin: re-pinning
  # images.mysqlClient.digest without updating tracebloc.mysqlEngineMajor
  # makes the default render report "unknown" and fails here.
  - it: renders the format guard armed for 5.7 by default (digest pin recognized)
    template: templates/mysql-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: mysql-format-guard
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TB_EXPECTED_ENGINE
            value: "5.7"
      - equal:
          path: spec.template.spec.initContainers[0].volumeMounts[0].readOnly
          value: true

  - it: 8.4 opt-in (tag 8.4, empty digest) runs the 8.4 image and arms the guard for 8.4
    template: templates/mysql-deployment.yaml
    set:
      images:
        mysqlClient:
          tag: "8.4"
          digest: ""
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/tracebloc/mysql-client:8.4
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TB_EXPECTED_ENGINE
            value: "8.4"

  - it: the 8.0 transit hop is recognized (guard stands down for the staged upgrade)
    template: templates/mysql-deployment.yaml
    set:
      images:
        mysqlClient:
          tag: "8.0"
          digest: ""
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TB_EXPECTED_ENGINE
            value: "8.0"

  # ---- the empty-tag fallback is `prod`, NOT env.CLIENT_ENV ------------
  #
  # values.schema.json claimed "Empty falls back to env.CLIENT_ENV" until
  # backend#1723's follow-up. The template is `... | default "prod"`, so every
  # environment gets `:prod`. The doc was not merely imprecise, it was an
  # instruction to break the edge: tracebloc/mysql-client publishes 8.0, 8.4,
  # four 8.4-<sha> builds, latest and prod — there is no `dev` or `stg` tag
  # (checked against Docker Hub 2026-08-12). These cases pin the behaviour the
  # corrected description now describes, so the two cannot drift apart again.
  - it: an empty tag renders :prod on a dev edge, not :dev
    template: templates/mysql-deployment.yaml
    set:
      env:
        CLIENT_ENV: dev
      images:
        mysqlClient:
          tag: ""
          digest: ""
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/tracebloc/mysql-client:prod

  - it: an empty tag renders :prod on a stg edge, not :stg
    template: templates/mysql-deployment.yaml
    set:
      env:
        CLIENT_ENV: stg
      images:
        mysqlClient:
          tag: ""
          digest: ""
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/tracebloc/mysql-client:prod

  # The control for the two above: prod renders the same thing, which is what
  # makes "CLIENT_ENV is not consulted" the only explanation for them.
  - it: an empty tag renders :prod on a prod edge too
    template: templates/mysql-deployment.yaml
    set:
      env:
        CLIENT_ENV: prod
      images:
        mysqlClient:
          tag: ""
          digest: ""
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/tracebloc/mysql-client:prod

  # Why the false doc had teeth beyond a failed pull: an env-derived tag is
  # unrecognized by tracebloc.mysqlEngineMajor, so the mysql-format-guard
  # stands down silently. `prod` (the real fallback) keeps it armed at 5.7.
  - it: believing the old doc would also disarm the mysql-format-guard
    template: templates/mysql-deployment.yaml
    set:
      env:
        CLIENT_ENV: dev
      images:
        mysqlClient:
          tag: "dev"
          digest: ""
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TB_EXPECTED_ENGINE
            value: "unknown"

  - it: the real fallback keeps the guard armed at 5.7
    template: templates/mysql-deployment.yaml
    set:
      images:
        mysqlClient:
          tag: ""
          digest: ""
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TB_EXPECTED_ENGINE
            value: "5.7"

  - it: a custom digest pin disarms the guard (engine unknown)
    template: templates/mysql-deployment.yaml
    set:
      images:
        mysqlClient:
          digest: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: TB_EXPECTED_ENGINE
            value: "unknown"

  - it: hostPath keeps the chown bootstrap first and the guard second
    template: templates/mysql-deployment.yaml
    set:
      hostPath:
        enabled: true
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: init-mysql-data
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: mysql-format-guard

  - it: the format guard re-homes onto a private mirror like every other image (#585)
    template: templates/mysql-deployment.yaml
    set:
      global:
        imageRegistry: mirror.corp.example
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: mirror.corp.example/library/busybox:1.35

  # Names no ServiceAccount, so before backend#2345 it mounted the NAMESPACE'S
  # `default` SA token — a credential a database and two busybox init containers
  # never call the API with. The drift guard proves the key is STATED; only this
  # pins which way, because nothing in the chart's RBAC would contradict a flip
  # back to `true` on a pod spec that has no ServiceAccount to bind.
  - it: refuses the default ServiceAccount token
    template: templates/mysql-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - notExists:
          path: spec.template.spec.serviceAccountName

  # backend#947 Phase 0: MYSQL_ROOT_PASSWORD env is gated on rotateMysqlRoot so a
  # default install relies on the image's baked default (byte-identical).
  - it: no chart-managed root password env by default (byte-for-byte off)
    template: templates/mysql-deployment.yaml
    asserts:
      # The mysql-client container has no env block at all by default — relying
      # on the image's baked MYSQL_ROOT_PASSWORD — so the whole key is absent.
      - notExists:
          path: spec.template.spec.containers[0].env

  - it: injects MYSQL_ROOT_PASSWORD from the Secret when rotateMysqlRoot is on
    template: templates/mysql-deployment.yaml
    set:
      rotateMysqlRoot: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MYSQL_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-secrets
                key: MYSQL_ROOT_PASSWORD
