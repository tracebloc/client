suite: perExperimentDbCreds resolves per environment (backend#1528)
# WHY THIS SUITE EXISTS
#
# Every other gate in the backend#1528 rollout resolved through a helper with a
# `…ByEnv` map. This one was read as a bare `.Values.perExperimentDbCreds` in
# five templates — so the flag the ticket's LAST step is gated on was the only
# one whose fleet posture the chart could not record.
#
# That is not cosmetic. A fleet taken to the per-experiment credential shape
# held that fact solely in its stored release values. A values-resetting upgrade
# or a fresh-datadir reinstall drops it, the account mint goes back to running
# as `edgeuser`, and the mysql-client image's fresh-datadir init script re-grants
# that account `CREATE USER … WITH GRANT OPTION` plus `ALL PRIVILEGES` on both
# databases. The retirement undoes itself, and nothing says so.
#
# `dev`/`stg`/`prod: true` here record postures already achieved — dev retired
# 2026-08-26, staging DROPped 2026-08-31 (backend#2776), prod edge 713 DROPped
# 2026-09-01 (backend#2800). This gate is additive, so a fresh install of any of
# the three comes up on per-experiment credentials; an operator override still
# holds a single edge back (tested below).
# ALL THREE CALL SITES, not just the one that sets the env var.
#
# The first version of this suite listed `jobs-manager-deployment.yaml` alone.
# Reverting `secrets.yaml` and `rbac.yaml` to the raw `.Values` lookup then
# changed no assertion here, passed all 592 helm-unittest cases, and passed
# `scripts/tests/gate-byenv-resolution.sh` too -- because the existing Secret and
# RBAC cases set an explicit override, and a whole-render diff is satisfied by
# the jobs-manager env var alone (Bugbot, client#888).
#
# The result would be a `dev` edge with PER_EXPERIMENT_DB_CREDS=1 and no
# TB_CREDMGR_PASSWORD and no RBAC to reap the Secrets: a gate honoured by SOME
# of its call sites, which is worse than one honoured by none.
templates:
  - templates/jobs-manager-deployment.yaml
  - templates/secrets.yaml
  - templates/rbac.yaml
release:
  name: pedc
  namespace: tracebloc
set:
  clientId: "test-id"
  clientPassword: "test"
  # backend#2892: this suite renders dev fleets (dev's ByEnv default turns
  # rotateMysqlRoot ON) only to assert perExperimentDbCreds resolution. The
  # fail-closed guard refuses an unpinned rotation-on mint on a CLUSTER-LESS
  # render (which helm-unittest always is), so pin root's value tier-1 to let the
  # render through. Nothing here asserts on the root password; the pin is inert to
  # what this suite tests.
  mysqlRootPassword: "RotatedRootPw123"

tests:
  - it: "dev edges mint per-experiment credentials — the retired fleet's posture"
    template: templates/jobs-manager-deployment.yaml
    set:
      env.CLIENT_ENV: dev
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PER_EXPERIMENT_DB_CREDS
            value: "1"

  - it: "the documented alias `development` resolves — it must not miss its entry"
    # The backend#1723 class, one env-name spelling away: a lookup on the RAW
    # value would find nothing and silently leave a retired fleet off.
    template: templates/jobs-manager-deployment.yaml
    set:
      env.CLIENT_ENV: development
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PER_EXPERIMENT_DB_CREDS
            value: "1"

  - it: "stg mints per-experiment credentials — baked after the DROP (backend#2776)"
    template: templates/jobs-manager-deployment.yaml
    set:
      env.CLIENT_ENV: stg
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PER_EXPERIMENT_DB_CREDS
            value: "1"

  - it: "prod mints per-experiment credentials — baked after edge 713's DROP (backend#2800)"
    template: templates/jobs-manager-deployment.yaml
    set:
      env.CLIENT_ENV: prod
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PER_EXPERIMENT_DB_CREDS
            value: "1"

  - it: "an operator can still hold a dev edge back — override beats the fleet default"
    template: templates/jobs-manager-deployment.yaml
    set:
      env.CLIENT_ENV: dev
      perExperimentDbCreds: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PER_EXPERIMENT_DB_CREDS
            value: "1"

  - it: "an operator can still switch one prod edge on — the override wins both ways"
    # Both directions, because an override that only ever turns things ON would
    # leave "false means unset" indistinguishable from "false means off", which
    # is precisely the bug the null default exists to avoid.
    template: templates/jobs-manager-deployment.yaml
    set:
      env.CLIENT_ENV: prod
      perExperimentDbCreds: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PER_EXPERIMENT_DB_CREDS
            value: "1"

  # ── the other two call sites, per environment ──────────────────────────────

  - it: "dev edges get the tb_credmgr password Secret, from the fleet default"
    template: templates/secrets.yaml
    set:
      env.CLIENT_ENV: dev
    asserts:
      - isNotEmpty:
          path: data.TB_CREDMGR_PASSWORD
        documentIndex: 0

  - it: "prod gets the tb_credmgr Secret too — the map is baked on (backend#2800)"
    template: templates/secrets.yaml
    set:
      env.CLIENT_ENV: prod
    asserts:
      - isNotEmpty:
          path: data.TB_CREDMGR_PASSWORD
        documentIndex: 0

  - it: "an override-off edge renders no such Secret — the gate can still redden"
    template: templates/secrets.yaml
    set:
      env.CLIENT_ENV: prod
      perExperimentDbCreds: false
    asserts:
      - isNull:
          path: data.TB_CREDMGR_PASSWORD
        documentIndex: 0

  - it: "dev edges get the Secret-reaping RBAC, from the fleet default"
    # Without this rule the minted per-experiment Secrets are never reaped, so a
    # dev edge would mint credentials it cannot clean up (backend#2692).
    template: templates/rbac.yaml
    set:
      env.CLIENT_ENV: dev
      clusterScope: true
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["list", "delete", "patch"]

  - it: "prod gets the reaping RBAC too — the map is baked on (backend#2800)"
    template: templates/rbac.yaml
    set:
      env.CLIENT_ENV: prod
      clusterScope: true
    documentIndex: 1
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["list", "delete", "patch"]

  - it: "an override-off edge gets no reaping RBAC — the gate can still redden"
    template: templates/rbac.yaml
    set:
      env.CLIENT_ENV: prod
      perExperimentDbCreds: false
      clusterScope: true
    documentIndex: 1
    asserts:
      # THREE shapes guarded since `patch` joined the grant (backend#2795):
      # a leak would render as the three-verb rule, which the older two-verb
      # guard alone would not catch.
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["list", "delete"]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["list", "delete", "patch"]
